<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="100%" height="100%">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-sync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-blue-border)"/>
    </linearGradient>
    <linearGradient id="grad-paint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-green-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-green-bg)"/>
    </linearGradient>
    <linearGradient id="grad-async" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-purple-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-purple-border)"/>
    </linearGradient>
    <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="var(--svg-card-alt)"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow-sync-light" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-paint-light" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-async-light" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-text-secondary)"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-purple-border)"/>
    </marker>
  </defs>
  
  <!-- Background Card -->
  <rect width="800" height="270" rx="16" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.5"/>
  
  <!-- Flow Timeline Line -->
  <line x1="80" y1="135" x2="720" y2="135" stroke="var(--svg-line)" stroke-width="4" stroke-dasharray="2,6"/>
  
  <!-- STEP 1: INITIAL LOAD -->
  <g transform="translate(40, 50)">
    <!-- Box -->
    <rect x="0" y="0" width="130" height="70" rx="10" fill="url(#grad-gray)" stroke="var(--svg-line)" stroke-width="1.2"/>
    <text x="65" y="25" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">STEP 1</text>
    <text x="65" y="44" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Page Request</text>
    <text x="65" y="58" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">DOM starts building</text>
    
    <!-- Connect and Node -->
    <path d="M 130 35 L 180 35" stroke="var(--svg-line)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="65" cy="85" r="5" fill="var(--svg-text-secondary)"/>
  </g>
  
  <!-- STEP 2: SYNC INLINE PAINT -->
  <g transform="translate(210, 50)">
    <!-- Box -->
    <rect x="0" y="0" width="150" height="70" rx="10" fill="url(#grad-gray)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" filter="url(#glow-sync-light)"/>
    <text x="75" y="25" fill="var(--svg-node-blue-border)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">STEP 2 (SYNC)</text>
    <text x="75" y="44" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Cached Render</text>
    <text x="75" y="58" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Inlined script checks Cache</text>
    
    <!-- Connect and Node -->
    <path d="M 150 35 L 195 35" stroke="var(--svg-node-blue-border)" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <circle cx="75" cy="85" r="5" fill="var(--svg-node-blue-border)"/>
  </g>

  <!-- STEP 3: FLICKER-FREE PAINT -->
  <g transform="translate(400, 50)">
    <!-- Box -->
    <rect x="0" y="0" width="140" height="70" rx="10" fill="url(#grad-gray)" stroke="var(--svg-node-green-border)" stroke-width="1.5" filter="url(#glow-paint-light)"/>
    <text x="70" y="25" fill="var(--svg-node-green-border)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">STEP 3 (DOM PAINT)</text>
    <text x="70" y="44" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Flicker-Free UI</text>
    <text x="70" y="58" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">DOM displays immediately</text>
    
    <!-- Connect and Node -->
    <path d="M 140 35 L 190 35" stroke="var(--svg-node-green-border)" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <circle cx="70" cy="85" r="5" fill="var(--svg-node-green-border)"/>
  </g>

  <!-- STEP 4: ASYNC BACKGROUND SYNC -->
  <g transform="translate(620, 50)">
    <!-- Box -->
    <rect x="0" y="0" width="140" height="70" rx="10" fill="url(#grad-gray)" stroke="var(--svg-node-purple-border)" stroke-width="1.5" filter="url(#glow-async-light)"/>
    <text x="70" y="25" fill="var(--svg-node-purple-border)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">STEP 4 (ASYNC)</text>
    <text x="70" y="44" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Background Sync</text>
    <text x="70" y="58" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Fetches &amp; stores fresh manifest</text>
    
    <!-- Node -->
    <circle cx="70" cy="85" r="5" fill="var(--svg-node-purple-border)"/>
  </g>
  
  <!-- FLOW LOGIC PATHS (BOTTOM CONTAINER) -->
  <g transform="translate(40, 160)">
    <rect width="720" height="85" rx="10" fill="rgba(31, 41, 55, 0.4)" stroke="var(--svg-border)" stroke-width="1.2"/>
    
    <!-- Sync Script Details -->
    <g transform="translate(15, 12)">
      <rect width="210" height="60" rx="6" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
      <text x="15" y="20" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="bold">Inline Sync Script Tasks:</text>
      <text x="15" y="38" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="500">• Instantly shows cached unread dots</text>
      <text x="15" y="50" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="500">• Displays cached navigation counts</text>
    </g>
    
    <!-- Path Tracking Detail -->
    <g transform="translate(245, 12)">
      <rect width="230" height="60" rx="6" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1"/>
      <text x="15" y="20" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="bold">Route Tracking Logic:</text>
      <text x="15" y="38" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="500">• If pathname is a list (e.g. /posts), mark section read</text>
      <text x="15" y="50" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="500">• If pathname is detail (e.g. /posts/slug), mark item read</text>
    </g>

    <!-- Async Sync Details -->
    <g transform="translate(495, 12)">
      <rect width="210" height="60" rx="6" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1"/>
      <text x="15" y="20" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="bold">Async Manifest Sync Tasks:</text>
      <text x="15" y="38" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="500">• Pulls fresh content manifest dynamically</text>
      <text x="15" y="50" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="500">• Updates local storage cache for next page load</text>
    </g>
  </g>
</svg>

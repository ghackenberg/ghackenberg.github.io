<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', system-ui, sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arrow-down-wiki" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="var(--svg-text-secondary)"/>
    </marker>
  </defs>

  <!-- Frame -->
  <rect x="8" y="8" width="764" height="374" rx="12" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.5"/>

  <!-- Layer 1: Raw Layer -->
  <g transform="translate(36, 24)">
    <rect x="0" y="0" width="708" height="76" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1.2"/>
    <rect x="0" y="0" width="708" height="26" rx="8" fill="var(--svg-node-blue-bg)" fill-opacity="0.5"/>
    <text x="16" y="18" fill="var(--svg-node-blue-subtext)" font-size="11.5" font-weight="700">1. RAW LAYER (raw/) ── Unveränderliche Ausführungsevidenz</text>
    <text x="16" y="45" fill="var(--svg-text-primary)" font-size="12" font-weight="500">Append-Only Archiv aller Ausführungstraces τ_i: Multi-Turn Tool Calls, Thought-Chains und Environment-Ausgaben.</text>
    <text x="16" y="64" fill="var(--svg-text-secondary)" font-size="11">Vollständig unveränderlich; der Inferenz-Agent operiert hier ohne Einblick in übergeordnete Wiki-Muster.</text>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(390, 100)">
    <line x1="0" y1="0" x2="0" y2="34" stroke="var(--svg-line)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-down-wiki)"/>
    <rect x="-115" y="8" width="230" height="18" rx="4" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1"/>
    <text x="0" y="21" fill="var(--svg-text-secondary)" font-size="9.5" font-weight="600" text-anchor="middle">VERDICHTUNG DURCH WIKI MAINTAINER</text>
  </g>

  <!-- Layer 2: Wiki Layer (The Core Innovation) -->
  <g transform="translate(36, 142)">
    <rect x="0" y="0" width="708" height="96" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
    <rect x="0" y="0" width="708" height="26" rx="8" fill="var(--svg-node-amber-bg)" fill-opacity="0.7"/>
    <text x="16" y="18" fill="var(--svg-node-amber-subtext)" font-size="11.5" font-weight="700">2. WIKI LAYER (wiki/) ── PERSISTENT &amp; KUMULATIV (WIRD NIEMALS ZURÜCKGEROLLT!)</text>
    <text x="16" y="47" fill="var(--svg-node-amber-subtext)" font-size="12" font-weight="600">• patterns/*.md: Generalisierte Root-Cause Analysen, Fehlerbilder, Randbedingungen und Heuristiken.</text>
    <text x="16" y="67" fill="var(--svg-node-amber-subtext)" font-size="12" font-weight="600">• skill-impact.md: Lückenloser Prüfpfad (Unified-Diffs, Validierungsscores und Akzeptanz-Urteile).</text>
    <text x="16" y="85" fill="var(--svg-node-green-border)" font-size="11" font-weight="600">★ Verhindert Optimization Amnesia: Das System lernt aus Fehlschlägen und wiederholt keine Sackgassen.</text>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(390, 238)">
    <line x1="0" y1="0" x2="0" y2="34" stroke="var(--svg-line)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-down-wiki)"/>
    <rect x="-105" y="8" width="210" height="18" rx="4" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1"/>
    <text x="0" y="21" fill="var(--svg-text-secondary)" font-size="9.5" font-weight="600" text-anchor="middle">SYNTHESE DURCH SKILL PROPOSER</text>
  </g>

  <!-- Layer 3: Skills Layer -->
  <g transform="translate(36, 280)">
    <rect x="0" y="0" width="708" height="76" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.2"/>
    <rect x="0" y="0" width="708" height="26" rx="8" fill="var(--svg-node-green-bg)" fill-opacity="0.6"/>
    <text x="16" y="18" fill="var(--svg-node-green-subtext)" font-size="11.5" font-weight="700">3. SKILLS LAYER (skills/) ── Ausführbar, modular und mutationsfähig</text>
    <text x="16" y="45" fill="var(--svg-text-primary)" font-size="12" font-weight="500">Prozedurale Handlungsanweisungen S_k: SKILL.md (Code/Workflows) verknüpft via PURPOSE.md mit Wiki-Mustern.</text>
    <text x="16" y="64" fill="var(--svg-node-green-subtext)" font-size="11">Validation Gating: Sinkt die Erfolgsquote, rollt S_k zurück – das Wiki (Schicht 2) behält die Erfahrung!</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', system-ui, sans-serif;"><defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="824" height="444" rx="12" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" fill="var(--svg-node-blue-border)" font-size="11" font-weight="700" letter-spacing="1">ARCHITEKTUR-VERGLEICH</text>
    <text x="0" y="24" fill="var(--svg-text-primary)" font-size="18" font-weight="700">Hermes Agent vs. Google WikiSkills</text>
    <text x="0" y="42" fill="var(--svg-text-secondary)" font-size="12">Pragmatische Runtime-Kuratierung im Dialog trifft auf mathematisch entkoppelte 3-Schichten-Wissenssynthese</text>
  </g>

  <!-- Left Column: Hermes Agent -->
  <g transform="translate(32, 90)">
    <rect x="0" y="0" width="374" height="336" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="32" rx="8" fill="var(--svg-node-blue-bg)" fill-opacity="0.6"/>
    <text x="14" y="21" fill="var(--svg-node-blue-subtext)" font-size="12" font-weight="700">HERMES AGENT (Nous Research)</text>
    <text x="14" y="52" fill="var(--svg-node-blue-border)" font-size="11" font-weight="600">Schwerpunkt: Interaktiver 24/7-Produktivbetrieb</text>

    <!-- Point 1 -->
    <g transform="translate(14, 70)">
      <circle cx="4" cy="6" r="3" fill="var(--svg-node-blue-border)"/>
      <text x="14" y="10" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">Progressive Disclosure (agentskills.io)</text>
      <text x="14" y="26" fill="var(--svg-text-secondary)" font-size="11">Dreistufig: L0-Katalog (Prompt) ──► L1 SKILL.md ──► L2 Skripte</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(14, 118)">
      <circle cx="4" cy="6" r="3" fill="var(--svg-node-blue-border)"/>
      <text x="14" y="10" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">In-Session-Lernen &amp; /learn-Kommando</text>
      <text x="14" y="26" fill="var(--svg-text-secondary)" font-size="11">Destilliert APIs, Code-Repos und Dialogspuren in Markdown-Skills</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(14, 166)">
      <circle cx="4" cy="6" r="3" fill="var(--svg-node-blue-border)"/>
      <text x="14" y="10" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">Der Hintergrund-Curator („Hausmeister“)</text>
      <text x="14" y="26" fill="var(--svg-text-secondary)" font-size="11">Inaktivitäts-Trigger: 30 Tage = stale, 90 Tage = .archive/</text>
      <text x="14" y="42" fill="var(--svg-text-secondary)" font-size="11">LLM Umbrella Merging konsolidiert redundante Mini-Skills</text>
    </g>

    <!-- Point 4 -->
    <g transform="translate(14, 230)">
      <circle cx="4" cy="6" r="3" fill="var(--svg-node-blue-border)"/>
      <text x="14" y="10" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">KV-Cache &amp; Schutz vor Amnesie</text>
      <text x="14" y="26" fill="var(--svg-text-secondary)" font-size="11">Frozen Snapshots (MEMORY.md) + hermes curator pin</text>
    </g>

    <!-- Evaluation footer -->
    <g transform="translate(14, 282)">
      <rect x="0" y="0" width="346" height="40" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
      <text x="10" y="16" fill="var(--svg-node-blue-subtext)" font-size="10.5" font-weight="600">Vorteil: Geringer Overhead, sofort einsatzbereit im Dev-Alltag</text>
      <text x="10" y="31" fill="var(--svg-node-red-border)" font-size="10.5">Grenze: Fehlversuche hinterlassen keinen maschinenlesbaren Prüfpfad</text>
    </g>
  </g>

  <!-- Right Column: Google WikiSkills -->
  <g transform="translate(434, 90)">
    <rect x="0" y="0" width="374" height="336" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="32" rx="8" fill="var(--svg-node-amber-bg)" fill-opacity="0.6"/>
    <text x="14" y="21" fill="var(--svg-node-amber-subtext)" font-size="12" font-weight="700">GOOGLE WIKISKILLS (arXiv:2608.27454)</text>
    <text x="14" y="52" fill="var(--svg-node-amber-border)" font-size="11" font-weight="600">Schwerpunkt: Formale Offline-Optimierung &amp; Anti-Amnesie</text>

    <!-- Point 1 -->
    <g transform="translate(14, 70)">
      <circle cx="4" cy="6" r="3" fill="var(--svg-node-amber-border)"/>
      <text x="14" y="10" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">3-Schichten-Wissensarchitektur</text>
      <text x="14" y="26" fill="var(--svg-text-secondary)" font-size="11">raw/ (Traces) ──► wiki/ (Muster) ──► skills/ (Ausführbare SKILL.md)</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(14, 118)">
      <circle cx="4" cy="6" r="3" fill="var(--svg-node-amber-border)"/>
      <text x="14" y="10" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">Strikte Inferenz-Isolation</text>
      <text x="14" y="26" fill="var(--svg-text-secondary)" font-size="11">Inferenz-Agent sieht das Wiki nie – erzwingt kanonische Skills</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(14, 166)">
      <circle cx="4" cy="6" r="3" fill="var(--svg-node-amber-border)"/>
      <text x="14" y="10" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">Unlöschbares Wiki &amp; Audit-Ledger</text>
      <text x="14" y="26" fill="var(--svg-text-secondary)" font-size="11">Validation-Fail? Nur Skills rollen zurück; das Wiki merkt sich Diffs</text>
      <text x="14" y="42" fill="var(--svg-node-green-border)" font-size="11" font-weight="600">★ Eliminiert Optimization Amnesia vollständig</text>
    </g>

    <!-- Point 4 -->
    <g transform="translate(14, 230)">
      <circle cx="4" cy="6" r="3" fill="var(--svg-node-amber-border)"/>
      <text x="14" y="10" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">4-Agenten-Zyklus mit Ground Truth</text>
      <text x="14" y="26" fill="var(--svg-text-secondary)" font-size="11">Inferenz ──► Wiki Maintainer ──► Skill Proposer ──► Validation Gating</text>
    </g>

    <!-- Evaluation footer -->
    <g transform="translate(14, 282)">
      <rect x="0" y="0" width="346" height="40" rx="6" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1"/>
      <text x="10" y="16" fill="var(--svg-node-amber-subtext)" font-size="10.5" font-weight="600">Vorteil: Monotone Gewinne (+12 % Gemini, +40 % SpreadSheet)</text>
      <text x="10" y="31" fill="var(--svg-node-red-subtext)" font-size="10.5">Grenze: Hoher Rechenaufwand, benötigt formalisierte Benchmarks</text>
    </g>
  </g>
</svg>

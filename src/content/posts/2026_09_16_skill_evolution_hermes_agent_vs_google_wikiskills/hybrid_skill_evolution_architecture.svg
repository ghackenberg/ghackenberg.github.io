<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', system-ui, sans-serif;">
  <defs>
    <marker id="arrow-hybrid-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="8" y="8" width="804" height="424" rx="12" fill="#0b1329" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" fill="#a855f7" font-size="11" font-weight="700" letter-spacing="1">HYBRIDE ENTERPRISE-ARCHITEKTUR</text>
    <text x="0" y="24" fill="#f8fafc" font-size="18" font-weight="700">Der „WikiCurator“: Symbiose aus Hermes Agent und WikiSkills</text>
    <text x="0" y="42" fill="#94a3b8" font-size="12">Schlanke, interaktive Ausführungslaufzeit kombiniert mit persistentem, unlöschbarem Wissensspeicher</text>
  </g>

  <!-- Level 1: Runtime Host (Hermes Agent Body) -->
  <g transform="translate(32, 90)">
    <rect x="0" y="0" width="756" height="80" rx="8" fill="#0d1b2e" stroke="#3b82f6" stroke-width="1.2" />
    <rect x="0" y="0" width="756" height="26" rx="8" fill="#1e3a8a" fill-opacity="0.5" />
    <text x="16" y="18" fill="#bfdbfe" font-size="11.5" font-weight="700">SCHICHT 1: HERMES RUNTIME-HOST (Interaktiver Dialog &amp; Ausführung)</text>
    
    <text x="16" y="46" fill="#f8fafc" font-size="12" font-weight="600">Progressive Disclosure nach agentskills.io:</text>
    <text x="270" y="46" fill="#94a3b8" font-size="12">L0-Katalog im System-Prompt hält KV-Cache schlank; L1/L2 werden on-demand geladen.</text>
    
    <text x="16" y="66" fill="#f8fafc" font-size="12" font-weight="600">Bounded Context:</text>
    <text x="130" y="66" fill="#94a3b8" font-size="12">Frozen Snapshots von MEMORY.md und USER.md verhindern Kontext- und Prompt-Verwässerung.</text>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(410, 170)">
    <line x1="0" y1="0" x2="0" y2="28" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-hybrid-down)" />
    <rect x="-105" y="5" width="210" height="18" rx="4" fill="#0b1329" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="0" y="18" fill="#cbd5e1" font-size="9.5" font-weight="600" text-anchor="middle">ASYNCHRONE TRACE-ÜBERGABE (raw/)</text>
  </g>

  <!-- Level 2: The WikiCurator Background Engine -->
  <g transform="translate(32, 204)">
    <rect x="0" y="0" width="756" height="100" rx="8" fill="#1e1329" stroke="#a855f7" stroke-width="1.4" />
    <rect x="0" y="0" width="756" height="26" rx="8" fill="#581c87" fill-opacity="0.6" />
    <text x="16" y="18" fill="#f3e8ff" font-size="11.5" font-weight="700">SCHICHT 2: DER WIKICURATOR (Intelligente Hintergrund-Optimierung im Leerlauf)</text>
    
    <text x="16" y="47" fill="#fef08a" font-size="12" font-weight="600">• Inaktivitäts-Pass:</text>
    <text x="145" y="47" fill="#cbd5e1" font-size="12">Feuert während Ruhephasen (≥ 2h Leerlauf), ohne laufende Benutzersitzungen zu blockieren.</text>
    
    <text x="16" y="68" fill="#fef08a" font-size="12" font-weight="600">• Unlöschbares Wiki:</text>
    <text x="155" y="68" fill="#cbd5e1" font-size="12">Destilliert Fehler in patterns/*.md und führt skill-impact.md als permanenten Prüfpfad.</text>
    
    <text x="16" y="89" fill="#4ade80" font-size="12" font-weight="600">• Gated Merging:</text>
    <text x="125" y="89" fill="#a7f3d0" font-size="12">Konsolidiert Skills via Smoke-Tests: Bei Fehlschlag rollt der Skill zurück, das Wiki lernt!</text>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(410, 304)">
    <line x1="0" y1="0" x2="0" y2="28" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-hybrid-down)" />
    <rect x="-95" y="5" width="190" height="18" rx="4" fill="#0b1329" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="0" y="18" fill="#cbd5e1" font-size="9.5" font-weight="600" text-anchor="middle">VERSIONIERTE PERSISTENZ</text>
  </g>

  <!-- Level 3: Storage Layer -->
  <g transform="translate(32, 338)">
    <rect x="0" y="0" width="756" height="76" rx="8" fill="#061c16" stroke="#10b981" stroke-width="1.2" />
    <rect x="0" y="0" width="756" height="26" rx="8" fill="#064e3b" fill-opacity="0.6" />
    <text x="16" y="18" fill="#a7f3d0" font-size="11.5" font-weight="700">SCHICHT 3: LOKALE DATEISYSTEM-EBENE (Git-versioniert &amp; 100 % On-Premise)</text>
    
    <text x="16" y="47" fill="#6ee7b7" font-size="12" font-weight="600">~/.hermes/raw/ &amp; state.db</text>
    <text x="210" y="47" fill="#94a3b8" font-size="11.5">Unveränderliche Traces &amp; FTS5 SQLite</text>
    
    <text x="470" y="47" fill="#fde68a" font-size="12" font-weight="600">~/.hermes/wiki/</text>
    <text x="580" y="47" fill="#94a3b8" font-size="11.5">Persistent patterns &amp; impact ledger</text>
    
    <text x="16" y="65" fill="#93c5fd" font-size="12" font-weight="600">~/.hermes/skills/ &amp; .archive/</text>
    <text x="220" y="65" fill="#94a3b8" font-size="11.5">Ausführbare SKILL.md &amp; PURPOSE.md</text>
  </g>
</svg>

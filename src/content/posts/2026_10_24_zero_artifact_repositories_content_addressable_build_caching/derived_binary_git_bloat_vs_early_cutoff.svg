<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="auto" role="img" aria-label="Comparison of Traditional In-Tree Binary Git Bloat versus Domain-Projected Constructive Traces with Early Cutoff">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>

    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-red-border)" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-purple-border)" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
  </defs>

  <!-- Outer Canvas Frame -->
  <rect id="canvas-bg" width="880" height="430" rx="14" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="1.5" />

  <!-- Top Header Banner -->
  <g id="header-bar">
    <text x="440" y="25" fill="var(--svg-text-primary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.06em" text-anchor="middle">IN-TREE BINARY PACKFILE BLOAT VS. CONSTRUCTIVE TRACE EARLY CUTOFF</text>
    <text x="440" y="42" fill="var(--svg-text-secondary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" text-anchor="middle">Why entropy-coded MP3/PDF streams defeat RFC 3284 VCDIFF deltas and how domain projection isolates invalidation</text>
    <line x1="24" y1="52" x2="856" y2="52" stroke="var(--svg-line)" stroke-width="1" />
  </g>

  <!-- LEFT PANE: Traditional In-Tree Binary Bloat -->
  <g id="left-bloat-pane" transform="translate(24, 62)">
    <rect width="404" height="346" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-red-border)" stroke-width="1.5" />
    <rect x="14" y="10" width="376" height="20" rx="4" fill="var(--svg-node-red-bg)" />
    <text x="202" y="24" fill="var(--svg-node-red-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" text-anchor="middle">1. TRADITIONAL IN-TREE DERIVED ARTIFACT COMMITS</text>

    <!-- Node L1: 1-Word MDX Edit -->
    <g id="left-edit-node" transform="translate(16, 40)">
      <rect width="372" height="54" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1.2" />
      <text x="186" y="21" fill="var(--svg-text-primary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">1-Word MDX Voiceover or Slide Edit</text>
      <text x="186" y="39" fill="var(--svg-text-secondary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Committed directly alongside 601 binary outputs (229.89 MiB)</text>
    </g>

    <path id="arr-l1-l2" d="M 202 94 L 202 114" fill="none" stroke="var(--svg-node-red-border)" stroke-width="1.5" marker-end="url(#arr-red)" />

    <!-- Node L2: Entropy Shift -->
    <g id="left-entropy-node" transform="translate(16, 116)">
      <rect width="372" height="66" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
      <text x="186" y="20" fill="var(--svg-node-amber-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Bit-Level Entropy Shift Across Binary Streams</text>
      <text x="186" y="38" fill="var(--svg-node-amber-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">• 48 kbps MP3: shifted MDCT frames &amp; Huffman bit reservoirs</text>
      <text x="186" y="54" fill="var(--svg-node-amber-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">• Chromium PDF: shifted FlateDecode LZ77 dictionaries &amp; xref</text>
    </g>

    <path id="arr-l2-l3" d="M 202 182 L 202 202" fill="none" stroke="var(--svg-node-red-border)" stroke-width="1.5" marker-end="url(#arr-red)" />

    <!-- Node L3: VCDIFF Breakdown -->
    <g id="left-vcdiff-node" transform="translate(16, 204)">
      <rect width="372" height="58" rx="8" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1.5" />
      <text x="186" y="21" fill="var(--svg-node-red-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RFC 3284 VCDIFF / LibXDiff Window Collapse</text>
      <text x="186" y="40" fill="var(--svg-node-red-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Rabin-Karp 16-byte rolling hashes miss shifted compressed blocks</text>
    </g>

    <path id="arr-l3-l4" d="M 202 262 L 202 280" fill="none" stroke="var(--svg-node-red-border)" stroke-width="1.5" marker-end="url(#arr-red)" />

    <!-- Node L4: Monotonic Packfile Bloat -->
    <g id="left-pack-node" transform="translate(16, 282)">
      <rect width="372" height="50" rx="8" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1.8" />
      <text x="186" y="20" fill="var(--svg-node-red-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Monotonic .git/objects/pack Growth O(N * S)</text>
      <text x="186" y="38" fill="var(--svg-node-red-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Full multi-megabyte binary blobs appended per edit revision</text>
    </g>
  </g>

  <!-- RIGHT PANE: Domain-Projected Constructive Trace with Early Cutoff -->
  <g id="right-cutoff-pane" transform="translate(452, 62)">
    <rect width="404" height="346" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
    <rect x="14" y="10" width="376" height="20" rx="4" fill="var(--svg-node-green-bg)" />
    <text x="202" y="24" fill="var(--svg-node-green-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" text-anchor="middle">2. DOMAIN-PROJECTED TRACE &amp; EARLY CUTOFF</text>

    <!-- Node R1: Pure Text MDX Commit -->
    <g id="right-edit-node" transform="translate(16, 40)">
      <rect width="372" height="54" rx="8" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
      <text x="186" y="21" fill="var(--svg-node-blue-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">1-Word MDX Voiceover Edit in Git</text>
      <text x="186" y="39" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">0 B binary delta in Git; orthogonal domain projection splits trace</text>
    </g>

    <!-- Split Arrows from R1 to Audio (Left) and Visual (Right) -->
    <path id="arr-r1-audio" d="M 106 94 L 106 122" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="1.5" marker-end="url(#arr-purple)" />
    <path id="arr-r1-visual" d="M 298 94 L 298 122" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.5" marker-end="url(#arr-green)" />

    <!-- Branch A: Narrative Hash (Left Sub-Column) -->
    <g id="right-audio-branch" transform="translate(16, 124)">
      <rect width="178" height="106" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.5" />
      <text x="89" y="20" fill="var(--svg-node-purple-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Narrative Audio Trace</text>
      <text x="89" y="38" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">extractCuesAndCleanText()</text>
      <text x="89" y="54" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">MD5(v5 + spoken + rawVo)</text>
      <text x="89" y="74" fill="var(--svg-node-purple-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Re-synthesizes 1 slide MP3</text>
      <text x="89" y="90" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Other 188 slides: cache hit</text>
    </g>

    <!-- Branch B: Visual Projection with Early Cutoff (Right Sub-Column) -->
    <g id="right-visual-branch" transform="translate(210, 124)">
      <rect width="178" height="106" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
      <text x="89" y="20" fill="var(--svg-node-green-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Visual Early Cutoff</text>
      <text x="89" y="38" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">extractSlideVisualContent()</text>
      <text x="89" y="54" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Strips voiceover &amp; notes</text>
      <text x="89" y="74" fill="var(--svg-node-green-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">deckHash 100% Unchanged</text>
      <text x="89" y="90" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Skips 184.70 MiB PDF render</text>
    </g>

    <path id="arr-r2-audio" d="M 106 230 L 145 268" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="1.5" marker-end="url(#arr-purple)" />
    <path id="arr-r2-visual" d="M 298 230 L 259 268" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.5" marker-end="url(#arr-green)" />

    <!-- Node R3: Out-of-Tree .cache Outcome -->
    <g id="right-cache-node" transform="translate(16, 270)">
      <rect width="372" height="62" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.8" />
      <text x="186" y="22" fill="var(--svg-node-green-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Zero-Artifact Git Tree + O(1) Constructive Cache</text>
      <text x="186" y="40" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">• 0 derived binaries in Git (-229.89 MiB working-tree footprint)</text>
      <text x="186" y="54" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">• Local verify: 0s Puppeteer skip (--if-ci) • CI: split cache</text>
    </g>
  </g>
</svg>

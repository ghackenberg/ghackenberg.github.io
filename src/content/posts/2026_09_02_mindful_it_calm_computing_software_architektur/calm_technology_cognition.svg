<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <filter id="shadow-ct" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="860" height="460" rx="16" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="2"/>

  <!-- Headline -->
  <text x="35" y="42" fill="var(--svg-text-primary)" font-size="18" font-weight="bold">Calm Technology &amp; Kognitive Ergonomie</text>
  <text x="35" y="62" fill="var(--svg-text-secondary)" font-size="12">Peripherie-Wahrnehmung, kognitive Schonkost und bewusste Interaktionsschwellen</text>

  <!-- ==================== LEFT: CALM TECHNOLOGY & PERIPHERY ==================== -->
  <g filter="url(#shadow-ct)">
    <rect x="30" y="85" width="400" height="365" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="2"/>
    <rect x="30" y="85" width="400" height="38" rx="12" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="2"/>
    <text x="48" y="109" fill="var(--svg-node-blue-border)" font-size="13" font-weight="bold">Aufmerksamkeitszonen (Weiser &amp; Brown)</text>

    <!-- 1. Peripherie der Aufmerksamkeit -->
    <g transform="translate(48, 136)">
      <rect x="0" y="0" width="364" height="74" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
      <text x="12" y="20" fill="var(--svg-node-green-subtext)" font-size="11.5" font-weight="bold">1. Peripherie (Subtile Wahrnehmung)</text>
      <text x="12" y="38" fill="var(--svg-node-green-subtext)" font-size="10">• Sanfte Statusindikatoren &amp; dezente Farbakzente</text>
      <text x="12" y="54" fill="var(--svg-node-green-subtext)" font-size="10">• Beansprucht <tspan font-weight="bold">keine</tspan> aktive kognitive Arbeitsgedächtniskapazität</text>
      <text x="12" y="68" fill="var(--svg-node-green-subtext)" font-size="9.5">Informiert im Hintergrund ohne zu unterbrechen</text>
    </g>

    <!-- Transition indicator -->
    <g transform="translate(195, 218)">
      <text x="0" y="12" fill="var(--svg-text-secondary)" font-size="11" font-weight="bold">⇅ Nahtloser Übergang nach Bedarf</text>
    </g>

    <!-- 2. Zentrum der Aufmerksamkeit -->
    <g transform="translate(48, 238)">
      <rect x="0" y="0" width="364" height="74" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.5"/>
      <text x="12" y="20" fill="var(--svg-node-purple-border)" font-size="11.5" font-weight="bold">2. Zentrum (Fokussierte Analyse)</text>
      <text x="12" y="38" fill="var(--svg-node-purple-subtext)" font-size="10">• Tiefe Problemlösung und Schema-Konstruktion</text>
      <text x="12" y="54" fill="var(--svg-node-purple-subtext)" font-size="10">• Strikt limitiert auf <tspan font-weight="bold">4 ± 1 Informationseinheiten</tspan></text>
      <text x="12" y="68" fill="var(--svg-node-purple-subtext)" font-size="9.5">Wird nur bei intentionaler Relevanz aktiv beansprucht</text>
    </g>

    <!-- Bottom summary -->
    <g transform="translate(48, 322)">
      <rect x="0" y="0" width="364" height="60" rx="8" fill="var(--svg-pill-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
      <text x="12" y="18" fill="var(--svg-node-blue-subtext)" font-size="10.5" font-weight="bold">Prinzip der Calm Tech:</text>
      <text x="12" y="34" fill="var(--svg-text-secondary)" font-size="9.5">Technologie soll am Rand der Aufmerksamkeit ruhen und</text>
      <text x="12" y="48" fill="var(--svg-text-secondary)" font-size="9.5">nur bei expliziter Nutzerintention ins Zentrum treten.</text>
    </g>

    <text x="48" y="434" fill="var(--svg-text-secondary)" font-size="10">Ziel: Minimaler Extraneous Load • Maximale Agency</text>
  </g>

  <!-- ==================== RIGHT: MINDFUL FRICTION & DELIBERATION ==================== -->
  <g filter="url(#shadow-ct)">
    <rect x="450" y="85" width="400" height="365" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-amber-border)" stroke-width="2"/>
    <rect x="450" y="85" width="400" height="38" rx="12" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="2"/>
    <text x="468" y="109" fill="var(--svg-node-amber-subtext)" font-size="13" font-weight="bold">Mindful Friction vs. „Frictionless UX“</text>

    <!-- 1. Deliberation Gates -->
    <g transform="translate(468, 136)">
      <rect x="0" y="0" width="364" height="66" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
      <text x="12" y="18" fill="var(--svg-node-amber-subtext)" font-size="11" font-weight="bold">Deliberation Gates (Bedenkzeit-Schwellen)</text>
      <text x="12" y="36" fill="var(--svg-text-secondary)" font-size="10">• 3–5s Verzögerung bei potenziell emotionalen Mails/Posts</text>
      <text x="12" y="52" fill="var(--svg-text-secondary)" font-size="10">• Aktiviert den präfrontalen Kortex vor impulsiven Aktionen</text>
    </g>

    <!-- 2. Intentionality Prompts -->
    <g transform="translate(468, 212)">
      <rect x="0" y="0" width="364" height="66" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
      <text x="12" y="18" fill="var(--svg-node-green-subtext)" font-size="11" font-weight="bold">Intentionality Prompts (Ziel-Reflexion)</text>
      <text x="12" y="36" fill="var(--svg-text-secondary)" font-size="10">• Kurze Intention-Abfrage vor Öffnen von Newsfeeds</text>
      <text x="12" y="52" fill="var(--svg-text-secondary)" font-size="10">• Verhindert unbewusstes Abdriften ins Doomscrolling</text>
    </g>

    <!-- 3. Finite Stopping Cues -->
    <g transform="translate(468, 288)">
      <rect x="0" y="0" width="364" height="66" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
      <text x="12" y="18" fill="var(--svg-node-blue-subtext)" font-size="11" font-weight="bold">Natürliche Sollbruchstellen (Finite UX)</text>
      <text x="12" y="36" fill="var(--svg-text-secondary)" font-size="10">• Paginierung &amp; „Inbox Zero“-Ruhezustände statt Infinite Scroll</text>
      <text x="12" y="52" fill="var(--svg-text-secondary)" font-size="10">• Klare visuelle Bestätigung bei erledigten Aufgaben</text>
    </g>

    <!-- Bottom summary -->
    <g transform="translate(468, 364)">
      <rect x="0" y="0" width="364" height="60" rx="8" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1"/>
      <text x="12" y="18" fill="var(--svg-node-red-subtext)" font-size="10" font-weight="bold">Die Falle des „Reibungslosen Designs“:</text>
      <text x="12" y="34" fill="var(--svg-node-red-subtext)" font-size="9.5">Frictionless UX hebelt rationale Kontrolle aus und</text>
      <text x="12" y="48" fill="var(--svg-node-red-subtext)" font-size="9.5">begünstigt Dopamin-gesteuertes Suchtverhalten.</text>
    </g>
  </g>
</svg>

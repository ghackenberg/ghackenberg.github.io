<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="auto" role="img" aria-label="Semantic vector diagram contrasting fixed 760px column SVG stretching (25.3px inflated labels) against font-weighted SVG scaling in rehype-inline-svg.ts targeting 14px-14.5px body prose parity">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
  </defs>

  <!-- Outer Canvas Background -->
  <rect x="0" y="0" width="480" height="480" rx="16" fill="var(--svg-bg)" />

  <!-- Ambient Halos -->
  <ellipse cx="132" cy="128" rx="96" ry="52" fill="var(--svg-node-red-bg)" opacity="0.22" />
  <ellipse cx="348" cy="128" rx="96" ry="52" fill="var(--svg-node-green-bg)" opacity="0.22" />
  <ellipse cx="240" cy="316" rx="196" ry="74" fill="var(--svg-node-blue-bg)" opacity="0.22" />

  <!-- Header -->
  <text x="240" y="32" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="0.05em" fill="var(--svg-text-primary)">FONT-WEIGHTED SVG SCALING</text>
  <text x="240" y="50" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12.5" font-weight="500" fill="var(--svg-text-secondary)">Matching Diagram Labels to 14px–14.5px Body Prose</text>

  <!-- ===================================================================
       TOP COMPARISON: FIXED 760PX STRETCH VS ADAPTIVE CLAMP
       =================================================================== -->
  <!-- Left Card: Unbounded 760px Column Stretch -->
  <rect x="28" y="70" width="198" height="112" rx="12" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="2" />
  <text x="127" y="96" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-node-red-text)">Fixed 760px Width</text>
  <text x="127" y="118" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12.5" font-weight="600" fill="var(--svg-node-red-subtext)">480×480 @ 16px Text</text>
  <rect x="52" y="132" width="150" height="34" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-red-border)" stroke-width="1.6" />
  <text x="127" y="154" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-red-text)">Bloated 25.3px</text>

  <!-- Right Card: Font-Weighted Target Max-Width -->
  <rect x="254" y="70" width="198" height="112" rx="12" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="2" />
  <text x="353" y="96" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-node-green-text)">Font-Weighted Cap</text>
  <text x="353" y="118" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12.5" font-weight="600" fill="var(--svg-node-green-subtext)">max-width: 435px–480px</text>
  <rect x="278" y="132" width="150" height="34" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1.6" />
  <text x="353" y="154" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-green-text)">Crisp 14.0px–14.5px</text>

  <!-- Curved Horizon Divider -->
  <path d="M 32 204 Q 240 218 448 204" fill="none" stroke="var(--svg-line)" stroke-width="1.8" stroke-dasharray="5,5" />

  <!-- ===================================================================
       MIDDLE ZONE: SCALING CURVE & PERCENTILE CLAMPING GRAPH
       =================================================================== -->
  <rect x="36" y="222" width="408" height="162" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
  <text x="240" y="246" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-node-blue-text)">W_target = clamp(round(V_w · 14.5 / f_0.25), 360, 760)</text>

  <!-- Graph Axes -->
  <line x1="84" y1="348" x2="412" y2="348" stroke="var(--svg-text-muted)" stroke-width="1.8" />
  <line x1="84" y1="264" x2="84" y2="348" stroke="var(--svg-text-muted)" stroke-width="1.8" />

  <!-- Upper & Lower Clamp Guides -->
  <line x1="84" y1="276" x2="412" y2="276" stroke="var(--svg-node-purple-border)" stroke-width="1.4" stroke-dasharray="4,3" />
  <text x="406" y="271" text-anchor="end" font-family="Outfit, Inter, sans-serif" font-size="11.5" font-weight="600" fill="var(--svg-node-purple-subtext)">Upper Cap (760px / 880px)</text>

  <line x1="84" y1="334" x2="412" y2="334" stroke="var(--svg-node-amber-border)" stroke-width="1.4" stroke-dasharray="4,3" />
  <text x="406" y="329" text-anchor="end" font-family="Outfit, Inter, sans-serif" font-size="11.5" font-weight="600" fill="var(--svg-node-amber-subtext)">Lower Floor (320px / 360px)</text>

  <!-- Clamped Hyperbolic Scaling Curve -->
  <path d="M 96 276 H 156 Q 236 282 316 328 H 396" fill="none" stroke="var(--svg-node-green-border)" stroke-width="3" stroke-linecap="round" />

  <!-- Data Points on Curve -->
  <circle cx="156" cy="276" r="5" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-text)" stroke-width="2" />
  <text x="156" y="296" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-purple-text)">f = 11.5px</text>

  <circle cx="244" cy="304" r="5.5" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-text)" stroke-width="2" />
  <text x="244" y="294" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-green-text)">f = 14.5px</text>

  <circle cx="316" cy="328" r="5" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-text)" stroke-width="2" />
  <text x="328" y="318" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-amber-text)">f = 16px</text>

  <!-- Axis Labels -->
  <text x="248" y="368" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="600" fill="var(--svg-text-secondary)">Source SVG Font Size (f_0.25 &amp; f_0.15 Floor)</text>

  <!-- ===================================================================
       BOTTOM SUMMARY PILL: ZERO OPTICAL BLOAT
       =================================================================== -->
  <rect x="44" y="404" width="392" height="50" rx="25" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2.2" />
  <text x="240" y="426" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-node-blue-text)">rehype-inline-svg.ts Optical Parity</text>
  <text x="240" y="444" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12.5" font-weight="500" fill="var(--svg-node-blue-subtext)">Character-Weighted Mean (14px) + 15th-Percentile Floor (12.2px)</text>
</svg>

    <circle cx="208" cy="528" r="18" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="2" />
    <circle cx="208" cy="528" r="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-purple-text)" stroke-width="1.5" />
    <text x="208" y="566" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="700" fill="var(--svg-text-primary)">Services</text>
    <text x="208" y="582" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="10" fill="var(--svg-text-muted)">240° Indigo</text>

    <circle cx="320" cy="528" r="18" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="2" />
    <circle cx="320" cy="528" r="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-purple-text)" stroke-width="1.5" />
    <text x="320" y="566" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="700" fill="var(--svg-text-primary)">Letters</text>
    <text x="320" y="582" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="10" fill="var(--svg-text-muted)">252° Iris</text>


    <circle cx="432" cy="528" r="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-purple-text)" stroke-width="1.5" />
    <text x="432" y="566" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="700" fill="var(--svg-text-primary)">Visuals</text>

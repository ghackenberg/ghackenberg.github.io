<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="auto" role="img" aria-label="Priority+ Geometric Folding Stages in the top tier and the 10-Stop Aurora Domain Spectrum arranged in a two-row wave in the bottom tier">
  <defs>

    <text x="44" y="158" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="700" fill="var(--svg-text-secondary)">960px Medium (Tablet Breakpoint)</text>
    <rect x="44" y="168" width="144" height="36" rx="6" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <linearGradient id="mx-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="50%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-purple-border)"/>
    </linearGradient>

    <linearGradient id="mx-card-rbac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-purple-bg)"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>

    <linearGradient id="mx-card-abac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-card-alt)"/>
      <stop offset="100%" stop-color="var(--svg-card)"/>
    </linearGradient>

    <linearGradient id="mx-card-uma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-green-bg)"/>
      <stop offset="100%" stop-color="var(--svg-node-green-bg)"/>
    </linearGradient>

    <filter id="mx-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <marker id="mx-arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-blue-border)"/>
    </marker>
    <marker id="mx-arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-green-border)"/>
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect x="10" y="10" width="980" height="740" rx="16" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(35, 30)">
    <text x="0" y="24" fill="url(#mx-header)" font-size="19" font-weight="800" letter-spacing="0.5">AUTORISIERUNGSMATRIX: RBAC, ABAC &amp; UMA 2.0 IM KI-ÖKOSYSTEM</text>
    <text x="0" y="44" fill="var(--svg-text-secondary)" font-size="12">Feingranulare Zugriffskontrolle für Inferenzmodelle, Agenten-Tools (MCP) und Wissensspeicher</text>
  </g>

  <!-- COLUMN 1: RBAC Hierarchie (Left: x=35, w=295) -->
  <g transform="translate(35, 85)">
    <rect width="295" height="505" rx="12" fill="url(#mx-card-rbac)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" filter="url(#mx-shadow)"/>
    <rect x="0" y="0" width="295" height="30" rx="12" fill="var(--svg-node-blue-border)" opacity="0.4"/>
    <text x="14" y="20" fill="var(--svg-node-purple-subtext)" font-size="11.5" font-weight="800">1. ROLLENBASIERT (RBAC)</text>

    <!-- Role 1: ai-admin -->
    <g transform="translate(14, 42)">
      <rect width="267" height="96" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
      <text x="12" y="20" fill="var(--svg-node-purple-subtext)" font-size="11" font-weight="700">Rolle: ai-admin</text>
      <line x1="12" y1="26" x2="255" y2="26" stroke="var(--svg-node-blue-border)" stroke-width="0.8" opacity="0.4"/>
      <text x="12" y="42" fill="var(--svg-text-secondary)" font-size="9">• LiteLLM Admin &amp; globale Budgets</text>
      <text x="12" y="58" fill="var(--svg-text-secondary)" font-size="9">• Zugriff auf alle Frontier- &amp; Cloud-Modelle</text>
      <text x="12" y="74" fill="var(--svg-text-secondary)" font-size="9">• Bereitstellung von MCP-Connectors</text>
      <text x="12" y="90" fill="var(--svg-node-blue-border)" font-size="8.5" font-weight="600">Volle Management-Autorität</text>
    </g>

    <!-- Role 2: ai-researcher -->
    <g transform="translate(14, 148)">
      <rect width="267" height="96" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
      <text x="12" y="20" fill="var(--svg-node-purple-subtext)" font-size="11" font-weight="700">Rolle: ai-researcher</text>
      <line x1="12" y1="26" x2="255" y2="26" stroke="var(--svg-node-blue-border)" stroke-width="0.8" opacity="0.4"/>
      <text x="12" y="42" fill="var(--svg-text-secondary)" font-size="9">• Zugriff auf 70B+ vLLM &amp; Claude 3.5</text>
      <text x="12" y="58" fill="var(--svg-text-secondary)" font-size="9">• Schreib- und Leserechte auf Neo4j</text>
      <text x="12" y="74" fill="var(--svg-text-secondary)" font-size="9">• Hermes Agent Tool Execution</text>
      <text x="12" y="90" fill="var(--svg-node-blue-border)" font-size="8.5" font-weight="600">Erweiterte Forschungsprivilegien</text>
    </g>

    <!-- Role 3: ai-developer -->
    <g transform="translate(14, 254)">
      <rect width="267" height="96" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
      <text x="12" y="20" fill="var(--svg-node-purple-subtext)" font-size="11" font-weight="700">Rolle: ai-developer</text>
      <line x1="12" y1="26" x2="255" y2="26" stroke="var(--svg-node-blue-border)" stroke-width="0.8" opacity="0.4"/>
      <text x="12" y="42" fill="var(--svg-text-secondary)" font-size="9">• Lokale vLLM-Modelle &amp; Standard-APIs</text>
      <text x="12" y="58" fill="var(--svg-text-secondary)" font-size="9">• Qdrant Vektor-RAG Lesezugriff</text>
      <text x="12" y="74" fill="var(--svg-text-secondary)" font-size="9">• TPM/RPM Kontingent nach Team-Vorgabe</text>
      <text x="12" y="90" fill="var(--svg-node-blue-border)" font-size="8.5" font-weight="600">Standard Entwickler-Zugang</text>
    </g>

    <!-- Role 4: internal-user / student -->
    <g transform="translate(14, 360)">
      <rect width="267" height="110" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
      <text x="12" y="20" fill="var(--svg-node-purple-subtext)" font-size="11" font-weight="700">Rolle: internal-user / student</text>
      <line x1="12" y1="26" x2="255" y2="26" stroke="var(--svg-node-blue-border)" stroke-width="0.8" opacity="0.4"/>
      <text x="12" y="42" fill="var(--svg-text-secondary)" font-size="9">• Ausschließlich lokale vLLM-Modelle</text>
      <text x="12" y="58" fill="var(--svg-text-secondary)" font-size="9">• Keine externen kostenpflichtigen APIs</text>
      <text x="12" y="74" fill="var(--svg-text-secondary)" font-size="9">• Isolierter Chat- und Mem0-Speicher</text>
      <text x="12" y="90" fill="var(--svg-text-secondary)" font-size="9">• Monats-Budget gecappt (z. B. 20 €)</text>
      <text x="12" y="104" fill="var(--svg-node-blue-border)" font-size="8.5" font-weight="600">Kosten- &amp; Datenbegrenzung</text>
    </g>
  </g>

  <!-- Connective Arrow 1 -> 2 -->
  <g transform="translate(332, 335)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#mx-arr-cyan)"/>
  </g>

  <!-- COLUMN 2: ABAC Dynamische Claims (Middle: x=352, w=296) -->
  <g transform="translate(352, 85)">
    <rect width="296" height="505" rx="12" fill="url(#mx-card-abac)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" filter="url(#mx-shadow)"/>
    <rect x="0" y="0" width="296" height="30" rx="12" fill="var(--svg-node-blue-bg)" opacity="0.3"/>
    <text x="14" y="20" fill="var(--svg-node-blue-subtext)" font-size="11.5" font-weight="800">2. ATTRIBUTE &amp; CLAIMS (ABAC)</text>

    <!-- Sub-box 1: Protocol Mappers -->
    <g transform="translate(14, 42)">
      <rect width="268" height="142" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
      <text x="12" y="19" fill="var(--svg-node-blue-border)" font-size="10.5" font-weight="700">Protocol Mappers (JWT Injektion)</text>
      <line x1="12" y1="25" x2="256" y2="25" stroke="var(--svg-node-blue-border)" stroke-width="0.8" opacity="0.4"/>
      <text x="12" y="42" fill="var(--svg-text-primary)" font-size="9">• <tspan fill="var(--svg-node-amber-border)" font-family="monospace">tenant_id:</tspan> Mandant für Qdrant/Mem0</text>
      <text x="12" y="60" fill="var(--svg-text-primary)" font-size="9">• <tspan fill="var(--svg-node-amber-border)" font-family="monospace">cost_center:</tspan> Kostenstelle für Audit</text>
      <text x="12" y="78" fill="var(--svg-text-primary)" font-size="9">• <tspan fill="var(--svg-node-amber-border)" font-family="monospace">budget_limit:</tspan> Inferenz-Budget (EUR)</text>
      <text x="12" y="96" fill="var(--svg-text-primary)" font-size="9">• <tspan fill="var(--svg-node-amber-border)" font-family="monospace">allowed_models:</tspan> Modell-Whitelist</text>
      <text x="12" y="114" fill="var(--svg-text-primary)" font-size="9">• <tspan fill="var(--svg-node-amber-border)" font-family="monospace">clearance:</tspan> Sicherheitslevel (L1–L4)</text>
      <text x="12" y="132" fill="var(--svg-node-green-border)" font-size="8.5" font-weight="600">Zur Token-Laufzeit generiert</text>
    </g>

    <!-- Sub-box 2: Evaluierungs-Regeln -->
    <g transform="translate(14, 194)">
      <rect width="268" height="142" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
      <text x="12" y="19" fill="var(--svg-node-blue-border)" font-size="10.5" font-weight="700">Kontextuelle ABAC-Policies</text>
      <line x1="12" y1="25" x2="256" y2="25" stroke="var(--svg-node-blue-border)" stroke-width="0.8" opacity="0.4"/>
      <text x="12" y="42" fill="var(--svg-text-secondary)" font-size="9">• <tspan fill="var(--svg-node-blue-subtext)" font-weight="600">Netzwerk-Zonierung:</tspan></text>
      <text x="22" y="56" fill="var(--svg-text-secondary)" font-size="8.5">Sensible Modelle nur via Campus-IP/VPN</text>
      <text x="12" y="74" fill="var(--svg-text-secondary)" font-size="9">• <tspan fill="var(--svg-node-blue-subtext)" font-weight="600">Zeitfenster-Policies:</tspan></text>
      <text x="22" y="88" fill="var(--svg-text-secondary)" font-size="8.5">Batch-Inferenz außerhalb Spitzenlast</text>
      <text x="12" y="106" fill="var(--svg-text-secondary)" font-size="9">• <tspan fill="var(--svg-node-blue-subtext)" font-weight="600">Data Classification:</tspan></text>
      <text x="22" y="120" fill="var(--svg-text-secondary)" font-size="8.5">Sensible Daten ausschließlich lokal (vLLM)</text>
    </g>

    <!-- Sub-box 3: Stateless Enforcement -->
    <g transform="translate(14, 346)">
      <rect width="268" height="144" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
      <text x="12" y="19" fill="var(--svg-node-blue-border)" font-size="10.5" font-weight="700">Stateless Gateway Enforcement</text>
      <line x1="12" y1="25" x2="256" y2="25" stroke="var(--svg-node-blue-border)" stroke-width="0.8" opacity="0.4"/>
      <text x="12" y="42" fill="var(--svg-text-secondary)" font-size="9">LiteLLM evaluiert Claims im JWT:</text>
      <rect x="12" y="52" width="244" height="42" rx="4" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="0.8"/>
      <text x="18" y="68" fill="var(--svg-text-primary)" font-family="monospace" font-size="8">if model not in claims.models:</text>
      <text x="18" y="82" fill="var(--svg-node-red-border)" font-family="monospace" font-size="8">    raise AccessDenied(403)</text>
      <text x="12" y="110" fill="var(--svg-text-secondary)" font-size="8.5">Kein Datenbank-Roundtrip nötig!</text>
      <text x="12" y="128" fill="var(--svg-node-green-border)" font-size="8.5" font-weight="700">Prüf-Latenz: &lt; 0.2 ms (In-Memory)</text>
    </g>
  </g>

  <!-- Connective Arrow 2 -> 3 -->
  <g transform="translate(650, 335)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="var(--svg-node-green-border)" stroke-width="2" marker-end="url(#mx-arr-emerald)"/>
  </g>

  <!-- COLUMN 3: UMA 2.0 & Resource Servers (Right: x=670, w=295) -->
  <g transform="translate(670, 85)">
    <rect width="295" height="505" rx="12" fill="url(#mx-card-uma)" stroke="var(--svg-node-green-border)" stroke-width="1.5" filter="url(#mx-shadow)"/>
    <rect x="0" y="0" width="295" height="30" rx="12" fill="var(--svg-node-green-bg)" opacity="0.3"/>
    <text x="14" y="20" fill="var(--svg-node-green-subtext)" font-size="11.5" font-weight="800">3. UMA 2.0 &amp; RESSOURCEN</text>

    <!-- Sub-box 1: Protected AI Resources -->
    <g transform="translate(14, 42)">
      <rect width="267" height="142" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1"/>
      <text x="12" y="19" fill="var(--svg-node-green-subtext)" font-size="10.5" font-weight="700">Geschützte KI-Ressourcen</text>
      <line x1="12" y1="25" x2="255" y2="25" stroke="var(--svg-node-green-border)" stroke-width="0.8" opacity="0.4"/>
      <text x="12" y="42" fill="var(--svg-node-green-subtext)" font-size="9" font-weight="600">• Inferenz-Endpunkte:</text>
      <text x="22" y="56" fill="var(--svg-text-secondary)" font-size="8.5">/v1/models/llama-70b (Scope: <tspan fill="var(--svg-node-amber-border)">infer</tspan>)</text>
      <text x="12" y="74" fill="var(--svg-node-green-subtext)" font-size="9" font-weight="600">• MCP Werkzeuge &amp; Konnektoren:</text>
      <text x="22" y="88" fill="var(--svg-text-secondary)" font-size="8.5">/mcp/erp-service (Scope: <tspan fill="var(--svg-node-amber-border)">tool:sql_read</tspan>)</text>
      <text x="12" y="106" fill="var(--svg-node-green-subtext)" font-size="9" font-weight="600">• Wissensgraphen (Neo4j):</text>
      <text x="22" y="120" fill="var(--svg-text-secondary)" font-size="8.5">/graphs/enterprise (Scopes: <tspan fill="var(--svg-node-amber-border)">query</tspan>, <tspan fill="var(--svg-node-red-border)">mutate</tspan>)</text>
    </g>

    <!-- Sub-box 2: Permission Tickets & RPT -->
    <g transform="translate(14, 194)">
      <rect width="267" height="142" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1"/>
      <text x="12" y="19" fill="var(--svg-node-green-subtext)" font-size="10.5" font-weight="700">Ticket &amp; RPT Token Lifecycle</text>
      <line x1="12" y1="25" x2="255" y2="25" stroke="var(--svg-node-green-border)" stroke-width="0.8" opacity="0.4"/>
      <text x="12" y="40" fill="var(--svg-text-secondary)" font-size="8.5">1. Client fordert Ressource an</text>
      <text x="12" y="56" fill="var(--svg-text-secondary)" font-size="8.5">2. Server antwortet mit <tspan fill="var(--svg-node-amber-border)">Permission Ticket (401)</tspan></text>
      <text x="12" y="72" fill="var(--svg-text-secondary)" font-size="8.5">3. Client tauscht Ticket bei Keycloak ein</text>
      <text x="12" y="88" fill="var(--svg-text-secondary)" font-size="8.5">4. Keycloak evaluiert Policy-Matrix</text>
      <text x="12" y="104" fill="var(--svg-text-secondary)" font-size="8.5">5. Keycloak emittiert <tspan fill="var(--svg-node-green-border)" font-weight="700">RPT (Requesting Party Token)</tspan></text>
      <text x="12" y="126" fill="var(--svg-node-green-border)" font-size="8" font-weight="600">Standardisierter UMA 2.0 Ablauf</text>
    </g>

    <!-- Sub-box 3: Policy Enforcement Point -->
    <g transform="translate(14, 346)">
      <rect width="267" height="144" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1"/>
      <text x="12" y="19" fill="var(--svg-node-green-subtext)" font-size="10.5" font-weight="700">Policy Enforcement Point (PEP)</text>
      <line x1="12" y1="25" x2="255" y2="25" stroke="var(--svg-node-green-border)" stroke-width="0.8" opacity="0.4"/>
      <text x="12" y="42" fill="var(--svg-text-secondary)" font-size="9">• Entkopplung von Fachcode &amp; Security</text>
      <text x="12" y="60" fill="var(--svg-text-secondary)" font-size="9">• Keine hartcodierten ACLs im Agenten</text>
      <text x="12" y="78" fill="var(--svg-text-secondary)" font-size="9">• Zentrale Auditierbarkeit im IDP</text>
      <text x="12" y="96" fill="var(--svg-text-secondary)" font-size="9">• Sofortiger Widerruf von Tool-Rechten</text>
      <text x="12" y="124" fill="var(--svg-node-green-border)" font-size="8.5" font-weight="700">Dynamischer Zero-Trust Schutz</text>
    </g>
  </g>

  <!-- Bottom Summary Note (y=610 to 735, generous multi-line card) -->
  <g transform="translate(35, 608)">
    <rect width="930" height="114" rx="10" fill="var(--svg-pill-bg)" stroke="var(--svg-line)" stroke-width="1.2" filter="url(#mx-shadow)"/>
    <text x="18" y="24" fill="var(--svg-node-blue-border)" font-size="11" font-weight="700">Synergie der drei Autorisierungs-Dimensionen:</text>
    <line x1="18" y1="32" x2="912" y2="32" stroke="var(--svg-line)" stroke-width="0.8" opacity="0.5"/>
    
    <text x="18" y="52" fill="var(--svg-text-secondary)" font-size="9.5">
      <tspan fill="var(--svg-node-purple-subtext)" font-weight="700">• 1. RBAC:</tspan> Definiert statische Organisationsrollen (<tspan fill="var(--svg-text-primary)">ai-admin</tspan>, <tspan fill="var(--svg-text-primary)">researcher</tspan>, <tspan fill="var(--svg-text-primary)">student</tspan>) und regelt den Basiszugang zu Modellkatalogen und Repositories.
    </text>
    
    <text x="18" y="74" fill="var(--svg-text-secondary)" font-size="9.5">
      <tspan fill="var(--svg-node-blue-subtext)" font-weight="700">• 2. ABAC:</tspan> Steuert dynamische Kontextattribute (<tspan fill="var(--svg-node-amber-border)">tenant_id</tspan>, <tspan fill="var(--svg-node-amber-border)">budget_limit</tspan>, Zeitfenster, IP-Netzwerkzone) und erlaubt zustandslose Latenz-Validierung am Gateway.
    </text>
    
    <text x="18" y="96" fill="var(--svg-text-secondary)" font-size="9.5">
      <tspan fill="var(--svg-node-green-subtext)" font-weight="700">• 3. UMA 2.0:</tspan> Schützt konkrete KI-Werkzeuge (<tspan fill="var(--svg-text-primary)">Model Context Protocol</tspan>) und Inferenz-Ressourcen über Ticket-basierte Requesting Party Tokens (RPT).
    </text>
  </g>
</svg>

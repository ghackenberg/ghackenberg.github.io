<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="kc-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="kc-card-client" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="kc-card-quarkus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c233c" />
      <stop offset="100%" stop-color="#061220" />
    </linearGradient>

    <linearGradient id="kc-card-cache" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="kc-card-db" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e053a" />
    </linearGradient>

    <linearGradient id="kc-card-spi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311302" />
      <stop offset="100%" stop-color="#1a0a01" />
    </linearGradient>

    <filter id="kc-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <marker id="kc-arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="kc-arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="kc-arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="kc-arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Frame Canvas -->
  <rect x="10" y="10" width="980" height="700" rx="16" fill="#070b16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Header Section -->
  <g transform="translate(35, 30)">
    <text x="0" y="24" fill="url(#kc-header)" font-size="20" font-weight="800" letter-spacing="0.5">KEYCLOAK SYSTEM-ARCHITEKTUR &amp; CLOUD-NATIVE QUARKUS CORE</text>
    <text x="0" y="44" fill="#94a3b8" font-size="12.5">Hochperformante OIDC/OAuth2-Identity-Engine, verteiltes Infinispan In-Memory-State-Management &amp; Enterprise-SPIs</text>
  </g>

  <!-- 1. Client & Gateway Tier (Top Horizontal) -->
  <g transform="translate(35, 95)">
    <rect width="930" height="95" rx="12" fill="url(#kc-card-client)" stroke="#4338ca" stroke-width="1.5" filter="url(#kc-shadow)" />
    <rect x="0" y="0" width="930" height="26" rx="12" fill="#312e81" opacity="0.4" />
    <text x="18" y="18" fill="#a5b4fc" font-size="11.5" font-weight="700" letter-spacing="0.5">1. KONSUMENTEN, AGENTEN &amp; PERIMETER-GATEWAYS</text>

    <!-- Sub-boxes -->
    <g transform="translate(15, 34)">
      <rect width="210" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="20" fill="#e0e7ff" font-size="11" font-weight="700">Open WebUI Frontend</text>
      <text x="12" y="36" fill="#94a3b8" font-size="9.5">OIDC Auth Code Flow + PKCE</text>
    </g>

    <g transform="translate(245, 34)">
      <rect width="210" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="20" fill="#e0e7ff" font-size="11" font-weight="700">LiteLLM Proxy Gateway</text>
      <text x="12" y="36" fill="#94a3b8" font-size="9.5">Stateless JWT Auth &amp; Role-Mapping</text>
    </g>

    <g transform="translate(475, 34)">
      <rect width="215" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="20" fill="#e0e7ff" font-size="11" font-weight="700">Hermes Agent &amp; LangGraph</text>
      <text x="12" y="36" fill="#94a3b8" font-size="9.5">Client Credentials &amp; RFC 8693 Exchange</text>
    </g>

    <g transform="translate(710, 34)">
      <rect width="205" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="20" fill="#e0e7ff" font-size="11" font-weight="700">Admin Console &amp; CLI</text>
      <text x="12" y="36" fill="#94a3b8" font-size="9.5">kcadm.sh / REST Admin API</text>
    </g>
  </g>

  <!-- Flow Arrows 1 -> 2 -->
  <line x1="150" y1="190" x2="150" y2="225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#kc-arrow-sky)" />
  <line x1="380" y1="190" x2="380" y2="225" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#kc-arrow-sky)" />
  <line x1="610" y1="190" x2="610" y2="225" stroke="#c084fc" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#kc-arrow-purple)" />
  <line x1="840" y1="190" x2="840" y2="225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#kc-arrow-sky)" />

  <!-- 2. Core Quarkus Runtime (Central Box) -->
  <g transform="translate(35, 230)">
    <rect width="930" height="240" rx="14" fill="url(#kc-card-quarkus)" stroke="#0284c7" stroke-width="2" filter="url(#kc-shadow)" />
    <rect x="0" y="0" width="930" height="28" rx="14" fill="#0369a1" opacity="0.3" />
    <text x="18" y="19" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="0.5">2. KEYCLOAK CLOUD-NATIVE CORE (QUARKUS REACTIVE RUNTIME · NON-BLOCKING NETTY)</text>

    <!-- Subsystem 1: Protocol & Token Engine -->
    <g transform="translate(18, 38)">
      <rect width="210" height="185" rx="10" fill="#0b192c" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="14" y="22" fill="#7dd3fc" font-size="11.5" font-weight="700">OIDC / Token Engine</text>
      <line x1="14" y1="30" x2="196" y2="30" stroke="#0ea5e9" stroke-width="0.8" opacity="0.4" />
      
      <text x="14" y="50" fill="#e2e8f0" font-size="10">• JWT / JWS (RS256, EdDSA)</text>
      <text x="14" y="70" fill="#e2e8f0" font-size="10">• JWKS Key Rotation (/certs)</text>
      <text x="14" y="90" fill="#e2e8f0" font-size="10">• RFC 8693 Token Exchange</text>
      <text x="14" y="110" fill="#e2e8f0" font-size="10">• Refresh Token Rotation</text>
      <text x="14" y="130" fill="#e2e8f0" font-size="10">• OIDC Backchannel Logout</text>
      <text x="14" y="150" fill="#e2e8f0" font-size="10">• OAuth 2.0 Device Flow</text>
      <text x="14" y="170" fill="#38bdf8" font-size="9.5" font-weight="600">Latenz: &lt; 2 ms (Stateless Verify)</text>
    </g>

    <!-- Subsystem 2: Realm & Client Model -->
    <g transform="translate(245, 38)">
      <rect width="210" height="185" rx="10" fill="#0b192c" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="14" y="22" fill="#7dd3fc" font-size="11.5" font-weight="700">Realms &amp; Multi-Tenancy</text>
      <line x1="14" y1="30" x2="196" y2="30" stroke="#0ea5e9" stroke-width="0.8" opacity="0.4" />

      <text x="14" y="50" fill="#e2e8f0" font-size="10">• Master Realm (Cluster Admin)</text>
      <text x="14" y="70" fill="#e2e8f0" font-size="10">• AI-Tenant Realms (Isoliert)</text>
      <text x="14" y="90" fill="#e2e8f0" font-size="10">• Client Scopes &amp; Audiences</text>
      <text x="14" y="110" fill="#e2e8f0" font-size="10">• Protocol Mappers (Custom Claims)</text>
      <text x="14" y="130" fill="#e2e8f0" font-size="10">• Composite &amp; Client Roles</text>
      <text x="14" y="150" fill="#e2e8f0" font-size="10">• User Groups &amp; Attributes</text>
      <text x="14" y="170" fill="#38bdf8" font-size="9.5" font-weight="600">Strikte Tenant-Isolation</text>
    </g>

    <!-- Subsystem 3: Authorization Services (UMA 2.0) -->
    <g transform="translate(472, 38)">
      <rect width="215" height="185" rx="10" fill="#0b192c" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="14" y="22" fill="#7dd3fc" font-size="11.5" font-weight="700">UMA 2.0 &amp; Policy Engine</text>
      <line x1="14" y1="30" x2="201" y2="30" stroke="#0ea5e9" stroke-width="0.8" opacity="0.4" />

      <text x="14" y="50" fill="#e2e8f0" font-size="10">• Fine-Grained Authorization</text>
      <text x="14" y="70" fill="#e2e8f0" font-size="10">• Resource Servers &amp; Scopes</text>
      <text x="14" y="90" fill="#e2e8f0" font-size="10">• ABAC (Attribute-Based Policies)</text>
      <text x="14" y="110" fill="#e2e8f0" font-size="10">• RBAC (Role-Based Policies)</text>
      <text x="14" y="130" fill="#e2e8f0" font-size="10">• Permission Tickets &amp; RPTs</text>
      <text x="14" y="150" fill="#e2e8f0" font-size="10">• JavaScript &amp; Time Evaluation</text>
      <text x="14" y="170" fill="#38bdf8" font-size="9.5" font-weight="600">Policy Enforcement Points (PEP)</text>
    </g>

    <!-- Subsystem 4: Security & Authentication Flows -->
    <g transform="translate(704, 38)">
      <rect width="208" height="185" rx="10" fill="#0b192c" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="14" y="22" fill="#7dd3fc" font-size="11.5" font-weight="700">Auth Flows &amp; Brute Force</text>
      <line x1="14" y1="30" x2="194" y2="30" stroke="#0ea5e9" stroke-width="0.8" opacity="0.4" />

      <text x="14" y="50" fill="#e2e8f0" font-size="10">• Modular Execution Flows</text>
      <text x="14" y="70" fill="#e2e8f0" font-size="10">• WebAuthn / FIDO2 / Passkeys</text>
      <text x="14" y="90" fill="#e2e8f0" font-size="10">• Time-Based OTP (TOTP)</text>
      <text x="14" y="110" fill="#e2e8f0" font-size="10">• Brute Force Detection</text>
      <text x="14" y="130" fill="#e2e8f0" font-size="10">• IP / Failure Lockout Limits</text>
      <text x="14" y="150" fill="#e2e8f0" font-size="10">• Identity Brokering (OIDC/SAML)</text>
      <text x="14" y="170" fill="#38bdf8" font-size="9.5" font-weight="600">Zero-Trust Perimeter</text>
    </g>
  </g>

  <!-- Connectors 2 -> 3 (Bottom Tiers) -->
  <line x1="180" y1="470" x2="180" y2="505" stroke="#34d399" stroke-width="2" marker-end="url(#kc-arrow-emerald)" />
  <line x1="500" y1="470" x2="500" y2="505" stroke="#c084fc" stroke-width="2" marker-end="url(#kc-arrow-purple)" />
  <line x1="820" y1="470" x2="820" y2="505" stroke="#f59e0b" stroke-width="2" marker-end="url(#kc-arrow-amber)" />

  <!-- 3. Lower Tier: Storage, In-Memory Caches & SPIs -->
  <!-- Left Box: Infinispan Distributed State -->
  <g transform="translate(35, 510)">
    <rect width="295" height="175" rx="12" fill="url(#kc-card-cache)" stroke="#059669" stroke-width="1.5" filter="url(#kc-shadow)" />
    <rect x="0" y="0" width="295" height="26" rx="12" fill="#047857" opacity="0.3" />
    <text x="14" y="18" fill="#6ee7b7" font-size="11" font-weight="700" letter-spacing="0.5">INFINISPAN DISTRIBUTED CACHE</text>

    <text x="14" y="48" fill="#d1fae5" font-size="10.5" font-weight="600">• User Sessions &amp; Client Sessions</text>
    <text x="14" y="66" fill="#94a3b8" font-size="9.5">  Verteilt im Cluster via JGroups / TCP</text>

    <text x="14" y="86" fill="#d1fae5" font-size="10.5" font-weight="600">• Login Failures &amp; Rate Limits</text>
    <text x="14" y="104" fill="#94a3b8" font-size="9.5">  Echtzeit-Counter ohne DB-Writes</text>

    <text x="14" y="124" fill="#d1fae5" font-size="10.5" font-weight="600">• Offline Sessions &amp; Action Tokens</text>
    <text x="14" y="142" fill="#94a3b8" font-size="9.5">  Persistiert &amp; asynchron synchronisiert</text>

    <text x="14" y="162" fill="#34d399" font-size="9.5" font-weight="700">Sub-Millisekunden Lesezugriff</text>
  </g>

  <!-- Middle Box: Relational PostgreSQL Store -->
  <g transform="translate(345, 510)">
    <rect width="310" height="175" rx="12" fill="url(#kc-card-db)" stroke="#9333ea" stroke-width="1.5" filter="url(#kc-shadow)" />
    <rect x="0" y="0" width="310" height="26" rx="12" fill="#7e22ce" opacity="0.3" />
    <text x="14" y="18" fill="#d8b4fe" font-size="11" font-weight="700" letter-spacing="0.5">POSTGRESQL RELATIONAL PERSISTENZ</text>

    <text x="14" y="48" fill="#f3e8ff" font-size="10.5" font-weight="600">• Realm Konfiguration &amp; Keys</text>
    <text x="14" y="66" fill="#94a3b8" font-size="9.5">  Kryptografische Schlüssel, RSA/EC Keypairs</text>

    <text x="14" y="86" fill="#f3e8ff" font-size="10.5" font-weight="600">• Users, Credentials &amp; Passwörter</text>
    <text x="14" y="104" fill="#94a3b8" font-size="9.5">  Argon2 / PBKDF2 Hashing, MFA-Secrets</text>

    <text x="14" y="124" fill="#f3e8ff" font-size="10.5" font-weight="600">• Clients, Rollen &amp; UMA Policies</text>
    <text x="14" y="142" fill="#94a3b8" font-size="9.5">  ACID-Garantie, Transaktionssicherheit</text>

    <text x="14" y="162" fill="#c084fc" font-size="9.5" font-weight="700">Skalierbar via Read-Replicas</text>
  </g>

  <!-- Right Box: SPI Extensibility & Federation -->
  <g transform="translate(670, 510)">
    <rect width="295" height="175" rx="12" fill="url(#kc-card-spi)" stroke="#d97706" stroke-width="1.5" filter="url(#kc-shadow)" />
    <rect x="0" y="0" width="295" height="26" rx="12" fill="#b45309" opacity="0.3" />
    <text x="14" y="18" fill="#fde68a" font-size="11" font-weight="700" letter-spacing="0.5">SPI LAYER &amp; USER FEDERATION</text>

    <text x="14" y="48" fill="#fef3c7" font-size="10.5" font-weight="600">• LDAP / Active Directory Federation</text>
    <text x="14" y="66" fill="#94a3b8" font-size="9.5">  Periodischer User-Sync &amp; Kerberos SSO</text>

    <text x="14" y="86" fill="#fef3c7" font-size="10.5" font-weight="600">• Custom Event Listener SPI</text>
    <text x="14" y="104" fill="#94a3b8" font-size="9.5">  Audit-Streams an SIEM, Kafka &amp; OTEL</text>

    <text x="14" y="124" fill="#fef3c7" font-size="10.5" font-weight="600">• Token Exchange &amp; Mapper SPI</text>
    <text x="14" y="142" fill="#94a3b8" font-size="9.5">  Dynamische Claim-Transformation für AI</text>

    <text x="14" y="162" fill="#f59e0b" font-size="9.5" font-weight="700">100% Modulare Erweiterbarkeit</text>
  </g>
</svg>

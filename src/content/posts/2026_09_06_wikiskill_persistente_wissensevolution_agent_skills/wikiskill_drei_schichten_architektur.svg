<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', sans-serif;">
  <defs>
    <linearGradient id="grad-header-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="grad-raw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="grad-wiki" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="grad-skills" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect x="10" y="10" width="880" height="620" rx="16" fill="#090d1a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08">
    <line x1="30" y1="210" x2="870" y2="210" stroke="#818cf8" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="30" y1="410" x2="870" y2="410" stroke="#818cf8" stroke-dasharray="4 8" stroke-width="1" />
    <circle cx="100" cy="530" r="3" fill="#38bdf8" /><circle cx="150" cy="530" r="3" fill="#38bdf8" />
    <circle cx="750" cy="90" r="3" fill="#c084fc" /><circle cx="800" cy="90" r="3" fill="#c084fc" />
  </g>

  <!-- Badge & Title -->
  <rect x="40" y="28" width="350" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
  <text x="50" y="45" fill="#a5b4fc" font-size="11" font-weight="bold" letter-spacing="1">WIKISKILL ARCHITEKTUR &amp; EVOLUTIONS-LOOP</text>

  <text x="40" y="78" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="-0.5">Die Drei-Schichten-Architektur im iterativen 4-Agenten-Zyklus</text>
  <text x="40" y="98" fill="#94a3b8" font-size="12">Strikte Trennung von Roh-Trajektorien, persistenter Wissenskompilierung und ausführbaren Fertigkeiten</text>

  <!-- ==================== 3 SCHICHTEN CONTAINER (LEFT) ==================== -->
  
  <!-- LAYER 1: RAW LAYER -->
  <g filter="url(#box-shadow)" transform="translate(40, 120)">
    <rect x="0" y="0" width="370" height="135" rx="10" fill="url(#grad-raw)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="370" height="28" rx="10" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <text x="14" y="19" fill="#f0f9ff" font-size="11.5" font-weight="bold">1. RAW LAYER (raw/) – Unveränderliche Historie</text>
    
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="342" height="85" rx="6" fill="#0b1329" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
      <text x="10" y="18" fill="#bae6fd" font-size="10" font-weight="bold">• Vollständige Ausführungsspuren (Traces τ):</text>
      <text x="18" y="34" fill="#94a3b8" font-size="9.5">Multi-Turn Observations, Reasoning Steps, Werkzeugaufrufe &amp; Outputs</text>
      <text x="10" y="52" fill="#bae6fd" font-size="10" font-weight="bold">• Append-Only &amp; Immutable:</text>
      <text x="18" y="68" fill="#94a3b8" font-size="9.5">Keine nachträgliche Manipulation; dient als unverfälschte Evidenzbasis</text>
    </g>
  </g>

  <!-- LAYER 2: WIKI LAYER -->
  <g filter="url(#box-shadow)" transform="translate(40, 275)">
    <rect x="0" y="0" width="370" height="175" rx="10" fill="url(#grad-wiki)" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="370" height="28" rx="10" fill="#047857" stroke="#10b981" stroke-width="1.5" />
    <text x="14" y="19" fill="#ecfdf5" font-size="11.5" font-weight="bold">2. WIKI LAYER (wiki/) – Persistentes Langzeitwissen</text>
    
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="342" height="124" rx="6" fill="#022119" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
      <text x="10" y="18" fill="#6ee7b7" font-size="10" font-weight="bold">• patterns/*.md (Kompilierte Fehlermuster &amp; Strategien):</text>
      <text x="18" y="32" fill="#94a3b8" font-size="9.5">Strukturierte Root-Cause-Analysen, Problemursachen &amp; Workarounds</text>
      <text x="10" y="50" fill="#6ee7b7" font-size="10" font-weight="bold">• logs.md &amp; index.md (Evolutions-Katalog):</text>
      <text x="18" y="64" fill="#94a3b8" font-size="9.5">Chronologisches Protokoll aller Erkenntnisse und Pattern-Registry</text>
      <text x="10" y="82" fill="#6ee7b7" font-size="10" font-weight="bold">• skill-impact.md (Ground-Truth Audit-Trail):</text>
      <text x="18" y="96" fill="#94a3b8" font-size="9.5">Lückenlose Aufzeichnung aller Unified Diffs, Val-Scores &amp; Rejections</text>
      <text x="10" y="114" fill="#34d399" font-size="9.5" font-weight="bold">★ WIRD NIEMALS ZURÜCKGEROLLT (Persistenter Wissensspeicher)</text>
    </g>
  </g>

  <!-- LAYER 3: SKILLS LAYER -->
  <g filter="url(#box-shadow)" transform="translate(40, 470)">
    <rect x="0" y="0" width="370" height="135" rx="10" fill="url(#grad-skills)" stroke="#c084fc" stroke-width="1.5" />
    <rect x="0" y="0" width="370" height="28" rx="10" fill="#7e22ce" stroke="#c084fc" stroke-width="1.5" />
    <text x="14" y="19" fill="#faf5ff" font-size="11.5" font-weight="bold">3. SKILLS LAYER (skills/) – Ausführbare Prozeduren</text>
    
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="342" height="85" rx="6" fill="#200a35" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1" />
      <text x="10" y="18" fill="#e9d5ff" font-size="10" font-weight="bold">• SKILL.md (Deklaratives Fähigkeiten-Modul):</text>
      <text x="18" y="34" fill="#94a3b8" font-size="9.5">Name, Description, Input-Verträge, konkrete Handlungsregeln</text>
      <text x="10" y="52" fill="#e9d5ff" font-size="10" font-weight="bold">• PURPOSE.md (Rückverknüpfung ins Wiki):</text>
      <text x="18" y="68" fill="#94a3b8" font-size="9.5">Mappt die Fähigkeit direkt auf die motivierenden Wiki-Patterns</text>
    </g>
  </g>

  <!-- ==================== 4 AGENTEN EVOLUTIONS-LOOP (RIGHT) ==================== -->

  <!-- AGENT 1: INFERENCE AGENT -->
  <g filter="url(#box-shadow)" transform="translate(490, 120)">
    <rect x="0" y="0" width="360" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="24" cy="24" r="12" fill="#0284c7" />
    <text x="21" y="28" fill="#ffffff" font-size="11" font-weight="bold">1</text>
    <text x="44" y="28" fill="#38bdf8" font-size="13" font-weight="bold">Inference Agent (π)</text>
    <text x="16" y="52" fill="#e2e8f0" font-size="10.5">Führt Trainingsaufgaben D_train mit aktuellen Skills aus.</text>
    <text x="16" y="68" fill="#94a3b8" font-size="9.5">Erzeugt vollständige Multi-Turn-Interaktionsspuren in raw/.</text>
    <rect x="16" y="76" width="328" height="18" rx="4" fill="#1e293b" />
    <text x="22" y="89" fill="#f87171" font-size="9" font-weight="bold">Strikte Isolation: Kein direkter Wiki-Zugriff bei Rollouts!</text>
  </g>

  <!-- AGENT 2: WIKI MAINTAINER -->
  <g filter="url(#box-shadow)" transform="translate(490, 245)">
    <rect x="0" y="0" width="360" height="100" rx="10" fill="#022119" stroke="#10b981" stroke-width="1.5" />
    <circle cx="24" cy="24" r="12" fill="#059669" />
    <text x="20" y="28" fill="#ffffff" font-size="11" font-weight="bold">2</text>
    <text x="44" y="28" fill="#34d399" font-size="13" font-weight="bold">Wiki Maintainer (M_WM)</text>
    <text x="16" y="52" fill="#e2e8f0" font-size="10.5">Analysiert gesampelte Erfolge &amp; Fehler aus den Traces.</text>
    <text x="16" y="68" fill="#94a3b8" font-size="9.5">Isoliert Fehlerursachen, dokumentiert Workarounds in patterns/</text>
    <text x="16" y="82" fill="#94a3b8" font-size="9.5">und führt das chronologische Evolutionslog logs.md nach.</text>
  </g>

  <!-- AGENT 3: SKILL PROPOSER -->
  <g filter="url(#box-shadow)" transform="translate(490, 370)">
    <rect x="0" y="0" width="360" height="105" rx="10" fill="#1c102b" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="24" cy="24" r="12" fill="#9333ea" />
    <text x="20" y="28" fill="#ffffff" font-size="11" font-weight="bold">3</text>
    <text x="44" y="28" fill="#c084fc" font-size="13" font-weight="bold">Wiki-Informed Skill Proposer (M_P)</text>
    <text x="16" y="52" fill="#e2e8f0" font-size="10.5">ReAct-basierter Synthese-Agent mit Werkzeugnutzung.</text>
    <text x="16" y="68" fill="#94a3b8" font-size="9.5">Liest Wiki-Index, Audit-Trail (skill-impact.md) &amp; Traces on-demand.</text>
    <text x="16" y="82" fill="#94a3b8" font-size="9.5">Generiert atomare Skill-Updates (neuer Skill oder Patch).</text>
  </g>

  <!-- COMPONENT 4: GATING & ROLLBACK -->
  <g filter="url(#box-shadow)" transform="translate(490, 500)">
    <rect x="0" y="0" width="360" height="105" rx="10" fill="#1c1306" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="24" cy="24" r="12" fill="#d97706" />
    <text x="20" y="28" fill="#ffffff" font-size="11" font-weight="bold">4</text>
    <text x="44" y="28" fill="#fbbf24" font-size="13" font-weight="bold">Validation Gating &amp; Rollback Harness</text>
    <text x="16" y="50" fill="#e2e8f0" font-size="10.5">Testet Kandidaten-Skills auf dem Validierungs-Split D_val.</text>
    <text x="16" y="66" fill="#34d399" font-size="9.5">• Score steigt: Skill wird als aktiver Standard S_k übernommen.</text>
    <text x="16" y="80" fill="#f87171" font-size="9.5">• Score sinkt: Skill wird sofort auf S_{k-1} zurückgerollt.</text>
    <text x="16" y="95" fill="#fbbf24" font-size="9.5" font-weight="bold">★ Diff &amp; Ergebnis werden immer in skill-impact.md protokolliert!</text>
  </g>

  <!-- ==================== DYNAMIC CONNECTORS & ARROWS ==================== -->

  <!-- Inference Agent to Raw Layer -->
  <path d="M 490 170 L 415 170" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Raw Layer to Wiki Maintainer -->
  <path d="M 410 200 C 445 200, 445 275, 485 275" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrow-blue)" />

  <!-- Wiki Maintainer to Wiki Layer -->
  <path d="M 490 320 L 415 320" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)" />

  <!-- Wiki Layer to Skill Proposer -->
  <path d="M 410 395 L 485 395" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-emerald)" />

  <!-- Skill Proposer to Gating -->
  <path d="M 670 475 L 670 495" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- Gating accepted back to Skills Layer -->
  <path d="M 490 550 L 415 550" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- Skills Layer injected into Inference Agent (Upwards loop) -->
  <path d="M 225 470 C 225 450, 440 450, 450 140 C 455 135, 470 135, 485 135" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-purple)" />

</svg>

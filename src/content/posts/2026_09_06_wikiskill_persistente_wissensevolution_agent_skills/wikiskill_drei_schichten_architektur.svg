<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <linearGradient id="grad-header-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="50%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-purple-border)"/>
    </linearGradient>

    <linearGradient id="grad-raw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-purple-bg)"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>

    <linearGradient id="grad-wiki" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-green-bg)"/>
      <stop offset="100%" stop-color="var(--svg-node-green-bg)"/>
    </linearGradient>

    <linearGradient id="grad-skills" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-purple-bg)"/>
      <stop offset="100%" stop-color="var(--svg-node-purple-bg)"/>
    </linearGradient>

    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-blue-border)"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-green-border)"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-purple-border)"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-amber-border)"/>
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect x="10" y="10" width="880" height="620" rx="16" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="2"/>

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08">
    <line x1="30" y1="210" x2="870" y2="210" stroke="var(--svg-node-blue-border)" stroke-dasharray="4 8" stroke-width="1"/>
    <line x1="30" y1="410" x2="870" y2="410" stroke="var(--svg-node-blue-border)" stroke-dasharray="4 8" stroke-width="1"/>
    <circle cx="100" cy="530" r="3" fill="var(--svg-node-blue-border)"/><circle cx="150" cy="530" r="3" fill="var(--svg-node-blue-border)"/>
    <circle cx="750" cy="90" r="3" fill="var(--svg-node-purple-border)"/><circle cx="800" cy="90" r="3" fill="var(--svg-node-purple-border)"/>
  </g>

  <!-- Badge & Title -->
  <rect x="40" y="28" width="350" height="26" rx="6" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
  <text x="50" y="45" fill="var(--svg-node-purple-subtext)" font-size="11" font-weight="bold" letter-spacing="1">WIKISKILL ARCHITEKTUR &amp; EVOLUTIONS-LOOP</text>

  <text x="40" y="78" fill="var(--svg-text-primary)" font-size="22" font-weight="800" letter-spacing="-0.5">Die Drei-Schichten-Architektur im iterativen 4-Agenten-Zyklus</text>
  <text x="40" y="98" fill="var(--svg-text-secondary)" font-size="12">Strikte Trennung von Roh-Trajektorien, persistenter Wissenskompilierung und ausführbaren Fertigkeiten</text>

  <!-- ==================== 3 SCHICHTEN CONTAINER (LEFT) ==================== -->
  
  <!-- LAYER 1: RAW LAYER -->
  <g filter="url(#box-shadow)" transform="translate(40, 120)">
    <rect x="0" y="0" width="370" height="135" rx="10" fill="url(#grad-raw)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="28" rx="10" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <text x="14" y="19" fill="var(--svg-node-blue-subtext)" font-size="11.5" font-weight="bold">1. RAW LAYER (raw/) – Unveränderliche Historie</text>
    
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="342" height="85" rx="6" fill="var(--svg-card)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
      <text x="10" y="18" fill="var(--svg-node-blue-subtext)" font-size="10" font-weight="bold">• Vollständige Ausführungsspuren (Traces τ):</text>
      <text x="18" y="34" fill="var(--svg-text-secondary)" font-size="9.5">Multi-Turn Observations, Reasoning Steps, Werkzeugaufrufe &amp; Outputs</text>
      <text x="10" y="52" fill="var(--svg-node-blue-subtext)" font-size="10" font-weight="bold">• Append-Only &amp; Immutable:</text>
      <text x="18" y="68" fill="var(--svg-text-secondary)" font-size="9.5">Keine nachträgliche Manipulation; dient als unverfälschte Evidenzbasis</text>
    </g>
  </g>

  <!-- LAYER 2: WIKI LAYER -->
  <g filter="url(#box-shadow)" transform="translate(40, 275)">
    <rect x="0" y="0" width="370" height="175" rx="10" fill="url(#grad-wiki)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="28" rx="10" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <text x="14" y="19" fill="var(--svg-node-green-subtext)" font-size="11.5" font-weight="bold">2. WIKI LAYER (wiki/) – Persistentes Langzeitwissen</text>
    
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="342" height="124" rx="6" fill="var(--svg-node-green-bg)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
      <text x="10" y="18" fill="var(--svg-node-green-subtext)" font-size="10" font-weight="bold">• patterns/*.md (Kompilierte Fehlermuster &amp; Strategien):</text>
      <text x="18" y="32" fill="var(--svg-text-secondary)" font-size="9.5">Strukturierte Root-Cause-Analysen, Problemursachen &amp; Workarounds</text>
      <text x="10" y="50" fill="var(--svg-node-green-subtext)" font-size="10" font-weight="bold">• logs.md &amp; index.md (Evolutions-Katalog):</text>
      <text x="18" y="64" fill="var(--svg-text-secondary)" font-size="9.5">Chronologisches Protokoll aller Erkenntnisse und Pattern-Registry</text>
      <text x="10" y="82" fill="var(--svg-node-green-subtext)" font-size="10" font-weight="bold">• skill-impact.md (Ground-Truth Audit-Trail):</text>
      <text x="18" y="96" fill="var(--svg-text-secondary)" font-size="9.5">Lückenlose Aufzeichnung aller Unified Diffs, Val-Scores &amp; Rejections</text>
      <text x="10" y="114" fill="var(--svg-node-green-border)" font-size="9.5" font-weight="bold">★ WIRD NIEMALS ZURÜCKGEROLLT (Persistenter Wissensspeicher)</text>
    </g>
  </g>

  <!-- LAYER 3: SKILLS LAYER -->
  <g filter="url(#box-shadow)" transform="translate(40, 470)">
    <rect x="0" y="0" width="370" height="135" rx="10" fill="url(#grad-skills)" stroke="var(--svg-node-purple-border)" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="28" rx="10" fill="var(--svg-node-purple-border)" stroke="var(--svg-node-purple-border)" stroke-width="1.5"/>
    <text x="14" y="19" fill="var(--svg-node-purple-subtext)" font-size="11.5" font-weight="bold">3. SKILLS LAYER (skills/) – Ausführbare Prozeduren</text>
    
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="342" height="85" rx="6" fill="var(--svg-node-purple-bg)" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1"/>
      <text x="10" y="18" fill="var(--svg-node-purple-subtext)" font-size="10" font-weight="bold">• SKILL.md (Deklaratives Fähigkeiten-Modul):</text>
      <text x="18" y="34" fill="var(--svg-text-secondary)" font-size="9.5">Name, Description, Input-Verträge, konkrete Handlungsregeln</text>
      <text x="10" y="52" fill="var(--svg-node-purple-subtext)" font-size="10" font-weight="bold">• PURPOSE.md (Rückverknüpfung ins Wiki):</text>
      <text x="18" y="68" fill="var(--svg-text-secondary)" font-size="9.5">Mappt die Fähigkeit direkt auf die motivierenden Wiki-Patterns</text>
    </g>
  </g>

  <!-- ==================== 4 AGENTEN EVOLUTIONS-LOOP (RIGHT) ==================== -->

  <!-- AGENT 1: INFERENCE AGENT -->
  <g filter="url(#box-shadow)" transform="translate(490, 120)">
    <rect x="0" y="0" width="360" height="100" rx="10" fill="var(--svg-pill-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="var(--svg-node-blue-border)"/>
    <text x="21" y="28" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">1</text>
    <text x="44" y="28" fill="var(--svg-node-blue-border)" font-size="13" font-weight="bold">Inference Agent (π)</text>
    <text x="16" y="52" fill="var(--svg-text-primary)" font-size="10.5">Führt Trainingsaufgaben D_train mit aktuellen Skills aus.</text>
    <text x="16" y="68" fill="var(--svg-text-secondary)" font-size="9.5">Erzeugt vollständige Multi-Turn-Interaktionsspuren in raw/.</text>
    <rect x="16" y="76" width="328" height="18" rx="4" fill="var(--svg-card-alt)"/>
    <text x="22" y="89" fill="var(--svg-node-red-border)" font-size="9" font-weight="bold">Strikte Isolation: Kein direkter Wiki-Zugriff bei Rollouts!</text>
  </g>

  <!-- AGENT 2: WIKI MAINTAINER -->
  <g filter="url(#box-shadow)" transform="translate(490, 245)">
    <rect x="0" y="0" width="360" height="100" rx="10" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="var(--svg-node-green-border)"/>
    <text x="20" y="28" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">2</text>
    <text x="44" y="28" fill="var(--svg-node-green-border)" font-size="13" font-weight="bold">Wiki Maintainer (M_WM)</text>
    <text x="16" y="52" fill="var(--svg-text-primary)" font-size="10.5">Analysiert gesampelte Erfolge &amp; Fehler aus den Traces.</text>
    <text x="16" y="68" fill="var(--svg-text-secondary)" font-size="9.5">Isoliert Fehlerursachen, dokumentiert Workarounds in patterns/</text>
    <text x="16" y="82" fill="var(--svg-text-secondary)" font-size="9.5">und führt das chronologische Evolutionslog logs.md nach.</text>
  </g>

  <!-- AGENT 3: SKILL PROPOSER -->
  <g filter="url(#box-shadow)" transform="translate(490, 370)">
    <rect x="0" y="0" width="360" height="105" rx="10" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="var(--svg-node-purple-border)"/>
    <text x="20" y="28" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">3</text>
    <text x="44" y="28" fill="var(--svg-node-purple-border)" font-size="13" font-weight="bold">Wiki-Informed Skill Proposer (M_P)</text>
    <text x="16" y="52" fill="var(--svg-text-primary)" font-size="10.5">ReAct-basierter Synthese-Agent mit Werkzeugnutzung.</text>
    <text x="16" y="68" fill="var(--svg-text-secondary)" font-size="9.5">Liest Wiki-Index, Audit-Trail (skill-impact.md) &amp; Traces on-demand.</text>
    <text x="16" y="82" fill="var(--svg-text-secondary)" font-size="9.5">Generiert atomare Skill-Updates (neuer Skill oder Patch).</text>
  </g>

  <!-- COMPONENT 4: GATING & ROLLBACK -->
  <g filter="url(#box-shadow)" transform="translate(490, 500)">
    <rect x="0" y="0" width="360" height="105" rx="10" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="var(--svg-node-amber-border)"/>
    <text x="20" y="28" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">4</text>
    <text x="44" y="28" fill="var(--svg-node-amber-border)" font-size="13" font-weight="bold">Validation Gating &amp; Rollback Harness</text>
    <text x="16" y="50" fill="var(--svg-text-primary)" font-size="10.5">Testet Kandidaten-Skills auf dem Validierungs-Split D_val.</text>
    <text x="16" y="66" fill="var(--svg-node-green-border)" font-size="9.5">• Score steigt: Skill wird als aktiver Standard S_k übernommen.</text>
    <text x="16" y="80" fill="var(--svg-node-red-border)" font-size="9.5">• Score sinkt: Skill wird sofort auf S_{k-1} zurückgerollt.</text>
    <text x="16" y="95" fill="var(--svg-node-amber-border)" font-size="9.5" font-weight="bold">★ Diff &amp; Ergebnis werden immer in skill-impact.md protokolliert!</text>
  </g>

  <!-- ==================== DYNAMIC CONNECTORS & ARROWS ==================== -->

  <!-- Inference Agent to Raw Layer -->
  <path d="M 490 170 L 415 170" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Raw Layer to Wiki Maintainer -->
  <path d="M 410 200 C 445 200, 445 275, 485 275" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrow-blue)"/>

  <!-- Wiki Maintainer to Wiki Layer -->
  <path d="M 490 320 L 415 320" fill="none" stroke="var(--svg-node-green-border)" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Wiki Layer to Skill Proposer -->
  <path d="M 410 395 L 485 395" fill="none" stroke="var(--svg-node-green-border)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-emerald)"/>

  <!-- Skill Proposer to Gating -->
  <path d="M 670 475 L 670 495" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Gating accepted back to Skills Layer -->
  <path d="M 490 550 L 415 550" fill="none" stroke="var(--svg-node-amber-border)" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Skills Layer injected into Inference Agent (Upwards loop) -->
  <path d="M 225 470 C 225 450, 440 450, 450 140 C 455 135, 470 135, 485 135" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-purple)"/>

</svg>

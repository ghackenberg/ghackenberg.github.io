<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 510" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', sans-serif;">
  <defs>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <linearGradient id="grad-problem-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a080c" />
      <stop offset="100%" stop-color="#180407" />
    </linearGradient>

    <linearGradient id="grad-solution-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c24" />
      <stop offset="100%" stop-color="#08142c" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="10" y="10" width="820" height="490" rx="16" fill="#0b1329" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Subtle Halftone Pattern -->
  <g opacity="0.10">
    <circle cx="80" cy="70" r="2" fill="#3b82f6" /><circle cx="130" cy="70" r="2" fill="#3b82f6" /><circle cx="180" cy="70" r="2" fill="#3b82f6" />
    <circle cx="80" cy="110" r="2" fill="#3b82f6" /><circle cx="130" cy="110" r="2" fill="#3b82f6" /><circle cx="180" cy="110" r="2" fill="#3b82f6" />
    <circle cx="680" cy="400" r="2" fill="#8b5cf6" /><circle cx="730" cy="400" r="2" fill="#8b5cf6" /><circle cx="780" cy="400" r="2" fill="#8b5cf6" />
    <circle cx="680" cy="440" r="2" fill="#8b5cf6" /><circle cx="730" cy="440" r="2" fill="#8b5cf6" /><circle cx="780" cy="440" r="2" fill="#8b5cf6" />
    <line x1="40" y1="250" x2="800" y2="250" stroke="#3b82f6" stroke-dasharray="4 8" stroke-width="1" />
  </g>

  <!-- Header Category Tag -->
  <rect x="40" y="28" width="280" height="26" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="50" y="45" fill="#c084fc" font-size="11" font-weight="bold" letter-spacing="1">AGENTIC AI &amp; SKILL EVOLUTION</text>

  <!-- Main Headline -->
  <text x="40" y="78" fill="#f8fafc" font-size="21" font-weight="800" letter-spacing="-0.5">Das Fertigkeiten-Dilemma autonomer Agenten</text>
  <text x="40" y="98" fill="#94a3b8" font-size="12">Warum bisherige Skill-Optimierer an Optimization Amnesia scheitern und wie persistentes Wissen den Durchbruch bringt</text>

  <!-- ==================== LEFT CARD: DAS PROBLEM ==================== -->
  <g filter="url(#shadow)" transform="translate(40, 118)">
    <rect x="0" y="0" width="365" height="340" rx="12" fill="url(#grad-problem-card)" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="365" height="36" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#ef4444" />
    <text x="36" y="23" fill="#fecaca" font-size="12.5" font-weight="bold">Bisherige Ansätze: Monolithische Amnesie</text>

    <!-- Point 1 -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="333" height="52" rx="6" fill="#1e1315" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1" />
      <text x="10" y="17" fill="#fca5a5" font-size="11" font-weight="bold">1. Optimization Amnesia bei Rollbacks</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9.5">Führt eine Skill-Modifikation zur Leistungsdegradation,</text>
      <text x="10" y="44" fill="#94a3b8" font-size="9.5">wird sie verworfen – die Ursache wird komplett vergessen.</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(16, 108)">
      <rect x="0" y="0" width="333" height="52" rx="6" fill="#1e1315" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1" />
      <text x="10" y="17" fill="#fca5a5" font-size="11" font-weight="bold">2. Schichten-Konflation (Traces = Skills)</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9.5">Rohe Fehlerspuren werden direkt in Prozeduren gepatcht.</text>
      <text x="10" y="44" fill="#94a3b8" font-size="9.5">Es fehlt eine kuratierte Abstraktionsebene für Wissen.</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(16, 168)">
      <rect x="0" y="0" width="333" height="52" rx="6" fill="#1e1315" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1" />
      <text x="10" y="17" fill="#fca5a5" font-size="11" font-weight="bold">3. Wiederholte Fehlschläge in Sackgassen</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9.5">Ohne strukturierten Audit-Trail schlagen künftige Runden</text>
      <text x="10" y="44" fill="#94a3b8" font-size="9.5">wiederholt dieselben bereits gescheiterten Patches vor.</text>
    </g>

    <!-- Bottom Status Problem -->
    <g transform="translate(16, 230)">
      <rect x="0" y="0" width="333" height="92" rx="8" fill="#140608" stroke="#ef4444" stroke-width="1" />
      <text x="12" y="20" fill="#ef4444" font-size="10.5" font-weight="bold">Architektonische Konsequenz:</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="9.5">• Fragile Skills durch unreflektiertes Trail-and-Error</text>
      <text x="12" y="54" fill="#cbd5e1" font-size="9.5">• Hohe Volatilität &amp; Leistungseinbrüche über Iterationen</text>
      <text x="12" y="70" fill="#cbd5e1" font-size="9.5">• Keine Portabilität zwischen verschiedenen Modellgrößen</text>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: DIE WIKISKILL LÖSUNG ==================== -->
  <g filter="url(#shadow)" transform="translate(435, 118)">
    <rect x="0" y="0" width="365" height="340" rx="12" fill="url(#grad-solution-card)" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="0" y="0" width="365" height="36" rx="12" fill="#082f49" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#06b6d4" />
    <text x="36" y="23" fill="#e0f2fe" font-size="12.5" font-weight="bold">WikiSkill: Persistente Wissensevolution</text>

    <!-- Point 1 -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="333" height="52" rx="6" fill="#07202c" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
      <text x="10" y="17" fill="#67e8f9" font-size="11" font-weight="bold">1. Strikte Drei-Schichten-Architektur</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9.5">Entkopplung von Raw Traces, persistentem Wiki</text>
      <text x="10" y="44" fill="#94a3b8" font-size="9.5">und ausführbaren Prozeduren (Skills Layer).</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(16, 108)">
      <rect x="0" y="0" width="333" height="52" rx="6" fill="#07202c" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
      <text x="10" y="17" fill="#67e8f9" font-size="11" font-weight="bold">2. Persistenter Audit-Trail &amp; Pattern Catalog</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9.5">Das Wiki wird NIEMALS zurückgerollt. Jedes Negativwissen</text>
      <text x="10" y="44" fill="#94a3b8" font-size="9.5">wird dauerhaft in patterns/ und skill-impact.md konserviert.</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(16, 168)">
      <rect x="0" y="0" width="333" height="52" rx="6" fill="#07202c" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
      <text x="10" y="17" fill="#67e8f9" font-size="11" font-weight="bold">3. Fundierte Skill-Proposals im ReAct-Modus</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9.5">Der Skill Proposer stützt sich auf validierte Muster,</text>
      <text x="10" y="44" fill="#94a3b8" font-size="9.5">erkennt redundante Fehler und verfeinert atomare Regeln.</text>
    </g>

    <!-- Bottom Status Solution -->
    <g transform="translate(16, 230)">
      <rect x="0" y="0" width="333" height="92" rx="8" fill="#041620" stroke="#10b981" stroke-width="1" />
      <text x="12" y="20" fill="#34d399" font-size="10.5" font-weight="bold">Empirisch nachgewiesene Vorteile:</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="9.5">• Bis zu +12 % über den stärksten Baselines (SkillOpt, EvoSkill)</text>
      <text x="12" y="54" fill="#cbd5e1" font-size="9.5">• Kleines 9B-Modell mit Skills schlägt 27B-Modell ohne Skills</text>
      <text x="12" y="70" fill="#cbd5e1" font-size="9.5">• Hohe Transferierbarkeit über Modellgrenzen hinweg</text>
    </g>
  </g>

  <!-- Flow Connector Arrow in Middle -->
  <g transform="translate(390, 260)">
    <circle cx="27" cy="0" r="18" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" />
    <path d="M 21 -6 L 33 0 L 21 6" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Footer Tag -->
  <text x="40" y="488" fill="#64748b" font-size="10.5">Konzeption nach Google Research &amp; DeepMind (arXiv:2608.27454) • Stand: September 2026</text>
</svg>

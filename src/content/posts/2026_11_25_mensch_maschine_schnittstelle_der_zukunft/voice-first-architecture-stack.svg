<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="auto" role="img" aria-label="Fünf-Säulen-Referenzarchitektur sprachgeführter Mensch-Maschine-Systeme: Multimodaler Eingang, Mixed-Initiative Dialog-Regie, Kontext-Membran, Asynchroner Maschinenraum, Ephemere Projektionsfläche und souveräne Edge-Grenze">
  <title>Referenzarchitektur sprachgeführter Mensch-Maschine-Systeme</title>
  <desc>Fünf-Säulen-Referenzarchitektur sprachgeführter Mensch-Maschine-Systeme: Multimodaler Eingang, Mixed-Initiative Dialog-Regie, Kontext-Membran, Asynchroner Maschinenraum, Ephemere Projektionsfläche und souveräne Edge-Grenze</desc>
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <radialGradient id="edge-aura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="var(--svg-node-blue-border)" stop-opacity="0.14" />
      <stop offset="100%" stop-color="var(--svg-bg)" stop-opacity="0" />
    </radialGradient>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-purple-border)" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
    <marker id="arr-duplex" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="var(--svg-node-blue-text)" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="480" height="480" rx="16" fill="var(--svg-bg)" />

  <!-- Header -->
  <text x="240" y="34" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="0.05em" fill="var(--svg-text-primary)">ARCHITEKTUR SPRACHGEFÜHRTER SYSTEME</text>
  <text x="240" y="54" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="var(--svg-text-secondary)">Fünf Säulen für reaktionsschnelle und ruhige Interaktion</text>

  <!-- Outer Sovereign Privacy Perimeter -->
  <rect x="28" y="68" width="424" height="378" rx="22" fill="url(#edge-aura)" stroke="var(--svg-node-green-border)" stroke-width="1.6" stroke-dasharray="7,5" opacity="0.8" />

  <!-- ==================== LAYER 1: FULL-DUPLEX INPUT ==================== -->
  <g id="input-voice">
    <rect x="48" y="84" width="180" height="48" rx="24" fill="var(--svg-accent-2-bg)" stroke="var(--svg-accent-2-border)" stroke-width="1.8" />
    <circle cx="72" cy="108" r="14" fill="var(--svg-card)" stroke="var(--svg-accent-2-border)" stroke-width="1.4" />
    <line x1="67" y1="105" x2="67" y2="111" stroke="var(--svg-accent-2-text)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="72" y1="101" x2="72" y2="115" stroke="var(--svg-accent-2-text)" stroke-width="2" stroke-linecap="round" />
    <line x1="77" y1="104" x2="77" y2="112" stroke="var(--svg-accent-2-text)" stroke-width="1.8" stroke-linecap="round" />
    <text x="150" y="102" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="var(--svg-accent-2-text)">Vollduplex-Ton</text>
    <text x="150" y="119" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="var(--svg-accent-2-subtext)">Barge-in ≤ 300 ms</text>
  </g>

  <g id="input-deixis">
    <rect x="252" y="84" width="180" height="48" rx="24" fill="var(--svg-accent-4-bg)" stroke="var(--svg-accent-4-border)" stroke-width="1.8" />
    <circle cx="276" cy="108" r="14" fill="var(--svg-card)" stroke="var(--svg-accent-4-border)" stroke-width="1.4" />
    <polygon points="271,101 271,114 275,110 282,113" fill="var(--svg-accent-4-text)" />
    <text x="354" y="102" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="var(--svg-accent-4-text)">Blick &amp; Zeiger</text>
    <text x="354" y="119" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="var(--svg-accent-4-subtext)">Räumliche Deixis</text>
  </g>

  <!-- Converging Arrows to Layer 2 -->
  <path d="M 138 132 Q 168 148 198 159" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <path d="M 342 132 Q 312 148 282 159" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.8" marker-end="url(#arr-blue)" />

  <!-- ==================== LAYER 2: MIXED-INITIATIVE DIALOGUE CONTROL ==================== -->
  <g id="dialogue-control">
    <rect x="48" y="162" width="384" height="62" rx="14" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <!-- Full-Duplex Bidirectional Loop Icon with Arrowheads -->
    <circle cx="84" cy="193" r="18" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1.8" />
    <path d="M 75 189 A 10 10 0 0 1 92 189" fill="none" stroke="var(--svg-node-blue-text)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-duplex)" />
    <path d="M 93 197 A 10 10 0 0 1 76 197" fill="none" stroke="var(--svg-node-blue-text)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-duplex)" />
    <text x="262" y="186" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="var(--svg-node-blue-text)">MIXED-INITIATIVE DIALOG-REGIE</text>
    <text x="262" y="206" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="var(--svg-node-blue-subtext)">Prosodie, Klärungsdialog &amp; Zero-Freeze</text>
  </g>

  <!-- ==================== MEMBRANE & DISPATCH ==================== -->
  <path d="M 42 250 Q 240 238 438 250" fill="none" stroke="var(--svg-node-amber-border)" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="166" y="234" width="148" height="24" rx="12" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <text x="240" y="246" text-anchor="middle" dominant-baseline="central" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-amber-text)">KONTEXT-MEMBRAN</text>

  <!-- Routing Arrows cleanly outside Membrane Pill -->
  <path d="M 152 224 L 136 278" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="2" marker-end="url(#arr-purple)" />
  <path d="M 328 224 L 344 278" fill="none" stroke="var(--svg-node-green-border)" stroke-width="2" marker-start="url(#arr-green)" marker-end="url(#arr-green)" />

  <!-- ==================== LAYER 3: SPLIT WINGS ==================== -->
  <g id="engine-wing">
    <rect x="48" y="284" width="178" height="132" rx="14" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.8" />
    <polygon points="94,306 106,313 106,327 94,334 82,327 82,313" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.6" />
    <polygon points="137,306 149,313 149,327 137,334 125,327 125,313" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.6" />
    <polygon points="180,306 192,313 192,327 180,334 168,327 168,313" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.6" />
    <circle cx="94" cy="320" r="3" fill="var(--svg-node-purple-text)" />
    <circle cx="137" cy="320" r="3" fill="var(--svg-node-purple-text)" />
    <circle cx="180" cy="320" r="3" fill="var(--svg-node-purple-text)" />
    <text x="137" y="357" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="var(--svg-node-purple-text)">Maschinenraum</text>
    <text x="137" y="375" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="var(--svg-node-purple-subtext)">Werkzeuge &amp; Logik</text>
    <line x1="76" y1="386" x2="198" y2="386" stroke="var(--svg-node-purple-border)" stroke-width="1" opacity="0.35" />
    <text x="137" y="403" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="var(--svg-node-purple-subtext)">Asynchron isoliert</text>
  </g>

  <g id="projection-wing">
    <rect x="254" y="284" width="178" height="132" rx="14" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.8" />
    <rect x="307" y="303" width="72" height="36" rx="6" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1.6" />
    <polygon points="325,311 335,317 335,328 325,334 315,328 315,317" fill="none" stroke="var(--svg-node-green-text)" stroke-width="1.5" />
    <path d="M 346 320 L 351 325 L 362 314" fill="none" stroke="var(--svg-node-green-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="343" y="357" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="var(--svg-node-green-text)">Projektionsfläche</text>
    <text x="343" y="375" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="var(--svg-node-green-subtext)">3D, Tabellen &amp; Diffs</text>
    <line x1="282" y1="386" x2="404" y2="386" stroke="var(--svg-node-green-border)" stroke-width="1" opacity="0.35" />
    <text x="343" y="403" text-anchor="middle" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="var(--svg-node-green-subtext)">Prüfbar auf Abruf</text>
  </g>

  <!-- Cross-Wing Result Flow -->
  <path d="M 228 350 H 250" fill="none" stroke="var(--svg-node-green-border)" stroke-width="2" marker-end="url(#arr-green)" />

  <!-- Bottom Sovereign Edge Privacy Pill -->
  <rect x="114" y="432" width="252" height="28" rx="14" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.8" />
  <text x="240" y="446" text-anchor="middle" dominant-baseline="central" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-green-text)">Souveräne lokale Edge-Grenze</text>
</svg>

  <text x="520" y="558" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-green-text)">dist/ + llms.txt</text>
  <text x="520" y="578" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="10" fill="var(--svg-node-green-subtext)">Verified Build Output</text>

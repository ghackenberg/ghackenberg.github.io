  <path d="M 448 474 L 402 442" stroke="var(--svg-node-blue-border)" stroke-width="1.8" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)" />

  <path d="M 320 458 V 526" stroke="var(--svg-node-green-border)" stroke-width="2" marker-end="url(#arr-green)" />


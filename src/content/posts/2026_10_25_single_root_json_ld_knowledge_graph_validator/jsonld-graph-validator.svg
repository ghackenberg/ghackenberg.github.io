<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="auto" role="img" aria-label="Comparison between fragmented JSON-LD snippets with broken blank nodes in the top tier and a single-root @graph star topology passing through 6 validation gates into dist/ and llms.txt in the bottom tier">

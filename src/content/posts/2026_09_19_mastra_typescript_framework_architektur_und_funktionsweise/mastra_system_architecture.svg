<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Frame -->
  <rect x="10" y="10" width="880" height="500" rx="16" fill="#070b16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="52" fill="url(#grad-header)" font-size="20" font-weight="800">Mastra: Systemarchitektur im Überblick</text>
  <text x="40" y="74" fill="#94a3b8" font-size="12">Die vier Kernschichten des TypeScript-AI-Frameworks</text>

  <!-- LAYER 1: CLIENTS & SURFACES -->
  <g id="layer-surfaces" transform="translate(40, 95)">
    <rect x="0" y="0" width="820" height="60" rx="10" fill="#0b1329" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="20" y="24" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="0.5">SURFACES &amp; APIS</text>

    <rect x="160" y="12" width="190" height="36" rx="6" fill="#131e3a" stroke="#38bdf8" stroke-width="0.8" />
    <text x="255" y="34" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Mastra Studio (Port 4111)</text>

    <rect x="370" y="12" width="190" height="36" rx="6" fill="#131e3a" stroke="#38bdf8" stroke-width="0.8" />
    <text x="465" y="34" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Next.js / REST API</text>

    <rect x="580" y="12" width="220" height="36" rx="6" fill="#131e3a" stroke="#10b981" stroke-width="0.8" />
    <text x="690" y="34" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">MCP Hosts (Cursor / Claude)</text>
  </g>

  <!-- Arrow down -->
  <path d="M 450 155 L 450 180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)" />

  <!-- LAYER 2: MASTRA CORE RUNTIME -->
  <g id="layer-core" transform="translate(40, 185)">
    <rect x="0" y="0" width="820" height="150" rx="12" fill="#0c1222" stroke="#818cf8" stroke-width="1.5" />
    <text x="20" y="26" fill="#a5b4fc" font-size="11" font-weight="700" letter-spacing="0.5">MASTRA CORE RUNTIME</text>

    <!-- 4 Clean Pillars -->
    <!-- Agents -->
    <rect x="20" y="42" width="180" height="92" rx="8" fill="#1e1035" stroke="#a855f7" stroke-width="1" />
    <text x="110" y="74" fill="#e9d5ff" font-size="15" font-weight="700" text-anchor="middle">Agents</text>
    <text x="110" y="96" fill="#c084fc" font-size="11" text-anchor="middle">ReAct Reasoning Loop</text>
    <text x="110" y="114" fill="#94a3b8" font-size="10" text-anchor="middle">Stochastisch &amp; Autonom</text>

    <!-- Workflows -->
    <rect x="220" y="42" width="180" height="92" rx="8" fill="#1e1808" stroke="#f59e0b" stroke-width="1" />
    <text x="310" y="74" fill="#fef3c7" font-size="15" font-weight="700" text-anchor="middle">Workflows</text>
    <text x="310" y="96" fill="#fbbf24" font-size="11" text-anchor="middle">State Machine &amp; DAG</text>
    <text x="310" y="114" fill="#94a3b8" font-size="10" text-anchor="middle">Deterministisch &amp; Typisiert</text>

    <!-- Tools -->
    <rect x="420" y="42" width="180" height="92" rx="8" fill="#0d1b2a" stroke="#38bdf8" stroke-width="1" />
    <text x="510" y="74" fill="#e0f2fe" font-size="15" font-weight="700" text-anchor="middle">Tools</text>
    <text x="510" y="96" fill="#38bdf8" font-size="11" text-anchor="middle">createTool() mit Zod</text>
    <text x="510" y="114" fill="#94a3b8" font-size="10" text-anchor="middle">Compile- &amp; Runtime-sicher</text>

    <!-- MCP -->
    <rect x="620" y="42" width="180" height="92" rx="8" fill="#0a1f1b" stroke="#10b981" stroke-width="1" />
    <text x="710" y="74" fill="#d1fae5" font-size="15" font-weight="700" text-anchor="middle">MCP Gateway</text>
    <text x="710" y="96" fill="#34d399" font-size="11" text-anchor="middle">Client &amp; Server</text>
    <text x="710" y="114" fill="#94a3b8" font-size="10" text-anchor="middle">stdio &amp; SSE Transports</text>
  </g>

  <!-- Arrow down -->
  <path d="M 450 335 L 450 360" stroke="#818cf8" stroke-width="2" marker-end="url(#arr-purple)" />

  <!-- LAYER 3: INFRASTRUCTURE & INFERENCE -->
  <g id="layer-infra" transform="translate(40, 365)">
    <!-- Storage & Memory -->
    <rect x="0" y="0" width="395" height="115" rx="10" fill="#0b1329" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
    <text x="20" y="28" fill="#fbbf24" font-size="11" font-weight="700">PERSISTENZ, MEMORY &amp; RAG</text>
    
    <rect x="20" y="44" width="170" height="52" rx="6" fill="#131e3a" stroke="rgba(245, 158, 11, 0.3)" />
    <text x="105" y="68" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Storage &amp; Memory</text>
    <text x="105" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">PostgreSQL / LibSQL</text>

    <rect x="205" y="44" width="170" height="52" rx="6" fill="#131e3a" stroke="rgba(245, 158, 11, 0.3)" />
    <text x="290" y="68" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Vector Stores</text>
    <text x="290" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">PgVector / Pinecone</text>

    <!-- Models & Inferenz -->
    <rect x="425" y="0" width="395" height="115" rx="10" fill="#0b1329" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
    <text x="445" y="28" fill="#c084fc" font-size="11" font-weight="700">INFERENZ &amp; EVALUATIONEN</text>

    <rect x="445" y="44" width="170" height="52" rx="6" fill="#131e3a" stroke="rgba(168, 85, 247, 0.3)" />
    <text x="530" y="68" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Model Router</text>
    <text x="530" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">OpenAI, Claude, LiteLLM</text>

    <rect x="630" y="44" width="170" height="52" rx="6" fill="#131e3a" stroke="rgba(168, 85, 247, 0.3)" />
    <text x="715" y="68" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Evals &amp; Tracing</text>
    <text x="715" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">@mastra/evals + OTel</text>
  </g>

</svg>

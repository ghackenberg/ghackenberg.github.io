<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Frame -->
  <rect x="10" y="10" width="880" height="500" rx="16" fill="#070b16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="52" fill="url(#grad-header)" font-size="20" font-weight="800">Mastra &amp; Model Context Protocol (MCP)</text>
  <text x="40" y="74" fill="#94a3b8" font-size="12">Die Dualität: Werkzeuge konsumieren (Client) vs. eigene Logik exponieren (Server)</text>

  <!-- TOP BOX: CLIENT -->
  <g id="box-client" transform="translate(40, 95)">
    <rect x="0" y="0" width="820" height="180" rx="12" fill="#0c172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="25" y="32" fill="#38bdf8" font-size="14" font-weight="700">1. MASTRA ALS MCP CLIENT</text>
    <text x="795" y="32" text-anchor="end" fill="#94a3b8" font-size="11">Tools aus dem Ökosystem konsumieren</text>

    <!-- 3 Steps horizontally -->
    <!-- Node 1: External Servers -->
    <rect x="25" y="52" width="220" height="95" rx="8" fill="#13233f" stroke="#38bdf8" stroke-width="0.8" />
    <text x="135" y="85" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Externe MCP-Server</text>
    <text x="135" y="108" fill="#94a3b8" font-size="11" text-anchor="middle">GitHub, PostgreSQL, Filesystem</text>
    <text x="135" y="125" fill="#64748b" font-size="10" text-anchor="middle">stdio / SSE Transport</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 245 100 L 295 100" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="270" y="90" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">MCP</text>

    <!-- Node 2: Mastra MCPClient -->
    <rect x="300" y="52" width="220" height="95" rx="8" fill="#182e54" stroke="#38bdf8" stroke-width="1.2" />
    <text x="410" y="85" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">Mastra MCPClient</text>
    <text x="410" y="108" fill="#f8fafc" font-size="11" text-anchor="middle">getTools() Discovery</text>
    <text x="410" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">Typsichere Tool-Adapter</text>

    <!-- Arrow 2 to 3 -->
    <path d="M 520 100 L 570 100" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)" />

    <!-- Node 3: Mastra Agent -->
    <rect x="575" y="52" width="220" height="95" rx="8" fill="#1e1035" stroke="#a855f7" stroke-width="1" />
    <text x="685" y="85" fill="#e9d5ff" font-size="14" font-weight="700" text-anchor="middle">Mastra Agent</text>
    <text x="685" y="108" fill="#c084fc" font-size="11" text-anchor="middle">tools: { ...mcpTools }</text>
    <text x="685" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">ReAct-Nutzung ohne Wrapper</text>
  </g>

  <!-- BOTTOM BOX: SERVER -->
  <g id="box-server" transform="translate(40, 295)">
    <rect x="0" y="0" width="820" height="180" rx="12" fill="#091f1a" stroke="#10b981" stroke-width="1.2" />
    <text x="25" y="32" fill="#34d399" font-size="14" font-weight="700">2. MASTRA ALS MCP SERVER</text>
    <text x="795" y="32" text-anchor="end" fill="#94a3b8" font-size="11">Eigene Tools &amp; Workflows bereitstellen</text>

    <!-- 3 Steps horizontally -->
    <!-- Node 1: Mastra Tools & Workflows -->
    <rect x="25" y="52" width="220" height="95" rx="8" fill="#0d2e26" stroke="#10b981" stroke-width="0.8" />
    <text x="135" y="85" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Interne Mastra Logik</text>
    <text x="135" y="108" fill="#94a3b8" font-size="11" text-anchor="middle">createTool() &amp; Workflows</text>
    <text x="135" y="125" fill="#64748b" font-size="10" text-anchor="middle">ERP, CRM, SQL-Abfragen</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 245 100 L 295 100" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)" />

    <!-- Node 2: Mastra MCPServer -->
    <rect x="300" y="52" width="220" height="95" rx="8" fill="#133d33" stroke="#34d399" stroke-width="1.2" />
    <text x="410" y="85" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">Mastra MCPServer</text>
    <text x="410" y="108" fill="#f8fafc" font-size="11" text-anchor="middle">new MCPServer({ tools })</text>
    <text x="410" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">startStdio() / startSSE()</text>

    <!-- Arrow 2 to 3 -->
    <path d="M 520 100 L 570 100" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)" />
    <text x="545" y="90" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">MCP</text>

    <!-- Node 3: External MCP Hosts -->
    <rect x="575" y="52" width="220" height="95" rx="8" fill="#0d1b2a" stroke="#38bdf8" stroke-width="1" />
    <text x="685" y="85" fill="#e0f2fe" font-size="14" font-weight="700" text-anchor="middle">MCP Hosts / IDEs</text>
    <text x="685" y="108" fill="#38bdf8" font-size="11" text-anchor="middle">Cursor, Windsurf, Claude</text>
    <text x="685" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">Direkte Nutzung in Entwickler-IDEs</text>
  </g>

</svg>

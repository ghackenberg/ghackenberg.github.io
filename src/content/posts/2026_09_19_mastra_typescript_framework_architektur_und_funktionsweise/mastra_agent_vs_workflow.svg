<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-purple-border)"/>
    </linearGradient>

    <marker id="arr-purple" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 z" fill="var(--svg-node-purple-border)"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 z" fill="var(--svg-node-amber-border)"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 z" fill="var(--svg-node-blue-border)"/>
    </marker>
  </defs>

  <!-- Frame -->
  <rect x="10" y="10" width="880" height="500" rx="16" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="52" fill="url(#grad-header)" font-size="20" font-weight="800">Agent vs. Workflow in Mastra</text>
  <text x="40" y="74" fill="var(--svg-text-secondary)" font-size="12">Stochastische ReAct-Schleife vs. deterministischer Zustandsgraph</text>

  <!-- LEFT COLUMN: AGENT -->
  <g id="col-agent" transform="translate(40, 95)">
    <rect x="0" y="0" width="395" height="310" rx="12" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.2"/>
    <text x="25" y="32" fill="var(--svg-node-purple-subtext)" font-size="16" font-weight="700">Agent (ReAct-Schleife)</text>
    <text x="370" y="32" text-anchor="end" fill="var(--svg-node-purple-border)" font-size="11" font-weight="600">Stochastisch</text>

    <!-- Node 1: User Prompt -->
    <rect x="25" y="55" width="345" height="38" rx="6" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="0.8"/>
    <text x="197" y="79" fill="var(--svg-text-primary)" font-size="12" font-weight="600" text-anchor="middle">1. User Prompt &amp; Memory</text>

    <path d="M 197 93 L 197 110" stroke="var(--svg-node-purple-border)" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Node 2: LLM Reasoning -->
    <rect x="25" y="112" width="345" height="42" rx="6" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1"/>
    <text x="197" y="132" fill="var(--svg-node-purple-subtext)" font-size="12" font-weight="700" text-anchor="middle">2. LLM Reasoning</text>
    <text x="197" y="146" fill="var(--svg-node-purple-subtext)" font-size="10" text-anchor="middle">Entscheidet nächsten Schritt autonom</text>

    <path d="M 197 154 L 197 172" stroke="var(--svg-node-purple-border)" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Node 3: Tool Execution -->
    <rect x="25" y="174" width="345" height="42" rx="6" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-blue-border)" stroke-width="0.8"/>
    <text x="197" y="194" fill="var(--svg-node-blue-border)" font-size="12" font-weight="700" text-anchor="middle">3. Tool Execution (Zod)</text>
    <text x="197" y="208" fill="var(--svg-text-secondary)" font-size="10" text-anchor="middle">Führt Tool aus &amp; füttert Beobachtung zurück</text>

    <!-- Loop Arrow -->
    <path d="M 370 195 C 390 195, 390 133, 372 133" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-blue)"/>

    <path d="M 197 216 L 197 235" stroke="var(--svg-node-purple-border)" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Node 4: Final Output -->
    <rect x="25" y="238" width="345" height="38" rx="6" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-green-border)" stroke-width="0.8"/>
    <text x="197" y="262" fill="var(--svg-node-green-border)" font-size="12" font-weight="600" text-anchor="middle">4. Finale Antwort (Stream)</text>
  </g>

  <!-- RIGHT COLUMN: WORKFLOW -->
  <g id="col-workflow" transform="translate(465, 95)">
    <rect x="0" y="0" width="395" height="310" rx="12" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.2"/>
    <text x="25" y="32" fill="var(--svg-node-amber-subtext)" font-size="16" font-weight="700">Workflow (State Graph)</text>
    <text x="370" y="32" text-anchor="end" fill="var(--svg-node-amber-border)" font-size="11" font-weight="600">Deterministisch</text>

    <!-- Step 1: Input -->
    <rect x="25" y="55" width="345" height="38" rx="6" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="0.8"/>
    <text x="197" y="79" fill="var(--svg-text-primary)" font-size="12" font-weight="600" text-anchor="middle">Step 1: Input Validation (Zod)</text>

    <path d="M 197 93 L 197 110" stroke="var(--svg-node-amber-border)" stroke-width="1.5" marker-end="url(#arr-amber)"/>

    <!-- Step 2: Parallel Steps -->
    <g transform="translate(25, 112)">
      <rect x="0" y="0" width="165" height="42" rx="6" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-blue-border)" stroke-width="0.8"/>
      <text x="82" y="21" fill="var(--svg-node-blue-border)" font-size="11" font-weight="600" text-anchor="middle">Step 2a: DB Fetch</text>
      <text x="82" y="34" fill="var(--svg-text-secondary)" font-size="9" text-anchor="middle">Parallel</text>

      <rect x="180" y="0" width="165" height="42" rx="6" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-blue-border)" stroke-width="0.8"/>
      <text x="262" y="21" fill="var(--svg-node-blue-border)" font-size="11" font-weight="600" text-anchor="middle">Step 2b: API Check</text>
      <text x="262" y="34" fill="var(--svg-text-secondary)" font-size="9" text-anchor="middle">Parallel</text>
    </g>

    <path d="M 197 154 L 197 172" stroke="var(--svg-node-amber-border)" stroke-width="1.5" marker-end="url(#arr-amber)"/>

    <!-- Step 3: Suspend Gate (HITL) -->
    <rect x="25" y="174" width="345" height="42" rx="6" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.2"/>
    <text x="197" y="194" fill="var(--svg-node-amber-border)" font-size="12" font-weight="700" text-anchor="middle">Step 3: suspend() Gate (HITL)</text>
    <text x="197" y="208" fill="var(--svg-node-amber-subtext)" font-size="10" text-anchor="middle">Friert Zustand ein • Wartet auf Freigabe</text>

    <path d="M 197 216 L 197 235" stroke="var(--svg-node-amber-border)" stroke-width="1.5" marker-end="url(#arr-amber)"/>

    <!-- Step 4: Resume & Commit -->
    <rect x="25" y="238" width="345" height="38" rx="6" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-green-border)" stroke-width="0.8"/>
    <text x="197" y="262" fill="var(--svg-node-green-border)" font-size="12" font-weight="600" text-anchor="middle">Step 4: resumeStream() &amp; Commit</text>
  </g>

  <!-- BOTTOM BAR: HYBRIDE KOMBINATION -->
  <g id="bottom-bar" transform="translate(40, 420)">
    <rect x="0" y="0" width="820" height="65" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
    <text x="20" y="26" fill="var(--svg-node-blue-border)" font-size="11" font-weight="700">HYBRIDE KOMPOSITION IN DER PRAXIS</text>
    
    <rect x="20" y="35" width="375" height="20" rx="4" fill="var(--svg-card-alt)"/>
    <text x="207" y="49" fill="var(--svg-text-primary)" font-size="11" text-anchor="middle">Muster A: Agent als flexibler Workflow-Schritt</text>

    <rect x="425" y="35" width="375" height="20" rx="4" fill="var(--svg-card-alt)"/>
    <text x="612" y="49" fill="var(--svg-text-primary)" font-size="11" text-anchor="middle">Muster B: Workflow als sicheres Tool für Agenten</text>
  </g>

</svg>

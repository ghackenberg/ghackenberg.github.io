<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', system-ui, sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <linearGradient id="box-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-blue-bg)"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>
    <linearGradient id="box-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-amber-bg)"/>
      <stop offset="100%" stop-color="var(--svg-card-alt)"/>
    </linearGradient>
    <linearGradient id="box-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-green-bg)"/>
      <stop offset="100%" stop-color="var(--svg-node-green-bg)"/>
    </linearGradient>
    <marker id="arr-pipe" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-blue-border)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="240" fill="var(--svg-bg)"/>

  <!-- Title -->
  <text x="30" y="32" fill="var(--svg-text-primary)" font-size="15" font-weight="800">Generative Laufzeit-Führung: Der Inferenz-Mechanismus</text>

  <!-- Step 1: Lokalisierung -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="165" height="135" rx="10" fill="url(#box-blue)" stroke="var(--svg-node-blue-border)" stroke-width="1.2"/>
    <rect x="12" y="14" width="75" height="20" rx="4" fill="var(--svg-node-blue-border)"/>
    <text x="20" y="28" fill="var(--svg-text-primary)" font-size="9" font-weight="800">1. LOCATE</text>
    <text x="14" y="56" fill="var(--svg-text-primary)" font-size="13" font-weight="800">Knoten-Match</text>
    <text x="14" y="78" fill="var(--svg-text-secondary)" font-size="10">Lokalisiert aktiven</text>
    <text x="14" y="94" fill="var(--svg-text-secondary)" font-size="10">Knoten u_t aus</text>
    <text x="14" y="110" fill="var(--svg-text-secondary)" font-size="10">letzter Aktion a_{t-1}.</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="200" y1="127" x2="230" y2="127" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-pipe)"/>

  <!-- Step 2: Extraktion -->
  <g transform="translate(235, 60)">
    <rect x="0" y="0" width="165" height="135" rx="10" fill="url(#box-blue)" stroke="var(--svg-node-blue-border)" stroke-width="1.2"/>
    <rect x="12" y="14" width="80" height="20" rx="4" fill="var(--svg-node-blue-border)"/>
    <text x="20" y="28" fill="var(--svg-text-primary)" font-size="9" font-weight="800">2. EXTRACT</text>
    <text x="14" y="56" fill="var(--svg-text-primary)" font-size="13" font-weight="800">h-Hop Subgraph</text>
    <text x="14" y="78" fill="var(--svg-text-secondary)" font-size="10">Extrahiert 2-Hop-</text>
    <text x="14" y="94" fill="var(--svg-text-secondary)" font-size="10">Nachbarschaft N_h</text>
    <text x="14" y="110" fill="var(--svg-text-secondary)" font-size="10">inkl. aller Kantenattribute.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="405" y1="127" x2="435" y2="127" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-pipe)"/>

  <!-- Step 3: Generierung Guidance -->
  <g transform="translate(440, 60)">
    <rect x="0" y="0" width="175" height="135" rx="10" fill="url(#box-amber)" stroke="var(--svg-node-amber-border)" stroke-width="1.2"/>
    <rect x="12" y="14" width="90" height="20" rx="4" fill="var(--svg-node-amber-border)"/>
    <text x="20" y="28" fill="var(--svg-text-primary)" font-size="9" font-weight="800">3. GENERATE</text>
    <text x="14" y="56" fill="var(--svg-text-primary)" font-size="13" font-weight="800">Soft Guidance g_t</text>
    <text x="14" y="78" fill="var(--svg-text-secondary)" font-size="10">Guidance-LLM Ψ</text>
    <text x="14" y="94" fill="var(--svg-text-secondary)" font-size="10">formuliert situative</text>
    <text x="14" y="110" fill="var(--svg-text-secondary)" font-size="10">Handlungshinweise.</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="620" y1="127" x2="650" y2="127" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-pipe)"/>

  <!-- Step 4: Solver Aktion -->
  <g transform="translate(655, 60)">
    <rect x="0" y="0" width="155" height="135" rx="10" fill="url(#box-green)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <rect x="12" y="14" width="70" height="20" rx="4" fill="var(--svg-node-green-bg)"/>
    <text x="20" y="28" fill="var(--svg-text-primary)" font-size="9" font-weight="800">4. ACTION</text>
    <text x="14" y="56" fill="var(--svg-text-primary)" font-size="13" font-weight="800">Solver π</text>
    <text x="14" y="78" fill="var(--svg-text-secondary)" font-size="10">Wählt nächste</text>
    <text x="14" y="94" fill="var(--svg-text-secondary)" font-size="10">Aktion a_t frei,</text>
    <text x="14" y="110" fill="var(--svg-node-green-subtext)" font-size="10" font-weight="bold">aber topologisch gelenkt.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', system-ui, sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <!-- Node Gradients -->
    <linearGradient id="node-blue-clean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-blue-bg)"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>
    <linearGradient id="node-amber-clean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-amber-bg)"/>
      <stop offset="100%" stop-color="var(--svg-card-alt)"/>
    </linearGradient>
    <linearGradient id="node-green-clean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-green-bg)"/>
      <stop offset="100%" stop-color="var(--svg-node-green-bg)"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-blue-border)"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-green-border)"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-purple-border)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="440" fill="var(--svg-bg)"/>

  <!-- Headline -->
  <text x="40" y="38" fill="var(--svg-text-primary)" font-size="18" font-weight="800" letter-spacing="-0.5">B2B-Auftragsprüfung als Procedural Graph</text>
  <text x="40" y="58" fill="var(--svg-text-secondary)" font-size="11.5">Topologische Kanten führen den Agenten durch Prüfungen und warnen vor Fallstricken</text>

  <!-- ==================== HORIZONTAL GRAPH FLOW ==================== -->
  <!-- Arrows -->
  <line x1="165" y1="125" x2="225" y2="125" stroke="var(--svg-node-blue-border)" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="375" y1="125" x2="435" y2="125" stroke="var(--svg-node-blue-border)" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="585" y1="125" x2="645" y2="125" stroke="var(--svg-node-blue-border)" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <path d="M 720 160 L 720 220 L 720 270" stroke="var(--svg-node-purple-border)" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr-purple)"/>

  <!-- Node 1: Eingang -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="125" height="60" rx="8" fill="url(#node-blue-clean)" stroke="var(--svg-node-blue-border)" stroke-width="1.2"/>
    <text x="14" y="24" fill="var(--svg-node-blue-subtext)" font-size="9" font-weight="700">1. EINGANG</text>
    <text x="14" y="44" fill="var(--svg-text-primary)" font-size="12" font-weight="800">Bestelldaten</text>
  </g>

  <!-- Node 2: Bonität (Aktiv) -->
  <g transform="translate(225, 95)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="url(#node-blue-clean)" stroke="var(--svg-node-blue-border)" stroke-width="2"/>
    <circle cx="134" cy="16" r="5" fill="var(--svg-node-blue-border)"/>
    <text x="14" y="24" fill="var(--svg-node-blue-border)" font-size="9" font-weight="800">2. AKTIVER SCHRITT</text>
    <text x="14" y="44" fill="var(--svg-text-primary)" font-size="12" font-weight="800">Bonitätsprüfung</text>
  </g>

  <!-- Node 3: Machbarkeit -->
  <g transform="translate(435, 95)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="url(#node-blue-clean)" stroke="var(--svg-node-blue-border)" stroke-width="1.2"/>
    <text x="14" y="24" fill="var(--svg-node-blue-subtext)" font-size="9" font-weight="700">3. PRÜFUNG</text>
    <text x="14" y="44" fill="var(--svg-text-primary)" font-size="12" font-weight="800">Machbarkeit &amp; Fracht</text>
  </g>

  <!-- Node 4: Freigabe -->
  <g transform="translate(645, 95)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="url(#node-green-clean)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <text x="14" y="24" fill="var(--svg-node-green-subtext)" font-size="9" font-weight="700">4. ABSCHLUSS</text>
    <text x="14" y="44" fill="var(--svg-text-primary)" font-size="12" font-weight="800">ERP-Freigabe</text>
  </g>

  <!-- Node 5: Eskalation (unten) -->
  <g transform="translate(645, 275)">
    <rect x="0" y="0" width="150" height="50" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="14" y="20" fill="var(--svg-node-purple-subtext)" font-size="8.5" font-weight="700">SONDERFALL</text>
    <text x="14" y="37" fill="var(--svg-text-primary)" font-size="11" font-weight="700">Mitarbeiter-Eskalation</text>
  </g>

  <!-- ==================== KANTEN-ATTRIBUTE DETAIL-PANEL ==================== -->
  <g transform="translate(40, 185)">
    <rect x="0" y="0" width="545" height="215" rx="10" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="545" height="30" rx="10" fill="var(--svg-card-alt)"/>
    <text x="16" y="20" fill="var(--svg-node-blue-subtext)" font-size="10.5" font-weight="700">Kanten-Attribute Φ(e): Übergang [Bonität ➔ Machbarkeit]</text>

    <!-- Condition -->
    <g transform="translate(16, 40)">
      <rect x="0" y="0" width="513" height="46" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="0.8"/>
      <text x="12" y="18" fill="var(--svg-node-blue-border)" font-size="9.5" font-weight="800">VORBEDINGUNG (Condition):</text>
      <text x="12" y="34" fill="var(--svg-text-secondary)" font-size="10">Bonitätsscore ≥ 80 Punkte UND kein Zahlungsstopp im ERP.</text>
    </g>

    <!-- Guidance -->
    <g transform="translate(16, 95)">
      <rect x="0" y="0" width="513" height="46" rx="6" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="0.8"/>
      <text x="12" y="18" fill="var(--svg-node-green-border)" font-size="9.5" font-weight="800">SITUATIVE FÜHRUNG (Guidance):</text>
      <text x="12" y="34" fill="var(--svg-text-secondary)" font-size="10">Lagerbestände beider Werke prüfen; bei Lieferzeit &gt; 14 Tage Expressfracht abfragen.</text>
    </g>

    <!-- Pitfall -->
    <g transform="translate(16, 150)">
      <rect x="0" y="0" width="513" height="46" rx="6" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="0.8"/>
      <text x="12" y="18" fill="var(--svg-node-red-border)" font-size="9.5" font-weight="800">FALLSTRICKE VERMEIDEN (Pitfalls):</text>
      <text x="12" y="34" fill="var(--svg-node-red-subtext)" font-size="10">Keine Teillieferung unter 500 € Mindestwert freigeben (verhindert Frachtverlust).</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <text x="605" y="360" fill="var(--svg-text-secondary)" font-size="10">
    <tspan fill="var(--svg-node-blue-border)" font-weight="bold">Soft Guidance:</tspan> Der Agent
  </text>
  <text x="605" y="376" fill="var(--svg-text-secondary)" font-size="10">wird situationsgerecht geführt,</text>
  <text x="605" y="392" fill="var(--svg-text-secondary)" font-size="10">ohne in starre Regeln verfallen zu müssen.</text>
</svg>

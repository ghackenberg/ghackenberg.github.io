<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', system-ui, sans-serif;">
  <defs>
    <linearGradient id="grad-node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrow-blue-triplet" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6" />
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="260" fill="#030712" />

  <!-- Node u -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="url(#grad-node)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="18" y="24" fill="#93c5fd" font-size="10" font-weight="700">PROZEDUR u</text>
    <text x="18" y="44" fill="#ffffff" font-size="13" font-weight="800">Aktion / Zustand 1</text>
  </g>

  <!-- Connecting Arrow with Relation r -->
  <line x1="245" y1="60" x2="535" y2="60" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue-triplet)" />
  <rect x="330" y="44" width="120" height="24" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="390" y="60" fill="#c7d2fe" font-size="10.5" font-weight="700" text-anchor="middle">Relation r: FÜHRT_ZU</text>

  <!-- Node v -->
  <g transform="translate(540, 30)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="url(#grad-node)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="18" y="24" fill="#93c5fd" font-size="10" font-weight="700">PROZEDUR v</text>
    <text x="18" y="44" fill="#ffffff" font-size="13" font-weight="800">Aktion / Zustand 2</text>
  </g>

  <!-- Downward Pointer to Attributes -->
  <path d="M 390 74 L 390 115" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Attributes Card -->
  <g transform="translate(140, 120)">
    <rect x="0" y="0" width="500" height="110" rx="10" fill="#0b1329" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    
    <text x="20" y="26" fill="#f8fafc" font-size="12" font-weight="800">Kanten-Attribute Φ(e):</text>
    
    <!-- Item 1: Condition -->
    <circle cx="28" cy="48" r="4" fill="#3b82f6" />
    <text x="40" y="52" fill="#cbd5e1" font-size="11">
      <tspan fill="#60a5fa" font-weight="bold">Vorbedingung (Condition):</tspan> Wann darf der Schritt ausgeführt werden?
    </text>

    <!-- Item 2: Guidance -->
    <circle cx="28" cy="72" r="4" fill="#10b981" />
    <text x="40" y="76" fill="#cbd5e1" font-size="11">
      <tspan fill="#34d399" font-weight="bold">Situative Führung (Guidance):</tspan> Wie ist vorzugehen (Tools, Parameter)?
    </text>

    <!-- Item 3: Pitfalls -->
    <circle cx="28" cy="96" r="4" fill="#ef4444" />
    <text x="40" y="100" fill="#cbd5e1" font-size="11">
      <tspan fill="#f87171" font-weight="bold">Bekannte Fallstricke (Pitfalls):</tspan> Welche Fehler müssen vermieden werden?
    </text>
  </g>
</svg>

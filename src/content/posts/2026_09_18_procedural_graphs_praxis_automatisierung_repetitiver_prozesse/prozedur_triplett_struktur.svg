<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', system-ui, sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <linearGradient id="grad-node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-blue-bg)"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>
    <marker id="arrow-blue-triplet" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-blue-border)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="260" fill="var(--svg-bg)"/>

  <!-- Node u -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="url(#grad-node)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <text x="18" y="24" fill="var(--svg-node-blue-subtext)" font-size="10" font-weight="700">PROZEDUR u</text>
    <text x="18" y="44" fill="var(--svg-text-primary)" font-size="13" font-weight="800">Aktion / Zustand 1</text>
  </g>

  <!-- Connecting Arrow with Relation r -->
  <line x1="245" y1="60" x2="535" y2="60" stroke="var(--svg-node-blue-border)" stroke-width="2.5" marker-end="url(#arrow-blue-triplet)"/>
  <rect x="330" y="44" width="120" height="24" rx="6" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
  <text x="390" y="60" fill="var(--svg-node-purple-subtext)" font-size="10.5" font-weight="700" text-anchor="middle">Relation r: FÜHRT_ZU</text>

  <!-- Node v -->
  <g transform="translate(540, 30)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="url(#grad-node)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <text x="18" y="24" fill="var(--svg-node-blue-subtext)" font-size="10" font-weight="700">PROZEDUR v</text>
    <text x="18" y="44" fill="var(--svg-text-primary)" font-size="13" font-weight="800">Aktion / Zustand 2</text>
  </g>

  <!-- Downward Pointer to Attributes -->
  <path d="M 390 74 L 390 115" stroke="var(--svg-line)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Attributes Card -->
  <g transform="translate(140, 120)">
    <rect x="0" y="0" width="500" height="110" rx="10" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1"/>
    
    <text x="20" y="26" fill="var(--svg-text-primary)" font-size="12" font-weight="800">Kanten-Attribute Φ(e):</text>
    
    <!-- Item 1: Condition -->
    <circle cx="28" cy="48" r="4" fill="var(--svg-node-blue-border)"/>
    <text x="40" y="52" fill="var(--svg-text-secondary)" font-size="11">
      <tspan fill="var(--svg-node-blue-border)" font-weight="bold">Vorbedingung (Condition):</tspan> Wann darf der Schritt ausgeführt werden?
    </text>

    <!-- Item 2: Guidance -->
    <circle cx="28" cy="72" r="4" fill="var(--svg-node-green-border)"/>
    <text x="40" y="76" fill="var(--svg-text-secondary)" font-size="11">
      <tspan fill="var(--svg-node-green-border)" font-weight="bold">Situative Führung (Guidance):</tspan> Wie ist vorzugehen (Tools, Parameter)?
    </text>

    <!-- Item 3: Pitfalls -->
    <circle cx="28" cy="96" r="4" fill="var(--svg-node-red-border)"/>
    <text x="40" y="100" fill="var(--svg-text-secondary)" font-size="11">
      <tspan fill="var(--svg-node-red-border)" font-weight="bold">Bekannte Fallstricke (Pitfalls):</tspan> Welche Fehler müssen vermieden werden?
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', system-ui, sans-serif;">
  <defs>
    <linearGradient id="card-step" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#080d17" />
    </linearGradient>
    <marker id="arr-step" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6" />
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="180" fill="#030712" />

  <!-- Title -->
  <text x="30" y="28" fill="#f8fafc" font-size="15" font-weight="800">In 4 Schritten zur produktiven Prozess-KI</text>

  <!-- Step 1 -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="170" height="115" rx="8" fill="url(#card-step)" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="20" cy="20" r="10" fill="#1d4ed8" />
    <text x="20" y="24" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">1</text>
    <text x="38" y="24" fill="#60a5fa" font-size="11" font-weight="700">Scoping</text>
    <text x="14" y="50" fill="#ffffff" font-size="12" font-weight="700">Prozessauswahl</text>
    <text x="14" y="70" fill="#94a3b8" font-size="9.5">• Hohes Volumen</text>
    <text x="14" y="85" fill="#94a3b8" font-size="9.5">• Klare Schnittstellen</text>
    <text x="14" y="100" fill="#94a3b8" font-size="9.5">• Bestehende SOPs</text>
  </g>

  <line x1="205" y1="102" x2="230" y2="102" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-step)" />

  <!-- Step 2 -->
  <g transform="translate(235, 45)">
    <rect x="0" y="0" width="170" height="115" rx="8" fill="url(#card-step)" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="20" cy="20" r="10" fill="#1d4ed8" />
    <text x="20" y="24" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">2</text>
    <text x="38" y="24" fill="#60a5fa" font-size="11" font-weight="700">Modellierung</text>
    <text x="14" y="50" fill="#ffffff" font-size="12" font-weight="700">Minimaler Graph</text>
    <text x="14" y="70" fill="#94a3b8" font-size="9.5">• 4–6 Kernknoten</text>
    <text x="14" y="85" fill="#94a3b8" font-size="9.5">• Standard-Gutfall</text>
    <text x="14" y="100" fill="#94a3b8" font-size="9.5">• Kanten-Attribute</text>
  </g>

  <line x1="410" y1="102" x2="435" y2="102" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-step)" />

  <!-- Step 3 -->
  <g transform="translate(440, 45)">
    <rect x="0" y="0" width="170" height="115" rx="8" fill="url(#card-step)" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="20" cy="20" r="10" fill="#b45309" />
    <text x="20" y="24" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">3</text>
    <text x="38" y="24" fill="#fde68a" font-size="11" font-weight="700">Piloting</text>
    <text x="14" y="50" fill="#ffffff" font-size="12" font-weight="700">Human-in-the-Loop</text>
    <text x="14" y="70" fill="#cbd5e1" font-size="9.5">• Schattenbetrieb</text>
    <text x="14" y="85" fill="#cbd5e1" font-size="9.5">• 30-Sekunden-Freigabe</text>
    <text x="14" y="100" fill="#cbd5e1" font-size="9.5">• Trace-Erfassung</text>
  </g>

  <line x1="615" y1="102" x2="640" y2="102" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-step)" />

  <!-- Step 4 -->
  <g transform="translate(645, 45)">
    <rect x="0" y="0" width="165" height="115" rx="8" fill="#042018" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="20" r="10" fill="#047857" />
    <text x="20" y="24" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">4</text>
    <text x="38" y="24" fill="#a7f3d0" font-size="11" font-weight="700">Skalierung</text>
    <text x="14" y="50" fill="#ffffff" font-size="12" font-weight="700">Autonome Härtung</text>
    <text x="14" y="70" fill="#a7f3d0" font-size="9.5">• Offline-Evolution</text>
    <text x="14" y="85" fill="#a7f3d0" font-size="9.5">• Rejection Memory</text>
    <text x="14" y="100" fill="#a7f3d0" font-size="9.5">• Kontinuierlicher ROI</text>
  </g>
</svg>

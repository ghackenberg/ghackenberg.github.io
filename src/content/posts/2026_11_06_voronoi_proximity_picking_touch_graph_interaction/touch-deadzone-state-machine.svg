<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="auto" role="img" aria-label="Touch interaction state machine reconciling vertical pan-y scrolling, two-step touch tap preview and navigation, and 8px deadzone node dragging">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--svg-node-blue-border)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--svg-node-amber-border)" />
    </marker>
  </defs>

  <!-- Outer Canvas Background -->
  <rect x="0" y="0" width="480" height="480" rx="16" fill="var(--svg-bg)" />

  <!-- Ambient Zone Glows -->
  <circle cx="240" cy="144" r="58" fill="var(--svg-node-blue-bg)" opacity="0.32" />
  <ellipse cx="116" cy="336" rx="82" ry="62" fill="var(--svg-node-amber-bg)" opacity="0.24" />
  <ellipse cx="364" cy="336" rx="82" ry="62" fill="var(--svg-node-green-bg)" opacity="0.26" />

  <!-- Header -->
  <text x="240" y="34" font-family="Outfit, Inter, sans-serif" font-size="16" font-weight="700" fill="var(--svg-text-primary)" text-anchor="middle" letter-spacing="0.05em">8PX TOUCH DEADZONE &amp; GESTURE ARBITRATION</text>
  <text x="240" y="55" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="500" fill="var(--svg-text-secondary)" text-anchor="middle">Reconciling pan-y Page Scroll, 2-Step Tap, and Single-Finger Drag</text>

  <!-- ==================== CENTRAL HUB: 8PX DEADZONE GATE ==================== -->
  <g transform="translate(240, 144)">
    <circle cx="0" cy="0" r="44" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="24" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.8" stroke-dasharray="4,3" />
    <circle cx="0" cy="0" r="5" fill="var(--svg-node-blue-border)" />
  </g>
  <text x="240" y="84" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--svg-node-blue-subtext)" text-anchor="middle">DRAG_DEADZONE = 8px</text>

  <!-- Branch 1 Connector (Left: Empty Space -> Page Scroll) -->
  <path d="M 198 162 Q 124 196 108 268" fill="none" stroke="var(--svg-node-amber-border)" stroke-width="2.2" marker-end="url(#arrow-amber)" />
  <text x="118" y="210" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="var(--svg-node-amber-subtext)" text-anchor="middle">No Hit (&gt;8px)</text>

  <!-- Branch 2 Connector (Center: Move <= 8px -> Two-Step Tap) -->
  <line x1="240" y1="190" x2="240" y2="268" stroke="var(--svg-node-blue-border)" stroke-width="2.2" marker-end="url(#arrow-blue)" />
  <text x="240" y="232" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="var(--svg-node-blue-subtext)" text-anchor="middle">Move &lt;= 8px</text>

  <!-- Branch 3 Connector (Right: Node Hit > 8px -> Lock Scroll & Drag) -->
  <path d="M 282 162 Q 356 196 372 268" fill="none" stroke="var(--svg-node-green-border)" stroke-width="2.2" marker-end="url(#arrow-green)" />
  <text x="362" y="210" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="var(--svg-node-green-subtext)" text-anchor="middle">Hit (&gt;8px)</text>

  <!-- ==================== OUTCOME 1 (LEFT): NATIVE PAN-Y SCROLL ==================== -->
  <g transform="translate(104, 314)">
    <circle cx="0" cy="0" r="34" fill="var(--svg-card)" stroke="var(--svg-node-amber-border)" stroke-width="2.4" />
    <!-- Vertical Scroll Arrows Icon -->
    <line x1="0" y1="-15" x2="0" y2="15" stroke="var(--svg-node-amber-border)" stroke-width="2.2" />
    <polyline points="-7,-8 0,-16 7,-8" fill="none" stroke="var(--svg-node-amber-border)" stroke-width="2.2" />
    <polyline points="-7,8 0,16 7,8" fill="none" stroke="var(--svg-node-amber-border)" stroke-width="2.2" />
  </g>
  <text x="104" y="368" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-text-primary)" text-anchor="middle">Native Scroll</text>
  <text x="104" y="388" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="var(--svg-node-amber-subtext)" text-anchor="middle">pan-y Active</text>

  <!-- ==================== OUTCOME 2 (CENTER): TWO-STEP TOUCH TAP ==================== -->
  <g transform="translate(240, 314)">
    <circle cx="0" cy="0" r="34" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="2.4" />
    <!-- Two-Tap Concentric Ring & Card Icon -->
    <rect x="-14" y="-12" width="28" height="18" rx="4" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.8" />
    <circle cx="0" cy="12" r="5" fill="var(--svg-node-blue-border)" />
  </g>
  <text x="240" y="368" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-text-primary)" text-anchor="middle">2-Step Tap</text>
  <text x="240" y="388" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="var(--svg-node-blue-subtext)" text-anchor="middle">1st Show / 2nd Go</text>

  <!-- ==================== OUTCOME 3 (RIGHT): 60FPS NODE DRAG ==================== -->
  <g transform="translate(376, 314)">
    <circle cx="0" cy="0" r="34" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="2.4" />
    <!-- 4-Way Node Drag Vector Icon -->
    <circle cx="0" cy="0" r="7" fill="var(--svg-node-green-border)" />
    <line x1="-17" y1="0" x2="17" y2="0" stroke="var(--svg-node-green-border)" stroke-width="2" />
    <line x1="0" y1="-17" x2="0" y2="17" stroke="var(--svg-node-green-border)" stroke-width="2" />
  </g>
  <text x="376" y="368" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-text-primary)" text-anchor="middle">Node Drag</text>
  <text x="376" y="388" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="var(--svg-node-green-subtext)" text-anchor="middle">preventDefault()</text>

  <!-- Bottom Summary Pill -->
  <rect x="34" y="424" width="412" height="36" rx="18" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.5" />
  <text x="240" y="447" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--svg-text-primary)" text-anchor="middle">800ms lastTouchTime Guard Blocks Synthetic Mouse</text>
</svg>

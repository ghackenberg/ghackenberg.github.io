<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="100%" height="100%" style="background-color: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="trap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1315" />
      <stop offset="100%" stop-color="#11090a" />
    </linearGradient>
    <linearGradient id="sol-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1d18" />
      <stop offset="100%" stop-color="#06120e" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect x="8" y="8" width="904" height="314" rx="14" fill="#070b16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <text x="36" y="42" fill="#f8fafc" font-size="17" font-weight="700">Diffusions-Kamerasteuerung im Vergleich</text>
  <text x="36" y="64" fill="#94a3b8" font-size="12.5">Warum 2D-Bildkonditionierung scheitert und wie Room DNA mit Fokus-Varianten funktioniert</text>

  <!-- ==================== LEFT CARD: THE PROBLEM ==================== -->
  <g transform="translate(36, 84)">
    <rect width="412" height="216" rx="12" fill="url(#trap-grad)" stroke="#ef4444" stroke-width="1.2" />
    
    <!-- Header -->
    <rect x="18" y="16" width="24" height="24" rx="6" fill="#ef4444" fill-opacity="0.2" />
    <text x="30" y="33" fill="#ef4444" font-size="14" font-weight="800" text-anchor="middle">✕</text>
    <text x="52" y="33" fill="#fca5a5" font-size="14" font-weight="700">2D Layout-Locking (Anti-Pattern)</text>

    <line x1="18" y1="50" x2="394" y2="50" stroke="#372023" />

    <!-- 3 Flow Steps -->
    <g transform="translate(18, 66)">
      <text x="0" y="12" fill="#f87171" font-size="11" font-weight="700">1. Eingabe:</text>
      <text x="76" y="12" fill="#cbd5e1" font-size="11.5">Weitwinkelfoto als Bildreferenz</text>
      
      <text x="0" y="38" fill="#f87171" font-size="11" font-weight="700">2. Konflikt:</text>
      <text x="76" y="38" fill="#cbd5e1" font-size="11.5">Prompt fordert Close-up, 2D-Raster friert ein</text>
      
      <text x="0" y="64" fill="#f87171" font-size="11" font-weight="700">3. Artefakt:</text>
      <text x="76" y="64" fill="#fca5a5" font-size="11.5" font-weight="600">Schwebende Duplikate &amp; Geisterobjekte</text>

      <!-- Result Callout -->
      <rect x="0" y="86" width="376" height="42" rx="6" fill="#2d1215" stroke="#7f1d1d" stroke-width="0.8" />
      <text x="14" y="103" fill="#fca5a5" font-size="11" font-weight="700">✕ Coordinate Freezing:</text>
      <text x="14" y="119" fill="#fecaca" font-size="10.5">Keine 3D-Kamerarotation über 2D-Bildpfade möglich</text>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: THE SOLUTION ==================== -->
  <g transform="translate(472, 84)">
    <rect width="412" height="216" rx="12" fill="url(#sol-grad)" stroke="#10b981" stroke-width="1.2" />

    <!-- Header -->
    <rect x="18" y="16" width="24" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
    <text x="30" y="33" fill="#34d399" font-size="14" font-weight="800" text-anchor="middle">✓</text>
    <text x="52" y="33" fill="#a7f3d0" font-size="14" font-weight="700">Room DNA &amp; Varianten (Best Practice)</text>

    <line x1="18" y1="50" x2="394" y2="50" stroke="#16382b" />

    <!-- 3 Flow Steps -->
    <g transform="translate(18, 66)">
      <text x="0" y="12" fill="#34d399" font-size="11" font-weight="700">1. Eingabe:</text>
      <text x="76" y="12" fill="#cbd5e1" font-size="11.5">Text-DNA + vorberechnete Fokus-Variante</text>
      
      <text x="0" y="38" fill="#34d399" font-size="11" font-weight="700">2. Vorteil:</text>
      <text x="76" y="38" fill="#cbd5e1" font-size="11.5">Blickwinkel ist im Bildanker bereits justiert</text>
      
      <text x="0" y="64" fill="#34d399" font-size="11" font-weight="700">3. Ergebnis:</text>
      <text x="76" y="64" fill="#6ee7b7" font-size="11.5" font-weight="600">Freie Perspektiven ohne Halluzinationen</text>

      <!-- Result Callout -->
      <rect x="0" y="86" width="376" height="42" rx="6" fill="#0d2b20" stroke="#059669" stroke-width="0.8" />
      <text x="14" y="103" fill="#34d399" font-size="11" font-weight="700">✓ Volle Konsistenz:</text>
      <text x="14" y="119" fill="#a7f3d0" font-size="10.5">Identische Materialien, Lichtführung &amp; Geometrie</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <!-- Background Gradients -->
    <linearGradient id="bg-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-card)"/>
      <stop offset="100%" stop-color="#080d1e"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-exiting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="var(--svg-node-purple-bg)"/>
    </linearGradient>
    <linearGradient id="card-visible" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-card-alt)"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>
    <linearGradient id="card-recycled" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-green-bg)" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>

    <!-- Flow Gradients -->
    <linearGradient id="flow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--svg-node-amber-border)"/>
      <stop offset="50%" stop-color="var(--svg-node-purple-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-green-border)"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-amber-border)"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)"/>
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect width="840" height="450" rx="16" fill="url(#bg-panel)" stroke="var(--svg-border)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <text x="0" y="16" fill="var(--svg-node-purple-border)" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CONTINUOUS DOM RECYCLING ENGINE</text>
    <text x="0" y="36" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="18" font-weight="800">Zero-Jump Position Compensation &amp; Pool Re-Hydration</text>
  </g>

  <!-- VIEWPORT BOX -->
  <g transform="translate(190, 80)">
    <!-- Viewport Active Area -->
    <rect width="450" height="150" rx="10" fill="var(--svg-pill-bg)" fill-opacity="0.6" stroke="var(--svg-node-blue-border)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="225" y="24" fill="var(--svg-node-blue-border)" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">VISIBLE BROWSER VIEWPORT</text>

    <!-- Visible Active Cards -->
    <g transform="translate(30, 42)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="115" height="68" rx="8" fill="url(#card-visible)" stroke="var(--svg-line)" stroke-width="1.2"/>
      <rect x="10" y="12" width="60" height="5" rx="2.5" fill="var(--svg-text-secondary)"/>
      <rect x="10" y="22" width="85" height="4" rx="2" fill="var(--svg-card-alt)"/>
      <text x="57.5" y="52" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Card 1 (Active)</text>

      <!-- Card 2 -->
      <rect x="135" y="0" width="115" height="68" rx="8" fill="url(#card-visible)" stroke="var(--svg-line)" stroke-width="1.2"/>
      <rect x="145" y="12" width="55" height="5" rx="2.5" fill="var(--svg-text-secondary)"/>
      <rect x="145" y="22" width="80" height="4" rx="2" fill="var(--svg-card-alt)"/>
      <text x="192.5" y="52" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Card 2 (Active)</text>

      <!-- Card 3 -->
      <rect x="270" y="0" width="115" height="68" rx="8" fill="url(#card-visible)" stroke="var(--svg-line)" stroke-width="1.2"/>
      <rect x="280" y="12" width="65" height="5" rx="2.5" fill="var(--svg-text-secondary)"/>
      <rect x="280" y="22" width="75" height="4" rx="2" fill="var(--svg-card-alt)"/>
      <text x="327.5" y="52" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Card 3 (Active)</text>
    </g>

    <!-- Velocity Arrow -->
    <line x1="390" y1="130" x2="60" y2="130" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="225" y="142" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Motion Velocity v (px/s)</text>
  </g>

  <!-- LEFT BOUNDARY: EXITING CARD 0 -->
  <g transform="translate(30, 80)">
    <!-- Boundary line -->
    <line x1="160" y1="-5" x2="160" y2="155" stroke="var(--svg-node-amber-border)" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="155" y="-12" fill="var(--svg-node-amber-border)" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="end">Left Boundary</text>

    <!-- Card 0 (Fully Offscreen) -->
    <rect x="15" y="42" width="125" height="68" rx="8" fill="url(#card-exiting)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
    <rect x="25" y="54" width="60" height="5" rx="2.5" fill="var(--svg-node-amber-border)"/>
    <text x="77.5" y="74" fill="var(--svg-node-amber-subtext)" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Card 0 (Exiting)</text>
    <text x="77.5" y="92" fill="var(--svg-node-amber-subtext)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">right &lt; vp.left - 10</text>
  </g>

  <!-- RECYCLING ARCH PIPELINE -->
  <g>
    <!-- Pipeline arc from Card 0 to Card Recycled -->
    <path d="M 92 195 C 92 310, 755 310, 755 195" fill="none" stroke="url(#flow-line)" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>
    
    <!-- Step 1: Detach & Compensate -->
    <g transform="translate(75, 310)">
      <rect width="190" height="74" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-amber-border)" stroke-width="1.2"/>
      <text x="14" y="24" fill="var(--svg-node-amber-border)" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="800">1. Coordinate Shift</text>
      <text x="14" y="42" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="700">track.x += (width + gap)</text>
      <text x="14" y="58" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10">Cancels flex child index shift</text>
    </g>

    <!-- Step 2: Pool Selection & LRU -->
    <g transform="translate(315, 310)">
      <rect width="210" height="74" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.2"/>
      <text x="14" y="24" fill="var(--svg-node-purple-border)" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="800">2. Pool Re-Hydration</text>
      <text x="14" y="42" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="700">pickNextItem(candidates)</text>
      <text x="14" y="58" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10">Excludes on-screen cards · LRU boost</text>
    </g>

    <!-- Step 3: Append to End -->
    <g transform="translate(575, 310)">
      <rect width="190" height="74" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1.2"/>
      <text x="14" y="24" fill="var(--svg-node-green-border)" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="800">3. Append to Tail</text>
      <text x="14" y="42" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="700">track.appendChild(card)</text>
      <text x="14" y="58" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', sans-serif" font-size="10">Becomes right buffer runway</text>
    </g>
  </g>

  <!-- RIGHT BUFFER: RECYCLED CARD APPRENDED -->
  <g transform="translate(680, 80)">
    <rect x="15" y="42" width="125" height="68" rx="8" fill="url(#card-recycled)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <rect x="25" y="54" width="70" height="5" rx="2.5" fill="var(--svg-node-green-subtext)"/>
    <text x="77.5" y="74" fill="var(--svg-node-green-subtext)" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Card 0 (Recycled)</text>
    <text x="77.5" y="92" fill="var(--svg-node-green-subtext)" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">New Image &amp; Meta</text>
  </g>

  <!-- MATH GUARANTEE BADGE -->
  <g transform="translate(240, 400)">
    <rect width="360" height="28" rx="14" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
    <text x="180" y="18" fill="var(--svg-node-purple-subtext)" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Mathematical Guarantee: Net Visual Shift = -offset + offset = 0 px</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="auto" role="img" aria-label="Final-corpus clustering followed by chronological slicing across three progressive timeline snapshots with fixed cluster colors and zero renames">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="480" height="480" rx="12" fill="var(--svg-bg)" />

  <!-- Header -->
  <text x="240" y="32" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="0.05em" text-anchor="middle" fill="var(--svg-text-primary)">FINAL-CORPUS CLUSTERING + SLICING</text>
  <text x="240" y="51" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="var(--svg-text-muted)">Cluster once on finalCanonical, then reveal chronologically</text>

  <!-- Top Banner: Final Corpus Anchor -->
  <rect x="24" y="68" width="432" height="58" rx="10" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1.3" />
  <text x="42" y="90" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="var(--svg-text-primary)">1. Cluster Once</text>
  <text x="42" y="108" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="var(--svg-text-muted)">Fixed names &amp; OKLab hues</text>

  <!-- Fixed Cluster Pills in Banner -->
  <rect x="218" y="81" width="70" height="28" rx="14" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <text x="253" y="95" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="var(--svg-node-blue-text)">Systems</text>

  <rect x="296" y="81" width="72" height="28" rx="14" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <text x="332" y="95" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="var(--svg-node-amber-text)">Graphics</text>

  <rect x="376" y="81" width="66" height="28" rx="14" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
  <text x="409" y="95" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="var(--svg-node-green-text)">Ethics</text>

  <!-- Downward Flow Arrows to 3 Progressive Snapshots -->
  <path d="M 92 126 V 146" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.6" marker-end="url(#arr-sky)" />
  <path d="M 240 126 V 146" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.6" marker-end="url(#arr-sky)" />
  <path d="M 388 126 V 146" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.6" marker-end="url(#arr-sky)" />

  <!-- Snapshot 1: Early Slice -->
  <rect x="24" y="152" width="136" height="222" rx="10" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.4" />
  <text x="92" y="175" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="var(--svg-text-primary)">Step s = 1</text>
  <text x="92" y="193" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" fill="var(--svg-text-muted)">1 active cluster</text>

  <!-- Active Cluster 1 -->
  <rect x="52" y="210" width="80" height="26" rx="13" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <text x="92" y="223" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="var(--svg-node-blue-text)">Systems</text>

  <!-- Content nodes for s=1 -->
  <line x1="92" y1="236" x2="72" y2="274" stroke="var(--svg-line)" stroke-width="1.4" stroke-dasharray="3,3" />
  <line x1="92" y1="236" x2="112" y2="282" stroke="var(--svg-line)" stroke-width="1.4" stroke-dasharray="3,3" />
  <circle cx="72" cy="274" r="9" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <circle cx="112" cy="282" r="9" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />

  <text x="92" y="356" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--svg-text-secondary)">2 items</text>

  <!-- Snapshot 2: Mid Slice -->
  <rect x="172" y="152" width="136" height="222" rx="10" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.4" />
  <text x="240" y="175" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="var(--svg-text-primary)">Step s = k</text>
  <text x="240" y="193" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" fill="var(--svg-text-muted)">2 active clusters</text>

  <!-- Active Clusters 1 & 2 -->
  <rect x="184" y="210" width="66" height="24" rx="12" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <text x="217" y="222" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="var(--svg-node-blue-text)">Systems</text>

  <rect x="228" y="242" width="68" height="24" rx="12" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <text x="262" y="254" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="var(--svg-node-amber-text)">Graphics</text>

  <!-- Content nodes for s=k -->
  <line x1="217" y1="234" x2="202" y2="286" stroke="var(--svg-line)" stroke-width="1.3" stroke-dasharray="3,3" />
  <line x1="262" y1="266" x2="242" y2="296" stroke="var(--svg-line)" stroke-width="1.3" stroke-dasharray="3,3" />
  <line x1="217" y1="234" x2="242" y2="296" stroke="var(--svg-line)" stroke-width="1.3" stroke-dasharray="3,3" />
  <line x1="262" y1="266" x2="276" y2="310" stroke="var(--svg-line)" stroke-width="1.3" stroke-dasharray="3,3" />
  <circle cx="202" cy="286" r="8.5" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <circle cx="242" cy="296" r="8.5" fill="var(--svg-accent-3-bg)" stroke="var(--svg-accent-3-border)" stroke-width="1.5" />
  <circle cx="276" cy="310" r="8.5" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <circle cx="218" cy="322" r="8.5" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />

  <text x="240" y="356" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--svg-text-secondary)">4 items</text>

  <!-- Snapshot 3: Final Slice -->
  <rect x="320" y="152" width="136" height="222" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
  <text x="388" y="175" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="var(--svg-node-green-text)">Final (n - 1)</text>
  <text x="388" y="193" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" fill="var(--svg-text-muted)">All K clusters active</text>

  <!-- All 3 Active Clusters -->
  <rect x="332" y="208" width="64" height="22" rx="11" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.4" />
  <text x="364" y="219" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="var(--svg-node-blue-text)">Systems</text>

  <rect x="382" y="236" width="66" height="22" rx="11" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.4" />
  <text x="415" y="247" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="var(--svg-node-amber-text)">Graphics</text>

  <rect x="334" y="264" width="60" height="22" rx="11" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.4" />
  <text x="364" y="275" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="var(--svg-node-green-text)">Ethics</text>

  <!-- Content nodes for Final -->
  <circle cx="348" cy="310" r="8" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.4" />
  <circle cx="376" cy="304" r="8" fill="var(--svg-accent-3-bg)" stroke="var(--svg-accent-3-border)" stroke-width="1.4" />
  <circle cx="406" cy="296" r="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.4" />
  <circle cx="428" cy="320" r="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.4" />
  <circle cx="362" cy="332" r="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.4" />
  <circle cx="394" cy="328" r="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.4" />

  <text x="388" y="356" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--svg-node-green-text)">100% corpus</text>

  <!-- Bottom Invariant Summary Bar -->
  <rect x="24" y="392" width="432" height="64" rx="10" fill="var(--svg-card-alt)" stroke="var(--svg-node-green-border)" stroke-width="1.4" />
  <text x="240" y="416" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--svg-node-green-text)">Identity Invariants Across Every Keyframe</text>
  <text x="240" y="438" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="var(--svg-text-secondary)">renames = 0 · colourBreaks = 0 · weightDrift = 0</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="100%" height="auto" role="img" aria-label="2D Kollisionsfreier Porträt-Platzierungs-Solver mit Kandidat A Rechts-Mittig und Kandidat B Oben neben H1">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-amber-border)" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-purple-border)" />
    </marker>
  </defs>

  <!-- Main Canvas Frame -->
  <rect width="600" height="470" rx="16" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="2" />

  <!-- Header -->
  <text x="300" y="34" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2D KOLLISIONSFREIER PORTRÄT-SOLVER</text>
  <line x1="24" y1="48" x2="576" y2="48" stroke="var(--svg-line)" stroke-width="2" />

  <!-- Hero Grid Coordinate Frame -->
  <rect x="24" y="62" width="552" height="314" rx="12" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="2" />
  <text x="40" y="86" fill="var(--svg-text-secondary)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="700">#hero-grid (Breite W, Höhe H) — maxRightInVerticalRange(yTop, yBottom)</text>

  <!-- Left Text Contour Bands (bands[]) -->
  <g id="contour-bands" transform="translate(40, 100)">
    <!-- H1 Band 1 -->
    <rect x="0" y="0" width="210" height="36" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="14" y="23" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">H1 Zeile 1 (H_h1 = 78px)</text>

    <!-- H1 Band 2 -->
    <rect x="0" y="42" width="260" height="36" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="14" y="65" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">H1 Zeile 2 (b.right = 260)</text>

    <!-- Subtitle Band -->
    <rect x="0" y="92" width="295" height="34" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="14" y="114" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">Subtitle Band (b.right = 295)</text>

    <!-- Bio Band -->
    <rect x="0" y="136" width="280" height="58" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="14" y="162" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">Bio &amp; Trust-Pills Bänder</text>
    <text x="14" y="182" fill="var(--svg-node-blue-subtext)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="500">GAP_X = 18px | GAP_Y = 6px</text>

    <!-- CTA & Social Row Band -->
    <rect x="0" y="204" width="245" height="36" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="14" y="227" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">CTA + Social-Icons Band</text>
  </g>

  <!-- Clearance Boundary Line (reqLeft) -->
  <line x1="353" y1="96" x2="353" y2="352" stroke="var(--svg-node-amber-border)" stroke-width="2.5" stroke-dasharray="6,4" />
  <rect x="292" y="342" width="122" height="24" rx="6" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <text x="353" y="359" fill="var(--svg-node-amber-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">reqLeft (+18px)</text>

  <!-- Candidate B: Top Beside H1 (Purple Dashed Square) -->
  <g id="candidate-top" transform="translate(322, 100)">
    <rect x="0" y="0" width="96" height="78" rx="10" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="2.5" stroke-dasharray="5,3" />
    <text x="48" y="34" fill="var(--svg-node-purple-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Kandidat B</text>
    <text x="48" y="54" fill="var(--svg-node-purple-subtext)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Oben (H_h1)</text>
  </g>

  <!-- Candidate A: Right-Center (Green Solid Square) -->
  <g id="candidate-right-center" transform="translate(366, 134)">
    <rect x="0" y="0" width="192" height="192" rx="14" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="3" />
    <text x="96" y="52" fill="var(--svg-node-green-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Kandidat A</text>
    <text x="96" y="76" fill="var(--svg-node-green-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Rechts-Mittig (S_center)</text>
    <text x="96" y="106" fill="var(--svg-node-green-subtext)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">yTop = (H - S) / 2</text>
    <text x="96" y="128" fill="var(--svg-node-green-subtext)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">yBottom = (H + S) / 2</text>
    <rect x="20" y="144" width="152" height="30" rx="6" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
    <text x="96" y="164" fill="var(--svg-node-green-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">reqLeft + S &lt;= W</text>
  </g>

  <!-- Bottom Decision Rule Banner -->
  <g id="solver-decision-banner" transform="translate(24, 388)">
    <rect width="552" height="64" rx="12" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="276" y="27" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Entscheidungsregel &amp; 4px-Hysterese: S_center + 4 &gt;= S_top</text>
    <text x="276" y="49" fill="var(--svg-node-blue-subtext)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Falls max(S_center, S_top) &lt; H_h1 → Porträt kollisionsfrei ausblenden</text>
  </g>
</svg>

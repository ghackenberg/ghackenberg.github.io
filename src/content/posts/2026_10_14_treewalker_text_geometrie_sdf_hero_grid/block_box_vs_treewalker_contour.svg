<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="100%" height="auto" role="img" aria-label="Vergleich zwischen starrer CSS Block-Bounding-Box und zeilenexakter TreeWalker-Kontur">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-red-border)" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
  </defs>

  <!-- Main Canvas Frame -->
  <rect width="600" height="460" rx="16" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="2" />

  <!-- Top Header -->
  <text x="300" y="34" fill="var(--svg-text-primary)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BLOCK-BOX VS. TREEWALKER-ZEILENKONTUR</text>
  <line x1="24" y1="48" x2="576" y2="48" stroke="var(--svg-line)" stroke-width="2" />

  <!-- ========================================================= -->
  <!-- PANEL 1: CSS BLOCK-BOX (Element.getBoundingClientRect())   -->
  <!-- ========================================================= -->
  <g id="panel-block-box" transform="translate(24, 62)">
    <rect width="552" height="178" rx="12" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="2" />

    <!-- Panel Title -->
    <text x="18" y="28" fill="var(--svg-node-red-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="16" font-weight="700">1. CSS Block-Box: Element.getBoundingClientRect()</text>

    <!-- Full CSS max-w-2xl Block Container -->
    <rect x="18" y="42" width="516" height="120" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-red-border)" stroke-width="2.5" stroke-dasharray="6,4" />

    <!-- Wasted Right-Hand Space Highlight -->
    <path d="M 390 46 L 530 46 L 530 158 L 234 158 L 234 122 L 326 122 L 326 84 L 390 84 Z" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="2" />

    <!-- 3 Ragged Text Lines -->
    <rect x="28" y="50" width="352" height="28" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="40" y="69" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">Zeile 1: Hi, I am Dr. Georg Hackenberg</text>

    <rect x="28" y="86" width="288" height="28" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="40" y="105" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">Zeile 2: Professor @ FH OÖ Wels</text>

    <rect x="28" y="122" width="196" height="28" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="40" y="141" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">Zeile 3: AI &amp; Systems</text>

    <!-- Wasted Space Callout Label -->
    <text x="405" y="102" fill="var(--svg-node-red-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Toter Block-Raum</text>
    <text x="405" y="123" fill="var(--svg-node-red-subtext)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">180–340 px verschenkt</text>
    <text x="405" y="143" fill="var(--svg-node-red-subtext)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">(Blockiert Porträt &amp; Grid)</text>
  </g>

  <!-- ========================================================= -->
  <!-- PANEL 2: SUB-ELEMENT KONTUR (TreeWalker + Range Rects)     -->
  <!-- ========================================================= -->
  <g id="panel-treewalker-contour" transform="translate(24, 256)">
    <rect width="552" height="182" rx="12" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="2" />

    <!-- Panel Title -->
    <text x="18" y="28" fill="var(--svg-node-green-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="16" font-weight="700">2. Sub-Element Kontur: TreeWalker + Range.getClientRects()</text>

    <!-- Reclaimed 2D Space Highlight (Green) -->
    <path d="M 392 44 L 534 44 L 534 164 L 236 164 L 236 124 L 328 124 L 328 84 L 392 84 Z" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="2.5" />

    <!-- Stepped Contour Staircase Line -->
    <path d="M 384 44 L 384 82 L 320 82 L 320 120 L 228 120 L 228 164" fill="none" stroke="var(--svg-node-amber-border)" stroke-width="3" />

    <!-- 3 Measured Line Bands -->
    <rect x="28" y="48" width="352" height="28" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="40" y="67" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">Band 1: [top: 0, bottom: 28, right: 352]</text>

    <rect x="28" y="86" width="288" height="28" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="40" y="105" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">Band 2: [top: 38, bottom: 66, right: 288]</text>

    <rect x="28" y="124" width="196" height="28" rx="6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
    <text x="40" y="143" fill="var(--svg-node-blue-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600">Band 3: [right: 196]</text>

    <!-- Reclaimed Space Callout Label -->
    <text x="412" y="96" fill="var(--svg-node-green-text)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Freier 2D-Raum</text>
    <text x="412" y="118" fill="var(--svg-node-green-subtext)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Exakte Treppenkontur</text>
    <text x="412" y="138" fill="var(--svg-node-green-subtext)" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">bands[] für Porträt &amp; SDF</text>
  </g>
</svg>

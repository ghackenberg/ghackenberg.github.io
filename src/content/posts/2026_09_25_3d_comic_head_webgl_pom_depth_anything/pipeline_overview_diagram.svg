<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipeline-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow-pipe" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>

    <style>
      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="820" height="320" rx="14" fill="url(#pipeline-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Diagram Title -->
  <text x="32" y="38" fill="#f8fafc" font-size="16" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">End-to-End Asset- &amp; Rendering-Pipeline</text>
  <text x="32" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Von der 2D-Synthese über monokulare Tiefenschätzung zum interaktiven WebGL-Shader</text>

  <!-- 4 Pipeline Stages (Cards) -->
  <!-- Stage 1: Porträt & Comic -->
  <g transform="translate(32, 85)">
    <rect width="165" height="175" rx="10" fill="url(#card-blue-p)" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#3b82f6" fill-opacity="0.2" />
    <text x="28" y="33" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="50" y="33" fill="#f8fafc" font-size="13" font-weight="700">Synthese</text>

    <text x="16" y="65" fill="#93c5fd" font-size="11" font-weight="600">Google Gemini</text>
    <text x="16" y="80" fill="#60a5fa" font-size="10.5">Nano Banana</text>

    <line x1="16" y1="92" x2="149" y2="92" stroke="#334155" stroke-width="1" />
    <text x="16" y="112" fill="#cbd5e1" font-size="10.5">• Reales Foto</text>
    <text x="16" y="130" fill="#cbd5e1" font-size="10.5">• Disney/Pixar Stil</text>
    <text x="16" y="148" fill="#cbd5e1" font-size="10.5">• Brand-Palette</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="202" y1="172" x2="225" y2="172" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-pipe)" />

  <!-- Stage 2: Segmentierung & Expressions -->
  <g transform="translate(230, 85)">
    <rect width="165" height="175" rx="10" fill="url(#card-blue-p)" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="28" y="33" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="50" y="33" fill="#f8fafc" font-size="13" font-weight="700">Mimik &amp; Crop</text>

    <text x="16" y="65" fill="#c4b5fd" font-size="11" font-weight="600">Inpainting</text>
    <text x="16" y="80" fill="#a78bfa" font-size="10.5">Semantische Isolation</text>

    <line x1="16" y1="92" x2="149" y2="92" stroke="#334155" stroke-width="1" />
    <text x="16" y="112" fill="#cbd5e1" font-size="10.5">• Schwebender Kopf</text>
    <text x="16" y="130" fill="#cbd5e1" font-size="10.5">• 5 Mimik-Varianten</text>
    <text x="16" y="148" fill="#cbd5e1" font-size="10.5">• Feste Konturen</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="400" y1="172" x2="423" y2="172" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-pipe)" />

  <!-- Stage 3: Tiefenkarten -->
  <g transform="translate(428, 85)">
    <rect width="165" height="175" rx="10" fill="url(#card-blue-p)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.2" />
    <text x="28" y="33" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="50" y="33" fill="#f8fafc" font-size="13" font-weight="700">Depth Maps</text>

    <text x="16" y="65" fill="#6ee7b7" font-size="11" font-weight="600">Depth Anything V2</text>
    <text x="16" y="80" fill="#34d399" font-size="10.5">PyTorch / ViT</text>

    <line x1="16" y1="92" x2="149" y2="92" stroke="#334155" stroke-width="1" />
    <text x="16" y="112" fill="#cbd5e1" font-size="10.5">• 8-Bit Höhenfeld</text>
    <text x="16" y="130" fill="#cbd5e1" font-size="10.5">• Weicher Roll-off</text>
    <text x="16" y="148" fill="#cbd5e1" font-size="10.5">• Keine Klippen</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="598" y1="172" x2="621" y2="172" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-pipe)" />

  <!-- Stage 4: WebGL Shader & State Machine -->
  <g transform="translate(625, 85)">
    <rect width="165" height="175" rx="10" fill="url(#card-blue-p)" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#f59e0b" fill-opacity="0.2" />
    <text x="28" y="33" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="50" y="33" fill="#f8fafc" font-size="13" font-weight="700">WebGL POM</text>

    <text x="16" y="65" fill="#fde68a" font-size="11" font-weight="600">Raymarching &amp; FSM</text>
    <text x="16" y="80" fill="#f59e0b" font-size="10.5">3 KB Shader</text>

    <line x1="16" y1="92" x2="149" y2="92" stroke="#334155" stroke-width="1" />
    <text x="16" y="112" fill="#cbd5e1" font-size="10.5">• 40 Tiefenscheiben</text>
    <text x="16" y="130" fill="#cbd5e1" font-size="10.5">• 2-State Crossfade</text>
    <text x="16" y="148" fill="#cbd5e1" font-size="10.5">• 60 FPS &lt; 500 KB</text>
  </g>

  <!-- Bottom Note -->
  <text x="410" y="295" fill="#64748b" font-size="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">100% Client-Side WebGL Rendering ohne externe 3D-Laufzeitumgebung (kein Three.js / kein Blender-Export)</text>
</svg>

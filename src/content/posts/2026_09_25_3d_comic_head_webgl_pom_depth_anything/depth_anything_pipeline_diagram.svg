<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="100%">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <!-- Background Gradient -->
    <linearGradient id="da-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-card)"/>
      <stop offset="100%" stop-color="var(--svg-bg)"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="da-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-card-alt)"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arr-da" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)"/>
    </marker>

    <style>
      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="880" height="290" rx="14" fill="url(#da-bg)" stroke="var(--svg-line)" stroke-width="1.5"/>

  <!-- Diagram Title Header -->
  <text x="36" y="38" fill="var(--svg-text-primary)" font-size="16" font-weight="700">Depth Anything V2 Pipeline mit Alpha-Kantenbehandlung</text>
  <text x="36" y="58" fill="var(--svg-text-secondary)" font-size="12">Vom 2D-RGB-Bild zum 8-Bit-Höhenfeld ohne Klippen-Artefakte an den Konturen</text>

  <!-- 5 Pipeline Stage Cards -->

  <!-- STAGE 1: RGB Input -->
  <g transform="translate(36, 82)">
    <rect width="140" height="155" rx="10" fill="url(#da-card)" stroke="var(--svg-node-blue-border)" stroke-width="1.2"/>
    <circle cx="24" cy="24" r="12" fill="var(--svg-node-blue-border)" fill-opacity="0.2"/>
    <text x="24" y="28" fill="var(--svg-node-blue-border)" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="44" y="28" fill="var(--svg-text-primary)" font-size="12" font-weight="700">RGB-Bild</text>

    <text x="14" y="56" fill="var(--svg-node-blue-subtext)" font-size="10" font-weight="600">1024 × 1024 px</text>
    <text x="14" y="70" fill="var(--svg-node-blue-border)" font-size="9.5">RGBA (Comic)</text>

    <line x1="14" y1="80" x2="126" y2="80" stroke="var(--svg-line)" stroke-width="1"/>
    <text x="14" y="98" fill="var(--svg-text-secondary)" font-size="9.5">• 3-Kanal Farbe</text>
    <text x="14" y="114" fill="var(--svg-text-secondary)" font-size="9.5">• Freigestellter Kopf</text>
    <text x="14" y="130" fill="var(--svg-text-secondary)" font-size="9.5">• Transparenz (Alpha)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="176" y1="160" x2="200" y2="160" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-da)"/>

  <!-- STAGE 2: Depth Anything ViT -->
  <g transform="translate(203, 82)">
    <rect width="140" height="155" rx="10" fill="url(#da-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.2"/>
    <circle cx="24" cy="24" r="12" fill="var(--svg-node-purple-border)" fill-opacity="0.2"/>
    <text x="24" y="28" fill="var(--svg-node-purple-border)" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="44" y="28" fill="var(--svg-text-primary)" font-size="12" font-weight="700">ViT-Inferenz</text>

    <text x="14" y="56" fill="var(--svg-node-purple-subtext)" font-size="10" font-weight="600">Depth Anything V2</text>
    <text x="14" y="70" fill="var(--svg-node-purple-border)" font-size="9.5">DINOv2-Backbone</text>

    <line x1="14" y1="80" x2="126" y2="80" stroke="var(--svg-line)" stroke-width="1"/>
    <text x="14" y="98" fill="var(--svg-text-secondary)" font-size="9.5">• Monokulare Tiefe</text>
    <text x="14" y="114" fill="var(--svg-text-secondary)" font-size="9.5">• Null-Schuss-Transfer</text>
    <text x="14" y="130" fill="var(--svg-text-secondary)" font-size="9.5">• Scharfe Konturen</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="343" y1="160" x2="367" y2="160" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-da)"/>

  <!-- STAGE 3: Raw Depth Matrix -->
  <g transform="translate(370, 82)">
    <rect width="140" height="155" rx="10" fill="url(#da-card)" stroke="var(--svg-node-amber-border)" stroke-width="1.2"/>
    <circle cx="24" cy="24" r="12" fill="var(--svg-node-amber-border)" fill-opacity="0.2"/>
    <text x="24" y="28" fill="var(--svg-node-amber-border)" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="44" y="28" fill="var(--svg-text-primary)" font-size="12" font-weight="700">Rohtiefe</text>

    <text x="14" y="56" fill="var(--svg-node-amber-subtext)" font-size="10" font-weight="600">16-Bit Matrix</text>
    <text x="14" y="70" fill="var(--svg-node-amber-border)" font-size="9.5">Float Tensor</text>

    <line x1="14" y1="80" x2="126" y2="80" stroke="var(--svg-line)" stroke-width="1"/>
    <text x="14" y="98" fill="var(--svg-text-secondary)" font-size="9.5">• Metrische Distanzen</text>
    <text x="14" y="114" fill="var(--svg-text-secondary)" font-size="9.5">• Beliebige Skala</text>
    <text x="14" y="130" fill="var(--svg-text-secondary)" font-size="9.5">• Kontinuierlich</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="510" y1="160" x2="534" y2="160" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-da)"/>

  <!-- STAGE 4: Normalization -->
  <g transform="translate(537, 82)">
    <rect width="140" height="155" rx="10" fill="url(#da-card)" stroke="var(--svg-node-green-border)" stroke-width="1.2"/>
    <circle cx="24" cy="24" r="12" fill="var(--svg-node-green-border)" fill-opacity="0.2"/>
    <text x="24" y="28" fill="var(--svg-node-green-border)" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="44" y="28" fill="var(--svg-text-primary)" font-size="12" font-weight="700">Normierung</text>

    <text x="14" y="56" fill="var(--svg-node-green-subtext)" font-size="10" font-weight="600">Min-Max 0..255</text>
    <text x="14" y="70" fill="var(--svg-node-green-border)" font-size="9.5">8-Bit Quantisierung</text>

    <line x1="14" y1="80" x2="126" y2="80" stroke="var(--svg-line)" stroke-width="1"/>
    <text x="14" y="98" fill="var(--svg-text-secondary)" font-size="9.5">• Dynamikbereich voll</text>
    <text x="14" y="114" fill="var(--svg-text-secondary)" font-size="9.5">• Weiß = Vorderseite</text>
    <text x="14" y="130" fill="var(--svg-text-secondary)" font-size="9.5">• Schwarz = Hinten</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="677" y1="160" x2="701" y2="160" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-da)"/>

  <!-- STAGE 5: Edge Roll-off & Output -->
  <g transform="translate(704, 82)">
    <rect width="140" height="155" rx="10" fill="url(#da-card)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="var(--svg-node-green-border)" fill-opacity="0.2"/>
    <text x="24" y="28" fill="var(--svg-node-green-border)" font-size="11" font-weight="700" text-anchor="middle">5</text>
    <text x="44" y="28" fill="var(--svg-text-primary)" font-size="12" font-weight="700">Alpha-Roll-off</text>

    <text x="14" y="56" fill="var(--svg-node-blue-subtext)" font-size="10" font-weight="600">Shader-Optimiert</text>
    <text x="14" y="70" fill="var(--svg-node-green-border)" font-size="9.5">PNG Tiefenkarte</text>

    <line x1="14" y1="80" x2="126" y2="80" stroke="var(--svg-line)" stroke-width="1"/>
    <text x="14" y="98" fill="var(--svg-text-secondary)" font-size="9.5">• Weicher Randabfall</text>
    <text x="14" y="114" fill="var(--svg-text-secondary)" font-size="9.5">• 0% Klippen-Artefakt</text>
    <text x="14" y="130" fill="var(--svg-node-green-border)" font-size="9.5" font-weight="600">✓ POM-Ready</text>
  </g>

  <!-- Bottom Footer Note -->
  <text x="440" y="265" fill="var(--svg-text-secondary)" font-size="11" text-anchor="middle">Der exponentielle Alpha-Roll-off zieht Randpixel sanft auf z = 0.0 und verhindert senkrechte Abrisskanten im Fragment-Shader.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="auto" role="img" aria-label="Four Agent Bridging Topologies Connecting Native Browser Agents, In-Page Scripts, CDP Coding Harnesses, and Local Stdio-WebSocket Relays to In-Page W3C WebMCP document.modelContext">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-purple-border)" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-amber-border)" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
  </defs>

  <!-- Outer Canvas Frame -->
  <rect id="canvas-bg" width="880" height="420" rx="14" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="1.5" />

  <!-- Top Header Banner -->
  <g id="header-bar">
    <text x="440" y="25" fill="var(--svg-text-primary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" text-anchor="middle">W3C WEBMCP AGENT BRIDGING &amp; TRANSPORT TOPOLOGIES</text>
    <text x="440" y="42" fill="var(--svg-text-secondary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" text-anchor="middle">Bridging desktop stdio/JSON-RPC 2.0 agent harnesses and native browser assistants into the renderer Document realm</text>
    <line x1="24" y1="52" x2="856" y2="52" stroke="var(--svg-line)" stroke-width="1" />
  </g>

  <!-- LEFT PANE: 4 Agent Bridging Topologies (A, B, C, D) -->
  <g id="topologies-pane" transform="translate(24, 62)">
    <rect width="468" height="338" rx="10" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.5" />
    <rect x="14" y="10" width="440" height="20" rx="4" fill="var(--svg-pill-bg)" />
    <text x="234" y="24" fill="var(--svg-text-primary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" text-anchor="middle">1. FOUR AGENT HARNESS &amp; TRANSPORT BRIDGES</text>

    <!-- Topology A: Native Browser Agents -->
    <g id="topology-a" transform="translate(14, 38)">
      <rect width="440" height="66" rx="8" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
      <rect x="10" y="8" width="110" height="15" rx="3" fill="var(--svg-pill-bg)" />
      <text x="65" y="19" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">TOPOLOGY A • NATIVE IPC</text>
      <text x="128" y="20" fill="var(--svg-node-blue-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Native Browser Agents (Gemini, Edge Copilot)</text>
      <text x="12" y="40" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10">Privileged Browser Process IPC → Traversable Navigable</text>
      <text x="12" y="55" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5">Tracks async lifecycle via spec &quot;pending tool executions map&quot;</text>
    </g>

    <!-- Topology B: In-Page & Cross-Frame JS Agents -->
    <g id="topology-b" transform="translate(14, 112)">
      <rect width="440" height="66" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.5" />
      <rect x="10" y="8" width="110" height="15" rx="3" fill="var(--svg-pill-bg)" />
      <text x="65" y="19" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">TOPOLOGY B • IN-PAGE API</text>
      <text x="128" y="20" fill="var(--svg-node-purple-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">In-Page &amp; Cross-Frame JS Agents (WebLLM)</text>
      <text x="12" y="40" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10">Consumer API: document.modelContext.getTools() &amp; executeTool()</text>
      <text x="12" y="55" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5">Governed by exposedTo origins &amp; HTTP Permissions-Policy: tools</text>
    </g>

    <!-- Topology C: CLI / IDE Coding Agents via CDP -->
    <g id="topology-c" transform="translate(14, 186)">
      <rect width="440" height="68" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
      <rect x="10" y="8" width="110" height="15" rx="3" fill="var(--svg-pill-bg)" />
      <text x="65" y="19" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">TOPOLOGY C • CDP BRIDGE</text>
      <text x="128" y="20" fill="var(--svg-node-green-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">CLI &amp; IDE Agents (Antigravity, Claude Code)</text>
      <text x="12" y="40" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10">stdio JSON-RPC → chrome-devtools-mcp (WebMCP bridge)</text>
      <text x="12" y="56" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5">Exposes list_webmcp_tools &amp; execute_webmcp_tool over CDP</text>
    </g>

    <!-- Topology D: Stdio-to-WebSocket Local Relay -->
    <g id="topology-d" transform="translate(14, 262)">
      <rect width="440" height="66" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
      <rect x="10" y="8" width="110" height="15" rx="3" fill="var(--svg-pill-bg)" />
      <text x="65" y="19" fill="var(--svg-node-amber-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">TOPOLOGY D • WS RELAY</text>
      <text x="128" y="20" fill="var(--svg-node-amber-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Stdio-to-WebSocket Relay (MCP-B Ecosystem)</text>
      <text x="12" y="40" fill="var(--svg-node-amber-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10">npx @mcp-b/webmcp-local-relay ↔ ws://127.0.0.1:9333</text>
      <text x="12" y="55" fill="var(--svg-node-amber-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5">Bridges desktop MCP clients to in-page @mcp-b/global polyfill</text>
    </g>
  </g>

  <!-- RIGHT PANE: Browser Renderer Process (Document / Window Realm) -->
  <g id="renderer-pane" transform="translate(524, 62)">
    <rect width="332" height="338" rx="10" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" stroke-dasharray="6,4" />
    <rect x="14" y="10" width="304" height="20" rx="4" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1" />
    <text x="166" y="24" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" text-anchor="middle">2. BROWSER RENDERER (DOCUMENT REALM)</text>

    <!-- Central Hub: document.modelContext -->
    <g id="model-context-hub" transform="translate(16, 42)">
      <rect width="300" height="94" rx="8" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.8" />
      <rect x="12" y="8" width="168" height="16" rx="3" fill="var(--svg-pill-bg)" />
      <text x="96" y="19" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">W3C WEBMCP REGISTRY INTERFACE</text>
      <text x="150" y="42" fill="var(--svg-node-blue-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">document.modelContext</text>
      <text x="150" y="60" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">• JSON Schema 2020-12 inputSchema validation</text>
      <text x="150" y="75" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">• ToolAnnotations &amp; AbortSignal cleanup</text>
      <text x="150" y="88" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">• Realm-agnostic DOMException error mapping</text>
    </g>

    <!-- Dual Implementation Paths -->
    <path id="hub-to-imp" d="M 96 136 L 96 164" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.5" marker-end="url(#arr-blue)" />
    <path id="hub-to-decl" d="M 236 136 L 236 164" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="1.5" marker-end="url(#arr-purple)" />

    <!-- Imperative JS Tool Box -->
    <g id="imperative-api-box" transform="translate(16, 166)">
      <rect width="144" height="86" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1.2" />
      <text x="72" y="20" fill="var(--svg-node-blue-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Imperative API</text>
      <text x="72" y="38" fill="var(--svg-text-secondary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">registerTool(tool, { signal })</text>
      <text x="72" y="54" fill="var(--svg-text-muted)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">execute(input, { signal })</text>
      <text x="72" y="70" fill="var(--svg-text-muted)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">ontoolchange / ontoolcancel</text>
    </g>

    <!-- Declarative Form Tool Box -->
    <g id="declarative-api-box" transform="translate(172, 166)">
      <rect width="144" height="86" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.2" />
      <text x="72" y="20" fill="var(--svg-node-purple-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Declarative HTML</text>
      <text x="72" y="38" fill="var(--svg-text-secondary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">&lt;form toolname=&quot;...&quot;&gt;</text>
      <text x="72" y="54" fill="var(--svg-text-muted)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">e.agentInvoked === true</text>
      <text x="72" y="70" fill="var(--svg-text-muted)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">e.respondWith(Promise)</text>
    </g>

    <!-- Converging Arrows to Live Session State -->
    <path id="imp-to-state" d="M 88 252 L 128 274" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.5" marker-end="url(#arr-green)" />
    <path id="decl-to-state" d="M 244 252 L 204 274" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.5" marker-end="url(#arr-green)" />

    <!-- Bottom Shared State & Auth Box -->
    <g id="shared-session-box" transform="translate(16, 276)">
      <rect width="300" height="52" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
      <text x="150" y="21" fill="var(--svg-node-green-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Authenticated Live Tab State &amp; Human UI</text>
      <text x="150" y="39" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">HttpOnly SSO Cookies • React/WebGL State • Live DOM</text>
    </g>
  </g>

  <!-- Cross-Pane Connectors from Topologies A, B, C, D to document.modelContext -->
  <path id="conn-a" d="M 478 133 L 506 133 L 506 128 L 538 128" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-blue)" />
  <path id="conn-b" d="M 478 207 L 510 207 L 510 144 L 538 144" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="2" marker-end="url(#arr-purple)" />
  <path id="conn-c" d="M 478 282 L 516 282 L 516 160 L 538 160" fill="none" stroke="var(--svg-node-green-border)" stroke-width="2" marker-end="url(#arr-green)" />
  <path id="conn-d" d="M 478 357 L 522 357 L 522 176 L 538 176" fill="none" stroke="var(--svg-node-amber-border)" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-amber)" />
</svg>

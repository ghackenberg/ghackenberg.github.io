<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-lb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="card-pod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c233c" />
      <stop offset="100%" stop-color="#061220" />
    </linearGradient>

    <linearGradient id="card-redis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="card-pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261b0c" />
      <stop offset="100%" stop-color="#150f06" />
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <marker id="arr-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect x="10" y="10" width="880" height="460" rx="16" fill="#070b16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Header Section -->
  <text x="35" y="46" fill="url(#grad-header)" font-size="20" font-weight="800" letter-spacing="0.5">HORIZONTALE SKALIERUNG &amp; TOPOLOGIE</text>
  <text x="35" y="68" fill="#94a3b8" font-size="12">Stateless FastAPI ASGI Worker Pods hinter Reverse-Proxy mit geteilter Redis- &amp; PostgreSQL-Infrastruktur</text>
  <rect x="650" y="32" width="220" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
  <text x="760" y="49" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">Zero-Downtime Cluster Topologie</text>

  <!-- TIER 1: LOAD BALANCER (TOP) -->
  <g filter="url(#shadow)">
    <rect x="310" y="95" width="280" height="60" rx="10" fill="url(#card-lb)" stroke="#4338ca" stroke-width="1.5" />
    <rect x="310" y="95" width="280" height="22" rx="10" fill="#1e1b4b" />
    <text x="450" y="111" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">INGRESS REVERSE PROXY / LOAD BALANCER</text>
    <text x="450" y="137" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Traefik / NGINX / Envoy Gateway</text>
    <text x="450" y="149" fill="#94a3b8" font-size="10" text-anchor="middle">SSL-Termination · Round-Robin · Health Probes</text>
  </g>

  <!-- Flow Lines LB to Pods -->
  <path d="M 370 155 L 200 205" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr-indigo)" />
  <path d="M 450 155 L 450 205" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr-indigo)" />
  <path d="M 530 155 L 700 205" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr-indigo)" />

  <!-- TIER 2: STATELESS LITELLM WORKER PODS (MIDDLE) -->
  <!-- Pod 1 -->
  <g filter="url(#shadow)">
    <rect x="80" y="210" width="230" height="90" rx="10" fill="url(#card-pod)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="80" y="210" width="230" height="24" rx="10" fill="#0c4a6e" />
    <text x="195" y="227" fill="#e0f2fe" font-size="11" font-weight="700" text-anchor="middle">LITELLM PROXY POD 1</text>
    <text x="195" y="252" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">FastAPI ASGI Server</text>
    <text x="195" y="270" fill="#7dd3fc" font-size="10" text-anchor="middle">Stateless Python Event Loop</text>
    <text x="195" y="286" fill="#94a3b8" font-size="9.5" text-anchor="middle">In-Process Router &amp; Adapters</text>
  </g>

  <!-- Pod 2 -->
  <g filter="url(#shadow)">
    <rect x="335" y="210" width="230" height="90" rx="10" fill="url(#card-pod)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="335" y="210" width="230" height="24" rx="10" fill="#0c4a6e" />
    <text x="450" y="227" fill="#e0f2fe" font-size="11" font-weight="700" text-anchor="middle">LITELLM PROXY POD 2</text>
    <text x="450" y="252" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">FastAPI ASGI Server</text>
    <text x="450" y="270" fill="#7dd3fc" font-size="10" text-anchor="middle">Stateless Python Event Loop</text>
    <text x="450" y="286" fill="#94a3b8" font-size="9.5" text-anchor="middle">In-Process Router &amp; Adapters</text>
  </g>

  <!-- Pod N -->
  <g filter="url(#shadow)">
    <rect x="590" y="210" width="230" height="90" rx="10" fill="url(#card-pod)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="590" y="210" width="230" height="24" rx="10" fill="#0c4a6e" />
    <text x="705" y="227" fill="#e0f2fe" font-size="11" font-weight="700" text-anchor="middle">LITELLM PROXY POD N</text>
    <text x="705" y="252" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">FastAPI ASGI Server</text>
    <text x="705" y="270" fill="#7dd3fc" font-size="10" text-anchor="middle">Horizontal Pod Autoscaler (HPA)</text>
    <text x="705" y="286" fill="#94a3b8" font-size="9.5" text-anchor="middle">In-Process Router &amp; Adapters</text>
  </g>

  <!-- Connecting Bus to Persistence Tier -->
  <path d="M 195 300 L 195 330 L 260 350" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M 450 300 L 450 345" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M 705 300 L 705 330 L 640 350" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- TIER 3: SHARED PERSISTENCE & DISTRIBUTED STATE (BOTTOM) -->
  <!-- Redis Cluster -->
  <g filter="url(#shadow)">
    <rect x="80" y="345" width="350" height="95" rx="10" fill="url(#card-redis)" stroke="#059669" stroke-width="1.5" />
    <rect x="80" y="345" width="350" height="24" rx="10" fill="#064e3b" />
    <text x="95" y="362" fill="#a7f3d0" font-size="11" font-weight="700">DISTRIBUTED STATE BUS · REDIS CLUSTER</text>
    <text x="95" y="386" fill="#ecfdf5" font-size="11.5" font-weight="600">Globales Rate Limiting &amp; In-Memory Cache</text>
    <text x="95" y="403" fill="#cbd5e1" font-size="10.5">• RPM/TPM Sliding Window über alle Pods hinweg</text>
    <text x="95" y="419" fill="#94a3b8" font-size="10">• Virtual Key Auth Cache (`enable_redis_auth_cache: true`)</text>
    <text x="95" y="433" fill="#34d399" font-size="9.5">Latenz &lt; 0.5 ms · Keine Race Conditions</text>
  </g>

  <!-- PostgreSQL Database -->
  <g filter="url(#shadow)">
    <rect x="470" y="345" width="350" height="95" rx="10" fill="url(#card-pg)" stroke="#d97706" stroke-width="1.5" />
    <rect x="470" y="345" width="350" height="24" rx="10" fill="#451a03" />
    <text x="485" y="362" fill="#fde68a" font-size="11" font-weight="700">TRANSACTIONAL STORAGE · POSTGRESQL 16+</text>
    <text x="485" y="386" fill="#fffbeb" font-size="11.5" font-weight="600">Prisma ORM &amp; Asynchrones Batch-Logging</text>
    <text x="485" y="403" fill="#cbd5e1" font-size="10.5">• Mandanten-, Team- und Key-Verwaltung</text>
    <text x="485" y="419" fill="#94a3b8" font-size="10">• Entkoppeltes Spend-Logging (`LiteLLM_SpendLogs`)</text>
    <text x="485" y="433" fill="#f59e0b" font-size="9.5">Write-Entlastet durch Batching · Read-Replicas möglich</text>
  </g>

  <!-- Footer Info Line -->
  <text x="35" y="458" fill="#64748b" font-size="10">LiteLLM Cloud-Native Deployment Topologie · Lineare Skalierbarkeit für 10.000+ parallele Anfragen pro Sekunde</text>
</svg>

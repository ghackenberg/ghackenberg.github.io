<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-hier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="card-iam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="card-budget" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261b0c" />
      <stop offset="100%" stop-color="#150f06" />
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <marker id="arr-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect x="10" y="10" width="980" height="660" rx="16" fill="#070b16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Header Section -->
  <text x="40" y="50" fill="url(#grad-header)" font-size="22" font-weight="800" letter-spacing="0.5">ENTERPRISE GOVERNANCE &amp; MULTI-TENANCY MATRIX</text>
  <text x="40" y="74" fill="#94a3b8" font-size="13">Hierarchisches Key-Management, Keycloak OIDC Federation, Budget-Enforcement &amp; Spend-Accounting</text>
  <rect x="710" y="34" width="250" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
  <text x="835" y="53" fill="#c7d2fe" font-size="11.5" font-weight="600" text-anchor="middle">Compliance &amp; Cost Control</text>

  <!-- LEFT: HIERARCHICAL KEY MANAGEMENT (Width: 460) -->
  <g filter="url(#shadow)">
    <rect x="40" y="105" width="455" height="425" rx="12" fill="url(#card-hier)" stroke="#4338ca" stroke-width="1.5" />
    <rect x="40" y="105" width="455" height="28" rx="12" fill="#1e1b4b" />
    <text x="55" y="124" fill="#a5b4fc" font-size="11.5" font-weight="700" letter-spacing="0.5">1. HIERARCHISCHE MULTI-TENANT STRUKTUR</text>

    <!-- Node 1: Root Organization -->
    <rect x="60" y="145" width="415" height="65" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <rect x="75" y="157" width="10" height="10" rx="2" fill="#6366f1" />
    <text x="95" y="167" fill="#f8fafc" font-size="12" font-weight="700">Enterprise Root Organization (z. B. FH Oberösterreich)</text>
    <text x="75" y="187" fill="#94a3b8" font-size="10.5">Globales Monatsbudget: $10,000 · Master-Audit-Log · Zentrale Compliance-Richtlinien</text>
    <text x="75" y="201" fill="#38bdf8" font-size="9.5">Table: LiteLLM_OrganizationTable (Prisma ORM)</text>

    <!-- Branch Lines -->
    <line x1="267" y1="210" x2="267" y2="235" stroke="#6366f1" stroke-width="2" />
    <line x1="160" y1="235" x2="375" y2="235" stroke="#6366f1" stroke-width="2" />
    <line x1="160" y1="235" x2="160" y2="250" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-purple)" />
    <line x1="375" y1="235" x2="375" y2="250" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-purple)" />

    <!-- Node 2A: Team 1 (Forschung & AI Labs) -->
    <rect x="60" y="250" width="200" height="75" rx="8" fill="#0b1329" stroke="#818cf8" stroke-width="1" />
    <text x="70" y="270" fill="#e0e7ff" font-size="11" font-weight="700">Team: AI Research Lab</text>
    <text x="70" y="288" fill="#cbd5e1" font-size="10">Budget: $2,500 / Monat</text>
    <text x="70" y="303" fill="#a5b4fc" font-size="9.5">Models: vLLM-70B, Claude-3.5</text>
    <text x="70" y="317" fill="#34d399" font-size="9">TPM: 200k · RPM: 1,000</text>

    <!-- Node 2B: Team 2 (Lehre & Campus Wels) -->
    <rect x="275" y="250" width="200" height="75" rx="8" fill="#0b1329" stroke="#818cf8" stroke-width="1" />
    <text x="285" y="270" fill="#e0e7ff" font-size="11" font-weight="700">Team: Lehre &amp; Studierende</text>
    <text x="285" y="288" fill="#cbd5e1" font-size="10">Budget: $1,000 / Semester</text>
    <text x="285" y="303" fill="#a5b4fc" font-size="9.5">Models: Local-vLLM (Whitelisted)</text>
    <text x="285" y="317" fill="#38bdf8" font-size="9">TPM: 50k · RPM: 200</text>

    <!-- Connecting down to Virtual Keys -->
    <path d="M 160 325 L 160 355" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-purple)" />
    <path d="M 375 325 L 375 355" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-purple)" />

    <!-- Node 3: Virtual Keys & End-Users -->
    <rect x="60" y="355" width="415" height="155" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-width="1" />
    <text x="75" y="375" fill="#38bdf8" font-size="11.5" font-weight="700">Virtuelle API-Keys (sk-litellm-...) &amp; End-Users</text>

    <rect x="75" y="390" width="385" height="35" rx="6" fill="#031524" stroke="#0369a1" stroke-width="1" />
    <text x="85" y="408" fill="#f8fafc" font-size="10.5" font-family="monospace">Key 1: sk-hermes-agent-prod</text>
    <text x="310" y="408" fill="#34d399" font-size="10">Limit: $500/Mo · No PII</text>
    <text x="85" y="420" fill="#94a3b8" font-size="9">Zugeordnet: Hermes Agent Autonomous Worker (Schicht 2)</text>

    <rect x="75" y="432" width="385" height="35" rx="6" fill="#031524" stroke="#0369a1" stroke-width="1" />
    <text x="85" y="450" fill="#f8fafc" font-size="10.5" font-family="monospace">Key 2: sk-openwebui-faculty</text>
    <text x="310" y="450" fill="#38bdf8" font-size="10">Limit: $1,000/Mo · SSO User</text>
    <text x="85" y="462" fill="#94a3b8" font-size="9">Zugeordnet: Open WebUI Workspace Connector (Schicht 6)</text>

    <rect x="75" y="474" width="385" height="28" rx="6" fill="#031524" stroke="#0369a1" stroke-width="1" />
    <text x="85" y="492" fill="#cbd5e1" font-size="10">Redis Virtual Key Cache: </text>
    <text x="215" y="492" fill="#34d399" font-size="10" font-weight="600">O(1) Hash-Lookup &lt; 0.2 ms Latenz</text>
  </g>

  <!-- RIGHT: IAM FEDERATION & BUDGET ENFORCEMENT (Width: 460) -->
  <g filter="url(#shadow)">
    <rect x="515" y="105" width="445" height="425" rx="12" fill="url(#card-iam)" stroke="#059669" stroke-width="1.5" />
    <rect x="515" y="105" width="445" height="28" rx="12" fill="#064e3b" />
    <text x="530" y="124" fill="#a7f3d0" font-size="11.5" font-weight="700" letter-spacing="0.5">2. KEYCLOAK OIDC SSO &amp; BUDGET CONTROL</text>

    <!-- IAM Sub-Card 1: Keycloak Integration -->
    <rect x="535" y="145" width="405" height="110" rx="8" fill="#022c22" stroke="#047857" stroke-width="1" />
    <text x="550" y="167" fill="#6ee7b7" font-size="12" font-weight="700">Enterprise Identity Federation (Keycloak)</text>
    <text x="550" y="187" fill="#ecfdf5" font-size="10.5">• OpenID Connect (OIDC) &amp; SAML 2.0 Integration</text>
    <text x="550" y="204" fill="#ecfdf5" font-size="10.5">• JWT Token Inspection an Proxy-Endpunkten</text>
    <text x="550" y="221" fill="#cbd5e1" font-size="10">• Rollen-Mapping: Keycloak Realm Role -&gt; LiteLLM RBAC</text>
    <text x="550" y="238" fill="#34d399" font-size="10" font-weight="600">Roles: proxy_admin · internal_user · team_lead</text>

    <!-- IAM Sub-Card 2: Budget & Rate Enforcement -->
    <rect x="535" y="265" width="405" height="120" rx="8" fill="#022c22" stroke="#047857" stroke-width="1" />
    <text x="550" y="287" fill="#fcd34d" font-size="12" font-weight="700">Granulare Budget- &amp; Quota-Logik</text>
    <text x="550" y="307" fill="#ecfdf5" font-size="10.5">• Sliding Window Counter in Redis (RPM / TPM)</text>
    <text x="550" y="324" fill="#ecfdf5" font-size="10.5">• Soft Alert: Webhook / Slack-Warnung bei 80 % Budget</text>
    <text x="550" y="341" fill="#fca5a5" font-size="10.5">• Hard Stop: Automatischer HTTP 429 bei 100 % Budget</text>
    <text x="550" y="358" fill="#cbd5e1" font-size="10">• Automatische Kontingent-Rücksetzung (Daily / Monthly)</text>

    <!-- IAM Sub-Card 3: Asynchronous Spend Logging -->
    <rect x="535" y="395" width="405" height="115" rx="8" fill="#022c22" stroke="#047857" stroke-width="1" />
    <text x="550" y="417" fill="#38bdf8" font-size="12" font-weight="700">Asynchrones PostgreSQL Spend-Logging</text>
    <text x="550" y="437" fill="#ecfdf5" font-size="10.5">• In-Memory Aggregation von Token-Events</text>
    <text x="550" y="454" fill="#ecfdf5" font-size="10.5">• Batch-Write alle N Sekunden via Prisma ORM</text>
    <text x="550" y="471" fill="#cbd5e1" font-size="10">• Keine Schreibblockaden im Inferenz-Pfad!</text>
    <text x="550" y="488" fill="#38bdf8" font-size="9.5">Entlastung des Primärdatenbank-Knotens</text>
  </g>

  <!-- BOTTOM OBSERVABILITY & TELEMETRY STRIP (FULL WIDTH) -->
  <g filter="url(#shadow)">
    <rect x="40" y="545" width="920" height="95" rx="12" fill="#091424" stroke="#0284c7" stroke-width="1.5" />
    <rect x="40" y="545" width="920" height="26" rx="12" fill="#0c2d48" />
    <text x="60" y="563" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1">OBSERVABILITY-ÖKOSYSTEM · OPENTELEMETRY V2 &amp; PROMETHEUS METRICS</text>

    <rect x="60" y="580" width="270" height="48" rx="6" fill="#031524" stroke="#0369a1" stroke-width="1" />
    <text x="75" y="598" fill="#f8fafc" font-size="11" font-weight="600">OpenTelemetry v2 Traces</text>
    <text x="75" y="615" fill="#94a3b8" font-size="9.5">LITELLM_OTEL_V2=true -&gt; SigNoz / Jaeger</text>

    <rect x="350" y="580" width="270" height="48" rx="6" fill="#031524" stroke="#0369a1" stroke-width="1" />
    <text x="365" y="598" fill="#f8fafc" font-size="11" font-weight="600">Prometheus Metrics (/metrics)</text>
    <text x="365" y="615" fill="#94a3b8" font-size="9.5">litellm_requests_metric, latency_seconds</text>

    <rect x="640" y="580" width="300" height="48" rx="6" fill="#031524" stroke="#0369a1" stroke-width="1" />
    <text x="655" y="598" fill="#f8fafc" font-size="11" font-weight="600">Audit Trail &amp; Compliance</text>
    <text x="655" y="615" fill="#34d399" font-size="9.5">DSGVO &amp; EU AI Act konforme Protokollierung</text>
  </g>

  <!-- Status Bar Footer -->
  <text x="50" y="658" fill="#64748b" font-size="10">LiteLLM Enterprise Governance Architecture · Zero-Trust Multi-Tenancy · Datensouveräne Steuerung</text>
</svg>

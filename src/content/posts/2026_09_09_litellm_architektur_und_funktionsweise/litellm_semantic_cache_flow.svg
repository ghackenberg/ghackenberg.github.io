<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-step" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>

    <linearGradient id="card-hit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="card-miss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c0d02" />
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <marker id="arr-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect x="10" y="10" width="880" height="500" rx="16" fill="#070b16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Header Section -->
  <text x="35" y="46" fill="url(#grad-header)" font-size="20" font-weight="800" letter-spacing="0.5">SEMANTISCHES VEKTOR-CACHING ENTSCHEIDUNGS-FLUSS</text>
  <text x="35" y="68" fill="#94a3b8" font-size="12">Intelligenter Ähnlichkeitsabgleich via Qdrant/Redis: Sub-Millisekunden-Antworten ohne Inferenzkosten</text>
  <rect x="670" y="32" width="200" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="770" y="49" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">cos(e, v) ≥ τ Subsystem</text>

  <!-- STEP 1: Incoming Prompt -->
  <g filter="url(#shadow)">
    <rect x="290" y="95" width="320" height="55" rx="10" fill="url(#card-step)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="290" y="95" width="320" height="20" rx="10" fill="#0c4a6e" />
    <text x="450" y="110" fill="#e0f2fe" font-size="10.5" font-weight="700" text-anchor="middle">1. EINGEHENDER BENUTZER-PROMPT q</text>
    <text x="450" y="133" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">"Wie reise ich zur FH Wels an?"</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 450 150 L 450 175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-sky)" />

  <!-- STEP 2: Embedding Engine -->
  <g filter="url(#shadow)">
    <rect x="290" y="180" width="320" height="55" rx="10" fill="url(#card-step)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="290" y="180" width="320" height="20" rx="10" fill="#312e81" />
    <text x="450" y="195" fill="#e0e7ff" font-size="10.5" font-weight="700" text-anchor="middle">2. LOKALE EMBEDDING ENGINE</text>
    <text x="450" y="218" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">Vektorisierung: e = E(q) ∈ ℝᵈ (z. B. FastEmbed BGE)</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 450 235 L 450 260" stroke="#818cf8" stroke-width="2" marker-end="url(#arr-sky)" />

  <!-- STEP 3: Vector Index Lookup -->
  <g filter="url(#shadow)">
    <rect x="260" y="265" width="380" height="60" rx="10" fill="url(#card-step)" stroke="#c084fc" stroke-width="1.5" />
    <rect x="260" y="265" width="380" height="20" rx="10" fill="#581c87" />
    <text x="450" y="280" fill="#f3e8ff" font-size="10.5" font-weight="700" text-anchor="middle">3. VEKTOR-INDEX LOOKUP (Qdrant / Redis / Valkey)</text>
    <text x="450" y="303" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Next Neighbor Search: k* = argmax_k cos(e, v_k)</text>
    <text x="450" y="317" fill="#cbd5e1" font-size="10" text-anchor="middle">Berechnung der maximalen Cosinus-Ähnlichkeit zum Bestand</text>
  </g>

  <!-- Arrow 3 to Decision Diamond -->
  <path d="M 450 325 L 450 350" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-sky)" />

  <!-- Decision Junction Box -->
  <g filter="url(#shadow)">
    <polygon points="450,355 530,385 450,415 370,385" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="450" y="388" fill="#fef3c7" font-size="11" font-weight="800" text-anchor="middle">cos(e, v) ≥ τ ?</text>
  </g>

  <!-- Branch Left: YES / CACHE HIT -->
  <path d="M 370 385 L 230 385 L 230 415" stroke="#34d399" stroke-width="2" marker-end="url(#arr-emerald)" />
  <text x="290" y="377" fill="#34d399" font-size="11" font-weight="700">JA (Treffer ≥ 0.95)</text>

  <!-- Branch Right: NO / CACHE MISS -->
  <path d="M 530 385 L 670 385 L 670 415" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)" />
  <text x="610" y="377" fill="#f59e0b" font-size="11" font-weight="700">NEIN (&lt; 0.95)</text>

  <!-- RESULT CARD LEFT: CACHE HIT -->
  <g filter="url(#shadow)">
    <rect x="70" y="420" width="320" height="70" rx="10" fill="url(#card-hit)" stroke="#10b981" stroke-width="1.5" />
    <rect x="70" y="420" width="320" height="20" rx="10" fill="#064e3b" />
    <text x="230" y="435" fill="#a7f3d0" font-size="11" font-weight="800" text-anchor="middle">SEMANTIC CACHE HIT · SOFORTIGE ANTWORT</text>
    <text x="85" y="457" fill="#ecfdf5" font-size="11" font-weight="600">• Antwort direkt aus Vektordatenbank ausgeliefert</text>
    <text x="85" y="473" fill="#a7f3d0" font-size="10.5">• Latenz: &lt; 15 ms · Token-Kosten: 0 € · Keine Serverlast</text>
  </g>

  <!-- RESULT CARD RIGHT: CACHE MISS -->
  <g filter="url(#shadow)">
    <rect x="510" y="420" width="320" height="70" rx="10" fill="url(#card-miss)" stroke="#d97706" stroke-width="1.5" />
    <rect x="510" y="420" width="320" height="20" rx="10" fill="#451a03" />
    <text x="670" y="435" fill="#fde68a" font-size="11" font-weight="800" text-anchor="middle">CACHE MISS · INFERENZ VIA LITELLM ROUTER</text>
    <text x="525" y="457" fill="#fffbeb" font-size="11" font-weight="600">• Weiterleitung an vLLM GPU-Cluster / Cloud Provider</text>
    <text x="525" y="473" fill="#fcd34d" font-size="10.5">• Latenz: 800 ms+ · Asynchrones Nachladen in Vektor-DB</text>
  </g>
</svg>

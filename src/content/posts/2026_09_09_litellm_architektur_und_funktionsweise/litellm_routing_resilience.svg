<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="50%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-purple-border)"/>
    </linearGradient>

    <linearGradient id="card-lb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-purple-bg)"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>

    <linearGradient id="card-cb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-card-alt)"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>

    <linearGradient id="card-fb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261b0c"/>
      <stop offset="100%" stop-color="#150f06"/>
    </linearGradient>

    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <marker id="arr-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-blue-border)"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-red-border)"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-green-border)"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-amber-border)"/>
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect x="10" y="10" width="980" height="660" rx="16" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="2"/>

  <!-- Header Section -->
  <text x="40" y="50" fill="url(#grad-header)" font-size="22" font-weight="800" letter-spacing="0.5">DYNAMISCHES ROUTING &amp; RESILIENZ-ARCHITEKTUR</text>
  <text x="40" y="74" fill="var(--svg-text-secondary)" font-size="13">Load-Balancing-Algorithmen, Cooldown-Circuit-Breaker &amp; Mehrstufige Fallback-Kaskaden</text>
  <rect x="710" y="34" width="250" height="28" rx="14" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
  <text x="835" y="53" fill="var(--svg-node-purple-subtext)" font-size="11.5" font-weight="600" text-anchor="middle">Ausfallsichere Inferenz-Kontrolle</text>

  <!-- SECTION 1: 5 LOAD BALANCING STRATEGIES (LEFT COLUMN, width 320) -->
  <g filter="url(#shadow)">
    <rect x="40" y="105" width="310" height="425" rx="12" fill="url(#card-lb)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <rect x="40" y="105" width="310" height="28" rx="12" fill="var(--svg-node-purple-bg)"/>
    <text x="55" y="124" fill="var(--svg-node-purple-subtext)" font-size="11.5" font-weight="700" letter-spacing="0.5">1. ROUTING-STRATEGIEN (ROUTER)</text>

    <!-- Strategy 1: latency-based -->
    <rect x="55" y="145" width="280" height="65" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
    <text x="68" y="166" fill="var(--svg-node-blue-border)" font-size="11.5" font-weight="700">latency-based-routing</text>
    <text x="68" y="184" fill="var(--svg-text-secondary)" font-size="10.5">Gleitender EMA-Latenzwert (TTFT)</text>
    <text x="68" y="200" fill="var(--svg-text-secondary)" font-size="9.5">Bevorzugt Instanzen mit schnellster Rückmeldung</text>

    <!-- Strategy 2: usage-based -->
    <rect x="55" y="220" width="280" height="65" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
    <text x="68" y="241" fill="var(--svg-node-blue-border)" font-size="11.5" font-weight="700">usage-based-routing</text>
    <text x="68" y="259" fill="var(--svg-text-secondary)" font-size="10.5">Tracking von RPM/TPM in Redis</text>
    <text x="68" y="275" fill="var(--svg-text-secondary)" font-size="9.5">Verhindert Rate-Limit-Überschreitungen an Deployments</text>

    <!-- Strategy 3: least-busy -->
    <rect x="55" y="295" width="280" height="65" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
    <text x="68" y="316" fill="var(--svg-node-purple-border)" font-size="11.5" font-weight="700">least-busy</text>
    <text x="68" y="334" fill="var(--svg-text-secondary)" font-size="10.5">Aktive In-Flight-Verbindungen</text>
    <text x="68" y="350" fill="var(--svg-text-secondary)" font-size="9.5">Routet zu Pods mit minimaler Warteschlange</text>

    <!-- Strategy 4: cost-based -->
    <rect x="55" y="370" width="280" height="65" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
    <text x="68" y="391" fill="var(--svg-node-green-border)" font-size="11.5" font-weight="700">cost-based-routing</text>
    <text x="68" y="409" fill="var(--svg-text-secondary)" font-size="10.5">Dynamischer Preisabgleich ($/Token)</text>
    <text x="68" y="425" fill="var(--svg-text-secondary)" font-size="9.5">Routet automatisch zur günstigsten Option</text>

    <!-- Strategy 5: simple-shuffle -->
    <rect x="55" y="445" width="280" height="65" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1"/>
    <text x="68" y="466" fill="var(--svg-node-amber-border)" font-size="11.5" font-weight="700">simple-shuffle (Standard)</text>
    <text x="68" y="484" fill="var(--svg-text-secondary)" font-size="10.5">Statistisch uniforme Lastverteilung</text>
    <text x="68" y="500" fill="var(--svg-text-secondary)" font-size="9.5">Zufällige Verteilung über gesunde Deployments</text>
  </g>

  <!-- SECTION 2: CIRCUIT BREAKER & COOLDOWN STATE MACHINE (CENTER COLUMN, width 290) -->
  <g filter="url(#shadow)">
    <rect x="365" y="105" width="285" height="425" rx="12" fill="url(#card-cb)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <rect x="365" y="105" width="285" height="28" rx="12" fill="var(--svg-node-blue-bg)"/>
    <text x="380" y="124" fill="var(--svg-node-blue-subtext)" font-size="11.5" font-weight="700" letter-spacing="0.5">2. CIRCUIT BREAKER &amp; COOLDOWNS</text>

    <!-- State 1: Active / Healthy -->
    <rect x="380" y="150" width="255" height="75" rx="10" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <circle cx="400" cy="170" r="7" fill="var(--svg-node-green-border)"/>
    <text x="415" y="174" fill="var(--svg-node-green-subtext)" font-size="12" font-weight="700">ACTIVE / HEALTHY</text>
    <text x="400" y="194" fill="var(--svg-node-green-subtext)" font-size="10.5">Deployment empfängt Regellast</text>
    <text x="400" y="210" fill="var(--svg-node-green-subtext)" font-size="9.5">Erfolgsrate &gt; 99 % · Latenz im Normbereich</text>

    <!-- Transition Failure Arrow Down -->
    <path d="M 507 225 L 507 265" stroke="var(--svg-node-red-border)" stroke-width="2" marker-end="url(#arr-red)"/>
    <text x="515" y="250" fill="var(--svg-node-red-border)" font-size="10" font-weight="600">HTTP 429 / 5xx Error</text>

    <!-- State 2: Cooldown State -->
    <rect x="380" y="270" width="255" height="85" rx="10" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1.5"/>
    <circle cx="400" cy="292" r="7" fill="var(--svg-node-red-border)"/>
    <text x="415" y="296" fill="var(--svg-node-red-subtext)" font-size="12" font-weight="700">COOLDOWN (ISOLIERT)</text>
    <text x="400" y="316" fill="var(--svg-node-red-subtext)" font-size="10.5">Aus Routing-Pool entfernt</text>
    <text x="400" y="332" fill="var(--svg-node-red-subtext)" font-size="9.5">T_cooldown Timer läuft (z. B. 60s)</text>
    <text x="400" y="346" fill="var(--svg-text-secondary)" font-size="9.5">Automatisches Failover auf Fallback-Kette</text>

    <!-- Transition Timer Expired -->
    <path d="M 507 355 L 507 395" stroke="var(--svg-node-amber-border)" stroke-width="2" marker-end="url(#arr-amber)"/>
    <text x="515" y="380" fill="var(--svg-node-amber-border)" font-size="10" font-weight="600">Cooldown abgelaufen</text>

    <!-- State 3: Canary / Probe State -->
    <rect x="380" y="400" width="255" height="75" rx="10" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
    <circle cx="400" cy="420" r="7" fill="var(--svg-node-amber-border)"/>
    <text x="415" y="424" fill="var(--svg-node-amber-subtext)" font-size="12" font-weight="700">CANARY PROBE</text>
    <text x="400" y="444" fill="var(--svg-node-amber-subtext)" font-size="10.5">Test-Request zur Zustandsprüfung</text>
    <text x="400" y="460" fill="var(--svg-node-amber-subtext)" font-size="9.5">Bei Erfolg: Rückkehr zu ACTIVE / HEALTHY</text>

    <!-- Loop Back to Healthy -->
    <path d="M 380 440 Q 350 300 380 185" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-emerald)"/>
    <text x="325" y="315" fill="var(--svg-node-green-border)" font-size="9.5" font-weight="600" transform="rotate(-90 325 315)">Canary OK</text>
  </g>

  <!-- SECTION 3: HIERARCHICAL FALLBACK CASCADE (RIGHT COLUMN, width 285) -->
  <g filter="url(#shadow)">
    <rect x="665" y="105" width="295" height="425" rx="12" fill="url(#card-fb)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
    <rect x="665" y="105" width="295" height="28" rx="12" fill="var(--svg-node-amber-bg)"/>
    <text x="680" y="124" fill="var(--svg-node-amber-subtext)" font-size="11.5" font-weight="700" letter-spacing="0.5">3. KASKADIERENDE FALLBACK-KETTE</text>

    <!-- Tier 1: Primary On-Prem -->
    <rect x="680" y="145" width="265" height="72" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1"/>
    <text x="695" y="167" fill="var(--svg-node-green-border)" font-size="11.5" font-weight="700">Stufe 1: Primärer vLLM Cluster</text>
    <text x="695" y="185" fill="var(--svg-node-amber-subtext)" font-size="10.5">Llama-3.3-70B-Instruct (On-Premises)</text>
    <text x="695" y="202" fill="var(--svg-text-secondary)" font-size="9.5">Maximale Datensouveränität &amp; Null Grenzkosten</text>

    <!-- Failover Arrow 1 -->
    <path d="M 812 217 L 812 242" stroke="var(--svg-node-red-border)" stroke-width="2" marker-end="url(#arr-red)"/>
    <text x="822" y="233" fill="var(--svg-node-red-border)" font-size="9.5" font-weight="600">Bei Ausfall / VRAM-Überlauf</text>

    <!-- Tier 2: Secondary Local Backup -->
    <rect x="680" y="245" width="265" height="72" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1"/>
    <text x="695" y="267" fill="var(--svg-node-blue-border)" font-size="11.5" font-weight="700">Stufe 2: Sekundärer GPU-Knoten</text>
    <text x="695" y="285" fill="var(--svg-node-amber-subtext)" font-size="10.5">Qwen-2.5-72B (AWQ Quantisiert)</text>
    <text x="695" y="302" fill="var(--svg-text-secondary)" font-size="9.5">Lokaler Failover auf Notfall-Server</text>

    <!-- Failover Arrow 2 -->
    <path d="M 812 317 L 812 342" stroke="var(--svg-node-red-border)" stroke-width="2" marker-end="url(#arr-red)"/>
    <text x="822" y="333" fill="var(--svg-node-red-border)" font-size="9.5" font-weight="600">Bei Cluster-Totalausfall</text>

    <!-- Tier 3: Enterprise Frontier Cloud -->
    <rect x="680" y="345" width="265" height="72" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1"/>
    <text x="695" y="367" fill="var(--svg-node-purple-border)" font-size="11.5" font-weight="700">Stufe 3: Cloud SLA Provider</text>
    <text x="695" y="385" fill="var(--svg-node-amber-subtext)" font-size="10.5">Claude 3.5 Sonnet / Azure OpenAI</text>
    <text x="695" y="402" fill="var(--svg-text-secondary)" font-size="9.5">Gesicherte Hochverfügbarkeit mit Token-Accounting</text>

    <!-- Failover Arrow 3 -->
    <path d="M 812 417 L 812 442" stroke="var(--svg-node-red-border)" stroke-width="2" marker-end="url(#arr-red)"/>

    <!-- Tier 4: Graceful Degradation -->
    <rect x="680" y="445" width="265" height="65" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1"/>
    <text x="695" y="467" fill="var(--svg-node-amber-border)" font-size="11.5" font-weight="700">Stufe 4: Graceful Degradation</text>
    <text x="695" y="485" fill="var(--svg-node-amber-subtext)" font-size="10.5">Mistral-Small / Edge LLM Notbetrieb</text>
    <text x="695" y="499" fill="var(--svg-text-secondary)" font-size="9">Geringer Ressourcenverbrauch, Basisfunktion bleibt aktiv</text>
  </g>

  <!-- BOTTOM COMPARISON & METRICS BAR (FULL WIDTH) -->
  <g filter="url(#shadow)">
    <rect x="40" y="545" width="920" height="95" rx="12" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <rect x="40" y="545" width="920" height="26" rx="12" fill="var(--svg-card-alt)"/>
    <text x="60" y="563" fill="var(--svg-node-blue-border)" font-size="11.5" font-weight="700" letter-spacing="1">RESILIENZ-VERTRAG: EXPONENTIAL BACKOFF MIT JITTER &amp; HEALTH PROBES</text>

    <text x="60" y="593" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">Backoff-Formel:</text>
    <text x="175" y="593" fill="var(--svg-node-amber-subtext)" font-size="11" font-family="monospace">t_retry = min(t_max, t_base * 2^(attempt) + Uniform(0, jitter))</text>
    <text x="60" y="618" fill="var(--svg-text-secondary)" font-size="10.5">Verhindert den gefürchteten "Thundering Herd"-Effekt bei Inferenz-Wiederanläufen nach Störungen.</text>

    <rect x="670" y="580" width="270" height="48" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-bg)" stroke-width="1"/>
    <text x="685" y="600" fill="var(--svg-node-blue-subtext)" font-size="11" font-weight="600">Health Probes:</text>
    <text x="685" y="616" fill="var(--svg-text-secondary)" font-size="10">GET /health/readiness &amp; /health/liveliness</text>
  </g>

  <!-- Status / Copyright -->
  <text x="50" y="658" fill="var(--svg-text-secondary)" font-size="10">LiteLLM Resilience Matrix · Robuste Enterprise-Sicherheit gegen Ausfälle, Ratelimits und Netzwerk-Jitter</text>
</svg>

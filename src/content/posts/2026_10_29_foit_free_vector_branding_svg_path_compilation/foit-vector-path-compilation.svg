<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="auto" role="img" aria-label="Comparison between runtime SVG text failure (FOIT) in sandboxed browser contexts in the top tier and build-time vector path compilation with the DT-1 H-Bridge emblem in the bottom tier">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-red-border)" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="640" rx="12" fill="var(--svg-bg)" />

  <!-- Top Tier: Runtime <text> Failure (FOIT) -->
  <rect x="24" y="24" width="592" height="264" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-red-border)" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="320" y="50" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.04em" fill="var(--svg-node-red-text)">RUNTIME &lt;TEXT&gt; FAILURE (FOIT)</text>

  <rect x="44" y="70" width="212" height="84" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <text x="150" y="102" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-amber-text)">&lt;text&gt;GH&lt;/text&gt; + @font-face</text>
  <text x="150" y="126" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" fill="var(--svg-node-amber-subtext)">External WOFF2 Request</text>

  <rect x="44" y="176" width="212" height="92" rx="8" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1.5" />
  <text x="150" y="212" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-red-text)">SANDBOX BLOCKED</text>
  <text x="150" y="234" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" fill="var(--svg-node-red-subtext)">&lt;img&gt; &amp; Canvas Isolation</text>

  <path d="M 150 154 V 172" fill="none" stroke="var(--svg-node-red-border)" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-red)" />
  <path d="M 256 112 H 316" fill="none" stroke="var(--svg-node-red-border)" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-red)" />
  <path d="M 256 222 H 316" fill="none" stroke="var(--svg-node-red-border)" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-red)" />

  <!-- Failure Card 1: Blank Icon (FOIT) -->
  <rect x="322" y="70" width="274" height="88" rx="8" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1.5" />
  <rect x="340" y="84" width="60" height="60" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-red-border)" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="352" y1="96" x2="388" y2="132" stroke="var(--svg-node-red-border)" stroke-width="1.5" stroke-dasharray="3,2" />
  <text x="498" y="106" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-red-text)">Blank Icon (FOIT)</text>
  <text x="498" y="128" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" fill="var(--svg-node-red-subtext)">0 Glyphs Rendered</text>

  <!-- Failure Card 2: Serif Fallback -->
  <rect x="322" y="180" width="274" height="88" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <rect x="340" y="194" width="60" height="60" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <line x1="344" y1="224" x2="396" y2="224" stroke="var(--svg-node-amber-border)" stroke-width="1" stroke-dasharray="2,2" />
  <text x="376" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="var(--svg-node-amber-text)">GH</text>
  <text x="498" y="216" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-amber-text)">Serif Fallback</text>
  <text x="498" y="238" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" fill="var(--svg-node-amber-subtext)">Baseline Drift</text>

  <!-- Bottom Tier: Build-Time Path Compilation & DT-1 H-Bridge -->
  <rect x="24" y="308" width="592" height="308" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <text x="320" y="334" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.04em" fill="var(--svg-node-blue-text)">BUILD-TIME PATH COMPILATION &amp; DT-1 H-BRIDGE</text>

  <rect x="44" y="352" width="248" height="244" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <rect x="108" y="368" width="120" height="120" rx="24" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="2" />
  <polygon points="144,437.6 148.8,418.4 192,418.4 187.2,437.6" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <polygon points="129.6,461.6 144,394.4 160.8,394.4 146.4,461.6" fill="var(--svg-node-green-text)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
  <polygon points="175.2,461.6 189.6,394.4 206.4,394.4 192,461.6" fill="var(--svg-node-green-text)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />

  <!-- Bezier Control Handles & Anchor Vertices -->
  <path d="M 116 428 C 116 398, 136 380, 168 380" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="1.2" stroke-dasharray="3,2" />
  <line x1="116" y1="428" x2="116" y2="398" stroke="var(--svg-node-purple-border)" stroke-width="1" />
  <line x1="168" y1="380" x2="136" y2="380" stroke="var(--svg-node-purple-border)" stroke-width="1" />
  <circle cx="116" cy="398" r="2.5" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.2" />
  <circle cx="136" cy="380" r="2.5" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.2" />
  <circle cx="144" cy="394.4" r="3.5" fill="var(--svg-node-purple-border)" />
  <circle cx="160.8" cy="394.4" r="3.5" fill="var(--svg-node-purple-border)" />
  <circle cx="129.6" cy="461.6" r="3.5" fill="var(--svg-node-purple-border)" />
  <circle cx="189.6" cy="394.4" r="3.5" fill="var(--svg-node-purple-border)" />
  <circle cx="206.4" cy="394.4" r="3.5" fill="var(--svg-node-purple-border)" />
  <circle cx="192" cy="461.6" r="3.5" fill="var(--svg-node-purple-border)" />

  <text x="168" y="514" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--svg-text-primary)">DT-1 Vector Geometry</text>
  <text x="168" y="534" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" fill="var(--svg-text-secondary)">&lt;path&gt; &amp; &lt;polygon&gt; Nodes</text>
  <rect x="86" y="552" width="164" height="26" rx="13" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.2" />
  <text x="168" y="569" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-node-purple-text)">SHA-256 Cache Hit</text>

  <!-- Fan-Out Connectors -->
  <path d="M 292 474 H 320 V 378 H 348" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.8" marker-end="url(#arr-green)" />
  <path d="M 292 474 H 320 V 442 H 348" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <path d="M 292 474 H 320 V 506 H 348" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <path d="M 292 474 H 320 V 570 H 348" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.8" marker-end="url(#arr-green)" />

  <!-- Target Cards -->
  <rect x="354" y="352" width="242" height="52" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
  <text x="475" y="374" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-green-text)">favicon.svg</text>
  <text x="475" y="393" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" fill="var(--svg-node-green-subtext)">128x128 Pure Vector</text>

  <rect x="354" y="416" width="242" height="52" rx="8" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <text x="475" y="438" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-blue-text)">PWA Icons</text>
  <text x="475" y="457" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" fill="var(--svg-node-blue-subtext)">192 / 512 Maskable</text>

  <rect x="354" y="480" width="242" height="52" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.5" />
  <text x="475" y="502" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-purple-text)">OG Cards</text>
  <text x="475" y="521" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" fill="var(--svg-node-purple-subtext)">1200x630 Starfield</text>

  <rect x="354" y="544" width="242" height="52" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
  <text x="475" y="566" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-green-text)">Email Header</text>
  <text x="475" y="585" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" fill="var(--svg-node-green-subtext)">React Email Badge</text>
</svg>

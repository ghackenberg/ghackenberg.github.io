  <!-- Blocked Wire 1 -> 2 -->
  <path d="M 130 98 H 196" fill="none" stroke="var(--svg-node-red-border)" stroke-width="2.2" stroke-dasharray="5,4" />
  <line x1="157" y1="90" x2="169" y2="106" stroke="var(--svg-node-red-border)" stroke-width="2.6" />
  <line x1="169" y1="90" x2="157" y2="106" stroke="var(--svg-node-red-border)" stroke-width="2.6" />


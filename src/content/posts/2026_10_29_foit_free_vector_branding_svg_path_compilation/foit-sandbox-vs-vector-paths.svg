  <polygon points="350,333 355,307 362,307 357,333" fill="var(--svg-node-green-text)" />
  <polygon points="367,333 372,307 379,307 374,333" fill="var(--svg-node-green-text)" />
  <polygon points="355,324 357,316 373,316 371,324" fill="var(--svg-node-green-border)" />

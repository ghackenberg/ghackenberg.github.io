<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="greenGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="yellowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="0" y="0" width="960" height="520" rx="16" fill="url(#bgGrad2)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Header -->
  <text x="480" y="40" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="800" fill="#f3f4f6" text-anchor="middle">
    Finanzierungsmodell: Die "Almtal AG" &amp; Fördermittel-Hebel
  </text>
  <text x="480" y="62" font-family="'Outfit', 'Inter', sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">
    Gesamtkapitalbedarf: ca. 20 Mio. € (2027–2030) | Trägerschaft: Regionale Innovationsgenossenschaft
  </text>

  <!-- LEFT SECTION: Capital Inputs (20 Mio € Total) -->
  <g transform="translate(40, 95)">
    <!-- Column Title -->
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" />
    <text x="205" y="23" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="middle">
      1. CAPITAL RAISING (Mittelherkunft)
    </text>

    <!-- Pillar 1: Fördermittel (50%) -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="410" height="80" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <rect x="0" y="0" width="12" height="80" rx="4" fill="url(#greenGrad2)" />
      <text x="28" y="26" font-family="'Outfit', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#34d399">Fördermittel (EU, Land, Bund)</text>
      <text x="390" y="26" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="800" fill="#34d399" text-anchor="end">10 Mio. € (50%)</text>
      <text x="28" y="46" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#9ca3af">EU LEADER &amp; Horizon Europe, Land OÖ (#upperVISION2030)</text>
      <text x="28" y="62" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#9ca3af">FFG &amp; Klima- und Energiefonds (50–70% Förderquote)</text>
    </g>

    <!-- Pillar 2: Almtal AG Eigenkapital (30%) -->
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="410" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <rect x="0" y="0" width="12" height="90" rx="4" fill="url(#blueGrad)" />
      <text x="28" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#60a5fa">Almtal AG (Eigenkapital)</text>
      <text x="390" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="800" fill="#60a5fa" text-anchor="end">6 Mio. € (30%)</text>
      <text x="28" y="44" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">▪ Bürgerbeteiligung: ~2 Mio. € (1.000 Bürger à 2.000 €)</text>
      <text x="28" y="60" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">▪ Corporate Investment: ~4 Mio. € (8–10 Leitbetriebe à 500k €)</text>
      <text x="28" y="76" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#94a3b8">100% regionale Entscheidungsgewalt – Verbleib aller Gewinne im Tal</text>
    </g>

    <!-- Pillar 3: Fremdkapital & Gemeinden (20%) -->
    <g transform="translate(0, 238)">
      <rect x="0" y="0" width="410" height="70" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      <rect x="0" y="0" width="12" height="70" rx="4" fill="url(#purpleGrad2)" />
      <text x="28" y="26" font-family="'Outfit', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#c084fc">Fremdkapital &amp; Gemeinden</text>
      <text x="390" y="26" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="800" fill="#c084fc" text-anchor="end">4 Mio. € (20%)</text>
      <text x="28" y="48" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#9ca3af">Klassische Bankkredite (Immobilienbesichert) &amp; moderate</text>
      <text x="28" y="62" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#9ca3af">Infrastrukturbeiträge der 4 Almtal-Gemeinden</text>
    </g>
  </g>

  <!-- CENTER ARROW / FLOW -->
  <g transform="translate(460, 260)">
    <path d="M 0,-15 L 40,0 L 0,15 Z" fill="#60a5fa" filter="url(#glow2)" />
    <text x="20" y="-25" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">ROI</text>
  </g>

  <!-- RIGHT SECTION: Return on Investment (Drei Ebenen) -->
  <g transform="translate(510, 95)">
    <!-- Column Title -->
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#1e293b" />
    <text x="205" y="23" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">
      2. RETURN ON INVESTMENT (3-Stufen-Modell)
    </text>

    <!-- ROI 1: Direkt für Aktionäre -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="410" height="80" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <circle cx="26" cy="40" r="16" fill="url(#blueGrad)" />
      <text x="26" y="45" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
      <text x="52" y="26" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#60a5fa">Direkter Finanzieller ROI (ab 2030)</text>
      <text x="390" y="26" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#3b82f6" text-anchor="end">3 – 5 % p.a.</text>
      <text x="52" y="46" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">Mieteinnahmen (FH/Uni), Laborpachten &amp; Start-up Exits</text>
      <text x="52" y="62" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#9ca3af">Ausschüttungen an Bürger und Betriebe</text>
    </g>

    <!-- ROI 2: Corporate ROI für Leitbetriebe -->
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="410" height="90" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="26" cy="45" r="16" fill="url(#yellowGrad2)" />
      <text x="26" y="50" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
      <text x="52" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#fbbf24">Corporate ROI (Sofortig)</text>
      <text x="390" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="end">HR &amp; R&amp;D Bonus</text>
      <text x="52" y="44" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Direktes Recruiting: Absolventen bleiben in der Region</text>
      <text x="52" y="60" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Eingesparte Headhunter-Kosten (15–25k € pro Kopf)</text>
      <text x="52" y="76" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#94a3b8">Unmittelbarer Technologietransfer &amp; gemeinsame Forschung</text>
    </g>

    <!-- ROI 3: Volkswirtschaftlicher ROI -->
    <g transform="translate(0, 238)">
      <rect x="0" y="0" width="410" height="70" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <circle cx="26" cy="35" r="16" fill="url(#greenGrad2)" />
      <text x="26" y="40" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
      <text x="52" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#34d399">Volkswirtschaftlicher ROI (Gemeinden)</text>
      <text x="390" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="end">+1,5 Mio. € p.a.</text>
      <text x="52" y="46" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">1.000–2.500 neue High-Tech Arbeitsplätze im Tal</text>
      <text x="52" y="60" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#9ca3af">50 Mio. € Lohnsumme = 1,5 Mio. € jährliches Kommunalsteuer-Plus</text>
    </g>
  </g>
</svg>

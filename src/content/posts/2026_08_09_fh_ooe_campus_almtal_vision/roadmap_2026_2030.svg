<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="960" height="440" rx="16" fill="url(#bgGrad3)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Title -->
  <text x="480" y="42" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="800" fill="#f3f4f6" text-anchor="middle">
    Roadmap 2026–2030: Der Stufenplan zur Umsetzung
  </text>
  <text x="480" y="64" font-family="'Outfit', 'Inter', sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">
    Von der Validierung im Kleinen bis zum dezentralen Regelbetrieb im Almtal
  </text>

  <!-- Main Timeline Line -->
  <line x1="80" y1="120" x2="880" y2="120" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" stroke-dasharray="6,6" />

  <!-- PHASE 1 -->
  <g transform="translate(100, 0)">
    <!-- Node Circle -->
    <circle cx="40" cy="120" r="16" fill="#0b1329" stroke="#3b82f6" stroke-width="3" filter="url(#glow3)" />
    <circle cx="40" cy="120" r="6" fill="#3b82f6" />
    <!-- Year Tag -->
    <rect x="-10" y="72" width="100" height="28" rx="6" fill="url(#p1Grad)" />
    <text x="40" y="91" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">H2 / 2026</text>

    <!-- Card Content -->
    <g transform="translate(-50, 160)">
      <rect x="0" y="0" width="180" height="230" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <text x="14" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#60a5fa" letter-spacing="1">PHASE 1</text>
      <text x="14" y="44" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Validierung &amp;</text>
      <text x="14" y="60" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Kernteam</text>

      <line x1="14" y1="72" x2="166" y2="72" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="14" y="92" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Diskussionsentwurf (v0.1) präsentieren</text>
      <text x="14" y="122" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Gespräche mit 5–10 Key-Playern</text>
      <text x="14" y="152" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Kernteam-Gründung ("Initiative 2035")</text>
      <text x="14" y="182" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#9ca3af">▪ Klärung erste Standorte</text>
    </g>
  </g>

  <!-- PHASE 2 -->
  <g transform="translate(320, 0)">
    <!-- Node Circle -->
    <circle cx="40" cy="120" r="16" fill="#0b1329" stroke="#a855f7" stroke-width="3" filter="url(#glow3)" />
    <circle cx="40" cy="120" r="6" fill="#a855f7" />
    <!-- Year Tag -->
    <rect x="-10" y="72" width="100" height="28" rx="6" fill="url(#p2Grad)" />
    <text x="40" y="91" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2027</text>

    <!-- Card Content -->
    <g transform="translate(-50, 160)">
      <rect x="0" y="0" width="180" height="230" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      <text x="14" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#c084fc" letter-spacing="1">PHASE 2</text>
      <text x="14" y="44" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Proof of Concept</text>
      <text x="14" y="60" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff">&amp; Gründung</text>

      <line x1="14" y1="72" x2="166" y2="72" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="14" y="92" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Pilot: "Almtal Summer School"</text>
      <text x="14" y="122" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Gründung der "Almtal AG" (Herbst)</text>
      <text x="14" y="152" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Einreichung Förderanträge (LEADER)</text>
      <text x="14" y="182" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#9ca3af">▪ Seed-Capital Sammlung</text>
    </g>
  </g>

  <!-- PHASE 3 -->
  <g transform="translate(540, 0)">
    <!-- Node Circle -->
    <circle cx="40" cy="120" r="16" fill="#0b1329" stroke="#f59e0b" stroke-width="3" filter="url(#glow3)" />
    <circle cx="40" cy="120" r="6" fill="#f59e0b" />
    <!-- Year Tag -->
    <rect x="-10" y="72" width="100" height="28" rx="6" fill="url(#p3Grad)" />
    <text x="40" y="91" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2028 – 2029</text>

    <!-- Card Content -->
    <g transform="translate(-50, 160)">
      <rect x="0" y="0" width="180" height="230" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="14" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="1">PHASE 3</text>
      <text x="14" y="44" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Satelliten &amp;</text>
      <text x="14" y="60" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Campus-Hardware</text>

      <line x1="14" y1="72" x2="166" y2="72" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="14" y="92" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Coworking Scharnstein Eröffnung</text>
      <text x="14" y="122" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Start 1. FH-Lehrgang / Kurse</text>
      <text x="14" y="152" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Ausbau Satellit Grünau &amp; Steinbach</text>
      <text x="14" y="182" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#9ca3af">▪ Erste Mieteinnahmen</text>
    </g>
  </g>

  <!-- PHASE 4 -->
  <g transform="translate(760, 0)">
    <!-- Node Circle -->
    <circle cx="40" cy="120" r="16" fill="#0b1329" stroke="#10b981" stroke-width="3" filter="url(#glow3)" />
    <circle cx="40" cy="120" r="6" fill="#10b981" />
    <!-- Year Tag -->
    <rect x="-10" y="72" width="100" height="28" rx="6" fill="url(#p4Grad)" />
    <text x="40" y="91" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Ab 2030</text>

    <!-- Card Content -->
    <g transform="translate(-50, 160)">
      <rect x="0" y="0" width="180" height="230" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="14" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#34d399" letter-spacing="1">PHASE 4</text>
      <text x="14" y="44" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Vollbetrieb &amp;</text>
      <text x="14" y="60" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Skalierung</text>

      <line x1="14" y1="72" x2="166" y2="72" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="14" y="92" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Regelbetrieb Bildungsökosystem</text>
      <text x="14" y="122" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Break-Even der Almtal AG</text>
      <text x="14" y="152" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e2e8f0">▪ Dividenden an Bürger &amp; Betriebe</text>
      <text x="14" y="182" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#9ca3af">▪ 1.500+ neue Ganzjahres-Jobs</text>
    </g>
  </g>
</svg>

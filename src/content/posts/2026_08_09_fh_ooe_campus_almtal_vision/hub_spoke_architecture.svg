<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="960" height="560" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Grid Lines / Decorative Circles -->
  <circle cx="480" cy="270" r="210" fill="none" stroke="rgba(59, 130, 246, 0.12)" stroke-width="1.5" stroke-dasharray="6,6" />
  <circle cx="480" cy="270" r="120" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Header Title -->
  <text x="480" y="42" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="800" fill="#f3f4f6" text-anchor="middle">
    FH OÖ Campus Almtal: Dezentrales Hub-&amp;-Spoke Modell
  </text>
  <text x="480" y="65" font-family="'Outfit', 'Inter', sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">
    Jeder Ortsteil besetzt eine klare wissenschaftliche &amp; wirtschaftliche Nische (Vision 2035)
  </text>

  <!-- Connecting Lines from Hub to Spokes -->
  <!-- Scharnstein to Grünau -->
  <line x1="480" y1="270" x2="220" y2="150" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4" />
  <!-- Scharnstein to Pettenbach -->
  <line x1="480" y1="270" x2="740" y2="150" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4" />
  <!-- Scharnstein to Viechtwang -->
  <line x1="480" y1="270" x2="800" y2="330" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4" />
  <!-- Scharnstein to Steinbach -->
  <line x1="480" y1="270" x2="480" y2="470" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4" />
  <!-- Scharnstein to St. Konrad -->
  <line x1="480" y1="270" x2="160" y2="340" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4" />

  <!-- CENTRAL HUB: Scharnstein -->
  <g transform="translate(480, 270)">
    <circle r="72" fill="url(#hubGrad)" filter="url(#glow)" stroke="#60a5fa" stroke-width="3" />
    <text x="0" y="-22" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">HAUPTCAMPUS</text>
    <text x="0" y="-2" font-family="'Outfit', 'Inter', sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">Scharnstein</text>
    <text x="0" y="16" font-family="'Outfit', 'Inter', sans-serif" font-size="11" fill="#e0f2fe" text-anchor="middle">Inkubator &amp; HTL/FH</text>
    <text x="0" y="30" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">Wolf System &amp; Grüne Erde</text>
  </g>

  <!-- SPOKE 1: Grünau im Almtal (Top-Left) -->
  <g transform="translate(220, 150)">
    <rect x="-130" y="-45" width="260" height="90" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#glow)" />
    <circle cx="-100" cy="0" r="18" fill="url(#greenGrad)" />
    <text x="-100" y="5" font-family="'Outfit', 'Inter', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">🌲</text>
    <text x="-70" y="-18" font-family="'Outfit', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#34d399">Grünau im Almtal</text>
    <text x="-70" y="0" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">Alpine Biosphären-Labor</text>
    <text x="-70" y="16" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#9ca3af">Wasser, Wald &amp; Wildtiere (KLF Uni Wien)</text>
    <text x="-70" y="29" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#9ca3af">Sanfter Alpinismus &amp; Forschung</text>
  </g>

  <!-- SPOKE 2: Pettenbach (Top-Right) -->
  <g transform="translate(740, 150)">
    <rect x="-130" y="-45" width="260" height="90" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2" filter="url(#glow)" />
    <circle cx="-100" cy="0" r="18" fill="url(#hubGrad)" />
    <text x="-100" y="5" font-family="'Outfit', 'Inter', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">⚡</text>
    <text x="-70" y="-18" font-family="'Outfit', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#60a5fa">Pettenbach</text>
    <text x="-70" y="0" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">Energie &amp; Tech Gateway</text>
    <text x="-70" y="16" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#9ca3af">Dezentrale Netze &amp; Automation</text>
    <text x="-70" y="29" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#9ca3af">Partner: Fronius &amp; Danner</text>
  </g>

  <!-- SPOKE 3: Viechtwang (Bottom-Right) -->
  <g transform="translate(800, 330)">
    <rect x="-130" y="-45" width="260" height="90" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#glow)" />
    <circle cx="-100" cy="0" r="18" fill="url(#yellowGrad)" />
    <text x="-100" y="5" font-family="'Outfit', 'Inter', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">🛋️</text>
    <text x="-70" y="-18" font-family="'Outfit', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#fbbf24">Viechtwang</text>
    <text x="-70" y="0" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">Handwerk &amp; Lernwelten</text>
    <text x="-70" y="16" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#9ca3af">Arbeitsraumgestaltung &amp; Ergonomie</text>
    <text x="-70" y="29" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#9ca3af">Partner: Mayr-Schulmöbel</text>
  </g>

  <!-- SPOKE 4: Steinbach am Ziehberg (Bottom-Center) -->
  <g transform="translate(480, 470)">
    <rect x="-140" y="-42" width="280" height="84" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#glow)" />
    <circle cx="-110" cy="0" r="18" fill="url(#greenGrad)" />
    <text x="-110" y="5" font-family="'Outfit', 'Inter', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">🪵</text>
    <text x="-80" y="-16" font-family="'Outfit', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#34d399">Steinbach am Ziehberg</text>
    <text x="-80" y="2" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">Forstwirtschaft &amp; Biomasse</text>
    <text x="-80" y="18" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#9ca3af">Datengestützte Forstpraxis &amp; Retreats</text>
  </g>

  <!-- SPOKE 5: St. Konrad (Bottom-Left) -->
  <g transform="translate(160, 340)">
    <rect x="-130" y="-45" width="260" height="90" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
    <circle cx="-100" cy="0" r="18" fill="url(#purpleGrad)" />
    <text x="-100" y="5" font-family="'Outfit', 'Inter', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">🌱</text>
    <text x="-70" y="-18" font-family="'Outfit', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#c084fc">St. Konrad</text>
    <text x="-70" y="0" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">Agri-Tech &amp; Resilienz</text>
    <text x="-70" y="16" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#9ca3af">Permakultur &amp; Wasserkreisläufe</text>
    <text x="-70" y="29" font-family="'Outfit', 'Inter', sans-serif" font-size="10" fill="#9ca3af">Smarte Nischen-Landwirtschaft</text>
  </g>
</svg>

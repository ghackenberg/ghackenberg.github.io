<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#070e20" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="techGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="450" rx="16" fill="url(#iconBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Stars / Digital Grid -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Mountain Silhouettes (Almtal Alps) -->
  <polygon points="50,380 220,180 380,380" fill="url(#mountainGrad2)" opacity="0.8" />
  <polygon points="280,380 480,120 680,380" fill="url(#mountainGrad1)" opacity="0.9" />
  <polygon points="520,380 660,220 800,380" fill="url(#mountainGrad2)" opacity="0.7" />

  <!-- Alpine Snowcaps (Stylized) -->
  <polygon points="480,120 450,165 470,160 480,175 495,158 510,165" fill="#f8fafc" opacity="0.85" />
  <polygon points="220,180 200,215 215,210 220,222 232,210 240,218" fill="#e2e8f0" opacity="0.75" />

  <!-- Hub Nodes & Networks Overlaid on Mountains -->
  <g filter="url(#iconGlow)">
    <!-- Scharnstein Center Node -->
    <line x1="400" y1="260" x2="240" y2="320" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4" />
    <line x1="400" y1="260" x2="580" y2="300" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4,4" />
    <line x1="400" y1="260" x2="330" y2="210" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,4" />
    <line x1="400" y1="260" x2="490" y2="210" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4" />

    <circle cx="400" cy="260" r="28" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
    <text x="400" y="266" font-family="'Outfit', 'Inter', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">FH</text>

    <!-- Satellite Nodes -->
    <circle cx="240" cy="320" r="16" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <circle cx="580" cy="300" r="16" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <circle cx="330" cy="210" r="14" fill="#a855f7" stroke="#ffffff" stroke-width="2" />
    <circle cx="490" cy="210" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Title Text -->
  <rect x="180" y="360" width="440" height="54" rx="12" fill="#0f172a" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  <text x="400" y="385" font-family="'Outfit', 'Inter', sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">
    FH OÖ Campus Almtal
  </text>
  <text x="400" y="403" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle" letter-spacing="1">
    SCHOOL OF NATURAL SCIENCES &amp; APPLICATIONS
  </text>
</svg>

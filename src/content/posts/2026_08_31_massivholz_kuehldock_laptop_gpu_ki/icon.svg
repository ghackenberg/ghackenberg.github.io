<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#070e20" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Wood Texture / Body Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a26839" />
      <stop offset="50%" stop-color="#78471f" />
      <stop offset="100%" stop-color="#4d2b10" />
    </linearGradient>

    <!-- Blue Cool Air Gradient -->
    <linearGradient id="coolAir" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Hot Air Thermal Gradient -->
    <linearGradient id="heatFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Blueprint Background Grid -->
  <g stroke="rgba(59, 130, 246, 0.05)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Ambient Glow Elements -->
  <circle cx="400" cy="220" r="180" fill="#3b82f6" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="580" cy="200" r="130" fill="#f59e0b" opacity="0.08" filter="url(#softGlow)" />

  <!-- MAIN ISOMETRIC SCENE -->
  <g transform="translate(400, 230)">
    <!-- Base Shadow -->
    <polygon points="-240,110 0,170 240,110 0,50" fill="#000000" opacity="0.5" filter="url(#glow)" />

    <!-- 1. WOODEN BASE BLOCK (CNC Massivholz-Dock) -->
    <!-- Stand Bottom Extrusion -->
    <polygon points="-210,75 -210,100 0,150 0,125" fill="#3b1e08" stroke="#5c3413" stroke-width="1" />
    <polygon points="0,125 0,150 210,100 210,75" fill="#2d1706" stroke="#5c3413" stroke-width="1" />

    <!-- Stand Top Surface (Wedge Inclined for Ergonomics) -->
    <polygon points="-210,75 0,125 210,75 0,25" fill="url(#woodGrad)" stroke="#d97706" stroke-width="1.5" />

    <!-- CNC Milled Lattice / Air Ventilation Honeycomb Grid (Cutout in Wood) -->
    <g>
      <!-- Deep Recess Pocket -->
      <polygon points="-160,70 0,108 160,70 0,32" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />

      <!-- Airflow Grid Ribs (CNC Lamellen) -->
      <!-- Longitudinal Ribs -->
      <path d="M -120,60 L 0,88 L 120,60" fill="none" stroke="#64748b" stroke-width="2" />
      <path d="M -80,50 L 0,69 L 80,50" fill="none" stroke="#64748b" stroke-width="2" />
      <path d="M -40,40 L 0,49 L 40,40" fill="none" stroke="#64748b" stroke-width="2" />

      <!-- Transverse Diagonal Slots (Gittermuster) -->
      <line x1="-120" y1="60" x2="-80" y2="79" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="-60" y1="45" x2="-20" y2="64" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="0" y1="32" x2="40" y2="51" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="60" y1="45" x2="100" y2="64" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />

      <line x1="120" y1="60" x2="80" y2="79" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="60" y1="45" x2="20" y2="64" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="0" y1="32" x2="-40" y2="51" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="-60" y1="45" x2="-100" y2="64" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <!-- Side Aerodynamic Exhaust Vents (Gefräste seitliche Ausström-Nuten) -->
    <g stroke="#f59e0b" stroke-width="2" opacity="0.8">
      <path d="M 40,135 L 140,110" />
      <path d="M 50,140 L 150,115" />
      <path d="M 60,145 L 160,120" />
    </g>
    <!-- Left Intake Air Slots -->
    <g stroke="#38bdf8" stroke-width="2" opacity="0.8">
      <path d="M -40,135 L -140,110" />
      <path d="M -50,140 L -150,115" />
      <path d="M -60,145 L -160,120" />
    </g>

    <!-- 2. HIGH-PERFORMANCE WORKSTATION LAPTOP (Floating / Rested on stand) -->
    <g transform="translate(0, -35)">
      <!-- Laptop Base Chassis -->
      <polygon points="-190,55 0,98 190,55 0,12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <polygon points="-190,55 -190,64 0,107 0,98" fill="#0f172a" />
      <polygon points="0,98 0,107 190,64 190,55" fill="#0f172a" />

      <!-- Keyboard & Trackpad Area -->
      <polygon points="-160,50 0,85 160,50 0,15" fill="#090d16" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <!-- Trackpad -->
      <polygon points="-40,70 0,79 40,70 0,61" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <!-- Illuminated Keyboard Matrix -->
      <polygon points="-140,45 0,74 140,45 0,22" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 2" />

      <!-- Open Display Lid (Tilted Up) -->
      <polygon points="-190,55 0,12 0,-130 -190,-87" fill="#020617" stroke="#3b82f6" stroke-width="1.5" />
      <!-- Screen Display with AI / CAD Workspace Graphic -->
      <polygon points="-180,48 -8,10 -8,-118 -180,-80" fill="#0b1329" stroke="#60a5fa" stroke-width="1" />
      
      <!-- Graphic on Laptop Display -->
      <g opacity="0.9">
        <!-- Neural Net / CAD Wireframe in screen -->
        <circle cx="-94" cy="-35" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
        <circle cx="-94" cy="-35" r="8" fill="#3b82f6" filter="url(#glow)" />
        <line x1="-150" y1="-50" x2="-94" y2="-35" stroke="#a855f7" stroke-width="1.5" />
        <line x1="-40" y1="-20" x2="-94" y2="-35" stroke="#10b981" stroke-width="1.5" />
        <line x1="-140" y1="-10" x2="-94" y2="-35" stroke="#f59e0b" stroke-width="1.5" />
        <text x="-94" y="-3" fill="#93c5fd" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">GPU INFERENCE: 98%</text>
      </g>
    </g>

    <!-- 3. THERMAL & AIRFLOW DYNAMICS (Arrows & Streams) -->
    <!-- Cool Air Intake Streams (Blue Glowing Arrows coming in from left and below) -->
    <g fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
      <path d="M -230,120 Q -180,100 -120,80" filter="url(#glow)" />
      <path d="M -180,160 Q -130,130 -60,95" filter="url(#glow)" />
      <path d="M -80,180 Q -30,150 0,110" filter="url(#glow)" />
    </g>

    <!-- Hot Air Exhaust Streams (Red/Orange Glowing Arrows escaping through channels to right/rear) -->
    <g fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round">
      <path d="M 30,70 Q 110,60 180,30" filter="url(#glow)" />
      <path d="M 60,90 Q 140,85 220,55" filter="url(#glow)" />
      <path d="M 80,110 Q 160,110 240,85" filter="url(#glow)" />
    </g>
  </g>

  <!-- TOP BADGE / TITLE -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(217, 119, 6, 0.15)" stroke="#d97706" stroke-width="1.5" />
    <circle cx="15" cy="15" r="4" fill="#f59e0b" />
    <text x="28" y="19" fill="#fbbf24" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1">HARDWARE &amp; ERGONOMICS</text>
  </g>

  <!-- BOTTOM FEATURE HIGHLIGHT PILLS -->
  <g transform="translate(40, 395)" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="600">
    <!-- Feature 1: Solid Wood CNC -->
    <g transform="translate(0, 0)">
      <rect width="210" height="34" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1" />
      <text x="15" y="21" fill="#fef08a">CNC-Massivholzblock</text>
    </g>

    <!-- Feature 2: Ventilation Lattice Grid -->
    <g transform="translate(230, 0)">
      <rect width="240" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="15" y="21" fill="#bae6fd">Aerodynamische Gitterstruktur</text>
    </g>

    <!-- Feature 3: Full Load GPU Sustained -->
    <g transform="translate(490, 0)">
      <rect width="230" height="34" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="15" y="21" fill="#a7f3d0">GPU-Volllast: Lokale KI &amp; CAD</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#070e20" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Arrow Marker Yellow: Energy Flow -->
    <marker id="arr-energy" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>

    <!-- Arrow Marker Green: Material / Airflow -->
    <marker id="arr-material" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>

    <!-- Arrow Marker Blue: Data Flow -->
    <marker id="arr-data" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>

    <!-- Arrow Marker Red: Thermal Dissipation -->
    <marker id="arr-heat" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="1000" height="620" rx="16" fill="url(#sysBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Background Blueprint Grid -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="320" x2="1000" y2="320" />
    <line x1="0" y1="400" x2="1000" y2="400" />
    <line x1="0" y1="480" x2="1000" y2="480" />
    <line x1="0" y1="560" x2="1000" y2="560" />
  </g>

  <!-- HEADER -->
  <g transform="translate(500, 45)" text-anchor="middle">
    <text y="0" fill="#f8fafc" font-family="'Outfit', 'Inter', sans-serif" font-size="21" font-weight="700">Systemarchitektur &amp; Multidomänen-Flussmodell</text>
    <text y="22" fill="#94a3b8" font-family="'Outfit', 'Inter', sans-serif" font-size="13">Gekoppelte Betrachtung von Energiefluss, Fluidik-/Materialstrom und Daten-/Telemetriepipelines</text>
  </g>

  <!-- LEGEND / FLOW KEY (TOP RIGHT) -->
  <g transform="translate(620, 80)" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="600">
    <rect x="0" y="0" width="340" height="42" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Energy -->
    <g transform="translate(15, 25)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-energy)" />
      <text x="26" y="4" fill="#fbbf24">Energiefluss</text>
    </g>
    <!-- Material / Air -->
    <g transform="translate(125, 25)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-material)" />
      <text x="26" y="4" fill="#34d399">Fluidik/Luft</text>
    </g>
    <!-- Data -->
    <g transform="translate(230, 25)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4 2" marker-end="url(#arr-data)" />
      <text x="26" y="4" fill="#60a5fa">Datenfluss</text>
    </g>
  </g>

  <!-- 3 MAIN SYSTEM COMPONENTS (HORIZONTAL ARCHITECTURE) -->

  <!-- ==================== COMPONENT 1: WORKLOAD & COMPUTING LAYER (LEFT) ==================== -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="280" height="380" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="38" rx="14" fill="rgba(59, 130, 246, 0.15)" />
    <text x="140" y="24" fill="#60a5fa" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Workload &amp; Host-Laptop</text>

    <!-- Sub-Block A: Applications & Inference -->
    <g transform="translate(15, 52)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="60" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="12" y="22" fill="#f8fafc" font-size="12" font-weight="600">Applikationsebene</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">• Lokale LLM-Inferenz (Ollama, vLLM)</text>
      <text x="12" y="50" fill="#94a3b8" font-size="10">• 3D-CAD, Simulation &amp; Rendering / Gaming</text>
    </g>

    <!-- Sub-Block B: Hardware Core / GPU-SoC -->
    <g transform="translate(15, 122)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="74" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="20" fill="#60a5fa" font-size="12" font-weight="700">Compute Silicon (CPU / dGPU)</text>
      <text x="12" y="37" fill="#cbd5e1" font-size="10">• VRAM / Tensor Cores (TDP 80W - 175W)</text>
      <text x="12" y="52" fill="#f59e0b" font-size="10">• TjMax 100°C / Hotspot-Management</text>
      <text x="12" y="66" fill="#38bdf8" font-size="10">• Dynamic Boost &amp; Clock Scaling</text>
    </g>

    <!-- Sub-Block C: Laptop Fan & Thermal Intake/Exhaust -->
    <g transform="translate(15, 206)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="74" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="12" y="20" fill="#f8fafc" font-size="12" font-weight="600">Internes Lüftermodul</text>
      <text x="12" y="37" fill="#94a3b8" font-size="10">• Dual Radial-Blower (4500-6000 RPM)</text>
      <text x="12" y="52" fill="#ef4444" font-size="10">• Abwärts- und Heck-Abluftdüsen</text>
      <text x="12" y="66" fill="#10b981" font-size="10">• Unterboden-Ansaugdruckbereich</text>
    </g>

    <!-- Sub-Block D: Telemetry Daemon -->
    <g transform="translate(15, 290)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="74" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="12" y="20" fill="#a855f7" font-size="12" font-weight="600">Telemetrie &amp; Regelung</text>
      <text x="12" y="37" fill="#cbd5e1" font-size="10">• Thermal Sensor Polling (NVML API)</text>
      <text x="12" y="52" fill="#cbd5e1" font-size="10">• Fan Curve Optimierung</text>
      <text x="12" y="66" fill="#cbd5e1" font-size="10">• Throttling-Prävention (0% Drossel)</text>
    </g>
  </g>

  <!-- ==================== COMPONENT 2: CNC SOLID WOOD COOLING DOCK (CENTER) ==================== -->
  <g transform="translate(360, 140)">
    <rect x="0" y="0" width="280" height="380" rx="14" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="38" rx="14" fill="rgba(217, 119, 6, 0.15)" />
    <text x="140" y="24" fill="#fbbf24" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. Massivholz-Kühldock</text>

    <!-- Sub-Block A: Milled Wooden Monolith -->
    <g transform="translate(15, 52)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="60" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="12" y="20" fill="#fef08a" font-size="12" font-weight="700">Massivholz-Korpus (CNC)</text>
      <text x="12" y="36" fill="#94a3b8" font-size="10">• 14° Ergonomischer Neigungskeil</text>
      <text x="12" y="50" fill="#94a3b8" font-size="10">• Akustische Eigendämpfung von Holz</text>
    </g>

    <!-- Sub-Block B: Aerodynamic Grid & Lattice -->
    <g transform="translate(15, 122)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="74" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="20" fill="#38bdf8" font-size="12" font-weight="700">Fluidik- &amp; Gitterstruktur</text>
      <text x="12" y="37" fill="#cbd5e1" font-size="10">• Aerodynamische Diffusorkammern</text>
      <text x="12" y="52" fill="#cbd5e1" font-size="10">• Strömungsleit-Lamellen (Lattice)</text>
      <text x="12" y="66" fill="#10b981" font-size="10">• Strömungswiderstand sinkt um 68%</text>
    </g>

    <!-- Sub-Block C: Thermal Exhaust Diffusers -->
    <g transform="translate(15, 206)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="74" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="12" y="20" fill="#ef4444" font-size="12" font-weight="600">Abluft-Lenkung &amp; Entlüftung</text>
      <text x="12" y="37" fill="#94a3b8" font-size="10">• Gezielte Ableitung nach hinten/seitlich</text>
      <text x="12" y="52" fill="#94a3b8" font-size="10">• Verhindert thermischen Rückstau</text>
      <text x="12" y="66" fill="#94a3b8" font-size="10">• Keine Heißluft-Re-Zirkulation</text>
    </g>

    <!-- Sub-Block D: Modular Interface (Optional Active Fans) -->
    <g transform="translate(15, 290)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="74" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="12" y="20" fill="#10b981" font-size="12" font-weight="600">Optionale Aktiv-Erweiterung</text>
      <text x="12" y="37" fill="#cbd5e1" font-size="10">• Lautlose 120mm Silent-Blower (USB-C)</text>
      <text x="12" y="52" fill="#cbd5e1" font-size="10">• Geschwindigkeitsregelung via PWM</text>
      <text x="12" y="66" fill="#cbd5e1" font-size="10">• Magnetische Schnellwechsel-Kassetten</text>
    </g>
  </g>

  <!-- ==================== COMPONENT 3: ENVIRONMENT & WORKSPACE (RIGHT) ==================== -->
  <g transform="translate(680, 140)">
    <rect x="0" y="0" width="280" height="380" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="38" rx="14" fill="rgba(16, 185, 129, 0.15)" />
    <text x="140" y="24" fill="#34d399" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. Arbeitsplatz &amp; Umwelt</text>

    <!-- Sub-Block A: Desk & Acoustic Environment -->
    <g transform="translate(15, 52)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="60" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="12" y="20" fill="#f8fafc" font-size="12" font-weight="600">Tischoberfläche &amp; Akustik</text>
      <text x="12" y="36" fill="#94a3b8" font-size="10">• Schreibtischoberfläche bleibt kühl</text>
      <text x="12" y="50" fill="#94a3b8" font-size="10">• Reduzierte Lüfterdrehzahl (-8 dB(A))</text>
    </g>

    <!-- Sub-Block B: Thermal Ambient Dissipation -->
    <g transform="translate(15, 122)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="74" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="20" fill="#fbbf24" font-size="12" font-weight="700">Thermische Verlustwärme (Q)</text>
      <text x="12" y="37" fill="#cbd5e1" font-size="10">• Freie Konvektion im Raum</text>
      <text x="12" y="52" fill="#cbd5e1" font-size="10">• Keine Hitzestau-Hotspots am Tisch</text>
      <text x="12" y="66" fill="#10b981" font-size="10">• Längere Hardware-Lebensdauer</text>
    </g>

    <!-- Sub-Block C: Fresh Air Supply -->
    <g transform="translate(15, 206)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="74" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="12" y="20" fill="#38bdf8" font-size="12" font-weight="600">Frischluft-Zustrom</text>
      <text x="12" y="37" fill="#94a3b8" font-size="10">• Ungehinderter Luftzutritt</text>
      <text x="12" y="52" fill="#94a3b8" font-size="10">• Delta-T (T_Inlet - T_Ambient) &lt; 1.5 K</text>
      <text x="12" y="66" fill="#94a3b8" font-size="10">• Optimale Ansaugtemperatur</text>
    </g>

    <!-- Sub-Block D: Sustainable Material Lifecycle -->
    <g transform="translate(15, 290)" font-family="'Outfit', 'Inter', sans-serif">
      <rect width="250" height="74" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="12" y="20" fill="#a7f3d0" font-size="12" font-weight="600">Nachhaltigkeit &amp; Haptik</text>
      <text x="12" y="37" fill="#cbd5e1" font-size="10">• Nachwachsender Rohstoff Holz</text>
      <text x="12" y="52" fill="#cbd5e1" font-size="10">• 100% biologisch abbaubar / reparierbar</text>
      <text x="12" y="66" fill="#cbd5e1" font-size="10">• Ästhetisches Premium-Workspace-Design</text>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTIONS BETWEEN LAYERS ==================== -->
  
  <!-- Flow 1: Heat Energy Flow (Laptop -> Stand -> Environment) -->
  <g fill="none">
    <!-- From Silicon to Stand Fluidics -->
    <path d="M 295,300 L 360,300" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-energy)" />
    <!-- From Stand to Environment -->
    <path d="M 640,300 L 680,300" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-energy)" />
  </g>

  <!-- Flow 2: Airflow / Material Loop (Environment -> Stand -> Laptop -> Environment) -->
  <g fill="none">
    <!-- Cool Inflow: Environment -> Stand -->
    <path d="M 680,390 L 640,390" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-material)" />
    <!-- Cool Inflow: Stand -> Laptop Fans -->
    <path d="M 360,390 L 295,390" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-material)" />
  </g>

  <!-- Flow 3: Telemetry Feedback Loop (Data Flow dashed) -->
  <g fill="none">
    <!-- Control: Laptop Telemetry to Stand Active Fans (bottom loop) -->
    <path d="M 295,475 L 360,475" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-data)" />
  </g>

  <!-- FOOTER BAR -->
  <g transform="translate(40, 560)">
    <rect width="920" height="34" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="20" y="21" fill="#94a3b8" font-family="'Outfit', 'Inter', sans-serif" font-size="11">
      FH OÖ Campus Wels | Professur für Industrieinformatik • <tspan fill="#60a5fa">Multi-Domain Modeling: Thermal, Fluid &amp; Cyber-Physical Performance</tspan>
    </text>
  </g>
</svg>

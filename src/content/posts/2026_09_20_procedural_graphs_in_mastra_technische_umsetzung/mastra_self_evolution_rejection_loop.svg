<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', system-ui, sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <linearGradient id="evo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--svg-node-amber-border)"/>
      <stop offset="50%" stop-color="var(--svg-node-red-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-green-border)"/>
    </linearGradient>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-amber-border)"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-red-border)"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-green-border)"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-blue-border)"/>
    </marker>
  </defs>

  <!-- Frame -->
  <rect x="12" y="12" width="876" height="396" rx="16" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="48" fill="url(#evo-grad)" font-size="20" font-weight="800">Mastra Offline Self-Evolution Loop</text>
  <text x="40" y="70" fill="var(--svg-text-secondary)" font-size="13">Kontinuierliche Graph-Härtung mit Rejection Memory und Mastra Evals</text>

  <!-- 1. Traces -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="170" height="100" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <text x="85" y="42" fill="var(--svg-node-blue-border)" font-size="13" font-weight="800" text-anchor="middle">1. TRACES</text>
    <text x="85" y="70" fill="var(--svg-text-primary)" font-size="15" font-weight="700" text-anchor="middle">Execution Logs</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 215 170 L 245 170" stroke="var(--svg-node-amber-border)" stroke-width="2.5" marker-end="url(#arr-amber)"/>

  <!-- 2. Refiner Agent -->
  <g transform="translate(255, 120)">
    <rect x="0" y="0" width="175" height="100" rx="12" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
    <text x="87" y="42" fill="var(--svg-node-amber-border)" font-size="13" font-weight="800" text-anchor="middle">2. REFINER</text>
    <text x="87" y="70" fill="var(--svg-text-primary)" font-size="15" font-weight="700" text-anchor="middle">Refiner Agent</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 435 170 L 465 170" stroke="var(--svg-node-red-border)" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- 3. Rejection Memory Filter -->
  <g transform="translate(475, 120)">
    <rect x="0" y="0" width="185" height="100" rx="12" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1.5"/>
    <text x="92" y="42" fill="var(--svg-node-red-border)" font-size="13" font-weight="800" text-anchor="middle">3. MEMORY</text>
    <text x="92" y="70" fill="var(--svg-text-primary)" font-size="15" font-weight="700" text-anchor="middle">Rejection Filter</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 665 170 L 695 170" stroke="var(--svg-node-green-border)" stroke-width="2.5" marker-end="url(#arr-emerald)"/>

  <!-- 4. Validation Gate -->
  <g transform="translate(705, 120)">
    <rect x="0" y="0" width="155" height="100" rx="12" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <text x="77" y="42" fill="var(--svg-node-green-border)" font-size="13" font-weight="800" text-anchor="middle">4. GATE</text>
    <text x="77" y="70" fill="var(--svg-text-primary)" font-size="15" font-weight="700" text-anchor="middle">Mastra Evals</text>
  </g>

  <!-- Loop back to Production Graph Store -->
  <g transform="translate(255, 275)">
    <rect x="0" y="0" width="390" height="75" rx="12" fill="var(--svg-pill-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <text x="195" y="34" fill="var(--svg-node-blue-border)" font-size="13" font-weight="800" text-anchor="middle">5. PRODUKTIONS-GRAPH</text>
    <text x="195" y="58" fill="var(--svg-text-primary)" font-size="15" font-weight="700" text-anchor="middle">Aktualisierter Procedural Graph</text>
  </g>

  <!-- Arrow Gate down to Production Graph -->
  <path d="M 782 225 L 782 312 L 655 312" stroke="var(--svg-node-green-border)" stroke-width="2.5" marker-end="url(#arr-emerald)"/>

  <!-- Arrow from Production Graph to Traces (Continuous loop) -->
  <path d="M 255 312 L 125 312 L 125 230" stroke="var(--svg-node-blue-border)" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-blue)"/>
  <text x="190" y="335" fill="var(--svg-text-secondary)" font-size="11" text-anchor="middle">Produktiver Einsatz</text>
</svg>
    <text x="20" y="80" fill="#ffffff" font-family="Outfit, sans-serif" font-size="20" font-weight="700">Answer Engine</text>
    <text x="20" y="104" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="500">Direktantwort-Systeme</text>

    <line x1="20" y1="125" x2="235" y2="125" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <text x="20" y="150" fill="#fde047" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ZIELGRUPPE</text>
    <text x="20" y="170" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="13">AI Overviews, Voice Search</text>

    <text x="20" y="210" fill="#fde047" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1">KERNFOKUS</text>
    <text x="20" y="232" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">• Answer-First Kernaussagen</text>
    <text x="20" y="254" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">• FAQPage Schema Markup</text>
    <text x="20" y="276" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">• Strukturierte Tabellen</text>
    <text x="20" y="298" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">• Direct Answer Callouts</text>

    <rect x="20" y="325" width="215" height="32" rx="10" fill="rgba(234, 179, 8, 0.1)" stroke="rgba(234, 179, 8, 0.2)" />
    <text x="127" y="345" fill="#fef08a" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Featured Snippets</text>
  </g>

  <!-- Column 4: AIO -->
  <g transform="translate(895, 185)">
    <rect width="255" height="380" rx="20" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />
    <rect width="255" height="6" rx="3" fill="url(#green-grad)" />
    
    <rect x="20" y="24" width="60" height="26" rx="8" fill="rgba(16, 185, 129, 0.15)" />
    <text x="50" y="41" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle">AIO</text>
    
    <text x="20" y="80" fill="#ffffff" font-family="Outfit, sans-serif" font-size="20" font-weight="700">AI Optimization</text>
    <text x="20" y="104" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="500">Autonome KI-Agenten</text>

    <line x1="20" y1="125" x2="235" y2="125" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <text x="20" y="150" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ZIELGRUPPE</text>
    <text x="20" y="170" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="13">Autonomous Agents &amp; APIs</text>

    <text x="20" y="210" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1">KERNFOKUS</text>
    <text x="20" y="232" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">• JSON-LD Schema Suite</text>
    <text x="20" y="254" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">• Content Manifest API</text>
    <text x="20" y="276" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">• E-E-A-T Signale &amp; BibTeX</text>
    <text x="20" y="298" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">• RAG Context Chunking</text>

    <rect x="20" y="325" width="215" height="32" rx="10" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.2)" />
    <text x="127" y="345" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agentische Aktionen</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <!-- Drop Shadow -->
    <filter id="shadow-ml" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Outer Frame -->
  <rect x="10" y="10" width="860" height="480" rx="16" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="2"/>

  <!-- Headline -->
  <text x="35" y="42" fill="var(--svg-text-primary)" font-size="18" font-weight="bold">Kommerzielle Marktlandschaft &amp; Software-Ökosysteme</text>
  <text x="35" y="62" fill="var(--svg-text-secondary)" font-size="12">Positionierung kommerzieller Angebote im Spannungsfeld aus Verhaltensoptimierung und Kognitionsförderung</text>

  <!-- ==================== QUADRANT 1: B2C ENGAGEMENT PLATFORMS ==================== -->
  <g filter="url(#shadow-ml)">
    <rect x="30" y="85" width="400" height="175" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-red-border)" stroke-width="1.5"/>
    <rect x="30" y="85" width="400" height="34" rx="10" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1.5"/>
    <text x="45" y="107" fill="var(--svg-node-red-subtext)" font-size="12" font-weight="bold">1. B2C Attention- &amp; Feed-Ökosysteme</text>

    <g transform="translate(45, 128)">
      <text x="0" y="12" fill="var(--svg-text-secondary)" font-size="10.5">Ziel: Maximierung von Verweildauer &amp; Werbeinventar</text>

      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="370" height="92" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
        <text x="10" y="20" fill="var(--svg-node-red-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-red-border)">TikTok (ByteDance):</tspan> Realtime Monolith Recommender</text>
        <text x="10" y="38" fill="var(--svg-node-red-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-red-border)">Meta (Instagram):</tspan> Discovery Engine &amp; Social Graph</text>
        <text x="10" y="56" fill="var(--svg-node-red-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-red-border)">YouTube &amp; X:</tspan> Deep Candidate Scoring &amp; Virality</text>
        <text x="10" y="78" fill="var(--svg-text-secondary)" font-size="9.5">Hebel: Variable Belohnungspläne &amp; Infinite Feeds</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 2: B2B BEHAVIORAL ANALYTICS & TESTING ==================== -->
  <g filter="url(#shadow-ml)">
    <rect x="450" y="85" width="400" height="175" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
    <rect x="450" y="85" width="400" height="34" rx="10" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
    <text x="465" y="107" fill="var(--svg-node-amber-subtext)" font-size="12" font-weight="bold">2. B2B Analytics &amp; Experimentation</text>

    <g transform="translate(465, 128)">
      <text x="0" y="12" fill="var(--svg-text-secondary)" font-size="10.5">Ziel: Verhaltenskohorten &amp; Conversion-Optimierung</text>

      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="370" height="92" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
        <text x="10" y="20" fill="var(--svg-node-amber-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-amber-border)">Amplitude / Mixpanel:</tspan> Clickstream- &amp; Funnel-Tracking</text>
        <text x="10" y="38" fill="var(--svg-node-amber-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-amber-border)">Statsig / LaunchDarkly:</tspan> Multivariate Realtime A/B-Tests</text>
        <text x="10" y="56" fill="var(--svg-node-amber-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-amber-border)">Braze / OneSignal:</tspan> Predictive AI-Push &amp; In-App Nudges</text>
        <text x="10" y="78" fill="var(--svg-text-secondary)" font-size="9.5">Hebel: Statistische A/B-Optimierung von Reiz-Reaktionen</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 3: EMOTION AI & PARASOCIAL COMPANIONS ==================== -->
  <g filter="url(#shadow-ml)">
    <rect x="30" y="280" width="400" height="175" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.5"/>
    <rect x="30" y="280" width="400" height="34" rx="10" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.5"/>
    <text x="45" y="302" fill="var(--svg-node-purple-subtext)" font-size="12" font-weight="bold">3. Affective Computing &amp; Emotion AI</text>

    <g transform="translate(45, 323)">
      <text x="0" y="12" fill="var(--svg-text-secondary)" font-size="10.5">Ziel: Affekterkennung &amp; parasoziale Interaktion</text>

      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="370" height="92" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
        <text x="10" y="20" fill="var(--svg-node-purple-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-purple-border)">Hume AI (EVI):</tspan> Empathische Stimmprosodie</text>
        <text x="10" y="38" fill="var(--svg-node-purple-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-purple-border)">Affectiva / Smart Eye:</tspan> Mimik- &amp; Blickverfolgung</text>
        <text x="10" y="56" fill="var(--svg-node-purple-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-purple-border)">Woebot &amp; Replika:</tspan> CBT-Therapie &amp; AI-Companions</text>
        <text x="10" y="78" fill="var(--svg-text-secondary)" font-size="9.5">Hebel: CASA-Paradigma &amp; Anthropomorphismus</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 4: DIGITAL WELLBEING & COGNITIVE PRODUCTIVITY ==================== -->
  <g filter="url(#shadow-ml)">
    <rect x="450" y="280" width="400" height="175" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <rect x="450" y="280" width="400" height="34" rx="10" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <text x="465" y="302" fill="var(--svg-node-green-subtext)" font-size="12" font-weight="bold">4. Digital Wellbeing &amp; Fokus-Tools</text>

    <g transform="translate(465, 323)">
      <text x="0" y="12" fill="var(--svg-text-secondary)" font-size="10.5">Ziel: Schutz mentaler Ressourcen &amp; Flow-Erhalt</text>

      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="370" height="92" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
        <text x="10" y="20" fill="var(--svg-node-green-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-green-border)">Opal &amp; Freedom:</tspan> Systemweite App- &amp; Web-Blocker</text>
        <text x="10" y="38" fill="var(--svg-node-green-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-green-border)">Rize.io &amp; RescueTime:</tspan> KI-Fokus- &amp; Ermüdungsanalyse</text>
        <text x="10" y="56" fill="var(--svg-node-green-subtext)" font-size="10.5">• <tspan font-weight="bold" fill="var(--svg-node-green-border)">Apple &amp; Google:</tspan> Screen Time, Focus Modes &amp; Nudges</text>
        <text x="10" y="78" fill="var(--svg-text-secondary)" font-size="9.5">Hebel: Kognitive Entlastung &amp; Selbstkontrolle</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', sans-serif;">
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow-ml" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Canvas Outer Frame -->
  <rect x="10" y="10" width="860" height="480" rx="16" fill="#0b1329" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Headline -->
  <text x="35" y="42" fill="#f8fafc" font-size="18" font-weight="bold">Kommerzielle Marktlandschaft &amp; Software-Ökosysteme</text>
  <text x="35" y="62" fill="#94a3b8" font-size="12">Positionierung kommerzieller Angebote im Spannungsfeld aus Verhaltensoptimierung und Kognitionsförderung</text>

  <!-- ==================== QUADRANT 1: B2C ENGAGEMENT PLATFORMS ==================== -->
  <g filter="url(#shadow-ml)">
    <rect x="30" y="85" width="400" height="175" rx="10" fill="#111827" stroke="#ef4444" stroke-width="1.5" />
    <rect x="30" y="85" width="400" height="34" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
    <text x="45" y="107" fill="#fca5a5" font-size="12" font-weight="bold">1. B2C Attention- &amp; Feed-Ökosysteme</text>

    <g transform="translate(45, 128)">
      <text x="0" y="12" fill="#94a3b8" font-size="10.5">Ziel: Maximierung von Verweildauer &amp; Werbeinventar</text>

      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="370" height="92" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="10" y="20" fill="#fecaca" font-size="10.5">• <tspan font-weight="bold" fill="#f87171">TikTok (ByteDance):</tspan> Realtime Monolith Recommender</text>
        <text x="10" y="38" fill="#fecaca" font-size="10.5">• <tspan font-weight="bold" fill="#f87171">Meta (Instagram):</tspan> Discovery Engine &amp; Social Graph</text>
        <text x="10" y="56" fill="#fecaca" font-size="10.5">• <tspan font-weight="bold" fill="#f87171">YouTube &amp; X:</tspan> Deep Candidate Scoring &amp; Virality</text>
        <text x="10" y="78" fill="#94a3b8" font-size="9.5">Hebel: Variable Belohnungspläne &amp; Infinite Feeds</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 2: B2B BEHAVIORAL ANALYTICS & TESTING ==================== -->
  <g filter="url(#shadow-ml)">
    <rect x="450" y="85" width="400" height="175" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="450" y="85" width="400" height="34" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
    <text x="465" y="107" fill="#fde047" font-size="12" font-weight="bold">2. B2B Analytics &amp; Experimentation</text>

    <g transform="translate(465, 128)">
      <text x="0" y="12" fill="#94a3b8" font-size="10.5">Ziel: Verhaltenskohorten &amp; Conversion-Optimierung</text>

      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="370" height="92" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="10" y="20" fill="#fef3c7" font-size="10.5">• <tspan font-weight="bold" fill="#fbbf24">Amplitude / Mixpanel:</tspan> Clickstream- &amp; Funnel-Tracking</text>
        <text x="10" y="38" fill="#fef3c7" font-size="10.5">• <tspan font-weight="bold" fill="#fbbf24">Statsig / LaunchDarkly:</tspan> Multivariate Realtime A/B-Tests</text>
        <text x="10" y="56" fill="#fef3c7" font-size="10.5">• <tspan font-weight="bold" fill="#fbbf24">Braze / OneSignal:</tspan> Predictive AI-Push &amp; In-App Nudges</text>
        <text x="10" y="78" fill="#94a3b8" font-size="9.5">Hebel: Statistische A/B-Optimierung von Reiz-Reaktionen</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 3: EMOTION AI & PARASOCIAL COMPANIONS ==================== -->
  <g filter="url(#shadow-ml)">
    <rect x="30" y="280" width="400" height="175" rx="10" fill="#111827" stroke="#a855f7" stroke-width="1.5" />
    <rect x="30" y="280" width="400" height="34" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
    <text x="45" y="302" fill="#e9d5ff" font-size="12" font-weight="bold">3. Affective Computing &amp; Emotion AI</text>

    <g transform="translate(45, 323)">
      <text x="0" y="12" fill="#94a3b8" font-size="10.5">Ziel: Affekterkennung &amp; parasoziale Interaktion</text>

      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="370" height="92" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="10" y="20" fill="#f3e8ff" font-size="10.5">• <tspan font-weight="bold" fill="#c084fc">Hume AI (EVI):</tspan> Empathische Stimmprosodie</text>
        <text x="10" y="38" fill="#f3e8ff" font-size="10.5">• <tspan font-weight="bold" fill="#c084fc">Affectiva / Smart Eye:</tspan> Mimik- &amp; Blickverfolgung</text>
        <text x="10" y="56" fill="#f3e8ff" font-size="10.5">• <tspan font-weight="bold" fill="#c084fc">Woebot &amp; Replika:</tspan> CBT-Therapie &amp; AI-Companions</text>
        <text x="10" y="78" fill="#94a3b8" font-size="9.5">Hebel: CASA-Paradigma &amp; Anthropomorphismus</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 4: DIGITAL WELLBEING & COGNITIVE PRODUCTIVITY ==================== -->
  <g filter="url(#shadow-ml)">
    <rect x="450" y="280" width="400" height="175" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <rect x="450" y="280" width="400" height="34" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="465" y="302" fill="#a7f3d0" font-size="12" font-weight="bold">4. Digital Wellbeing &amp; Fokus-Tools</text>

    <g transform="translate(465, 323)">
      <text x="0" y="12" fill="#94a3b8" font-size="10.5">Ziel: Schutz mentaler Ressourcen &amp; Flow-Erhalt</text>

      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="370" height="92" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="10" y="20" fill="#d1fae5" font-size="10.5">• <tspan font-weight="bold" fill="#34d399">Opal &amp; Freedom:</tspan> Systemweite App- &amp; Web-Blocker</text>
        <text x="10" y="38" fill="#d1fae5" font-size="10.5">• <tspan font-weight="bold" fill="#34d399">Rize.io &amp; RescueTime:</tspan> KI-Fokus- &amp; Ermüdungsanalyse</text>
        <text x="10" y="56" fill="#d1fae5" font-size="10.5">• <tspan font-weight="bold" fill="#34d399">Apple &amp; Google:</tspan> Screen Time, Focus Modes &amp; Nudges</text>
        <text x="10" y="78" fill="#94a3b8" font-size="9.5">Hebel: Kognitive Entlastung &amp; Selbstkontrolle</text>
      </g>
    </g>
  </g>
</svg>

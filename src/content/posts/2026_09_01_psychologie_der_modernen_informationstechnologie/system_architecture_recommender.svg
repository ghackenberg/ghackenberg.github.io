<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <!-- Arrow Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-purple-border)"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)"/>
    </marker>
    <marker id="arr-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-amber-border)"/>
    </marker>

    <!-- Comic Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Canvas Outer Frame -->
  <rect x="10" y="10" width="860" height="480" rx="16" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="2"/>

  <!-- Diagram Header -->
  <text x="35" y="42" fill="var(--svg-text-primary)" font-size="18" font-weight="bold">Architektur moderner Engagement- &amp; Recommender-Systeme</text>
  <text x="35" y="62" fill="var(--svg-text-secondary)" font-size="12">Softwaretechnische Pipeline zur Verhaltenssteuerung und kognitiven Interaktion</text>

  <!-- ==================== STAGE 1: EVENT TELEMETRY ==================== -->
  <g filter="url(#shadow)">
    <rect x="35" y="90" width="185" height="270" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="2"/>
    <rect x="35" y="90" width="185" height="36" rx="12" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="2"/>
    <text x="50" y="113" fill="var(--svg-node-blue-border)" font-size="12" font-weight="bold">1. Telemetrie &amp; Ingestion</text>

    <!-- Sub-elements -->
    <g transform="translate(45, 138)">
      <rect x="0" y="0" width="165" height="45" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="10" y="18" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">Clickstream-Sensorik</text>
      <text x="10" y="34" fill="var(--svg-text-secondary)" font-size="9.5">Dwell Time, Scroll, Hovers</text>

      <rect x="0" y="55" width="165" height="45" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="10" y="73" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">Event Streaming</text>
      <text x="10" y="89" fill="var(--svg-text-secondary)" font-size="9.5">Kafka / Flink Pipelines</text>

      <rect x="0" y="110" width="165" height="55" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="10" y="128" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">Affektive Telemetrie</text>
      <text x="10" y="144" fill="var(--svg-text-secondary)" font-size="9.5">Pupillometrie &amp; Eye-Gaze</text>
      <text x="10" y="157" fill="var(--svg-text-secondary)" font-size="9.5">(Spatial / Edge Sensing)</text>
    </g>
  </g>

  <!-- Flow 1 -> 2 -->
  <line x1="220" y1="225" x2="245" y2="225" stroke="var(--svg-node-blue-border)" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- ==================== STAGE 2: CANDIDATE RETRIEVAL ==================== -->
  <g filter="url(#shadow)">
    <rect x="250" y="90" width="185" height="270" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="2"/>
    <rect x="250" y="90" width="185" height="36" rx="12" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="2"/>
    <text x="265" y="113" fill="var(--svg-node-purple-border)" font-size="12" font-weight="bold">2. Candidate Retrieval</text>

    <!-- Sub-elements -->
    <g transform="translate(260, 138)">
      <rect x="0" y="0" width="165" height="45" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="10" y="18" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">Two-Tower DNN</text>
      <text x="10" y="34" fill="var(--svg-text-secondary)" font-size="9.5">User- &amp; Item-Embeddings</text>

      <rect x="0" y="55" width="165" height="45" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="10" y="73" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">Vektor-Datenbanken</text>
      <text x="10" y="89" fill="var(--svg-text-secondary)" font-size="9.5">ANN Search (Milvus/Qdrant)</text>

      <rect x="0" y="110" width="165" height="55" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="10" y="128" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">Reduktion &amp; Filter</text>
      <text x="10" y="144" fill="var(--svg-text-secondary)" font-size="9.5">10M+ Items → Top 1.000</text>
      <text x="10" y="157" fill="var(--svg-text-secondary)" font-size="9.5">Latenz &lt; 15 ms</text>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <line x1="435" y1="225" x2="460" y2="225" stroke="var(--svg-node-purple-border)" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- ==================== STAGE 3: HEAVY RANKING ==================== -->
  <g filter="url(#shadow)">
    <rect x="465" y="90" width="185" height="270" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-amber-border)" stroke-width="2"/>
    <rect x="465" y="90" width="185" height="36" rx="12" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="2"/>
    <text x="480" y="113" fill="var(--svg-node-amber-subtext)" font-size="12" font-weight="bold">3. Heavy Ranking &amp; AI</text>

    <!-- Sub-elements -->
    <g transform="translate(475, 138)">
      <rect x="0" y="0" width="165" height="45" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="10" y="18" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">Transformer / GNN</text>
      <text x="10" y="34" fill="var(--svg-text-secondary)" font-size="9.5">Graph Neural Networks</text>

      <rect x="0" y="55" width="165" height="55" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="10" y="73" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">Multi-Objective Opt.</text>
      <text x="10" y="89" fill="var(--svg-text-secondary)" font-size="9.5">CTR + Dwell + Virality</text>
      <text x="10" y="102" fill="var(--svg-text-secondary)" font-size="9.5">vs. Churn-Risiko</text>

      <rect x="0" y="120" width="165" height="45" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="10" y="138" fill="var(--svg-text-primary)" font-size="11" font-weight="bold">A/B Testing Engines</text>
      <text x="10" y="154" fill="var(--svg-text-secondary)" font-size="9.5">Statsig / LaunchDarkly</text>
    </g>
  </g>

  <!-- Flow 3 -> 4 -->
  <line x1="650" y1="225" x2="675" y2="225" stroke="var(--svg-node-amber-border)" stroke-width="2.5" marker-end="url(#arr-yellow)"/>

  <!-- ==================== STAGE 4: PERSUASIVE ACTUATION ==================== -->
  <g filter="url(#shadow)">
    <rect x="680" y="90" width="165" height="270" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="2"/>
    <rect x="680" y="90" width="165" height="36" rx="12" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="2"/>
    <text x="695" y="113" fill="var(--svg-node-green-subtext)" font-size="12" font-weight="bold">4. Persuasive UI</text>

    <!-- Sub-elements -->
    <g transform="translate(690, 138)">
      <rect x="0" y="0" width="145" height="45" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="8" y="18" fill="var(--svg-text-primary)" font-size="10.5" font-weight="bold">Infinite Feed UI</text>
      <text x="8" y="34" fill="var(--svg-text-secondary)" font-size="9">Prefetching Cache</text>

      <rect x="0" y="55" width="145" height="45" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="8" y="73" fill="var(--svg-text-primary)" font-size="10.5" font-weight="bold">Bandit Push Engine</text>
      <text x="8" y="89" fill="var(--svg-text-secondary)" font-size="9">Adaptive Notifications</text>

      <rect x="0" y="110" width="145" height="55" rx="6" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1"/>
      <text x="8" y="128" fill="var(--svg-text-primary)" font-size="10.5" font-weight="bold">Habit Gamification</text>
      <text x="8" y="144" fill="var(--svg-text-secondary)" font-size="9">Streaks &amp; Badges</text>
      <text x="8" y="157" fill="var(--svg-text-secondary)" font-size="9">(Redis Sorted Sets)</text>
    </g>
  </g>

  <!-- ==================== BOTTOM FEEDBACK BAR: PSYCHOLOGICAL IMPACT ==================== -->
  <g filter="url(#shadow)">
    <rect x="35" y="380" width="810" height="90" rx="10" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.5"/>
    <text x="55" y="405" fill="var(--svg-node-purple-subtext)" font-size="13" font-weight="bold">Kognitive &amp; Neurobiologische Rückkopplung (Psychologischer Stand der Wissenschaft):</text>
    <text x="55" y="428" fill="var(--svg-text-secondary)" font-size="11.5">• <tspan fill="var(--svg-node-purple-border)" font-weight="bold">Variable Belohnungspläne</tspan> (B.F. Skinner / Hook-Loop) triggern phasische Dopaminausschüttungen im Nucleus Accumbens.</text>
    <text x="55" y="448" fill="var(--svg-text-secondary)" font-size="11.5">• <tspan fill="var(--svg-node-blue-border)" font-weight="bold">Intermittierende Push-Signale</tspan> überfordern den präfrontalen Kortex, erzeugen Fragmentierung und bis zu 23 Minuten Task-Switching-Kosten.</text>
  </g>

  <!-- Curved Return Arrow from UI to User Telemetry -->
  <path d="M 760 365 C 760 380, 500 375, 120 375 C 120 375, 120 365, 120 365" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="2" stroke-dasharray="4 4"/>
</svg>

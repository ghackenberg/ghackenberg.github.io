<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <!-- Drop Shadow -->
    <filter id="shadow-cl" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="860" height="460" rx="16" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="2"/>

  <!-- Headline -->
  <text x="35" y="42" fill="var(--svg-text-primary)" font-size="18" font-weight="bold">Kognitive Belastung &amp; Aufmerksamkeitsdynamik</text>
  <text x="35" y="62" fill="var(--svg-text-secondary)" font-size="12">Informationsverarbeitung im Arbeitsgedächtnis versus Unterbrechungsökonomie</text>

  <!-- ==================== LEFT: COGNITIVE LOAD MODEL ==================== -->
  <g filter="url(#shadow-cl)">
    <!-- Container Card -->
    <rect x="30" y="85" width="400" height="365" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="2"/>
    <!-- Header -->
    <rect x="30" y="85" width="400" height="38" rx="12" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="2"/>
    <text x="48" y="109" fill="var(--svg-node-blue-border)" font-size="13" font-weight="bold">Cognitive Load Theory (John Sweller)</text>

    <!-- 1. Extraneous Load -->
    <g transform="translate(48, 136)">
      <rect x="0" y="0" width="364" height="68" rx="8" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1.5"/>
      <text x="12" y="20" fill="var(--svg-node-red-subtext)" font-size="11.5" font-weight="bold">Extraneous Load (Störbelastung)</text>
      <text x="12" y="38" fill="var(--svg-node-red-subtext)" font-size="10">• Reizüberflutung, schlechte UX, Störungen &amp; Dark Patterns</text>
      <text x="12" y="54" fill="var(--svg-node-red-subtext)" font-size="10">• Verschwendet begrenzte Arbeitsgedächtnis-Kapazität</text>
    </g>

    <!-- 2. Intrinsic Load -->
    <g transform="translate(48, 214)">
      <rect x="0" y="0" width="364" height="68" rx="8" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
      <text x="12" y="20" fill="var(--svg-node-blue-subtext)" font-size="11.5" font-weight="bold">Intrinsic Load (Aufgabenkomplexität)</text>
      <text x="12" y="38" fill="var(--svg-node-blue-subtext)" font-size="10">• Inhärente gedankliche Schwierigkeit der Kernaufgabe</text>
      <text x="12" y="54" fill="var(--svg-node-blue-subtext)" font-size="10">• Abhängig vom Wissensstand (Experte vs. Einsteiger)</text>
    </g>

    <!-- 3. Germane Load -->
    <g transform="translate(48, 292)">
      <rect x="0" y="0" width="364" height="68" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
      <text x="12" y="20" fill="var(--svg-node-green-subtext)" font-size="11.5" font-weight="bold">Germane Load (Nachhaltiges Lernen)</text>
      <text x="12" y="38" fill="var(--svg-node-green-subtext)" font-size="10">• Konstruktion mentaler Schemata im Langzeitgedächtnis</text>
      <text x="12" y="54" fill="var(--svg-node-green-subtext)" font-size="10">• <tspan font-weight="bold">Ziel gesunder IT:</tspan> Störlast senken, Lernlast ermöglichen</text>
    </g>

    <!-- Bottom Capacity Note -->
    <text x="48" y="434" fill="var(--svg-text-secondary)" font-size="10.5">Kapazitätsgrenze des Arbeitsgedächtnisses: nur ca. 4 ± 1 Einheiten</text>
  </g>

  <!-- ==================== RIGHT: ATTENTION & TASK SWITCHING ==================== -->
  <g filter="url(#shadow-cl)">
    <!-- Container Card -->
    <rect x="450" y="85" width="400" height="365" rx="12" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="2"/>
    <!-- Header -->
    <rect x="450" y="85" width="400" height="38" rx="12" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="2"/>
    <text x="468" y="109" fill="var(--svg-node-purple-border)" font-size="13" font-weight="bold">Aufmerksamkeit &amp; Unterbrechungskosten</text>

    <!-- Interruption Flow Sequence -->
    <g transform="translate(468, 136)">
      <!-- Flow State -->
      <rect x="0" y="0" width="165" height="38" rx="6" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
      <text x="10" y="16" fill="var(--svg-node-green-subtext)" font-size="10.5" font-weight="bold">Fokus &amp; Flow-State</text>
      <text x="10" y="30" fill="var(--svg-node-green-subtext)" font-size="9.5">Tiefe kognitive Arbeit</text>

      <!-- Arrow -->
      <text x="174" y="24" fill="var(--svg-text-secondary)" font-size="14" font-weight="bold">→</text>

      <!-- Push Interruption -->
      <rect x="195" y="0" width="169" height="38" rx="6" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1.5"/>
      <text x="10" y="16" transform="translate(195,0)" fill="var(--svg-node-red-subtext)" font-size="10.5" font-weight="bold">⚡ Push-Notification</text>
      <text x="10" y="30" transform="translate(195,0)" fill="var(--svg-node-red-subtext)" font-size="9.5">Alarm, Mail, Social Ping</text>
    </g>

    <!-- 1. Task-Switching Costs -->
    <g transform="translate(468, 186)">
      <rect x="0" y="0" width="364" height="106" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
      <text x="12" y="20" fill="var(--svg-node-amber-subtext)" font-size="11.5" font-weight="bold">Re-Fokussierung (~23 Min. nach Gloria Mark)</text>
      <text x="12" y="40" fill="var(--svg-text-secondary)" font-size="10">• <tspan fill="var(--svg-node-amber-subtext)" font-weight="bold">Attention Residue:</tspan> Gedanken haften an der Störung</text>
      <text x="12" y="58" fill="var(--svg-text-secondary)" font-size="10">• <tspan fill="var(--svg-node-amber-subtext)" font-weight="bold">Partial Attention:</tspan> Dauer-Alarm erschöpft Stirnhirn</text>
      <text x="12" y="76" fill="var(--svg-text-secondary)" font-size="10">• <tspan fill="var(--svg-node-amber-subtext)" font-weight="bold">Fehlerquote:</tspan> Steigt drastisch bei komplexen Aufgaben</text>
      <text x="12" y="94" fill="var(--svg-text-secondary)" font-size="9.5">Häufiges Umschalten fragmentiert das Denken nachhaltig</text>
    </g>

    <!-- 2. Cyberpsychology Dynamics -->
    <g transform="translate(468, 302)">
      <rect x="0" y="0" width="364" height="96" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.5"/>
      <text x="12" y="20" fill="var(--svg-node-purple-border)" font-size="11.5" font-weight="bold">Cyberpsychologische Dynamiken</text>
      <text x="12" y="40" fill="var(--svg-text-secondary)" font-size="10">• <tspan fill="var(--svg-node-purple-border)" font-weight="bold">Online Disinhibition:</tspan> Fehlende Präsenz senkt Hemmschwelle</text>
      <text x="12" y="58" fill="var(--svg-node-purple-border)" font-size="10">• <tspan fill="var(--svg-node-purple-border)" font-weight="bold">FOMO &amp; Statusvergleich:</tspan> Feeds treiben sozialen Stress</text>
      <text x="12" y="76" fill="var(--svg-node-purple-border)" font-size="10">• <tspan fill="var(--svg-node-purple-border)" font-weight="bold">Echokammern:</tspan> Algorithmen bestärken Bestätigungsfehler</text>
    </g>
  </g>
</svg>

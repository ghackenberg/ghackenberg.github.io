<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <!-- Filter for Comic Dropped Shadow -->
    <filter id="comic-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect x="10" y="10" width="780" height="430" rx="16" fill="#0b1329" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Subtle Halftone / Grid Pattern Background -->
  <g opacity="0.12">
    <circle cx="100" cy="80" r="2" fill="#3b82f6" /><circle cx="150" cy="80" r="2" fill="#3b82f6" /><circle cx="200" cy="80" r="2" fill="#3b82f6" />
    <circle cx="100" cy="130" r="2" fill="#3b82f6" /><circle cx="150" cy="130" r="2" fill="#3b82f6" /><circle cx="200" cy="130" r="2" fill="#3b82f6" />
    <circle cx="600" cy="320" r="2" fill="#a855f7" /><circle cx="650" cy="320" r="2" fill="#a855f7" /><circle cx="700" cy="320" r="2" fill="#a855f7" />
    <circle cx="600" cy="370" r="2" fill="#a855f7" /><circle cx="650" cy="370" r="2" fill="#a855f7" /><circle cx="700" cy="370" r="2" fill="#a855f7" />
    <line x1="50" y1="225" x2="750" y2="225" stroke="#3b82f6" stroke-dasharray="4 8" stroke-width="1" />
  </g>

  <!-- Header Category Tag -->
  <rect x="40" y="32" width="220" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="50" y="49" fill="#3b82f6" font-size="11" font-weight="bold" letter-spacing="1">STAND DER WISSENSCHAFT &amp; TECHNIK</text>

  <!-- Main Headline in Illustration -->
  <text x="40" y="85" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="-0.5">Psychologie der modernen IT</text>
  <text x="40" y="108" fill="#94a3b8" font-size="13">Das Spannungsfeld aus Kognition, Algorithmen, Cyberpsychologie &amp; Systemarchitektur</text>

  <!-- ==================== LEFT PILLAR: MENSCHLICHE KOGNITION (Stand der Wissenschaft) ==================== -->
  <g filter="url(#comic-shadow)">
    <rect x="40" y="135" width="225" height="270" rx="12" fill="#111827" stroke="#a855f7" stroke-width="2" />
    <rect x="40" y="135" width="225" height="38" rx="12" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
    <circle cx="58" cy="154" r="7" fill="#a855f7" />
    <text x="72" y="159" fill="#f3f4f6" font-size="13" font-weight="bold">Psyche &amp; Kognition</text>

    <!-- Content Items -->
    <g transform="translate(52, 185)">
      <rect x="0" y="0" width="201" height="42" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="10" y="17" fill="#c084fc" font-size="11" font-weight="bold">Aufmerksamkeitsökonomie</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9.5">Dopaminschleifen &amp; Task-Switching</text>

      <rect x="0" y="50" width="201" height="42" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="10" y="67" fill="#38bdf8" font-size="11" font-weight="bold">Cognitive Load Theory</text>
      <text x="10" y="82" fill="#94a3b8" font-size="9.5">Informationsflut &amp; Arbeitsgedächtnis</text>

      <rect x="0" y="100" width="201" height="42" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="10" y="117" fill="#4ade80" font-size="11" font-weight="bold">Cyberpsychologie &amp; Socials</text>
      <text x="10" y="132" fill="#94a3b8" font-size="9.5">Disinhibition, FOMO &amp; Blasen</text>

      <rect x="0" y="150" width="201" height="52" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="10" y="167" fill="#fde047" font-size="11" font-weight="bold">Extended Mind &amp; De-Skilling</text>
      <text x="10" y="182" fill="#94a3b8" font-size="9.5">Transaktives Gedächtnis vs. Atrophie</text>
      <text x="10" y="195" fill="#94a3b8" font-size="9.5">Automation Bias &amp; CASA-Paradigma</text>
    </g>
  </g>

  <!-- ==================== CENTER: INTERACTION & FEEDBACK DYNAMICS ==================== -->
  <!-- Bi-directional Synaptic Flow Line Top -->
  <path d="M 270 200 C 340 170, 460 170, 530 200" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="535,200 522,192 525,206" fill="#3b82f6" />
  <rect x="345" y="160" width="110" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="400" y="176" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">Verhaltenssignale</text>

  <!-- Center Core Icon (Brain + Chip Fusion) -->
  <g filter="url(#comic-shadow)">
    <circle cx="400" cy="275" r="54" fill="#0f172a" stroke="url(#grad-brain)" stroke-width="3.5" />
    <!-- Brain outline paths -->
    <path d="M 380 260 C 370 250, 365 270, 375 285 C 385 295, 395 290, 395 300" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 420 260 C 430 250, 435 270, 425 285 C 415 295, 405 290, 405 300" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Digital nodes inside core -->
    <circle cx="400" cy="255" r="4" fill="#f59e0b" />
    <circle cx="385" cy="275" r="3.5" fill="#10b981" />
    <circle cx="415" cy="275" r="3.5" fill="#3b82f6" />
    <line x1="400" y1="255" x2="385" y2="275" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="400" y1="255" x2="415" y2="275" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="385" y1="275" x2="415" y2="275" stroke="#10b981" stroke-width="1.5" />
    <text x="400" y="345" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">KOGNITIVE RESONANZ</text>
  </g>

  <!-- Bi-directional Flow Line Bottom -->
  <path d="M 530 350 C 460 380, 340 380, 270 350" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="265,350 278,342 275,356" fill="#10b981" />
  <rect x="345" y="365" width="110" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="400" y="381" fill="#86efac" font-size="10" font-weight="bold" text-anchor="middle">Persuasive Reize</text>

  <!-- ==================== RIGHT PILLAR: MODERNE IT & SYSTEMARCHITEKTUR (Stand der Technik) ==================== -->
  <g filter="url(#comic-shadow)">
    <rect x="535" y="135" width="225" height="270" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="2" />
    <rect x="535" y="135" width="225" height="38" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2" />
    <circle cx="553" cy="154" r="7" fill="#3b82f6" />
    <text x="567" y="159" fill="#f3f4f6" font-size="13" font-weight="bold">Architektur &amp; Systeme</text>

    <!-- Content Items -->
    <g transform="translate(547, 185)">
      <rect x="0" y="0" width="201" height="42" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="10" y="17" fill="#60a5fa" font-size="11" font-weight="bold">Deep Recommender Engines</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9.5">Two-Tower, GNNs &amp; Multi-Objective</text>

      <rect x="0" y="50" width="201" height="42" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="10" y="67" fill="#c084fc" font-size="11" font-weight="bold">Generative KI &amp; Reasoning</text>
      <text x="10" y="82" fill="#94a3b8" font-size="9.5">LLMs, Agenten &amp; Voice Interfaces</text>

      <rect x="0" y="100" width="201" height="42" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="10" y="117" fill="#4ade80" font-size="11" font-weight="bold">Event Telemetry &amp; Bandits</text>
      <text x="10" y="132" fill="#94a3b8" font-size="9.5">Kafka Streams, Realtime Notification</text>

      <rect x="0" y="150" width="201" height="52" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="10" y="167" fill="#fde047" font-size="11" font-weight="bold">Affective &amp; Spatial Sensing</text>
      <text x="10" y="182" fill="#94a3b8" font-size="9.5">Eye-Tracking, HRV &amp; Bio-Feedback</text>
      <text x="10" y="195" fill="#94a3b8" font-size="9.5">Experimentation SaaS (Amplitude/Statsig)</text>
    </g>
  </g>
</svg>

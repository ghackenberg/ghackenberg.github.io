<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <!-- Drop Shadow for Comic Outline Depth -->
    <filter id="comic-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="50%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-purple-border)"/>
    </linearGradient>

    <linearGradient id="card-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="var(--svg-card)"/>
    </linearGradient>

    <linearGradient id="card-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141124"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>
  </defs>

  <!-- Frame Canvas -->
  <rect x="10" y="10" width="820" height="450" rx="16" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <g transform="translate(35, 30)">
    <text x="0" y="22" fill="url(#header-grad)" font-size="20" font-weight="800" letter-spacing="0.5">GEO &amp; AEO: EMPIRISCHE STUDIENLANDSCHAFT</text>
    <text x="0" y="42" fill="var(--svg-text-secondary)" font-size="12.5">Wissenschaftliche Kausalhebel (Peer-Reviewed) vs. Live-Marktdynamik (Industrie-Benchmarks)</text>
  </g>

  <!-- ==================== LEFT CARD: PEER-REVIEWED SCIENCE ==================== -->
  <g transform="translate(35, 88)" filter="url(#comic-shadow)">
    <!-- Container -->
    <rect x="0" y="0" width="370" height="310" rx="12" fill="url(#card-left)" stroke="var(--svg-node-blue-border)" stroke-width="2"/>
    
    <!-- Badge Header -->
    <rect x="0" y="0" width="370" height="46" rx="12" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="2"/>
    <circle cx="24" cy="23" r="8" fill="var(--svg-node-blue-border)"/>
    <text x="40" y="28" fill="var(--svg-text-primary)" font-size="14" font-weight="700">1. Peer-Reviewed Studien</text>
    <text x="245" y="28" fill="var(--svg-node-blue-subtext)" font-size="11" font-weight="600">KDD • EMNLP • SIGIR</text>

    <!-- Metric Row 1: Quotations -->
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="334" height="48" rx="8" fill="var(--svg-pill-bg)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>
      <text x="14" y="29" fill="var(--svg-node-green-border)" font-size="18" font-weight="800">+40%</text>
      <text x="75" y="22" fill="var(--svg-text-primary)" font-size="12" font-weight="700">Expertenzitate &amp; Quellenangaben</text>
      <text x="75" y="37" fill="var(--svg-text-secondary)" font-size="10.5">Höchster gemessener Sichtbarkeitsgewinn (KDD '24)</text>
    </g>

    <!-- Metric Row 2: Statistics & Numbers -->
    <g transform="translate(18, 120)">
      <rect x="0" y="0" width="334" height="48" rx="8" fill="var(--svg-pill-bg)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>
      <text x="14" y="29" fill="var(--svg-node-blue-border)" font-size="18" font-weight="800">+37%</text>
      <text x="75" y="22" fill="var(--svg-text-primary)" font-size="12" font-weight="700">Statistiken &amp; Numerische Fakten</text>
      <text x="75" y="37" fill="var(--svg-text-secondary)" font-size="10.5">Disproportionaler Effekt in Fachdomänen (GEO-bench)</text>
    </g>

    <!-- Metric Row 3: Keyword Stuffing -->
    <g transform="translate(18, 178)">
      <rect x="0" y="0" width="334" height="48" rx="8" fill="var(--svg-pill-bg)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5"/>
      <text x="14" y="29" fill="var(--svg-node-red-border)" font-size="18" font-weight="800">-10%</text>
      <text x="75" y="22" fill="var(--svg-text-primary)" font-size="12" font-weight="700">Klassisches Keyword-Stuffing</text>
      <text x="75" y="37" fill="var(--svg-text-secondary)" font-size="10.5">SEO-Relikte wirken in Generative Engines negativ</text>
    </g>

    <!-- Metric Row 4: Verifiability Gap -->
    <g transform="translate(18, 236)">
      <rect x="0" y="0" width="334" height="54" rx="8" fill="var(--svg-pill-bg)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
      <text x="14" y="33" fill="var(--svg-node-amber-border)" font-size="18" font-weight="800">51.5%</text>
      <text x="75" y="24" fill="var(--svg-text-primary)" font-size="12" font-weight="700">Tatsächlich belegte Zitate (EMNLP '23)</text>
      <text x="75" y="40" fill="var(--svg-text-secondary)" font-size="10.5">LLMs bevorzugen Autorität über formale Logik</text>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: INDUSTRY BENCHMARKS ==================== -->
  <g transform="translate(435, 88)" filter="url(#comic-shadow)">
    <!-- Container -->
    <rect x="0" y="0" width="370" height="310" rx="12" fill="url(#card-right)" stroke="var(--svg-node-purple-border)" stroke-width="2"/>
    
    <!-- Badge Header -->
    <rect x="0" y="0" width="370" height="46" rx="12" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="2"/>
    <circle cx="24" cy="23" r="8" fill="var(--svg-node-purple-border)"/>
    <text x="40" y="28" fill="var(--svg-text-primary)" font-size="14" font-weight="700">2. Industrie-Benchmarks</text>
    <text x="235" y="28" fill="var(--svg-node-purple-subtext)" font-size="11" font-weight="600">SparkToro • BrightEdge</text>

    <!-- Metric Row 1: Zero-Click -->
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="334" height="48" rx="8" fill="var(--svg-node-purple-bg)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>
      <text x="14" y="29" fill="var(--svg-node-amber-border)" font-size="18" font-weight="800">68%</text>
      <text x="75" y="22" fill="var(--svg-text-primary)" font-size="12" font-weight="700">Zero-Click Searches (USA 2026)</text>
      <text x="75" y="37" fill="var(--svg-text-secondary)" font-size="10.5">Nutzer decken Informationsbedarf direkt im SERP</text>
    </g>

    <!-- Metric Row 2: Ranking Disruption -->
    <g transform="translate(18, 120)">
      <rect x="0" y="0" width="334" height="48" rx="8" fill="var(--svg-node-purple-bg)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>
      <text x="14" y="29" fill="var(--svg-node-blue-border)" font-size="18" font-weight="800">54%</text>
      <text x="75" y="22" fill="var(--svg-text-primary)" font-size="12" font-weight="700">Quellen außerhalb der Top 10</text>
      <text x="75" y="37" fill="var(--svg-text-secondary)" font-size="10.5">AIO zitiert strukturierte Nischenquellen (BrightEdge)</text>
    </g>

    <!-- Metric Row 3: Organic CTR Drop -->
    <g transform="translate(18, 178)">
      <rect x="0" y="0" width="334" height="48" rx="8" fill="var(--svg-node-purple-bg)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5"/>
      <text x="14" y="29" fill="var(--svg-node-red-border)" font-size="18" font-weight="800">-58%</text>
      <text x="75" y="22" fill="var(--svg-text-primary)" font-size="12" font-weight="700">CTR-Kompression auf Position 1</text>
      <text x="75" y="37" fill="var(--svg-text-secondary)" font-size="10.5">Verdrängung organischer Links durch AIO-Boxen</text>
    </g>

    <!-- Metric Row 4: Carousel Concentration -->
    <g transform="translate(18, 236)">
      <rect x="0" y="0" width="334" height="54" rx="8" fill="var(--svg-node-purple-bg)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
      <text x="14" y="33" fill="var(--svg-node-green-border)" font-size="18" font-weight="800">Top 3</text>
      <text x="75" y="24" fill="var(--svg-text-primary)" font-size="12" font-weight="700">Zitationskarten im AI Overview</text>
      <text x="75" y="40" fill="var(--svg-text-secondary)" font-size="10.5">Erhalten &gt;80% des verbleibenden AIO-Referral-Traffics</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SYNTHESIS FOOTER ==================== -->
  <g transform="translate(35, 412)">
    <rect x="0" y="0" width="770" height="34" rx="8" fill="var(--svg-pill-bg)" stroke="var(--svg-border)" stroke-width="1"/>
    <text x="385" y="21" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600" text-anchor="middle">
      <tspan fill="var(--svg-node-blue-border)">Strategische Konsequenz:</tspan> Semantische Struktur &amp; belegbare Faktenautorität schlagen reine Keyword-Platzierung.
    </text>
  </g>
</svg>

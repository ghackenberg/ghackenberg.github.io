<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Arrow Marker Blue -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <!-- Arrow Marker Yellow -->
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
    <!-- Arrow Marker Purple -->
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7" />
    </marker>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="900" height="520" rx="16" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Title -->
  <text x="450" y="42" fill="#f8fafc" font-family="'Outfit', 'Inter', sans-serif" font-size="20" font-weight="700" text-anchor="middle">KI-basierte Ergonomiesysteme: 4-Schichten-Systemarchitektur</text>
  <text x="450" y="65" fill="#94a3b8" font-family="'Outfit', 'Inter', sans-serif" font-size="13" text-anchor="middle">Vom Echtzeit-Sensor-Ingestion-Flow bis zur Verhaltensassistenz &amp; Möbel-Aktorik</text>

  <!-- Flow Lines Connecting Layers -->
  <path d="M 230 200 L 270 200" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />
  <path d="M 450 200 L 490 200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-yellow)" />
  <path d="M 670 200 L 710 200" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-purple)" />

  <!-- Feedback Loop Arrow (Bottom back to Layer 1) -->
  <path d="M 790 260 L 790 420 L 110 420 L 110 260" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)" />
  <rect x="360" y="405" width="180" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="450" y="425" fill="#34d399" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Kontinuierlicher Bio-Feedback-Loop</text>

  <!-- LAYER 1: MULTIMODALE SENSORIK -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="200" height="260" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="12" fill="rgba(59, 130, 246, 0.15)" />
    <text x="100" y="24" fill="#60a5fa" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Multimodale Sensorik</text>
    
    <g transform="translate(15, 50)" font-family="'Outfit', 'Inter', sans-serif" font-size="12">
      <!-- Item A -->
      <rect x="0" y="0" width="170" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="18" fill="#f8fafc" font-weight="600">Edge Pose Estimation</text>
      <text x="10" y="33" fill="#94a3b8" font-size="10">Kamera-basierte 3D-Skelettanalyse</text>

      <!-- Item B -->
      <rect x="0" y="52" width="170" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="70" fill="#f8fafc" font-weight="600">Sitz- &amp; Tischtelemetrie</text>
      <text x="10" y="85" fill="#94a3b8" font-size="10">Druckverteilung &amp; Höhenverlauf</text>

      <!-- Item C -->
      <rect x="0" y="104" width="170" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="122" fill="#f8fafc" font-weight="600">Raumklimasensoren</text>
      <text x="10" y="137" fill="#94a3b8" font-size="10">CO2, Beleuchtung, Temperatur</text>
    </g>
  </g>

  <!-- LAYER 2: KI-ANALYSE & MODELLIERUNG -->
  <g transform="translate(250, 100)">
    <rect x="0" y="0" width="200" height="260" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="12" fill="rgba(245, 158, 11, 0.15)" />
    <text x="100" y="24" fill="#fbbf24" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. KI-Modellierung</text>

    <g transform="translate(15, 50)" font-family="'Outfit', 'Inter', sans-serif" font-size="12">
      <!-- Item A -->
      <rect x="0" y="0" width="170" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="18" fill="#f8fafc" font-weight="600">Haltungsbewertung</text>
      <text x="10" y="33" fill="#94a3b8" font-size="10">Rundrücken &amp; Asymmetrien</text>

      <!-- Item B -->
      <rect x="0" y="52" width="170" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="70" fill="#f8fafc" font-weight="600">Ermüdungs-Prognose</text>
      <text x="10" y="85" fill="#94a3b8" font-size="10">Statische Verharren-Erkennung</text>

      <!-- Item C -->
      <rect x="0" y="104" width="170" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="122" fill="#f8fafc" font-weight="600">Arbeitskontext-Erkennung</text>
      <text x="10" y="137" fill="#94a3b8" font-size="10">Deep Work vs. Meeting / Call</text>
    </g>
  </g>

  <!-- LAYER 3: ADAPTIVE AKTORIK -->
  <g transform="translate(470, 100)">
    <rect x="0" y="0" width="200" height="260" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="12" fill="rgba(168, 85, 247, 0.15)" />
    <text x="100" y="24" fill="#c084fc" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. Adaptive Aktorik</text>

    <g transform="translate(15, 50)" font-family="'Outfit', 'Inter', sans-serif" font-size="12">
      <!-- Item A -->
      <rect x="0" y="0" width="170" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="18" fill="#f8fafc" font-weight="600">Mikro-Höhenanpassung</text>
      <text x="10" y="33" fill="#94a3b8" font-size="10">Dynamischer Tisch-Höhenwechsel</text>

      <!-- Item B -->
      <rect x="0" y="52" width="170" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="70" fill="#f8fafc" font-weight="600">Ergonomische Sitzelemente</text>
      <text x="10" y="85" fill="#94a3b8" font-size="10">Lordosenstützen-Verstellung</text>

      <!-- Item C -->
      <rect x="0" y="104" width="170" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="122" fill="#f8fafc" font-weight="600">Licht &amp; Raumumgebung</text>
      <text x="10" y="137" fill="#94a3b8" font-size="10">Zirkadiane Beleuchtungsszenen</text>
    </g>
  </g>

  <!-- LAYER 4: MENSCH-ZENTRIERTE INTERAKTION -->
  <g transform="translate(690, 100)">
    <rect x="0" y="0" width="180" height="260" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="180" height="36" rx="12" fill="rgba(16, 185, 129, 0.15)" />
    <text x="90" y="24" fill="#34d399" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">4. Assistenz &amp; Nudging</text>

    <g transform="translate(10, 50)" font-family="'Outfit', 'Inter', sans-serif" font-size="12">
      <!-- Item A -->
      <rect x="0" y="0" width="160" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="18" fill="#f8fafc" font-weight="600">Contextual Micro-Breaks</text>
      <text x="10" y="33" fill="#94a3b8" font-size="10">Pause bei Task-Wechseln</text>

      <!-- Item B -->
      <rect x="0" y="52" width="160" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="70" fill="#f8fafc" font-weight="600">Guided Micro-Exercises</text>
      <text x="10" y="85" fill="#94a3b8" font-size="10">Gezielte Dehnimpulse</text>

      <!-- Item C -->
      <rect x="0" y="104" width="160" height="42" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.05)" />
      <text x="10" y="122" fill="#f8fafc" font-weight="600">Personal Analytics</text>
      <text x="10" y="137" fill="#94a3b8" font-size="10">Datenschutzkonformes Feedback</text>
    </g>
  </g>

  <!-- Footnote / Metadata Bar -->
  <rect x="30" y="470" width="840" height="30" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <text x="45" y="490" fill="#94a3b8" font-family="'Outfit', 'Inter', sans-serif" font-size="11">FH OÖ Campus Wels | Professur für Industrieinformatik</text>
  <text x="855" y="490" fill="#64748b" font-family="'Outfit', 'Inter', sans-serif" font-size="11" text-anchor="end">Forschungsbereich: KI-basierte ergonomische Arbeitsumgebungen</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#070e20" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="260" cy="220" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="560" cy="220" r="140" fill="#a855f7" opacity="0.12" filter="url(#glow)" />

  <!-- LEFT: OFFICE ENVIRONMENT ICON GROUP -->
  <g transform="translate(120, 110)">
    <!-- Office Desk & Chair Outline -->
    <rect x="20" y="160" width="180" height="12" rx="4" fill="#334155" stroke="#3b82f6" stroke-width="2" />
    <rect x="40" y="172" width="12" height="68" rx="2" fill="#1e293b" />
    <rect x="160" y="172" width="12" height="68" rx="2" fill="#1e293b" />
    
    <!-- Monitor & AI Node -->
    <rect x="75" y="90" width="70" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <path d="M 110 140 L 110 160 M 95 160 L 125 160" stroke="#3b82f6" stroke-width="2" />
    <circle cx="110" cy="115" r="14" fill="#3b82f6" opacity="0.3" filter="url(#glow)" />
    <circle cx="110" cy="115" r="6" fill="#3b82f6" />

    <!-- Chair -->
    <path d="M 210 120 L 210 190 Q 210 200 200 200 L 175 200" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="200" x2="190" y2="240" stroke="#64748b" stroke-width="4" />
    <line x1="170" y1="240" x2="210" y2="240" stroke="#64748b" stroke-width="4" />

    <!-- Label -->
    <rect x="40" y="20" width="140" height="32" rx="16" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="110" y="41" fill="#93c5fd" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Corporate Office</text>
  </g>

  <!-- CENTER CONNECTING AI NODES -->
  <g transform="translate(360, 180)">
    <!-- Central AI Pulse Hub -->
    <circle cx="40" cy="40" r="45" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <circle cx="40" cy="40" r="32" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="40" cy="40" r="16" fill="#f59e0b" opacity="0.8" filter="url(#glow)" />
    <text x="40" y="45" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">KI</text>

    <!-- Flow vectors -->
    <path d="M -70 40 L -10 40" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4" />
    <path d="M 90 40 L 150 40" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4" />
  </g>

  <!-- RIGHT: HOME LIVING ENVIRONMENT ICON GROUP -->
  <g transform="translate(480, 110)">
    <!-- Home Roof Outline & Desk -->
    <path d="M 30 70 L 110 20 L 190 70" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <rect x="40" y="160" width="140" height="10" rx="4" fill="#334155" stroke="#a855f7" stroke-width="2" />
    <rect x="55" y="170" width="10" height="70" rx="2" fill="#1e293b" />
    <rect x="155" y="170" width="10" height="70" rx="2" fill="#1e293b" />

    <!-- Laptop with Vision/Pose Sensor -->
    <path d="M 80 160 L 130 160 L 135 125 L 85 125 Z" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="110" cy="120" r="3" fill="#10b981" />

    <!-- Pose Human Silhouette Grid -->
    <circle cx="110" cy="85" r="8" fill="none" stroke="#10b981" stroke-width="1.5" />
    <line x1="110" y1="93" x2="110" y2="120" stroke="#10b981" stroke-width="1.5" />
    <path d="M 95 102 L 110 97 L 125 102" fill="none" stroke="#10b981" stroke-width="1.5" />

    <!-- Label -->
    <rect x="40" y="255" width="140" height="32" rx="16" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.5" />
    <text x="110" y="276" fill="#c084fc" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Häusliches Wohnen</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="200" y="380" width="400" height="36" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <text x="400" y="403" fill="#f8fafc" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Adaptive Ergonomie &amp; Multimodale Assistenz</text>
</svg>

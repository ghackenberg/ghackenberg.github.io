<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="grad-curator-hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2246" />
      <stop offset="100%" stop-color="#08142b" />
    </linearGradient>

    <linearGradient id="grad-branch-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#051321" />
    </linearGradient>

    <linearGradient id="grad-branch-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24103a" />
      <stop offset="100%" stop-color="#0d0617" />
    </linearGradient>

    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-down-blue" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-down-purple" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect x="10" y="10" width="980" height="680" rx="16" fill="#070b16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Background Decorative Grid -->
  <g opacity="0.06">
    <line x1="30" y1="100" x2="970" y2="100" stroke="#818cf8" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="30" y1="215" x2="970" y2="215" stroke="#818cf8" stroke-dasharray="4 8" stroke-width="1" />
    <line x1="30" y1="330" x2="970" y2="330" stroke="#818cf8" stroke-dasharray="4 8" stroke-width="1" />
  </g>

  <!-- ==================== HEADER ==================== -->
  <g id="header-group">
    <rect x="40" y="24" width="275" height="20" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
    <text x="48" y="38" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1">KONTINUIERLICHE WISSENSEVOLUTION &amp; HYGIENE</text>

    <text x="40" y="66" fill="url(#grad-header)" font-size="20" font-weight="800">Der Background Curator Lifecycle: Skill-Evolution &amp; Pruning</text>
    <text x="40" y="88" fill="#94a3b8" font-size="12">Zweistufige Wartungsarchitektur: Deterministisches Inaktivitäts-Archivieren &amp; LLM-gestützte Dach-Konsolidierung</text>
  </g>

  <!-- ==================== TOP: INGESTION PIPELINE ==================== -->
  <g id="ingestion-group">
    <!-- Step 1: Input -->
    <rect x="60" y="110" width="260" height="85" rx="8" fill="#0b1329" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="75" y="122" width="60" height="16" rx="3" fill="rgba(56, 189, 248, 0.15)" />
    <text x="105" y="134" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="700">TRIGGER</text>
    <text x="75" y="154" fill="#f8fafc" font-size="12" font-weight="700">1. Neue Anforderung</text>
    <text x="75" y="172" fill="#94a3b8" font-size="10.5">Dokumentation, Repo, Session</text>
    <text x="75" y="186" fill="#64748b" font-size="9.5">Ad-hoc gelöster Anwendungsfall</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="325" y1="152" x2="365" y2="152" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sky)" />

    <!-- Step 2: Synthesis (/learn) -->
    <rect x="370" y="110" width="260" height="85" rx="8" fill="#0b1329" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="385" y="122" width="70" height="16" rx="3" fill="rgba(99, 102, 241, 0.15)" />
    <text x="420" y="134" text-anchor="middle" fill="#818cf8" font-size="9" font-weight="700">KOMPILIERUNG</text>
    <text x="385" y="154" fill="#f8fafc" font-size="12" font-weight="700">2. /learn Synthese</text>
    <text x="385" y="172" fill="#94a3b8" font-size="10.5">AIAgent generiert L0/L1/L2 Skill</text>
    <text x="385" y="186" fill="#64748b" font-size="9.5">Validiert Metadaten &amp; Python-Code</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="635" y1="152" x2="675" y2="152" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-sky)" />

    <!-- Step 3: Active Registry -->
    <rect x="680" y="110" width="260" height="85" rx="8" fill="#0b1329" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="695" y="122" width="80" height="16" rx="3" fill="rgba(168, 85, 247, 0.15)" />
    <text x="735" y="134" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="700">PRODUKTIV</text>
    <text x="695" y="154" fill="#f8fafc" font-size="12" font-weight="700">3. Aktive Registry</text>
    <text x="695" y="172" fill="#94a3b8" font-size="10.5">~/.hermes/skills/&lt;skill&gt;/</text>
    <text x="695" y="186" fill="#64748b" font-size="9.5">Sofort im L0-Katalog verfügbar</text>
  </g>

  <!-- Arrow down to Curator Hub -->
  <line x1="810" y1="195" x2="810" y2="210" stroke="#818cf8" stroke-width="1.5" />
  <line x1="810" y1="210" x2="500" y2="210" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="500" y1="210" x2="500" y2="223" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow-down-blue)" />

  <!-- ==================== MIDDLE: CURATOR ENGINE HUB ==================== -->
  <g id="curator-hub">
    <rect x="60" y="225" width="880" height="90" rx="10" fill="url(#grad-curator-hub)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5" filter="url(#card-shadow)" />

    <!-- Title & Icon -->
    <circle cx="85" cy="252" r="12" fill="rgba(59, 130, 246, 0.2)" />
    <text x="85" y="257" text-anchor="middle" fill="#60a5fa" font-size="14">🛡️</text>
    <text x="108" y="258" fill="#f8fafc" font-size="15" font-weight="800">DER BACKGROUND CURATOR LIFECYCLE</text>
    <text x="920" y="256" text-anchor="end" fill="#93c5fd" font-size="11" font-weight="600">Autonomer Inaktivitäts-Pass • Kein starrer Cron</text>

    <line x1="75" y1="274" x2="925" y2="274" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Trigger Metrics -->
    <text x="85" y="296" fill="#cbd5e1" font-size="11" font-weight="600">Ausführungs-Trigger:</text>
    <text x="210" y="296" fill="#38bdf8" font-size="11">interval_hours: 168 (wöchentlich)</text>
    <text x="410" y="296" fill="#94a3b8" font-size="11">UND</text>
    <text x="445" y="296" fill="#38bdf8" font-size="11">min_idle_hours: 2 (Agent untätig)</text>

    <text x="645" y="296" fill="#cbd5e1" font-size="11" font-weight="600">Isolation:</text>
    <text x="705" y="296" fill="#c084fc" font-size="11">Forkt AIAgent im Hintergrund (getrennter Cache)</text>
  </g>

  <!-- Connectors from Hub to Phase 1 and Phase 2 -->
  <line x1="272" y1="315" x2="272" y2="340" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-down-blue)" />
  <line x1="727" y1="315" x2="727" y2="340" stroke="#c084fc" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-down-purple)" />

  <!-- ==================== BOTTOM LEFT: PHASE 1 DETERMINISTIC ==================== -->
  <g id="phase-1-deterministic">
    <rect x="60" y="345" width="425" height="280" rx="10" fill="url(#grad-branch-left)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" filter="url(#card-shadow)" />

    <!-- Header -->
    <rect x="75" y="360" width="170" height="18" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="0.8" />
    <text x="83" y="373" fill="#38bdf8" font-size="9.5" font-weight="700">DETERMINISTISCH • 0 TOKEN-KOSTEN</text>

    <text x="75" y="396" fill="#f8fafc" font-size="14" font-weight="800">Phase 1: Inaktivitäts-Pruning</text>
    <text x="470" y="395" text-anchor="end" fill="#93c5fd" font-size="10.5">Automatisches Lebenszyklus-Tracking</text>

    <!-- Sub-step 1: Counter -->
    <rect x="75" y="412" width="395" height="50" rx="6" fill="#081526" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <circle cx="95" cy="437" r="4" fill="#38bdf8" />
    <text x="108" y="432" fill="#e2e8f0" font-size="11" font-weight="700">1. use_count &amp; Timestamp Überwachung</text>
    <text x="108" y="448" fill="#94a3b8" font-size="10">Prüft Datum des letzten Aufrufs im lokalen Dateisystem</text>

    <!-- Sub-step 2: Stale -->
    <rect x="75" y="474" width="395" height="50" rx="6" fill="#081526" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
    <circle cx="95" cy="499" r="4" fill="#f59e0b" />
    <text x="108" y="494" fill="#fde68a" font-size="11" font-weight="700">2. Nach 30 Tagen Inaktivität: Status 'stale'</text>
    <text x="108" y="510" fill="#94a3b8" font-size="10">Skill bleibt aktiv, wird aber im L0-Katalog markiert</text>

    <!-- Sub-step 3: Archive -->
    <rect x="75" y="536" width="395" height="74" rx="6" fill="#081526" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="95" cy="563" r="4" fill="#10b981" />
    <text x="108" y="556" fill="#a7f3d0" font-size="11" font-weight="700">3. Nach 90 Tagen Inaktivität: Verschieben ins Archiv</text>
    <text x="108" y="572" fill="#94a3b8" font-size="10">Automatischer Umzug nach ~/.hermes/skills/.archive/</text>
    <text x="108" y="594" fill="#34d399" font-size="9.5" font-weight="600">🛡️ Schutz: 'hermes curator pin' &amp; Cron-Jobs sind immun</text>
  </g>

  <!-- ==================== BOTTOM RIGHT: PHASE 2 LLM CONSOLIDATION ==================== -->
  <g id="phase-2-consolidation">
    <rect x="515" y="345" width="425" height="280" rx="10" fill="url(#grad-branch-right)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4" filter="url(#card-shadow)" />

    <!-- Header -->
    <rect x="530" y="360" width="165" height="18" rx="4" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="0.8" />
    <text x="538" y="373" fill="#c084fc" font-size="9.5" font-weight="700">curator.consolidate: true</text>

    <text x="530" y="396" fill="#f8fafc" font-size="14" font-weight="800">Phase 2: Umbrella-Konsolidierung</text>
    <text x="925" y="395" text-anchor="end" fill="#e9d5ff" font-size="10.5">Semantische Skill-Verschmelzung</text>

    <!-- Sub-step 1: Semantic Scan -->
    <rect x="530" y="412" width="395" height="50" rx="6" fill="#150a24" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1" />
    <circle cx="550" cy="437" r="4" fill="#c084fc" />
    <text x="563" y="432" fill="#e2e8f0" font-size="11" font-weight="700">1. Semantischer Ähnlichkeitsabgleich</text>
    <text x="563" y="448" fill="#94a3b8" font-size="10">Auxiliary-LLM identifiziert funktionale Überschneidungen</text>

    <!-- Sub-step 2: Umbrella Merge -->
    <rect x="530" y="474" width="395" height="50" rx="6" fill="#150a24" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1" />
    <circle cx="550" cy="499" r="4" fill="#c084fc" />
    <text x="563" y="494" fill="#f5d0fe" font-size="11" font-weight="700">2. Verschmelzung zu Dach-Skills («Umbrellas»)</text>
    <text x="563" y="510" fill="#94a3b8" font-size="10">Z. B. postgres-query, -backup, -migration ➔ postgresql-ops</text>

    <!-- Sub-step 3: Integrity & Ledger -->
    <rect x="530" y="536" width="395" height="74" rx="6" fill="#150a24" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
    <circle cx="550" cy="563" r="4" fill="#f59e0b" />
    <text x="563" y="556" fill="#fde68a" font-size="11" font-weight="700">3. Paket-Integrität &amp; Audit-Ledger</text>
    <text x="563" y="572" fill="#94a3b8" font-size="10">Überträgt Hilfsskripte &amp; relative Pfade ohne Referenzbruch</text>
    <text x="563" y="594" fill="#fbbf24" font-size="9.5" font-weight="600">↩️ Rollback: 'hermes curator rollback' stellt Vorzustand wieder her</text>
  </g>

  <!-- ==================== FOOTER: SUMMARY ==================== -->
  <g id="footer-group">
    <rect x="40" y="645" width="920" height="35" rx="8" fill="#090e1a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="60" cy="662" r="4" fill="#10b981" />
    <text x="75" y="666" fill="#cbd5e1" font-size="11" font-weight="500">
      <tspan font-weight="700" fill="#34d399">Curator-Ziel:</tspan> Verhindert Skill Sprawl und Context Window Bloat im Dauerbetrieb – hält den L0-Prompt-Katalog stets schlank und hochrelevant.
    </text>
  </g>
</svg>

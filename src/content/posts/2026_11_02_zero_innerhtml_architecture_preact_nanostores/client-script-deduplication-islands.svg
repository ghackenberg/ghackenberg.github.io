  <text x="240" y="441" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-node-green-text)">SYSTEM-009: 0 Raw .innerHTML Sinks Across 49 Scripts</text>

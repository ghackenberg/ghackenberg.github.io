  <circle cx="392" cy="306" r="34" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2.2" />
  <rect x="376" y="288" width="32" height="36" rx="4" fill="var(--svg-card)" stroke="var(--svg-node-blue-text)" stroke-width="2" />
  <polyline points="383,306 389,312 401,299" fill="none" stroke="var(--svg-node-blue-text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="392" y="360" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="15" font-weight="700" fill="var(--svg-node-blue-text)">clipboard.ts</text>

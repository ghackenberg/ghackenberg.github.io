<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="grad-gov-head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="grad-idp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="grad-gate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c233c" />
      <stop offset="100%" stop-color="#061220" />
    </linearGradient>

    <linearGradient id="grad-ui-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="grad-api-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d54" />
      <stop offset="100%" stop-color="#1f0933" />
    </linearGradient>

    <filter id="shadow-gov" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <marker id="arr-purple-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arr-sky-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-emerald-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Frame -->
  <rect x="10" y="10" width="980" height="560" rx="16" fill="#070b16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Header -->
  <text x="40" y="48" fill="url(#grad-gov-head)" font-size="20" font-weight="800" letter-spacing="0.5">ENTERPRISE GOVERNANCE &amp; API-DUALISMUS</text>
  <text x="40" y="70" fill="#94a3b8" font-size="12.5">Zentrale IAM-Kopplung mit Keycloak und simultane Bereitstellung von Web-UI und geschütztem /api/v1 Gateway</text>

  <!-- TOP CARD: IDENTITY PROVIDER -->
  <g filter="url(#shadow-gov)">
    <rect x="260" y="95" width="480" height="85" rx="10" fill="url(#grad-idp)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="260" y="95" width="480" height="26" rx="10" fill="#3730a3" />
    <text x="500" y="113" fill="#e0e7ff" font-size="12" font-weight="700" text-anchor="middle">ENTERPRISE IDENTITY PROVIDER (IDP)</text>

    <text x="280" y="142" fill="#f8fafc" font-size="11" font-weight="600">• Keycloak / Microsoft Entra ID / Okta / LDAP</text>
    <text x="280" y="162" fill="#94a3b8" font-size="10.5">OpenID Connect (OIDC) &amp; SAML 2.0 Single Sign-On</text>

    <text x="560" y="142" fill="#f8fafc" font-size="11" font-weight="600">• Enterprise Gruppen-Mapping</text>
    <text x="560" y="162" fill="#94a3b8" font-size="10.5">Automatischer Sync von Abteilungsrollen</text>
  </g>

  <!-- Connector IDP -> Gatekeeper -->
  <path d="M 500 180 L 500 215" stroke="#818cf8" stroke-width="2" marker-end="url(#arr-purple-2)" />
  <text x="515" y="202" fill="#c084fc" font-size="10.5" font-weight="600">JWT Bearer Token / Role Claims</text>

  <!-- CENTER CARD: OPEN WEBUI GATEKEEPER -->
  <g filter="url(#shadow-gov)">
    <rect x="140" y="220" width="720" height="135" rx="10" fill="url(#grad-gate)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="140" y="220" width="720" height="26" rx="10" fill="#034d75" />
    <text x="500" y="238" fill="#bae6fd" font-size="12" font-weight="700" text-anchor="middle">OPEN WEBUI GATEKEEPER &amp; GOVERNANCE ENGINE</text>

    <!-- 4 Sub-blocks inside Gatekeeper -->
    <rect x="155" y="258" width="160" height="82" rx="6" fill="#06182c" stroke="#0891b2" stroke-width="1" />
    <text x="165" y="278" fill="#38bdf8" font-size="11" font-weight="700">Feingranulares RBAC</text>
    <text x="165" y="296" fill="#e2e8f0" font-size="9.5">• Admin / User / Custom</text>
    <text x="165" y="310" fill="#e2e8f0" font-size="9.5">• Model-Erstellungsrechte</text>
    <text x="165" y="324" fill="#e2e8f0" font-size="9.5">• RAG-Upload-Berechtigung</text>

    <rect x="330" y="258" width="165" height="82" rx="6" fill="#06182c" stroke="#0891b2" stroke-width="1" />
    <text x="340" y="278" fill="#38bdf8" font-size="11" font-weight="700">Quotas &amp; Rate Limits</text>
    <text x="340" y="296" fill="#e2e8f0" font-size="9.5">• Token-Bucket-Algorithmus</text>
    <text x="340" y="310" fill="#e2e8f0" font-size="9.5">• Monatsbudgets pro User</text>
    <text x="340" y="324" fill="#e2e8f0" font-size="9.5">• Request-Throttling</text>

    <rect x="510" y="258" width="165" height="82" rx="6" fill="#06182c" stroke="#0891b2" stroke-width="1" />
    <text x="520" y="278" fill="#38bdf8" font-size="11" font-weight="700">Wissens-Isolation</text>
    <text x="520" y="296" fill="#e2e8f0" font-size="9.5">• Private Wissensdatenbanken</text>
    <text x="520" y="310" fill="#e2e8f0" font-size="9.5">• Abteilungsfilter (HR/Legal)</text>
    <text x="520" y="324" fill="#e2e8f0" font-size="9.5">• Mandanten-Kapselung</text>

    <rect x="690" y="258" width="155" height="82" rx="6" fill="#06182c" stroke="#0891b2" stroke-width="1" />
    <text x="700" y="278" fill="#38bdf8" font-size="11" font-weight="700">Audit &amp; Compliance</text>
    <text x="700" y="296" fill="#e2e8f0" font-size="9.5">• DSGVO &amp; EU AI Act</text>
    <text x="700" y="310" fill="#e2e8f0" font-size="9.5">• Revisionssichere Logs</text>
    <text x="700" y="324" fill="#e2e8f0" font-size="9.5">• Prompt-Hash-Tracing</text>
  </g>

  <!-- Connectors Gatekeeper to Dual Surfaces -->
  <path d="M 320 355 L 320 395 L 240 395 L 240 415" stroke="#34d399" stroke-width="2" marker-end="url(#arr-emerald-2)" />
  <path d="M 680 355 L 680 395 L 760 395 L 760 415" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple-2)" />

  <!-- DUAL SURFACE: BOTTOM TWO BRANCHES -->

  <!-- Branch 1: Fachanwender UI (Left) -->
  <g filter="url(#shadow-gov)">
    <rect x="40" y="420" width="430" height="120" rx="10" fill="url(#grad-ui-card)" stroke="#10b981" stroke-width="1.5" />
    <rect x="40" y="420" width="430" height="26" rx="10" fill="#065f46" />
    <text x="60" y="438" fill="#d1fae5" font-size="11.5" font-weight="700">OBERFLÄCHE 1: FACHANWENDER-WORKSPACE (HUMAN UX)</text>

    <text x="60" y="468" fill="#f8fafc" font-size="11" font-weight="600">• Interaktiver Chat mit KaTeX Formeln &amp; Markdown</text>
    <text x="60" y="488" fill="#e2e8f0" font-size="10.5">• Dokumenten-RAG (Drag-and-Drop) &amp; Web-Recherche</text>
    <text x="60" y="508" fill="#e2e8f0" font-size="10.5">• Side-by-Side Model Arena &amp; Sprachsteuerung (Whisper STT)</text>
    <text x="60" y="526" fill="#a7f3d0" font-size="9.5" font-weight="600">Zielgruppe: Mitarbeitende, Dozierende, Studierende, Forscher</text>
  </g>

  <!-- Branch 2: Reverse-Proxy / API Gateway (Right) -->
  <g filter="url(#shadow-gov)">
    <rect x="530" y="420" width="430" height="120" rx="10" fill="url(#grad-api-card)" stroke="#a855f7" stroke-width="1.5" />
    <rect x="530" y="420" width="430" height="26" rx="10" fill="#581c87" />
    <text x="550" y="438" fill="#f3e8ff" font-size="11.5" font-weight="700">OBERFLÄCHE 2: REVERSE-PROXY GATEWAY (/api/v1)</text>

    <text x="550" y="468" fill="#f8fafc" font-size="11" font-weight="600">• OpenAI-kompatibler Endpunkt (/v1/chat/completions)</text>
    <text x="550" y="488" fill="#e2e8f0" font-size="10.5">• Automatische RAG-, Filter- &amp; Guardrail-Erzwingung</text>
    <text x="550" y="508" fill="#e2e8f0" font-size="10.5">• Mandantenspezifische API-Keys mit Quota-Accounting</text>
    <text x="550" y="526" fill="#d8b4fe" font-size="9.5" font-weight="600">Zielgruppe: ERP/CRM-Systeme, CLI-Tools, interne Skripte &amp; Bots</text>
  </g>
</svg>

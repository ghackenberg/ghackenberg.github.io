<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background-color: var(--svg-bg); font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <linearGradient id="grad-inf-head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="50%" stop-color="var(--svg-node-blue-border)"/>
      <stop offset="100%" stop-color="var(--svg-node-purple-border)"/>
    </linearGradient>

    <linearGradient id="card-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-card-alt)"/>
      <stop offset="100%" stop-color="var(--svg-card)"/>
    </linearGradient>

    <linearGradient id="card-grad-vllm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261b0c"/>
      <stop offset="100%" stop-color="#150f06"/>
    </linearGradient>

    <linearGradient id="card-grad-proxy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-purple-bg)"/>
      <stop offset="100%" stop-color="var(--svg-pill-bg)"/>
    </linearGradient>

    <linearGradient id="card-grad-ollama" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--svg-node-green-bg)"/>
      <stop offset="100%" stop-color="var(--svg-node-green-bg)"/>
    </linearGradient>

    <filter id="shadow-inf" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <marker id="arr-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-blue-border)"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-amber-border)"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-blue-border)"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--svg-node-green-border)"/>
    </marker>
  </defs>

  <!-- Frame -->
  <rect x="10" y="10" width="980" height="540" rx="16" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="48" fill="url(#grad-inf-head)" font-size="20" font-weight="800" letter-spacing="0.5">MULTI-PROVIDER INFERENZ-ORCHESTRIERUNG &amp; ROUTING</text>
  <text x="40" y="70" fill="var(--svg-text-secondary)" font-size="12.5">Abstraktion heterogener Inferenzressourcen: High-Throughput Cluster, Gateways und lokale Nodes</text>

  <!-- TOP CARD: OPEN WEBUI ORCHESTRATOR -->
  <g filter="url(#shadow-inf)">
    <rect x="250" y="95" width="500" height="95" rx="10" fill="url(#card-grad-core)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <rect x="250" y="95" width="500" height="26" rx="10" fill="var(--svg-card-alt)"/>
    <text x="500" y="113" fill="var(--svg-node-blue-subtext)" font-size="12" font-weight="700" text-anchor="middle">OPEN WEBUI INFERENCE ROUTER &amp; ARENA CONTROLLER</text>
    
    <text x="270" y="145" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">• Virtuelle Modell-Aliase &amp; Load Balancing</text>
    <text x="270" y="165" fill="var(--svg-text-secondary)" font-size="10.5">• Side-by-Side Model Arena (Paralleles Streaming)</text>

    <text x="520" y="145" fill="var(--svg-text-primary)" font-size="11.5" font-weight="600">• Automatisches Failover &amp; Fallbacks</text>
    <text x="520" y="165" fill="var(--svg-text-secondary)" font-size="10.5">• SSE Token Streaming &amp; TTFT-Monitoring</text>
  </g>

  <!-- Connectors from Orchestrator to 3 Targets -->
  <path d="M 375 190 L 375 220 L 175 220 L 175 250" stroke="var(--svg-node-amber-border)" stroke-width="2" marker-end="url(#arr-amber)"/>
  <path d="M 500 190 L 500 250" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-indigo)"/>
  <path d="M 625 190 L 625 220 L 825 220 L 825 250" stroke="var(--svg-node-green-border)" stroke-width="2" marker-end="url(#arr-emerald)"/>

  <!-- MIDDLE LAYER: 3 TARGET BACKENDS -->

  <!-- Backend 1: vLLM Cluster (Left) -->
  <g filter="url(#shadow-inf)">
    <rect x="40" y="255" width="270" height="150" rx="10" fill="url(#card-grad-vllm)" stroke="var(--svg-node-amber-border)" stroke-width="1.5"/>
    <rect x="40" y="255" width="270" height="26" rx="10" fill="var(--svg-node-amber-bg)"/>
    <text x="175" y="273" fill="var(--svg-node-amber-subtext)" font-size="11.5" font-weight="700" text-anchor="middle">vLLM CLUSTER (SCHICHT 1)</text>

    <text x="55" y="302" fill="var(--svg-node-amber-border)" font-size="11" font-weight="700">Port 8000 · OpenAI Protocol</text>
    <text x="55" y="322" fill="var(--svg-text-primary)" font-size="10.5">• Interner GPU-Server (H100/A100)</text>
    <text x="55" y="340" fill="var(--svg-text-primary)" font-size="10.5">• Continuous Batching &amp; PagedAttn</text>
    <text x="55" y="358" fill="var(--svg-text-primary)" font-size="10.5">• Höchster Durchsatz für Standard-Last</text>
    <text x="55" y="380" fill="var(--svg-node-amber-subtext)" font-size="10" font-weight="600">Primärer Inferenz-Workhorse</text>
  </g>

  <!-- Backend 2: LiteLLM Proxy (Center) -->
  <g filter="url(#shadow-inf)">
    <rect x="365" y="255" width="270" height="150" rx="10" fill="url(#card-grad-proxy)" stroke="var(--svg-node-blue-border)" stroke-width="1.5"/>
    <rect x="365" y="255" width="270" height="26" rx="10" fill="var(--svg-node-blue-border)"/>
    <text x="500" y="273" fill="var(--svg-node-purple-subtext)" font-size="11.5" font-weight="700" text-anchor="middle">LiteLLM PROXY (GATEWAY)</text>

    <text x="380" y="302" fill="var(--svg-node-blue-border)" font-size="11" font-weight="700">Port 4000 · Aggregation Gateway</text>
    <text x="380" y="322" fill="var(--svg-text-primary)" font-size="10.5">• Einheitliche API für Multi-Cloud</text>
    <text x="380" y="340" fill="var(--svg-text-primary)" font-size="10.5">• Zentrales Budget- &amp; Key-Management</text>
    <text x="380" y="358" fill="var(--svg-text-primary)" font-size="10.5">• Dynamische Kostenallokation</text>
    <text x="380" y="380" fill="var(--svg-node-purple-subtext)" font-size="10" font-weight="600">Orchestrierung externer Provider</text>
  </g>

  <!-- Backend 3: Ollama Node (Right) -->
  <g filter="url(#shadow-inf)">
    <rect x="690" y="255" width="270" height="150" rx="10" fill="url(#card-grad-ollama)" stroke="var(--svg-node-green-border)" stroke-width="1.5"/>
    <rect x="690" y="255" width="270" height="26" rx="10" fill="var(--svg-node-green-bg)"/>
    <text x="825" y="273" fill="var(--svg-node-green-subtext)" font-size="11.5" font-weight="700" text-anchor="middle">OLLAMA NODE (LOKAL / EDGE)</text>

    <text x="705" y="302" fill="var(--svg-node-green-border)" font-size="11" font-weight="700">Port 11434 · Ollama API</text>
    <text x="705" y="322" fill="var(--svg-text-primary)" font-size="10.5">• Lokale Workstation / Mac Studio</text>
    <text x="705" y="340" fill="var(--svg-text-primary)" font-size="10.5">• GGUF-Quantisierungen (4-Bit / 8-Bit)</text>
    <text x="705" y="358" fill="var(--svg-text-primary)" font-size="10.5">• 1-Klick Model-Pull via Web-UI</text>
    <text x="705" y="380" fill="var(--svg-node-green-subtext)" font-size="10" font-weight="600">Offline- &amp; Entwicklungs-Modus</text>
  </g>

  <!-- Connectors from LiteLLM down to Cloud Providers -->
  <path d="M 450 405 L 450 445 L 340 445 L 340 470" stroke="var(--svg-node-blue-border)" stroke-width="1.5" marker-end="url(#arr-indigo)"/>
  <path d="M 550 405 L 550 445 L 660 445 L 660 470" stroke="var(--svg-node-blue-border)" stroke-width="1.5" marker-end="url(#arr-indigo)"/>

  <!-- SUB-TIER: CLOUD PROVIDERS -->
  <g filter="url(#shadow-inf)">
    <rect x="230" y="475" width="220" height="50" rx="8" fill="var(--svg-pill-bg)" stroke="var(--svg-line)" stroke-width="1"/>
    <text x="340" y="496" fill="var(--svg-text-primary)" font-size="11" font-weight="700" text-anchor="middle">OpenAI / Azure OpenAI</text>
    <text x="340" y="512" fill="var(--svg-text-secondary)" font-size="10" text-anchor="middle">GPT-4o, o1, o3-mini (Cloud)</text>
  </g>

  <g filter="url(#shadow-inf)">
    <rect x="550" y="475" width="220" height="50" rx="8" fill="var(--svg-pill-bg)" stroke="var(--svg-line)" stroke-width="1"/>
    <text x="660" y="496" fill="var(--svg-text-primary)" font-size="11" font-weight="700" text-anchor="middle">Anthropic Claude</text>
    <text x="660" y="512" fill="var(--svg-text-secondary)" font-size="10" text-anchor="middle">Claude 3.5 Sonnet / 3.7 (Cloud)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="auto" role="img" aria-label="Architecture diagram of the unified interaction physics kernel across five web graph engines in a square three-tier layout">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="640" rx="12" fill="var(--svg-bg)" stroke="var(--svg-border)" />

  <!-- Top Tier: Shared Preact Tooltip & 750ms Sine Ease Loop -->
  <rect x="24" y="24" width="592" height="92" rx="10" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <rect x="44" y="42" width="68" height="56" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <line x1="56" y1="56" x2="98" y2="56" stroke="var(--svg-node-blue-border)" stroke-width="2" />
  <line x1="56" y1="68" x2="88" y2="68" stroke="var(--svg-line)" stroke-width="2" />
  <circle cx="62" cy="82" r="3.5" fill="var(--svg-node-green-border)" />
  <circle cx="76" cy="82" r="3.5" fill="var(--svg-node-purple-border)" />

  <text x="316" y="62" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="0.03em" fill="var(--svg-node-blue-text)">SHARED PREACT TOOLTIP &amp; 750MS SINE EASE</text>
  <text x="316" y="88" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" fill="var(--svg-node-blue-subtext)">vis-tooltip.tsx + graph-payload.ts</text>

  <path d="M 508 88 C 530 88, 540 48, 564 48 C 580 48, 590 68, 600 68" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="2.5" />
  <circle cx="564" cy="48" r="4.5" fill="var(--svg-node-purple-border)" />

  <path d="M 116 116 V 138" stroke="var(--svg-node-blue-border)" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <path d="M 320 116 V 138" stroke="var(--svg-node-blue-border)" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <path d="M 524 116 V 138" stroke="var(--svg-node-blue-border)" stroke-width="1.8" marker-end="url(#arr-blue)" />

  <!-- Middle Tier Row 1: D3.js, vis-network, Cytoscape.js -->
  <rect x="24" y="142" width="184" height="136" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <circle cx="94" cy="174" r="8" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <circle cx="138" cy="174" r="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
  <line x1="102" y1="174" x2="130" y2="174" stroke="var(--svg-node-blue-border)" stroke-width="1.5" stroke-dasharray="3,2" />
  <text x="116" y="212" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-text-primary)">D3.js (SVG DOM)</text>
  <text x="116" y="234" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" fill="var(--svg-text-secondary)">d3-force Alpha</text>
  <text x="116" y="256" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" font-weight="600" fill="var(--svg-node-blue-text)">DOM .sort()</text>

  <rect x="228" y="142" width="184" height="136" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.5" />
  <circle cx="320" cy="174" r="10" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.5" />
  <circle cx="292" cy="168" r="4.5" fill="var(--svg-node-purple-border)" />
  <circle cx="348" cy="180" r="4.5" fill="var(--svg-node-purple-border)" />
  <text x="320" y="212" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-text-primary)">vis-network</text>
  <text x="320" y="234" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" fill="var(--svg-text-secondary)">2D Canvas FA2</text>
  <text x="320" y="256" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" font-weight="600" fill="var(--svg-node-purple-text)">edgeIndices</text>

  <rect x="432" y="142" width="184" height="136" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <rect x="496" y="162" width="56" height="24" rx="5" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <circle cx="512" cy="174" r="4.5" fill="var(--svg-node-amber-border)" />
  <circle cx="536" cy="174" r="4.5" fill="var(--svg-node-amber-border)" />
  <text x="524" y="212" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-text-primary)">Cytoscape.js</text>
  <text x="524" y="234" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" fill="var(--svg-text-secondary)">rAF cy.batch()</text>
  <text x="524" y="256" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" font-weight="600" fill="var(--svg-node-amber-text)">Style z-index</text>

  <!-- Middle Tier Row 2: Sigma.js & 3D Force -->
  <rect x="24" y="296" width="286" height="136" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
  <polygon points="167,316 187,344 147,344" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
  <text x="167" y="368" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-text-primary)">Sigma.js (WebGL)</text>
  <text x="167" y="390" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" fill="var(--svg-text-secondary)">Custom GLSL Shaders</text>
  <text x="167" y="412" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" font-weight="600" fill="var(--svg-node-green-text)">Graphology zIndex</text>

  <rect x="330" y="296" width="286" height="136" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <circle cx="473" cy="330" r="13" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <ellipse cx="473" cy="330" rx="13" ry="5" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.2" />
  <text x="473" y="368" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-text-primary)">3D Force (Three.js)</text>
  <text x="473" y="390" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" fill="var(--svg-text-secondary)">d3AlphaReheat Drag</text>
  <text x="473" y="412" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" font-weight="600" fill="var(--svg-node-blue-text)">Depth Buffer + s^3</text>

  <path d="M 116 432 V 460" stroke="var(--svg-node-green-border)" stroke-width="1.8" marker-end="url(#arr-green)" />
  <path d="M 320 432 V 460" stroke="var(--svg-node-green-border)" stroke-width="1.8" marker-end="url(#arr-green)" />
  <path d="M 524 432 V 460" stroke="var(--svg-node-green-border)" stroke-width="1.8" marker-end="url(#arr-green)" />

  <!-- Bottom Tier: Occluded Edges vs Dynamic Hop Z-Order & Steady Centroid -->
  <rect x="24" y="466" width="184" height="150" rx="10" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="1.5" />
  <circle cx="116" cy="508" r="14" fill="var(--svg-node-green-border)" />
  <line x1="86" y1="508" x2="146" y2="508" stroke="var(--svg-node-red-border)" stroke-width="4" />
  <text x="116" y="556" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-red-text)">OCCLUDED EDGES</text>
  <text x="116" y="578" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" fill="var(--svg-node-red-subtext)">Unsorted Paint</text>

  <rect x="228" y="466" width="184" height="150" rx="10" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
  <line x1="290" y1="508" x2="350" y2="508" stroke="var(--svg-line)" stroke-width="2.5" />
  <circle cx="320" cy="508" r="14" fill="var(--svg-node-green-border)" />
  <text x="320" y="556" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-green-text)">HOP Z-ORDER</text>
  <text x="320" y="578" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" fill="var(--svg-node-green-subtext)">d=0..1 Drawn Front</text>

  <rect x="432" y="466" width="184" height="150" rx="10" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <circle cx="524" cy="508" r="14" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="2" />
  <circle cx="524" cy="508" r="4" fill="var(--svg-node-blue-border)" />
  <text x="524" y="556" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-blue-text)">STEADY CENTROID</text>
  <text x="524" y="578" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="11" fill="var(--svg-node-blue-subtext)">touch-action: pan-y</text>
</svg>

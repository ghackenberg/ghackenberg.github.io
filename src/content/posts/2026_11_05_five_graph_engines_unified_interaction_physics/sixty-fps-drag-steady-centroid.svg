<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="auto" role="img" aria-label="60fps live drag physics with steady 8 percent centroid drift compensation and dynamic polar slot re-sorting">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arrow-drag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--svg-accent-stroke)" />
    </marker>
    <marker id="arrow-slot" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--svg-success-stroke)" />
    </marker>
  </defs>

  <!-- Outer Canvas Background -->
  <rect x="0" y="0" width="480" height="480" rx="16" fill="var(--svg-bg)" />

  <!-- Ambient Zone Glows -->
  <ellipse cx="240" cy="150" rx="190" ry="82" fill="var(--svg-accent-fill)" opacity="0.28" />
  <ellipse cx="240" cy="340" rx="185" ry="72" fill="var(--svg-success-fill)" opacity="0.26" />

  <!-- Header -->
  <text x="240" y="34" font-family="Outfit, Inter, sans-serif" font-size="16" font-weight="700" fill="var(--svg-fg)" text-anchor="middle" letter-spacing="0.05em">60FPS DRAG PHYSICS &amp; STEADY CAMERA FRAME</text>
  <text x="240" y="55" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="500" fill="var(--svg-muted)" text-anchor="middle">Pinned Drag Simulation Without Disorienting fit() Camera Jumps</text>

  <!-- ==================== TOP ZONE: FORCE DRAG + 8% CENTROID DRIFT ==================== -->
  <!-- Camera Viewport Frame Bracket Icons -->
  <path d="M 44 96 L 44 76 L 68 76" fill="none" stroke="var(--svg-accent-stroke)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 436 96 L 436 76 L 412 76" fill="none" stroke="var(--svg-accent-stroke)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 44 204 L 44 224 L 68 224" fill="none" stroke="var(--svg-accent-stroke)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 436 204 L 436 224 L 412 224" fill="none" stroke="var(--svg-accent-stroke)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Spring Links Between Unpinned Peer Nodes and Dragged Node -->
  <path d="M 122 124 Q 190 118 260 136" fill="none" stroke="var(--svg-accent-stroke)" stroke-width="2.2" stroke-dasharray="5,4" />
  <path d="M 122 180 Q 190 182 260 152" fill="none" stroke="var(--svg-accent-stroke)" stroke-width="2.2" stroke-dasharray="5,4" />
  <line x1="292" y1="144" x2="366" y2="144" stroke="var(--svg-accent-stroke)" stroke-width="2.8" marker-end="url(#arrow-drag)" />

  <!-- Unpinned Peer Nodes Shifting by -8% Centroid Drift -->
  <g transform="translate(106, 120)">
    <circle cx="0" cy="0" r="18" fill="var(--svg-surface)" stroke="var(--svg-accent-stroke)" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="var(--svg-accent-stroke)" />
  </g>
  <g transform="translate(106, 184)">
    <circle cx="0" cy="0" r="18" fill="var(--svg-surface)" stroke="var(--svg-accent-stroke)" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="var(--svg-accent-stroke)" />
  </g>
  <text x="106" y="92" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--svg-accent-text)" text-anchor="middle">-8% Drift</text>

  <!-- Central Centroid Crosshair -->
  <g transform="translate(198, 152)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="var(--svg-warning-stroke)" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="-16" y1="0" x2="16" y2="0" stroke="var(--svg-warning-stroke)" stroke-width="1.8" />
    <line x1="0" y1="-16" x2="0" y2="16" stroke="var(--svg-warning-stroke)" stroke-width="1.8" />
  </g>
  <text x="198" y="190" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-warning-text)" text-anchor="middle">Steady Centroid</text>

  <!-- Pinned Dragged Node -->
  <g transform="translate(276, 144)">
    <circle cx="0" cy="0" r="24" fill="var(--svg-accent-fill)" stroke="var(--svg-accent-stroke)" stroke-width="2.6" />
    <!-- Cursor / Grab Icon -->
    <polygon points="-5,-9 9,1 2,3 5,10 1,12 -2,4 -7,8" fill="var(--svg-accent-stroke)" />
  </g>
  <text x="348" y="118" font-family="Outfit, Inter, sans-serif" font-size="15" font-weight="700" fill="var(--svg-fg)" text-anchor="middle">Pinned Drag</text>
  <text x="348" y="180" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="var(--svg-accent-text)" text-anchor="middle">setCustomBBox</text>

  <!-- Curved Horizon Divider -->
  <path d="M 28 242 Q 240 258 452 242" fill="none" stroke="var(--svg-border)" stroke-width="1.5" stroke-dasharray="6,6" />

  <!-- ==================== BOTTOM ZONE: DYNAMIC RADIAL & COLUMN SLOT SORTING ==================== -->
  <text x="240" y="278" font-family="Outfit, Inter, sans-serif" font-size="15" font-weight="700" fill="var(--svg-success-text)" text-anchor="middle" letter-spacing="0.04em">LIVE POLAR &amp; LINEAR SLOT INTERPOLATION</text>

  <!-- Left Badge: Polar atan2(y - cy, x - cx) Ring Re-Sorting -->
  <g transform="translate(132, 348)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="var(--svg-success-stroke)" stroke-width="2" stroke-dasharray="5,4" />
    <!-- Angular Swap Arc -->
    <path d="M 28 -28 A 40 40 0 0 1 28 28" fill="none" stroke="var(--svg-success-stroke)" stroke-width="2.5" marker-end="url(#arrow-slot)" />
    <circle cx="0" cy="-42" r="9" fill="var(--svg-success-fill)" stroke="var(--svg-success-stroke)" stroke-width="2" />
    <circle cx="-38" cy="16" r="9" fill="var(--svg-success-fill)" stroke="var(--svg-success-stroke)" stroke-width="2" />
    <circle cx="38" cy="16" r="9" fill="var(--svg-accent-fill)" stroke="var(--svg-accent-stroke)" stroke-width="2.2" />
    <text x="0" y="5" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--svg-success-text)" text-anchor="middle">atan2</text>
  </g>
  <text x="132" y="412" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-fg)" text-anchor="middle">Radial Slot Swap</text>

  <!-- Right Badge: Column Slot Re-Sorting & Touch Action Shield -->
  <g transform="translate(344, 348)">
    <circle cx="0" cy="0" r="42" fill="var(--svg-surface)" stroke="var(--svg-success-stroke)" stroke-width="2.2" />
    <!-- Vertical Column Swap Bars -->
    <rect x="-18" y="-18" width="14" height="10" rx="3" fill="var(--svg-success-fill)" stroke="var(--svg-success-stroke)" stroke-width="1.8" />
    <rect x="-18" y="8" width="14" height="10" rx="3" fill="var(--svg-accent-fill)" stroke="var(--svg-accent-stroke)" stroke-width="1.8" />
    <path d="M 6 -14 C 18 -6, 18 6, 6 14" fill="none" stroke="var(--svg-success-stroke)" stroke-width="2.2" marker-end="url(#arrow-slot)" />
  </g>
  <text x="344" y="412" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-fg)" text-anchor="middle">Column &amp; Touch Guard</text>

  <!-- Bottom Summary Pill -->
  <rect x="34" y="428" width="412" height="36" rx="18" fill="var(--svg-surface)" stroke="var(--svg-border)" stroke-width="1.5" />
  <text x="240" y="451" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--svg-fg)" text-anchor="middle">animateTo() + touch-action: pan-y</text>
</svg>

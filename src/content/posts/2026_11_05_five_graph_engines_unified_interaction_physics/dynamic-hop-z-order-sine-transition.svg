<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="auto" role="img" aria-label="Comparison between unsorted background edge occlusion and dynamic hop z-ordering with 750ms sine-eased transitions">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
  </defs>

  <!-- Outer Canvas Background -->
  <rect x="0" y="0" width="480" height="480" rx="16" fill="var(--svg-bg)" />

  <!-- Ambient Zone Glows -->
  <ellipse cx="240" cy="112" rx="190" ry="68" fill="var(--svg-node-red-bg)" opacity="0.24" />
  <ellipse cx="240" cy="336" rx="195" ry="92" fill="var(--svg-node-blue-bg)" opacity="0.30" />

  <!-- ==================== TOP ZONE: UNSORTED PAINT OCCLUSION (ANTI-PATTERN) ==================== -->
  <text x="240" y="34" font-family="Outfit, Inter, sans-serif" font-size="16" font-weight="700" fill="var(--svg-node-red-subtext)" text-anchor="middle" letter-spacing="0.05em">UNSORTED PAINT ORDER (EDGE OCCLUSION)</text>

  <!-- Foreground Focus Node Drawn First, Then Sliced by Late Dimmed Edges -->
  <g transform="translate(154, 114)">
    <circle cx="0" cy="0" r="28" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="2.5" />
    <!-- Crossed-out / Occluded Node Lines Slicing Over Foreground -->
    <line x1="-48" y1="-22" x2="48" y2="22" stroke="var(--svg-text-secondary)" stroke-width="3.2" />
    <line x1="-48" y1="22" x2="48" y2="-22" stroke="var(--svg-text-secondary)" stroke-width="3.2" />
  </g>
  <text x="154" y="164" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-node-red-subtext)" text-anchor="middle">Sliced Focus Node</text>

  <!-- Explanation Badge on Right of Top Zone -->
  <g transform="translate(342, 114)">
    <circle cx="0" cy="0" r="24" fill="var(--svg-card)" stroke="var(--svg-node-red-border)" stroke-width="2.2" />
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="var(--svg-node-red-border)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="var(--svg-node-red-border)" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="342" y="156" font-family="Outfit, Inter, sans-serif" font-size="14" font-weight="700" fill="var(--svg-text-primary)" text-anchor="middle">Static Paint Order</text>
  <text x="342" y="174" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="500" fill="var(--svg-text-secondary)" text-anchor="middle">z=1 Bleeds Over z=40</text>

  <!-- Curved Horizon Divider -->
  <path d="M 28 198 Q 240 214 452 198" fill="none" stroke="var(--svg-border)" stroke-width="1.5" stroke-dasharray="6,6" />

  <!-- ==================== BOTTOM ZONE: DYNAMIC HOP Z-ORDER & 750MS SINE EASING ==================== -->
  <text x="240" y="236" font-family="Outfit, Inter, sans-serif" font-size="16" font-weight="700" fill="var(--svg-node-blue-subtext)" text-anchor="middle" letter-spacing="0.05em">DYNAMIC HOP Z-STACK &amp; 750MS SINE LOOP</text>

  <!-- Left: Elevation Stack (z=1 Back -> z=30 -> z=40 Front) -->
  <!-- Layer z=1 (Background Shell) -->
  <ellipse cx="144" cy="378" rx="68" ry="18" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.6" stroke-dasharray="4,4" />
  <text x="144" y="383" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="var(--svg-text-secondary)" text-anchor="middle">z=1..20 (Back)</text>

  <!-- Layer z=30 (1-Hop Ego Ring) -->
  <ellipse cx="144" cy="334" rx="68" ry="18" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="2" />
  <text x="144" y="339" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--svg-node-green-subtext)" text-anchor="middle">z=30 (1-Hop)</text>

  <!-- Layer z=40 (Focused Node Top Layer) -->
  <ellipse cx="144" cy="288" rx="68" ry="18" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2.5" />
  <text x="144" y="293" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="var(--svg-node-blue-subtext)" text-anchor="middle">z=40 (Focus)</text>

  <!-- Upward Z-Sort Arrow -->
  <line x1="56" y1="378" x2="56" y2="288" stroke="var(--svg-node-green-border)" stroke-width="2.5" marker-end="url(#arrow-up)" />

  <!-- Right: 750ms Sine Easing Curve & 3D s^3 Volume Scaling -->
  <g transform="translate(342, 326)">
    <circle cx="0" cy="0" r="48" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="2.2" />
    <!-- Smooth Sine Ease-In-Out S-Curve -->
    <path d="M -28 20 C -8 20, 8 -20, 28 -20" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="3" stroke-linecap="round" />
    <circle cx="-28" cy="20" r="4.5" fill="var(--svg-text-secondary)" />
    <circle cx="28" cy="-20" r="5" fill="var(--svg-node-blue-border)" />
  </g>
  <text x="342" y="394" font-family="Outfit, Inter, sans-serif" font-size="15" font-weight="700" fill="var(--svg-text-primary)" text-anchor="middle">750ms Sine Easing</text>
  <text x="342" y="413" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="var(--svg-node-blue-subtext)" text-anchor="middle">-0.5&#183;(cos(&#960;p) - 1)</text>

  <!-- Bottom Summary Pill -->
  <rect x="30" y="428" width="420" height="36" rx="18" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.5" />
  <text x="240" y="451" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--svg-text-primary)" text-anchor="middle">.sort() | edgeIndices | displayZIndex | s&#179; 3D</text>
</svg>

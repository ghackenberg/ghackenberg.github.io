<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="auto" role="img" aria-label="Semantic vector comparison contrasting Astro built-in text-only glob digesting with our composite Merkle asset tree digesting">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-red-border)" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)" />
    </marker>
  </defs>

  <!-- Outer Canvas Background -->
  <rect x="0" y="0" width="480" height="480" rx="16" fill="var(--svg-bg)" />

  <!-- Ambient Halos -->
  <ellipse cx="240" cy="136" rx="200" ry="64" fill="var(--svg-node-red-bg)" opacity="0.22" />
  <ellipse cx="240" cy="346" rx="206" ry="74" fill="var(--svg-node-green-bg)" opacity="0.22" />

  <!-- Header -->
  <text x="240" y="32" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="0.05em" fill="var(--svg-text-primary)">TEXT-ONLY DIGEST VS. MERKLE TREE</text>

  <!-- ===================================================================
       UPPER ZONE: BUILT-IN ASTRO GLOB() (STALE CACHE ON ASSET EDIT)
       =================================================================== -->
  <text x="36" y="62" font-family="Outfit, Inter, sans-serif" font-size="13.5" font-weight="700" fill="var(--svg-node-red-text)">1. Built-In glob() Loader</text>
  <text x="444" y="62" text-anchor="end" font-family="Outfit, Inter, sans-serif" font-size="12.5" font-weight="600" fill="var(--svg-node-red-subtext)">Blind to Sibling Assets</text>

  <!-- Left Input: index.md (Tracked) -->
  <rect x="32" y="76" width="126" height="54" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1.8" />
  <path d="M 46 90 H 58 L 62 94 V 114 H 46 Z" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <text x="104" y="99" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13.5" font-weight="700" fill="var(--svg-node-blue-text)">index.md</text>
  <text x="104" y="117" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="500" fill="var(--svg-node-blue-subtext)">Unchanged Text</text>

  <!-- Left Input 2: diagram.svg / hero.jpg (Mutated, Disconnected) -->
  <rect x="32" y="142" width="126" height="54" rx="10" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.8" stroke-dasharray="4,3" />
  <circle cx="52" cy="169" r="9" fill="var(--svg-card)" stroke="var(--svg-node-amber-border)" stroke-width="1.6" />
  <text x="104" y="165" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13.5" font-weight="700" fill="var(--svg-node-amber-text)">diagram.svg</text>
  <text x="104" y="183" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="600" fill="var(--svg-node-amber-subtext)">Edited on Disk</text>

  <!-- Arrow from index.md to Digest -->
  <path d="M 158 103 H 192" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-blue)" />

  <!-- Blocked X on diagram.svg -->
  <path d="M 158 169 H 180" fill="none" stroke="var(--svg-node-red-border)" stroke-width="1.8" stroke-dasharray="3,3" />
  <path d="M 180 163 L 192 175 M 192 163 L 180 175" fill="none" stroke="var(--svg-node-red-border)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Middle Node: Text-Only Digest -->
  <rect x="200" y="96" width="122" height="68" rx="10" fill="var(--svg-card)" stroke="var(--svg-node-red-border)" stroke-width="1.8" />
  <text x="261" y="124" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13.5" font-weight="700" fill="var(--svg-node-red-text)">Text Digest</text>
  <text x="261" y="144" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="600" fill="var(--svg-node-red-subtext)">Same Hash</text>

  <!-- Arrow to Stale DataStore -->
  <path d="M 322 130 H 348" fill="none" stroke="var(--svg-node-red-border)" stroke-width="2" marker-end="url(#arr-red)" />

  <!-- Right Outcome: Stale Cache -->
  <rect x="356" y="96" width="94" height="68" rx="10" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="2" />
  <text x="403" y="124" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13.5" font-weight="700" fill="var(--svg-node-red-text)">Stale Cache</text>
  <text x="403" y="144" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="600" fill="var(--svg-node-red-subtext)">Skipped</text>

  <!-- Horizon Divider -->
  <line x1="32" y1="220" x2="448" y2="220" stroke="var(--svg-border)" stroke-width="1.5" stroke-dasharray="5,4" />

  <!-- ===================================================================
       LOWER ZONE: ASSETAWAREGLOB MERKLE ASSET TREE (SYSTEM-012)
       =================================================================== -->
  <text x="36" y="248" font-family="Outfit, Inter, sans-serif" font-size="13.5" font-weight="700" fill="var(--svg-node-green-text)">2. Composite Merkle Tree</text>
  <text x="444" y="248" text-anchor="end" font-family="Outfit, Inter, sans-serif" font-size="12.5" font-weight="600" fill="var(--svg-node-green-subtext)">Full Input Closure</text>

  <!-- Leaf 1: index.md -->
  <rect x="32" y="264" width="128" height="46" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1.8" />
  <text x="96" y="284" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-blue-text)">index.md</text>
  <text x="96" y="301" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="500" fill="var(--svg-node-blue-subtext)">baseDigest</text>

  <!-- Leaf 2: diagram.svg & hero.jpg -->
  <rect x="32" y="320" width="128" height="46" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1.8" />
  <text x="96" y="340" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-green-text)">Sibling Assets</text>
  <text x="96" y="357" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="500" fill="var(--svg-node-green-subtext)">.svg + .jpg MD5</text>

  <!-- Leaf 3: Pipeline Plugins & CSS -->
  <rect x="32" y="376" width="128" height="46" rx="8" fill="var(--svg-card)" stroke="var(--svg-node-purple-border)" stroke-width="1.8" />
  <text x="96" y="396" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-purple-text)">Pipeline Files</text>
  <text x="96" y="413" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="500" fill="var(--svg-node-purple-subtext)">Plugins + CSS</text>

  <!-- Converging Merkle Branches -->
  <path d="M 160 287 H 180 V 333 H 196" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.8" marker-end="url(#arr-green)" />
  <path d="M 160 343 H 196" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.8" marker-end="url(#arr-green)" />
  <path d="M 160 399 H 180 V 353 H 196" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.8" marker-end="url(#arr-green)" />

  <!-- Root Merkle Digest Node -->
  <rect x="204" y="304" width="122" height="78" rx="10" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="2" />
  <text x="265" y="332" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13.5" font-weight="700" fill="var(--svg-node-green-text)">Merkle Root</text>
  <text x="265" y="351" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="600" fill="var(--svg-node-green-subtext)">base : assets</text>
  <text x="265" y="369" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="600" fill="var(--svg-node-green-subtext)">New Digest</text>

  <!-- Arrow to Fresh Rebuild -->
  <path d="M 326 343 H 348" fill="none" stroke="var(--svg-node-green-border)" stroke-width="2" marker-end="url(#arr-green)" />

  <!-- Right Outcome: Fresh DataStore Entry -->
  <rect x="356" y="304" width="94" height="78" rx="10" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="2" />
  <circle cx="403" cy="326" r="10" fill="var(--svg-card)" stroke="var(--svg-node-green-border)" stroke-width="1.6" />
  <polyline points="398,326 402,330 409,322" fill="none" stroke="var(--svg-node-green-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="403" y="352" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-green-text)">Fresh Store</text>
  <text x="403" y="370" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="12" font-weight="600" fill="var(--svg-node-green-subtext)">Re-Rendered</text>

  <!-- Bottom Summary Banner -->
  <rect x="44" y="434" width="392" height="32" rx="16" fill="var(--svg-card-alt)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
  <text x="240" y="455" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-green-text)">Constructive Traces Require Complete Input Fingerprints</text>
</svg>

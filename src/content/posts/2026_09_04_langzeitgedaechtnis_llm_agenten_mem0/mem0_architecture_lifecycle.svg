<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow-pipe" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="grad-card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="grad-stage-extract" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-stage-lifecycle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#17153b" />
    </linearGradient>
    <linearGradient id="grad-stage-storage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="12" y="12" width="916" height="516" rx="16" fill="#0b1120" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(35, 40)">
    <text x="0" y="0" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="-0.02em">Der Mem0-Lifecycle: Von Dialog-Streams zu persistenter Wissensevolution</text>
    <text x="0" y="22" fill="#a855f7" font-size="11.5" font-weight="700" letter-spacing="0.05em">EXTRAKTION, DEDUPLIZIERUNG, STATE-MUTATION (ADD/UPDATE/DELETE) UND SELEKTIVE INJEKTION</text>
  </g>

  <!-- ==================== FLOW CONNECTIONS ==================== -->
  <!-- 1. Input to Extraction -->
  <path d="M 215 170 L 260 170" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="222" y="160" fill="#93c5fd" font-size="9" font-weight="600">Turn</text>

  <!-- 2. Extraction to Lifecycle Engine -->
  <path d="M 450 170 L 495 170" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="456" y="160" fill="#c084fc" font-size="9" font-weight="600">Facts</text>

  <!-- 3. Lifecycle Engine to Storage -->
  <path d="M 685 170 L 730 170" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <text x="692" y="160" fill="#2dd4bf" font-size="9" font-weight="600">Mutation</text>

  <!-- 4. Storage to Context Injection (Feedback Loop) -->
  <path d="M 810 270 C 810 330, 125 330, 125 240" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-green)" />
  <text x="440" y="322" fill="#34d399" font-size="10.5" font-weight="700">Selektive Context Injection (&lt; 500 Tokens in System Prompt)</text>

  <!-- ==================== STAGE 1: INGESTION (DIALOG STREAM) ==================== -->
  <g filter="url(#shadow-pipe)" transform="translate(35, 95)">
    <rect x="0" y="0" width="180" height="145" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="180" height="28" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" />
    <text x="12" y="18" fill="#dbeafe" font-size="11.5" font-weight="800">1. Dialog-Ingestion</text>
    
    <g transform="translate(12, 38)">
      <circle cx="5" cy="5" r="3" fill="#3b82f6" />
      <text x="14" y="9" fill="#f8fafc" font-size="10" font-weight="600">Multi-Session Stream</text>
      <text x="14" y="22" fill="#94a3b8" font-size="8.5">Eingehende User &amp; Agent Turns</text>
    </g>

    <g transform="translate(12, 70)">
      <circle cx="5" cy="5" r="3" fill="#3b82f6" />
      <text x="14" y="9" fill="#f8fafc" font-size="10" font-weight="600">Scope-Identifikatoren</text>
      <text x="14" y="22" fill="#cbd5e1" font-size="8.5">• user_id (Benutzerprofil)</text>
      <text x="14" y="34" fill="#cbd5e1" font-size="8.5">• session_id (Dialogkontext)</text>
      <text x="14" y="46" fill="#cbd5e1" font-size="8.5">• agent_id (Agenten-Instanz)</text>
    </g>
  </g>

  <!-- ==================== STAGE 2: EXTRACTION ==================== -->
  <g filter="url(#shadow-pipe)" transform="translate(265, 95)">
    <rect x="0" y="0" width="185" height="145" rx="10" fill="url(#grad-stage-extract)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="0" y="0" width="185" height="28" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="1.5" />
    <text x="12" y="18" fill="#e0e7ff" font-size="11.5" font-weight="800">2. Atomare Extraktion</text>
    
    <g transform="translate(12, 38)">
      <circle cx="5" cy="5" r="3" fill="#818cf8" />
      <text x="14" y="9" fill="#f8fafc" font-size="10" font-weight="600">Dedicated Extractor LLM</text>
      <text x="14" y="22" fill="#94a3b8" font-size="8.5">Kein fixes Token-Chunking!</text>
    </g>

    <g transform="translate(12, 70)">
      <circle cx="5" cy="5" r="3" fill="#818cf8" />
      <text x="14" y="9" fill="#f8fafc" font-size="10" font-weight="600">Saliente Propositionen</text>
      <text x="14" y="22" fill="#cbd5e1" font-size="8.5">Extrahiert Vorlieben, Fakten,</text>
      <text x="14" y="34" fill="#cbd5e1" font-size="8.5">Entitäten &amp; Beziehungen</text>
      <text x="14" y="46" fill="#93c5fd" font-size="8.5">Befreit von Dialograuschen</text>
    </g>
  </g>

  <!-- ==================== STAGE 3: DYNAMIC LIFECYCLE ENGINE ==================== -->
  <g filter="url(#shadow-pipe)" transform="translate(500, 95)">
    <rect x="0" y="0" width="185" height="145" rx="10" fill="url(#grad-stage-lifecycle)" stroke="#c084fc" stroke-width="1.5" />
    <rect x="0" y="0" width="185" height="28" rx="10" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5" />
    <text x="12" y="18" fill="#f3e8ff" font-size="11.5" font-weight="800">3. Memory Lifecycle</text>
    
    <g transform="translate(10, 36)">
      <rect x="0" y="0" width="78" height="22" rx="4" fill="#065f46" />
      <text x="6" y="15" fill="#a7f3d0" font-size="9" font-weight="700">ADD: Neuer Fakt</text>

      <rect x="86" y="0" width="80" height="22" rx="4" fill="#1e3a8a" />
      <text x="92" y="15" fill="#bfdbfe" font-size="9" font-weight="700">NOOP: Duplikat</text>
    </g>

    <g transform="translate(10, 64)">
      <rect x="0" y="0" width="78" height="22" rx="4" fill="#854d0e" />
      <text x="6" y="15" fill="#fde68a" font-size="9" font-weight="700">UPDATE: Edit</text>

      <rect x="86" y="0" width="80" height="22" rx="4" fill="#7f1d1d" />
      <text x="92" y="15" fill="#fecaca" font-size="9" font-weight="700">DELETE: Lösch</text>
    </g>

    <g transform="translate(12, 94)">
      <text x="0" y="12" fill="#cbd5e1" font-size="8.5" font-weight="600">Konflikt- &amp; Konsistenzprüfung:</text>
      <text x="0" y="24" fill="#94a3b8" font-size="8.5">Veraltetes Wissen wird mutiert,</text>
      <text x="0" y="36" fill="#94a3b8" font-size="8.5">nicht akkumulierend gestapelt.</text>
    </g>
  </g>

  <!-- ==================== STAGE 4: HYBRID STORAGE (MEM0G) ==================== -->
  <g filter="url(#shadow-pipe)" transform="translate(735, 95)">
    <rect x="0" y="0" width="170" height="145" rx="10" fill="url(#grad-stage-storage)" stroke="#2dd4bf" stroke-width="1.5" />
    <rect x="0" y="0" width="170" height="28" rx="10" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="12" y="18" fill="#ccfbf1" font-size="11.5" font-weight="800">4. Hybride Persistenz</text>
    
    <g transform="translate(12, 38)">
      <circle cx="5" cy="5" r="3" fill="#2dd4bf" />
      <text x="14" y="9" fill="#f8fafc" font-size="10" font-weight="600">Dichter Vektor-Store</text>
      <text x="14" y="22" fill="#94a3b8" font-size="8.5">Qdrant, pgvector, Milvus</text>
      <text x="14" y="34" fill="#cbd5e1" font-size="8">Semantische Ähnlichkeitssuche</text>
    </g>

    <g transform="translate(12, 80)">
      <circle cx="5" cy="5" r="3" fill="#2dd4bf" />
      <text x="14" y="9" fill="#f8fafc" font-size="10" font-weight="600">Dynamic Graph (Mem0g)</text>
      <text x="14" y="22" fill="#94a3b8" font-size="8.5">Neo4j / Graphiti</text>
      <text x="14" y="34" fill="#cbd5e1" font-size="8">Multi-Hop &amp; zeitliche Kanten</text>
    </g>
  </g>

  <!-- ==================== BOTTOM ARCHITECTURAL VALUE CARDS ==================== -->
  <g transform="translate(35, 360)">
    <!-- Card 1: State Mutation vs Append -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="275" height="135" rx="10" fill="#111827" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />
      <rect x="12" y="12" width="130" height="22" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1" />
      <text x="18" y="27" fill="#93c5fd" font-size="10" font-weight="700">DETERMINISTISCH</text>
      <text x="12" y="55" fill="#f8fafc" font-size="13" font-weight="700">State Mutation statt Append</text>
      <text x="12" y="75" fill="#cbd5e1" font-size="9.5">Verhindert Widersprüche und Halluzinationen durch explizite CRUD-Semantik. Wenn sich Vorlieben ändern, wird der Speicherzustand aktualisiert.</text>
    </g>

    <!-- Card 2: Resource Efficiency -->
    <g transform="translate(297, 0)">
      <rect x="0" y="0" width="275" height="135" rx="10" fill="#111827" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />
      <rect x="12" y="12" width="130" height="22" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="18" y="27" fill="#6ee7b7" font-size="10" font-weight="700">EFFIZIENZ-SPRUNG</text>
      <text x="12" y="55" fill="#f8fafc" font-size="13" font-weight="700">>90 % Token- &amp; Kostenreduktion</text>
      <text x="12" y="75" fill="#cbd5e1" font-size="9.5">Bricht die quadratische O(T²)-Kostenkurve. Statt riesiger Transkript-Histories werden nur wenige hundert relevante Token gezielt in den Prompt injiziert.</text>
    </g>

    <!-- Card 3: Multi-Hop Reasoning -->
    <g transform="translate(595, 0)">
      <rect x="0" y="0" width="275" height="135" rx="10" fill="#111827" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />
      <rect x="12" y="12" width="130" height="22" rx="4" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="18" y="27" fill="#d8b4fe" font-size="10" font-weight="700">GRAPH-REASONING</text>
      <text x="12" y="55" fill="#f8fafc" font-size="13" font-weight="700">Mem0g: Relationaler Graph</text>
      <text x="12" y="75" fill="#cbd5e1" font-size="9.5">Kombiniert semantisches Vektor-Matching mit typisierten Kanten. Ermöglicht präzise Antworten auf zeitliche und mehrstufige relationale Anfragen.</text>
    </g>
  </g>
</svg>

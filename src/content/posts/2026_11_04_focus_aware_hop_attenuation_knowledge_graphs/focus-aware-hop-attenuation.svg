<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="auto" role="img" aria-label="Ego-neighborhood rings with hub-degree penalty in the top tier and parametric power-decay curves in the bottom tier">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-amber-border)" />
    </marker>
  </defs>
  <rect id="canvas-bg" x="0" y="0" width="640" height="640" rx="12" fill="var(--svg-bg)" />

  <!-- Top Tier: Ego-Neighborhood Rings (d_eff) -->
  <rect id="panel-top" x="24" y="24" width="592" height="292" rx="10" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.5" />
  <text id="title-top" x="320" y="50" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.04em" fill="var(--svg-text-primary)">EGO-NEIGHBORHOOD RINGS (d_eff)</text>

  <circle id="ring-d3" cx="270" cy="184" r="114" fill="none" stroke="var(--svg-line)" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle id="ring-d2" cx="270" cy="184" r="80" fill="none" stroke="var(--svg-line)" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle id="ring-d1" cx="270" cy="184" r="46" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.5" stroke-dasharray="4,3" />
  <text id="lbl-r1" x="270" y="132" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">d=1</text>
  <text id="lbl-r2" x="270" y="98" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">d=2</text>
  <text id="lbl-r3" x="270" y="64" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">d=3..4</text>

  <line id="edge-f-1" x1="270" y1="184" x2="230" y2="162" stroke="var(--svg-node-green-border)" stroke-width="2.5" />
  <line id="edge-f-2" x1="270" y1="184" x2="242" y2="220" stroke="var(--svg-node-green-border)" stroke-width="2.5" />
  <line id="edge-f-hub" x1="270" y1="184" x2="316" y2="184" stroke="var(--svg-node-amber-border)" stroke-width="2.5" />
  <line id="edge-d1-d2a" x1="230" y1="162" x2="192" y2="152" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <line id="edge-d1-d2b" x1="242" y1="220" x2="208" y2="242" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
  <line id="edge-d2-d3a" x1="192" y1="152" x2="160" y2="138" stroke="var(--svg-line)" stroke-width="1.2" />
  <line id="edge-d2-d3b" x1="208" y1="242" x2="176" y2="264" stroke="var(--svg-line)" stroke-width="1.2" />

  <line id="edge-hub-c1" x1="316" y1="184" x2="380" y2="142" stroke="var(--svg-node-amber-border)" stroke-width="1.5" stroke-dasharray="3,3" />
  <line id="edge-hub-c2" x1="316" y1="184" x2="388" y2="184" stroke="var(--svg-node-amber-border)" stroke-width="1.5" stroke-dasharray="3,3" />
  <line id="edge-hub-c3" x1="316" y1="184" x2="380" y2="226" stroke="var(--svg-node-amber-border)" stroke-width="1.5" stroke-dasharray="3,3" />
  <path id="penalty-arrow" d="M 332 172 L 370 148" fill="none" stroke="var(--svg-node-amber-border)" stroke-width="2" marker-end="url(#arr-amber)" />

  <rect id="badge-penalty" x="412" y="138" width="176" height="68" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
  <text id="lbl-penalty" x="500" y="166" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--svg-node-amber-text)">+Δd Hub Penalty</text>
  <text id="lbl-penalty-sub" x="500" y="188" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" fill="var(--svg-node-amber-subtext)">Attenuates Dense Tags</text>

  <circle id="node-focus" cx="270" cy="184" r="15" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="2.5" />
  <text id="lbl-focus" x="270" y="214" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="var(--svg-node-green-text)">d=0 Focus</text>
  <circle id="node-d1-a" cx="230" cy="162" r="10" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
  <circle id="node-d1-b" cx="242" cy="220" r="10" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="2" />
  <circle id="node-hub" cx="316" cy="184" r="12" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="2" />
  <text id="lbl-hub" x="316" y="210" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="var(--svg-node-amber-text)">Tag Hub</text>

  <circle id="node-d2-a" cx="192" cy="152" r="6.5" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" opacity="0.72" />
  <circle id="node-d2-b" cx="208" cy="242" r="6.5" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" opacity="0.72" />
  <circle id="node-d3-a" cx="160" cy="138" r="4" fill="var(--svg-card-alt)" stroke="var(--svg-text-muted)" stroke-width="1" opacity="0.4" />
  <circle id="node-d3-b" cx="176" cy="264" r="4" fill="var(--svg-card-alt)" stroke="var(--svg-text-muted)" stroke-width="1" opacity="0.4" />
  <circle id="node-hc-1" cx="380" cy="142" r="4" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1" opacity="0.45" />
  <circle id="node-hc-2" cx="388" cy="184" r="4" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1" opacity="0.45" />
  <circle id="node-hc-3" cx="380" cy="226" r="4" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1" opacity="0.45" />

  <!-- Bottom Tier: Parametric Power-Decay Curves f(d_eff) -->
  <rect id="panel-bottom" x="24" y="336" width="592" height="280" rx="10" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.5" />
  <text id="title-bottom" x="320" y="362" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.04em" fill="var(--svg-text-primary)">PARAMETRIC POWER-DECAY CURVES f(d_eff)</text>

  <line id="grid-h1" x1="96" y1="396" x2="576" y2="396" stroke="var(--svg-line)" stroke-dasharray="2,3" />
  <line id="grid-h2" x1="96" y1="478" x2="576" y2="478" stroke="var(--svg-line)" stroke-dasharray="2,3" />
  <line id="axis-y" x1="96" y1="390" x2="96" y2="560" stroke="var(--svg-border)" stroke-width="1.5" />
  <line id="axis-x" x1="96" y1="560" x2="576" y2="560" stroke="var(--svg-border)" stroke-width="1.5" />

  <text id="lbl-y-max" x="84" y="400" text-anchor="end" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">2.1x</text>
  <text id="lbl-y-mid" x="84" y="482" text-anchor="end" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">1.0x</text>
  <text id="lbl-y-min" x="84" y="560" text-anchor="end" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">0.0x</text>

  <text id="lbl-x-0" x="96" y="580" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">0</text>
  <text id="lbl-x-1" x="216" y="580" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">1</text>
  <text id="lbl-x-2" x="336" y="580" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">2</text>
  <text id="lbl-x-3" x="456" y="580" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">3</text>
  <text id="lbl-x-4" x="576" y="580" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="var(--svg-text-muted)">4</text>
  <text id="lbl-x-axis" x="336" y="602" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--svg-text-secondary)">Effective Hop Distance d_eff (0..4)</text>

  <line id="budget-line" x1="296" y1="390" x2="296" y2="560" stroke="var(--svg-node-amber-border)" stroke-width="1.8" stroke-dasharray="5,4" />
  <text id="lbl-budget" x="296" y="384" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="var(--svg-node-amber-text)">Focus Budget (16 Nodes)</text>

  <path id="curve-scale" d="M 96 396 C 220 404, 396 476, 576 532" fill="none" stroke="var(--svg-node-green-border)" stroke-width="3" />
  <path id="curve-color" d="M 96 478 C 216 482, 392 518, 576 546" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="3" />
  <circle id="pt-scale-0" cx="96" cy="396" r="4" fill="var(--svg-node-green-border)" />
  <circle id="pt-scale-4" cx="576" cy="532" r="4" fill="var(--svg-node-green-border)" />
  <circle id="pt-color-0" cx="96" cy="478" r="4" fill="var(--svg-node-purple-border)" />
  <circle id="pt-color-4" cx="576" cy="546" r="4" fill="var(--svg-node-purple-border)" />
  <text id="lbl-curve-scale" x="456" y="454" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-green-text)">Node Scale (2.1x..0.4x)</text>
  <text id="lbl-curve-color" x="456" y="514" text-anchor="middle" font-family="Outfit, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--svg-node-purple-text)">Color Retention (1.0..0.18)</text>
</svg>

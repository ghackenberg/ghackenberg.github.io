<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="auto" role="img" aria-label="Four Disciplinary Paradigms of Emergence and Nancy Leveson's STAMP / STPA-Sec Closed-Loop AI Agent Harness Control Architecture">
  <defs>
    <style>
      @import url('/styles/graphics.css');
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-blue-border)" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-purple-border)" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-green-border)" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-amber-border)" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--svg-node-red-border)" />
    </marker>
  </defs>

  <!-- Outer Canvas Frame -->
  <rect id="canvas-bg" width="880" height="420" rx="14" fill="var(--svg-bg)" stroke="var(--svg-border)" stroke-width="1.5" />

  <!-- Top Title Banner -->
  <g id="header-bar">
    <text x="440" y="26" fill="var(--svg-text-primary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.06em" text-anchor="middle">PARADIGMS OF EMERGENCE &amp; STAMP / STPA-SEC AI HARNESS CONTROL LOOP</text>
    <text x="440" y="43" fill="var(--svg-text-secondary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" text-anchor="middle">Bridging philosophical, physical, and neural scaling theories with Leveson's (2011) coupled control-loop security constraints</text>
    <line x1="24" y1="52" x2="856" y2="52" stroke="var(--svg-line)" stroke-width="1" />
  </g>

  <!-- LEFT PANE: 4 Disciplinary Paradigms of Emergence -->
  <g id="paradigms-pane" transform="translate(24, 62)">
    <rect width="316" height="338" rx="10" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.5" />
    <rect x="14" y="10" width="288" height="20" rx="4" fill="var(--svg-pill-bg)" />
    <text x="158" y="24" fill="var(--svg-text-primary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" text-anchor="middle">1. FOUR PARADIGMS OF EMERGENCE</text>

    <!-- Paradigm 1: Philosophy -->
    <g id="paradigm-philosophy" transform="translate(14, 38)">
      <rect width="288" height="64" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1" />
      <text x="12" y="19" fill="var(--svg-text-primary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">A. Philosophy of Science (1843–2006)</text>
      <text x="12" y="36" fill="var(--svg-text-secondary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5">Mill, Lewes, Broad &amp; Chalmers: Heteropathic laws</text>
      <text x="12" y="51" fill="var(--svg-text-muted)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10">Strong (irreducible) vs. Weak (unexpected) emergence</text>
    </g>

    <!-- Paradigm 2: Statistical Physics & Info Theory -->
    <g id="paradigm-physics" transform="translate(14, 110)">
      <rect width="288" height="64" rx="8" fill="var(--svg-card-alt)" stroke="var(--svg-border)" stroke-width="1" />
      <text x="12" y="19" fill="var(--svg-text-primary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">B. Physics &amp; Complexity (1972–2001)</text>
      <text x="12" y="36" fill="var(--svg-text-secondary)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5">Anderson, Crutchfield &amp; Lloyd: N → ∞ phase shifts</text>
      <text x="12" y="51" fill="var(--svg-text-muted)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10">Spontaneous symmetry breaking &amp; ε-machine state</text>
    </g>

    <!-- Paradigm 3: Deep Learning Scaling -->
    <g id="paradigm-dl" transform="translate(14, 182)">
      <rect width="288" height="64" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.2" />
      <text x="12" y="19" fill="var(--svg-node-purple-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">C. Neural Scaling &amp; Compounding (2022–2025)</text>
      <text x="12" y="36" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5">Wei, Schaeffer &amp; Du: L ≈ 2.2 loss phase threshold</text>
      <text x="12" y="51" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10">Smooth token loss → cliff-edge P_exploit = ∏ p_i jumps</text>
    </g>

    <!-- Paradigm 4: Systems Engineering STAMP -->
    <g id="paradigm-stamp" transform="translate(14, 254)">
      <rect width="288" height="70" rx="8" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
      <text x="12" y="19" fill="var(--svg-node-blue-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">D. Systems Theory / STAMP (2011–2014)</text>
      <text x="12" y="36" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5">Leveson &amp; Young (STPA-Sec): Coupled control loops</text>
      <text x="12" y="51" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10">Security emerges from enforced boundary constraints</text>
    </g>
  </g>

  <!-- Bridge Connector from Paradigm D to STAMP Control Loop -->
  <path id="bridge-connector" d="M 340 351 L 364 351" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="2" marker-end="url(#arr-blue)" />

  <!-- RIGHT PANE: STAMP / STPA-Sec Closed Control Loop -->
  <g id="stamp-loop-pane" transform="translate(364, 62)">
    <rect width="492" height="338" rx="10" fill="var(--svg-card-alt)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" stroke-dasharray="6,4" />
    <rect x="16" y="10" width="460" height="20" rx="4" fill="var(--svg-card)" stroke="var(--svg-node-blue-border)" stroke-width="1" />
    <text x="246" y="24" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em" text-anchor="middle">2. STAMP / STPA-SEC COUPLED AI HARNESS CONTROL LOOP</text>

    <!-- Node 1: CONTROLLER (Top Center) -->
    <g id="stamp-controller" transform="translate(136, 40)">
      <rect width="220" height="68" rx="8" fill="var(--svg-node-purple-bg)" stroke="var(--svg-node-purple-border)" stroke-width="1.5" />
      <rect x="10" y="7" width="126" height="15" rx="3" fill="var(--svg-pill-bg)" />
      <text x="73" y="18" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">CONTROLLER (POLICY)</text>
      <text x="110" y="38" fill="var(--svg-node-purple-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">LLM Weights &amp; Process Model</text>
      <text x="110" y="55" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Goal optimization &amp; world-state belief</text>
    </g>

    <!-- Node 2: ACTUATORS (Middle Right) -->
    <g id="stamp-actuators" transform="translate(262, 138)">
      <rect width="212" height="78" rx="8" fill="var(--svg-node-blue-bg)" stroke="var(--svg-node-blue-border)" stroke-width="1.5" />
      <rect x="10" y="7" width="150" height="15" rx="3" fill="var(--svg-pill-bg)" />
      <text x="85" y="18" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACTUATORS (ACI &amp; GATES)</text>
      <text x="106" y="38" fill="var(--svg-node-blue-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Tool, CLI &amp; MCP Harnesses</text>
      <text x="106" y="54" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">• Pre-commit schema &amp; syntax guards</text>
      <text x="106" y="68" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">• Capability &amp; egress allowlists</text>
    </g>

    <!-- Node 3: SENSORS (Middle Left) -->
    <g id="stamp-sensors" transform="translate(18, 138)">
      <rect width="212" height="78" rx="8" fill="var(--svg-node-amber-bg)" stroke="var(--svg-node-amber-border)" stroke-width="1.5" />
      <rect x="10" y="7" width="154" height="15" rx="3" fill="var(--svg-pill-bg)" />
      <text x="87" y="18" fill="var(--svg-node-amber-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SENSORS (FEEDBACK PARSER)</text>
      <text x="106" y="38" fill="var(--svg-node-amber-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Context &amp; Telemetry Filter</text>
      <text x="106" y="54" fill="var(--svg-node-amber-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">• XPIA / EchoLeak untrusted tagging</text>
      <text x="106" y="68" fill="var(--svg-node-amber-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">• Observation folding &amp; hash-delta</text>
    </g>

    <!-- Node 4: CONTROLLED PROCESS (Bottom Center) -->
    <g id="stamp-process" transform="translate(86, 246)">
      <rect width="320" height="78" rx="8" fill="var(--svg-node-green-bg)" stroke="var(--svg-node-green-border)" stroke-width="1.5" />
      <rect x="10" y="7" width="175" height="15" rx="3" fill="var(--svg-pill-bg)" />
      <text x="97" y="18" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">CONTROLLED PROCESS (RUNTIME)</text>
      <text x="160" y="38" fill="var(--svg-node-green-text)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Host OS, Container Sandbox &amp; Network</text>
      <text x="160" y="54" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Isolated microVM, unmounted Docker socket &amp; Air-Gap proxy</text>

      <!-- Hazard Warning Pill inside Runtime -->
      <rect x="26" y="59" width="268" height="15" rx="3" fill="var(--svg-node-red-bg)" stroke="var(--svg-node-red-border)" stroke-width="0.8" />
      <text x="160" y="70" fill="var(--svg-node-red-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">HAZARD IF UNBOUNDED: Socket Escape / Proxy Pivot / RCE</text>
    </g>

    <!-- Loop Arrows (Clockwise Control & Feedback Cycle) -->
    <!-- 1. Controller -> Actuators (Control Actions u_t) -->
    <path id="edge-ctrl-act" d="M 356 74 L 386 74 L 386 138" fill="none" stroke="var(--svg-node-purple-border)" stroke-width="1.8" marker-end="url(#arr-purple)" />
    <text x="424" y="102" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Control Action</text>
    <text x="424" y="114" fill="var(--svg-node-purple-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">(Tool Proposal u_t)</text>

    <!-- 2. Actuators -> Controlled Process (Enforced Constraints) -->
    <path id="edge-act-proc" d="M 386 216 L 386 240 L 340 240 L 340 246" fill="none" stroke="var(--svg-node-blue-border)" stroke-width="1.8" marker-end="url(#arr-blue)" />
    <text x="430" y="236" fill="var(--svg-node-blue-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">STPA Constraint</text>

    <!-- 3. Controlled Process -> Sensors (Raw State Telemetry y_t) -->
    <path id="edge-proc-sens" d="M 152 246 L 152 240 L 106 240 L 106 216" fill="none" stroke="var(--svg-node-green-border)" stroke-width="1.8" marker-end="url(#arr-green)" />
    <text x="58" y="236" fill="var(--svg-node-green-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">State Output y_t</text>

    <!-- 4. Sensors -> Controller (Sanitized Feedback o_t) -->
    <path id="edge-sens-ctrl" d="M 106 138 L 106 74 L 136 74" fill="none" stroke="var(--svg-node-amber-border)" stroke-width="1.8" marker-end="url(#arr-amber)" />
    <text x="62" y="102" fill="var(--svg-node-amber-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Feedback o_t</text>
    <text x="62" y="114" fill="var(--svg-node-amber-subtext)" font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">(Belief Update)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background-color: #030712; font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>

    <!-- Center Glow -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Node Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Directional Arrowhead Markers -->
    <marker id="arr-flow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-flow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arr-flow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arr-flow-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background Layer -->
  <rect width="960" height="540" fill="url(#bg-glow)" />
  <circle cx="480" cy="270" r="260" fill="url(#center-glow)" />

  <!-- Outer Orbiting Cycle Track (Closed Loop Indicator) -->
  <circle cx="480" cy="270" r="185" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  
  <!-- Flow Arcs around center -->
  <path d="M 370 170 A 185 185 0 0 1 590 170" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" marker-end="url(#arr-flow-amber)" />
  <path d="M 645 225 A 185 185 0 0 1 645 315" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.7" marker-end="url(#arr-flow-purple)" />
  <path d="M 590 370 A 185 185 0 0 1 370 370" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.7" marker-end="url(#arr-flow-emerald)" />
  <path d="M 315 315 A 185 185 0 0 1 315 225" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.7" marker-end="url(#arr-flow-blue)" />

  <!-- ORGANIC MIND-MAP BRANCH CONNECTORS -->
  <!-- Branch 1: Top-Left (Telemetrie) -->
  <path d="M 430 225 C 380 180, 310 150, 230 135" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
  <path d="M 230 135 C 190 110, 150 95, 105 90" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 230 135 C 190 155, 150 170, 105 175" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Branch 2: Top-Right (Heuristik) -->
  <path d="M 530 225 C 580 180, 650 150, 730 135" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.8" />
  <path d="M 730 135 C 770 110, 810 95, 855 90" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 730 135 C 770 155, 810 170, 855 175" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Branch 3: Bottom-Right (Synthese) -->
  <path d="M 530 315 C 580 360, 650 390, 730 405" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.8" />
  <path d="M 730 405 C 770 385, 810 370, 855 365" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 730 405 C 770 430, 810 445, 855 450" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Branch 4: Bottom-Left (Validierung) -->
  <path d="M 430 315 C 380 360, 310 390, 230 405" fill="none" stroke="#34d399" stroke-width="3" opacity="0.8" />
  <path d="M 230 405 C 190 385, 150 370, 105 365" fill="none" stroke="#34d399" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 230 405 C 190 430, 150 445, 105 450" fill="none" stroke="#34d399" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- ==================== MIND MAP NODES ==================== -->

  <!-- NODE 1: TELEMETRIE (Top-Left) -->
  <g transform="translate(230, 135)">
    <!-- Main Hub 1 -->
    <circle cx="0" cy="0" r="38" fill="#0c192e" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-subtle)" />
    <!-- Icon: Chart & Pulse -->
    <path d="M -14 8 L -6 -2 L 2 4 L 14 -8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="14" cy="-8" r="2.5" fill="#38bdf8" />
    <path d="M -14 12 L 14 12" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Text -->
    <text x="0" y="56" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Telemetrie</text>
    <text x="0" y="73" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">Messen</text>
  </g>
  <!-- Sub-nodes 1 -->
  <g transform="translate(105, 90)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="4" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">GSC</text>
    <text x="-28" y="4" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="end">Suchdaten</text>
  </g>
  <g transform="translate(105, 175)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="4" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">PL</text>
    <text x="-28" y="4" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="end">Verweildauer</text>
  </g>

  <!-- NODE 2: HEURISTIK (Top-Right) -->
  <g transform="translate(730, 135)">
    <!-- Main Hub 2 -->
    <circle cx="0" cy="0" r="38" fill="#241407" stroke="#fbbf24" stroke-width="2.5" filter="url(#glow-subtle)" />
    <!-- Icon: Filter & Compass -->
    <path d="M -12 -10 L 12 -10 L 4 1 L 4 9 L -4 9 L -4 1 Z" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linejoin="round" />
    <circle cx="0" cy="-2" r="2" fill="#fbbf24" />
    <!-- Text -->
    <text x="0" y="56" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Heuristik</text>
    <text x="0" y="73" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">Erkennen</text>
  </g>
  <!-- Sub-nodes 2 -->
  <g transform="translate(855, 90)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="0" y="4" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">P 4-15</text>
    <text x="28" y="4" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="start">Striking Distance</text>
  </g>
  <g transform="translate(855, 175)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="0" y="4" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">★</text>
    <text x="28" y="4" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="start">Hidden Champions</text>
  </g>

  <!-- NODE 3: SYNTHESE (Bottom-Right) -->
  <g transform="translate(730, 405)">
    <!-- Main Hub 3 -->
    <circle cx="0" cy="0" r="38" fill="#1e1035" stroke="#c084fc" stroke-width="2.5" filter="url(#glow-subtle)" />
    <!-- Icon: Code & Content Elements -->
    <path d="M -8 -8 L -14 0 L -8 8" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 8 -8 L 14 0 L 8 8" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 2 -10 L -2 10" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
    <!-- Text -->
    <text x="0" y="56" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Synthese</text>
    <text x="0" y="73" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">Optimieren</text>
  </g>
  <!-- Sub-nodes 3 -->
  <g transform="translate(855, 365)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <text x="0" y="4" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">AEO</text>
    <text x="28" y="4" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="start">Direct Answers</text>
  </g>
  <g transform="translate(855, 450)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <text x="0" y="4" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">GEO</text>
    <text x="28" y="4" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="start">Tabellensynthese</text>
  </g>

  <!-- NODE 4: VALIDIERUNG (Bottom-Left) -->
  <g transform="translate(230, 405)">
    <!-- Main Hub 4 -->
    <circle cx="0" cy="0" r="38" fill="#072218" stroke="#34d399" stroke-width="2.5" filter="url(#glow-subtle)" />
    <!-- Icon: Shield / Checkmark / Gauge -->
    <path d="M 0 -13 L 11 -7 C 11 4, 7 11, 0 14 C -7 11, -11 4, -11 -7 Z" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M -4 0 L -1 3 L 5 -3" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Text -->
    <text x="0" y="56" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Validierung</text>
    <text x="0" y="73" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">Verifizieren</text>
  </g>
  <!-- Sub-nodes 4 -->
  <g transform="translate(105, 365)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <text x="0" y="4" fill="#34d399" font-size="8.5" font-weight="800" text-anchor="middle">95+</text>
    <text x="-28" y="4" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="end">AIO Score</text>
  </g>
  <g transform="translate(105, 450)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <text x="0" y="4" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">GIT</text>
    <text x="-28" y="4" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="end">Astro Build</text>
  </g>

  <!-- ==================== CENTER CORE HUB ==================== -->
  <g transform="translate(480, 270)">
    <!-- Outer Ring Pulse -->
    <circle cx="0" cy="0" r="74" fill="#070d1d" stroke="url(#grad-blue)" stroke-width="2" opacity="0.9" filter="url(#glow-subtle)" />
    <circle cx="0" cy="0" r="56" fill="#0c152a" stroke="#3b82f6" stroke-width="1.5" />
    
    <!-- Central Icon: Unified Loop Infinity / Gear / Brain -->
    <path d="M -18 0 C -18 -10, -5 -10, 0 0 C 5 10, 18 10, 18 0 C 18 -10, 5 -10, 0 0 C -5 10, -18 10, -18 0 Z" fill="none" stroke="#60a5fa" stroke-width="2.5" />
    <circle cx="-9" cy="0" r="2" fill="#38bdf8" />
    <circle cx="9" cy="0" r="2" fill="#c084fc" />

    <!-- Center Label -->
    <text x="0" y="24" fill="#f8fafc" font-size="11" font-weight="800" letter-spacing="1.5" text-anchor="middle">CLOSED LOOP</text>
    <text x="0" y="-22" fill="#94a3b8" font-size="9" font-weight="600" letter-spacing="1" text-anchor="middle">AGENTIC MCP</text>
  </g>

</svg>

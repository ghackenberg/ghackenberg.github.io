<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1920 1080" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      
      text { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#030712"/>

  <!-- Header -->
  <g transform="translate(64, 48)">
    <text x="0" y="36" fill="#ffffff" font-size="34" font-weight="900" letter-spacing="-0.5">High-Performance Parallel Compute &amp; Real-Time Graphics</text>
    <text x="0" y="66" fill="#fbbf24" font-size="16" font-weight="700" letter-spacing="1">MULTI-THREADING, GPU COMPUTE SHADERS, CLUSTER NODES &amp; 2D/3D RENDERING</text>
    
    <!-- Badge -->
    <rect x="1560" y="8" width="232" height="40" rx="20" fill="rgba(255,255,255,0.05)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1676" y="33" fill="#fbbf24" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">TECHNICAL SCHEMATIC</text>
    
    <!-- Separator -->
    <line x1="0" y1="90" x2="1792" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 150)">
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="1720" height="780" rx="24" fill="#1e1808" stroke="rgba(245,158,11,0.3)" stroke-width="3"/>
      <text x="50" y="65" fill="#fbbf24" font-size="22" font-weight="800" letter-spacing="1.5">PARALLEL HIGH-PERFORMANCE SIMULATION &amp; 2D/3D VISUAL ENGINES</text>

      <g transform="translate(50, 110)">
        <!-- Left: Parallel GPU &amp; Multi-Threading -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="790" height="590" rx="20" fill="#0e0c04" stroke="rgba(245,158,11,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#fcd34d" font-size="20" font-weight="800">Massive Parallel Compute Architecture</text>
          <text x="35" y="75" fill="#a8a29e" font-size="14">Multi-Threaded Thread Pools, Cluster Dispatch &amp; GPU Shaders</text>

          <!-- GPU Thread Grid -->
          <g transform="translate(35, 110)">
            <rect x="0" y="0" width="340" height="230" rx="14" fill="#2d2208" stroke="#f59e0b" stroke-width="2"/>
            <text x="20" y="35" fill="#fbbf24" font-size="15" font-weight="800">GPU Compute Kernels (WebGPU / CUDA)</text>
            <g transform="translate(20, 50)">
              <!-- Grid of compute threads -->
              <rect x="0" y="0" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>
              <rect x="75" y="0" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>
              <rect x="150" y="0" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>
              <rect x="225" y="0" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>

              <rect x="0" y="45" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>
              <rect x="75" y="45" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>
              <rect x="150" y="45" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>
              <rect x="225" y="45" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>

              <rect x="0" y="90" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>
              <rect x="75" y="90" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>
              <rect x="150" y="90" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>
              <rect x="225" y="90" width="65" height="35" rx="6" fill="#f59e0b" opacity="0.8"/>
            </g>
            <text x="20" y="205" fill="#fde68a" font-size="12">1,000,000+ Agent Dynamics / Frame</text>
          </g>

          <!-- Multi-Threaded CPU &amp; Cluster -->
          <g transform="translate(400, 110)">
            <rect x="0" y="0" width="350" height="230" rx="14" fill="#18150a" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
            <text x="20" y="35" fill="#fbbf24" font-size="15" font-weight="800">Cluster &amp; CPU Thread Dispatch</text>
            <rect x="20" y="55" width="310" height="40" rx="8" fill="#030712"/>
            <text x="40" y="80" fill="#e2e8f0" font-size="12">Worker Thread 1: Physics Solver</text>
            <rect x="20" y="105" width="310" height="40" rx="8" fill="#030712"/>
            <text x="40" y="130" fill="#e2e8f0" font-size="12">Worker Thread 2: Route Optimization</text>
            <rect x="20" y="155" width="310" height="40" rx="8" fill="#030712"/>
            <text x="40" y="180" fill="#e2e8f0" font-size="12">Cluster Node 3: Monte Carlo Batch</text>
          </g>

          <rect x="35" y="370" width="715" height="180" rx="14" fill="#2d2208" stroke="#f59e0b" stroke-width="2"/>
          <text x="60" y="415" fill="#ffffff" font-size="16" font-weight="800">Parallel Scalability</text>
          <text x="60" y="450" fill="#fde68a" font-size="14">Offloading particle physics and agent routing to GPU compute shaders scales simulation speed by 100x compared to single-threaded CPU execution.</text>
        </g>

        <!-- Right: Real-time 2D/3D Computer Graphics Viewport -->
        <g transform="translate(830, 0)">
          <rect x="0" y="0" width="790" height="590" rx="20" fill="#0e0c04" stroke="rgba(245,158,11,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#fcd34d" font-size="20" font-weight="800">Real-Time 2D/3D Computer Graphics Viewport</text>
          <text x="35" y="75" fill="#a8a29e" font-size="14">Delta Dynamics &amp; SpineML Interactive Visualizers (60 FPS)</text>

          <!-- 3D Terrain &amp; Factory Canvas Mockup -->
          <g transform="translate(35, 110)">
            <rect x="0" y="0" width="720" height="300" rx="16" fill="#030712" stroke="rgba(245,158,11,0.5)" stroke-width="2"/>
            
            <!-- Wireframe Grid Floor -->
            <path d="M 60,250 L 660,250 M 120,200 L 600,200 M 180,150 L 540,150" stroke="rgba(245,158,11,0.25)" stroke-width="2"/>
            <path d="M 120,200 L 60,250 M 240,150 L 200,250 M 360,150 L 360,250 M 480,150 L 520,250 M 540,150 L 660,250" stroke="rgba(245,158,11,0.25)" stroke-width="2"/>

            <!-- 3D Low-poly Terrain / Machine Nodes -->
            <polygon points="200,180 240,120 280,180" fill="rgba(245,158,11,0.6)" stroke="#fbbf24" stroke-width="2"/>
            <polygon points="340,160 390,90 440,160" fill="rgba(16,185,129,0.6)" stroke="#34d399" stroke-width="2"/>
            <polygon points="480,190 530,130 580,190" fill="rgba(59,130,246,0.6)" stroke="#60a5fa" stroke-width="2"/>

            <!-- Real-time HUD -->
            <rect x="20" y="20" width="160" height="40" rx="8" fill="#18150a" stroke="#f59e0b" stroke-width="1"/>
            <text x="35" y="45" fill="#fde68a" font-size="13" font-weight="700">FPS: 60.0 • 4K</text>
          </g>

          <rect x="35" y="440" width="720" height="110" rx="14" fill="#261d06" stroke="rgba(245,158,11,0.5)" stroke-width="1.5"/>
          <text x="60" y="475" fill="#fbbf24" font-size="15" font-weight="800">Visual Intuition for Complex Data</text>
          <text x="60" y="505" fill="#d6d3d1" font-size="13">High-speed WebGL/Three.js rendering bridges mathematical abstraction with intuitive visual exploration.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(64, 1030)">
    <line x1="0" y1="0" x2="1792" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <text x="0" y="24" fill="#6b7280" font-size="14" font-weight="600">Dr. Georg Hackenberg • Personal Interests Exploration</text>
    <text x="1792" y="24" fill="#6b7280" font-size="14" font-weight="600" text-anchor="end">Original Vector SVG • Infinite Crisp Scalability</text>
  </g>
</svg>

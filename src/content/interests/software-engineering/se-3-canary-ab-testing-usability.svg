<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1920 1080" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      
      text { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#030712"/>

  <!-- Header -->
  <g transform="translate(64, 48)">
    <text x="0" y="36" fill="#ffffff" font-size="34" font-weight="900" letter-spacing="-0.5">Canary Releases, A/B Testing &amp; Usability Engineering</text>
    <text x="0" y="66" fill="#60a5fa" font-size="16" font-weight="700" letter-spacing="1">PROGRESSIVE EXPOSURE, TELEMETRY COMPARISON &amp; EMPIRICAL USER FEEDBACK</text>
    
    <!-- Badge -->
    <rect x="1560" y="8" width="232" height="40" rx="20" fill="rgba(255,255,255,0.05)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="1676" y="33" fill="#60a5fa" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">TECHNICAL SCHEMATIC</text>
    
    <!-- Separator -->
    <line x1="0" y1="90" x2="1792" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 150)">
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="1720" height="780" rx="24" fill="#0b132b" stroke="rgba(59,130,246,0.3)" stroke-width="3"/>
      <text x="50" y="65" fill="#60a5fa" font-size="22" font-weight="800" letter-spacing="1.5">CANARY RELEASES, A/B TESTING &amp; USABILITY FEEDBACK LOOPS</text>

      <!-- Left Block: Canary Traffic Split -->
      <g transform="translate(50, 110)">
        <rect x="0" y="0" width="770" height="590" rx="20" fill="#070d1e" stroke="rgba(59,130,246,0.3)" stroke-width="2"/>
        <text x="35" y="50" fill="#60a5fa" font-size="20" font-weight="800">Progressive Canary Deployment</text>

        <!-- Router / Ingress -->
        <rect x="35" y="90" width="180" height="90" rx="14" fill="#0f214a" stroke="#3b82f6" stroke-width="2"/>
        <text x="125" y="132" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">Live Ingress</text>
        <text x="125" y="155" fill="#93c5fd" font-size="12" text-anchor="middle">100% User Traffic</text>

        <!-- Traffic Splits -->
        <path d="M 215,135 C 310,135 310,210 390,210" fill="none" stroke="#3b82f6" stroke-width="6"/>
        <path d="M 215,135 C 310,135 310,420 390,420" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/>

        <!-- Baseline Fleet (95%) -->
        <rect x="390" y="150" width="340" height="125" rx="14" fill="#0a1936" stroke="#3b82f6" stroke-width="2"/>
        <text x="415" y="190" fill="#60a5fa" font-size="16" font-weight="800">Stable Baseline (v2.3)</text>
        <text x="415" y="215" fill="#9ca3af" font-size="13">95% Traffic • Monitored Error Rate: 0.01%</text>
        <rect x="415" y="235" width="90" height="24" rx="6" fill="#3b82f6" opacity="0.2"/>
        <text x="460" y="251" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">STABLE</text>

        <!-- Canary Fleet (5%) -->
        <rect x="390" y="360" width="340" height="160" rx="14" fill="#201a08" stroke="#f59e0b" stroke-width="2"/>
        <text x="415" y="400" fill="#fcd34d" font-size="16" font-weight="800">Canary Candidate (v2.4)</text>
        <text x="415" y="425" fill="#9ca3af" font-size="13">5% Traffic • Real-time Health Telemetry</text>
        <text x="415" y="450" fill="#9ca3af" font-size="13">Latency: -22ms • Error Rate: 0.00%</text>
        <rect x="415" y="475" width="130" height="26" rx="6" fill="#10b981" opacity="0.2"/>
        <text x="480" y="493" fill="#10b981" font-size="12" font-weight="800" text-anchor="middle">HEALTHY • PROMOTE</text>
      </g>

      <!-- Right Block: A/B Testing &amp; Usability Engineering -->
      <g transform="translate(860, 110)">
        <rect x="0" y="0" width="810" height="590" rx="20" fill="#070d1e" stroke="rgba(59,130,246,0.3)" stroke-width="2"/>
        <text x="35" y="50" fill="#60a5fa" font-size="20" font-weight="800">A/B Testing &amp; Usability Engineering Metrics</text>

        <!-- Variant A vs Variant B -->
        <g transform="translate(35, 80)">
          <!-- Variant A -->
          <rect x="0" y="0" width="350" height="230" rx="14" fill="#0b172e" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
          <text x="25" y="40" fill="#93c5fd" font-size="16" font-weight="700">Variant A (Control Flow)</text>
          <text x="25" y="75" fill="#9ca3af" font-size="13">Task Completion: 74.2%</text>
          <text x="25" y="105" fill="#9ca3af" font-size="13">Average Time on Task: 1m 45s</text>
          <text x="25" y="135" fill="#9ca3af" font-size="13">User Drop-off Rate: 18.5%</text>
          <rect x="25" y="170" width="300" height="12" rx="6" fill="rgba(255,255,255,0.1)"/>
          <rect x="25" y="170" width="222" height="12" rx="6" fill="#3b82f6"/>

          <!-- Variant B -->
          <rect x="390" y="0" width="350" height="230" rx="14" fill="#07261a" stroke="#10b981" stroke-width="2"/>
          <text x="415" y="40" fill="#6ee7b7" font-size="16" font-weight="800">Variant B (Optimized UX)</text>
          <text x="415" y="75" fill="#d1fae5" font-size="13">Task Completion: 91.8% (+17.6%)</text>
          <text x="415" y="105" fill="#d1fae5" font-size="13">Average Time on Task: 1m 02s (-43s)</text>
          <text x="415" y="135" fill="#d1fae5" font-size="13">User Drop-off Rate: 4.1% (-14.4%)</text>
          <rect x="415" y="170" width="300" height="12" rx="6" fill="rgba(255,255,255,0.1)"/>
          <rect x="415" y="170" width="275" height="12" rx="6" fill="#10b981"/>
          <text x="415" y="210" fill="#10b981" font-size="12" font-weight="800">WINNER • STATISTICALLY SIGNIFICANT (p &lt; 0.01)</text>
        </g>

        <!-- User-Centered Design Feedback Loop Summary -->
        <g transform="translate(35, 340)">
          <rect x="0" y="0" width="740" height="205" rx="16" fill="#0c1e3d" stroke="#3b82f6" stroke-width="2"/>
          <text x="30" y="45" fill="#60a5fa" font-size="18" font-weight="800">User-Centered Usability Feedback Integration</text>
          <text x="30" y="80" fill="#e2e8f0" font-size="14">Empirical data feeds directly back into the product backlog and UX design iterations.</text>
          
          <g transform="translate(30, 115)">
            <rect x="0" y="0" width="205" height="60" rx="10" fill="#070d1e" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
            <text x="102" y="26" fill="#93c5fd" font-size="12" text-anchor="middle">Qualitative Reviews</text>
            <text x="102" y="48" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">User Interviews</text>

            <rect x="235" y="0" width="205" height="60" rx="10" fill="#070d1e" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
            <text x="337" y="26" fill="#93c5fd" font-size="12" text-anchor="middle">Telemetry Metrics</text>
            <text x="337" y="48" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">Funnel Analytics</text>

            <rect x="470" y="0" width="205" height="60" rx="10" fill="#070d1e" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
            <text x="572" y="26" fill="#93c5fd" font-size="12" text-anchor="middle">Iterative Sprint</text>
            <text x="572" y="48" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">Design Refinement</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(64, 1030)">
    <line x1="0" y1="0" x2="1792" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <text x="0" y="24" fill="#6b7280" font-size="14" font-weight="600">Dr. Georg Hackenberg • Personal Interests Exploration</text>
    <text x="1792" y="24" fill="#6b7280" font-size="14" font-weight="600" text-anchor="end">Original Vector SVG • Infinite Crisp Scalability</text>
  </g>
</svg>

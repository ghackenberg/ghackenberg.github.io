<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1920 1080" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      
      text { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
    </style>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#030712"/>

  <!-- Header -->
  <g transform="translate(64, 48)">
    <text x="0" y="36" fill="#ffffff" font-size="34" font-weight="900" letter-spacing="-0.5">Multimodal Generative Models: Image, Sound &amp; Video</text>
    <text x="0" y="66" fill="#c084fc" font-size="16" font-weight="700" letter-spacing="1">CROSS-MODAL LATENT DIFFUSION &amp; TEMPORAL GENERATIVE SYNTHESIS</text>
    
    <!-- Badge -->
    <rect x="1560" y="8" width="232" height="40" rx="20" fill="rgba(255,255,255,0.05)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1676" y="33" fill="#c084fc" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">TECHNICAL SCHEMATIC</text>
    
    <!-- Separator -->
    <line x1="0" y1="90" x2="1792" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 150)">
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="1720" height="780" rx="24" fill="#1b0c2b" stroke="rgba(168,85,247,0.3)" stroke-width="3"/>
      <text x="50" y="65" fill="#c084fc" font-size="22" font-weight="800" letter-spacing="1.5">MULTIMODAL GENERATIVE AI: IMAGE, AUDIO &amp; VIDEO SYNTHESIS</text>

      <g transform="translate(50, 110)">
        <!-- Central Latent Space -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="450" height="590" rx="20" fill="#0d0517" stroke="rgba(168,85,247,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#d8b4fe" font-size="20" font-weight="800">Unified Latent Space</text>
          <text x="35" y="75" fill="#9ca3af" font-size="13">Cross-Attention Prompt Conditioning</text>

          <circle cx="225" cy="270" r="140" fill="url(#purpleGlow)" stroke="#a855f7" stroke-width="4"/>
          <text x="225" y="260" fill="#ffffff" font-size="22" font-weight="900" text-anchor="middle">LATENT</text>
          <text x="225" y="290" fill="#d8b4fe" font-size="16" font-weight="700" text-anchor="middle">DIFFUSION</text>

          <rect x="35" y="460" width="380" height="95" rx="12" fill="#240f3b" stroke="#a855f7" stroke-width="1.5"/>
          <text x="55" y="495" fill="#f3e8ff" font-size="14" font-weight="800">Multi-Modal Conditioners</text>
          <text x="55" y="525" fill="#d8b4fe" font-size="12">Text Prompts • Sketches • Audio Cues</text>
        </g>

        <!-- Branch 1: Image Generation -->
        <g transform="translate(480, 0)">
          <rect x="0" y="0" width="380" height="590" rx="20" fill="#0d0517" stroke="rgba(168,85,247,0.3)" stroke-width="2"/>
          <text x="30" y="45" fill="#d8b4fe" font-size="18" font-weight="800">1. Image Models</text>
          <text x="30" y="70" fill="#9ca3af" font-size="12">Denoising Diffusion (Imagen / SD)</text>

          <rect x="30" y="100" width="320" height="200" rx="14" fill="#1a0b29" stroke="#a855f7" stroke-width="2"/>
          <circle cx="190" cy="180" r="50" fill="rgba(168,85,247,0.3)" stroke="#c084fc" stroke-width="2"/>
          <text x="190" y="185" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Visual Latent Frame</text>
          <text x="190" y="280" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">512x512 → 4K Upscale</text>

          <rect x="30" y="325" width="320" height="230" rx="14" fill="#240f3b" stroke="#a855f7" stroke-width="1.5"/>
          <text x="50" y="360" fill="#f3e8ff" font-size="15" font-weight="800">Key Mechanisms</text>
          <text x="50" y="395" fill="#d8b4fe" font-size="12">• Step-by-step Gaussian denoising</text>
          <text x="50" y="425" fill="#d8b4fe" font-size="12">• Classifier-free guidance (CFG)</text>
          <text x="50" y="455" fill="#d8b4fe" font-size="12">• Vector Quantized VAE decoding</text>
          <text x="50" y="485" fill="#d8b4fe" font-size="12">• Stylized comic &amp; vector rendering</text>
        </g>

        <!-- Branch 2: Sound Generation -->
        <g transform="translate(890, 0)">
          <rect x="0" y="0" width="380" height="590" rx="20" fill="#0d0517" stroke="rgba(168,85,247,0.3)" stroke-width="2"/>
          <text x="30" y="45" fill="#d8b4fe" font-size="18" font-weight="800">2. Sound &amp; Voice Models</text>
          <text x="30" y="70" fill="#9ca3af" font-size="12">Neural Audio Codecs &amp; Chirp</text>

          <!-- Waveform View -->
          <rect x="30" y="100" width="320" height="200" rx="14" fill="#1a0b29" stroke="#3b82f6" stroke-width="2"/>
          <path d="M 45,200 Q 80,120 110,200 T 170,200 T 230,130 T 290,200 T 335,200" fill="none" stroke="#60a5fa" stroke-width="3"/>
          <text x="190" y="280" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">Neural Mel-Spectrogram</text>

          <rect x="30" y="325" width="320" height="230" rx="14" fill="#0b1a38" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="50" y="360" fill="#ffffff" font-size="15" font-weight="800">Key Mechanisms</text>
          <text x="50" y="395" fill="#93c5fd" font-size="12">• Discrete audio tokenization</text>
          <text x="50" y="425" fill="#93c5fd" font-size="12">• Expressive voice synthesis</text>
          <text x="50" y="455" fill="#93c5fd" font-size="12">• Sound effect generation</text>
          <text x="50" y="485" fill="#93c5fd" font-size="12">• Real-time voice conversion</text>
        </g>

        <!-- Branch 3: Video Generation -->
        <g transform="translate(1300, 0)">
          <rect x="0" y="0" width="370" height="590" rx="20" fill="#0d0517" stroke="rgba(168,85,247,0.3)" stroke-width="2"/>
          <text x="30" y="45" fill="#d8b4fe" font-size="18" font-weight="800">3. Video Generation</text>
          <text x="30" y="70" fill="#9ca3af" font-size="12">Spatio-Temporal DiT Models</text>

          <!-- Filmstrip Frames -->
          <rect x="30" y="100" width="310" height="200" rx="14" fill="#1a0b29" stroke="#10b981" stroke-width="2"/>
          <rect x="50" y="130" width="70" height="90" rx="6" fill="#064e3b" stroke="#34d399"/>
          <rect x="150" y="130" width="70" height="90" rx="6" fill="#064e3b" stroke="#34d399"/>
          <rect x="250" y="130" width="70" height="90" rx="6" fill="#064e3b" stroke="#34d399"/>
          <text x="185" y="280" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Temporal Consistency</text>

          <rect x="30" y="325" width="310" height="230" rx="14" fill="#062419" stroke="#10b981" stroke-width="1.5"/>
          <text x="50" y="360" fill="#ffffff" font-size="15" font-weight="800">Key Mechanisms</text>
          <text x="50" y="395" fill="#6ee7b7" font-size="12">• Diffusion Transformers (DiT)</text>
          <text x="50" y="425" fill="#6ee7b7" font-size="12">• 3D spatiotemporal attention</text>
          <text x="50" y="455" fill="#6ee7b7" font-size="12">• Physics-consistent dynamics</text>
          <text x="50" y="485" fill="#6ee7b7" font-size="12">• Multi-second continuous motion</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(64, 1030)">
    <line x1="0" y1="0" x2="1792" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <text x="0" y="24" fill="#6b7280" font-size="14" font-weight="600">Dr. Georg Hackenberg • Personal Interests Exploration</text>
    <text x="1792" y="24" fill="#6b7280" font-size="14" font-weight="600" text-anchor="end">Original Vector SVG • Infinite Crisp Scalability</text>
  </g>
</svg>

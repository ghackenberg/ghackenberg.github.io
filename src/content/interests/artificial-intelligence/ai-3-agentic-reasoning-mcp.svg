<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1920 1080" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      
      text { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#030712"/>

  <!-- Header -->
  <g transform="translate(64, 48)">
    <text x="0" y="36" fill="#ffffff" font-size="34" font-weight="900" letter-spacing="-0.5">Agentic AI, Reasoning Loops &amp; Model Context Protocol (MCP)</text>
    <text x="0" y="66" fill="#c084fc" font-size="16" font-weight="700" letter-spacing="1">AUTONOMOUS COGNITIVE WORKFLOWS, PROMPT &amp; CONTEXT ENGINEERING, TOOL EXECUTION</text>
    
    <!-- Badge -->
    <rect x="1560" y="8" width="232" height="40" rx="20" fill="rgba(255,255,255,0.05)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1676" y="33" fill="#c084fc" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">TECHNICAL SCHEMATIC</text>
    
    <!-- Separator -->
    <line x1="0" y1="90" x2="1792" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 150)">
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="1720" height="780" rx="24" fill="#1b0c2b" stroke="rgba(168,85,247,0.3)" stroke-width="3"/>
      <text x="50" y="65" fill="#c084fc" font-size="22" font-weight="800" letter-spacing="1.5">AGENTIC AI, REASONING LOOPS &amp; MODEL CONTEXT PROTOCOL (MCP)</text>

      <g transform="translate(50, 110)">
        <!-- Left: Autonomous Reasoning Loop -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="800" height="590" rx="20" fill="#0d0517" stroke="rgba(168,85,247,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#d8b4fe" font-size="20" font-weight="800">Autonomous Reasoning Loop (ReAct Framework)</text>
          <text x="35" y="75" fill="#9ca3af" font-size="14">Dynamic Task Decomposition &amp; Self-Correcting Reflection</text>

          <!-- 4-Step Cycle -->
          <g transform="translate(400, 320)">
            <!-- Step 1: PLAN -->
            <g transform="translate(0, -170)">
              <rect x="-130" y="-45" width="260" height="90" rx="14" fill="#2d1247" stroke="#a855f7" stroke-width="2"/>
              <text x="0" y="-8" fill="#f3e8ff" font-size="18" font-weight="800" text-anchor="middle">1. PLAN &amp; DECOMPOSE</text>
              <text x="0" y="20" fill="#d8b4fe" font-size="12" text-anchor="middle">Context analysis &amp; subtask tree</text>
            </g>

            <!-- Step 2: ACT (Tool Call) -->
            <g transform="translate(170, 0)">
              <rect x="-110" y="-45" width="220" height="90" rx="14" fill="#0b2447" stroke="#3b82f6" stroke-width="2"/>
              <text x="0" y="-8" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">2. ACT</text>
              <text x="0" y="20" fill="#93c5fd" font-size="12" text-anchor="middle">MCP Tool Invocation</text>
            </g>

            <!-- Step 3: OBSERVE -->
            <g transform="translate(0, 170)">
              <rect x="-130" y="-45" width="260" height="90" rx="14" fill="#073b22" stroke="#10b981" stroke-width="2"/>
              <text x="0" y="-8" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">3. OBSERVE</text>
              <text x="0" y="20" fill="#6ee7b7" font-size="12" text-anchor="middle">Parse tool results &amp; logs</text>
            </g>

            <!-- Step 4: REFLECT -->
            <g transform="translate(-170, 0)">
              <rect x="-110" y="-45" width="220" height="90" rx="14" fill="#3b2909" stroke="#f59e0b" stroke-width="2"/>
              <text x="0" y="-8" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">4. REFLECT</text>
              <text x="0" y="20" fill="#fde68a" font-size="12" text-anchor="middle">Validate goal progress</text>
            </g>

            <!-- Flow Connectors -->
            <path d="M 130,-170 C 180,-170 180,-60 170,-45" fill="none" stroke="#a855f7" stroke-width="3"/>
            <path d="M 170,45 C 180,60 180,170 130,170" fill="none" stroke="#3b82f6" stroke-width="3"/>
            <path d="M -130,170 C -180,170 -180,60 -170,45" fill="none" stroke="#10b981" stroke-width="3"/>
            <path d="M -170,-45 C -180,-60 -180,-170 -130,-170" fill="none" stroke="#f59e0b" stroke-width="3"/>

            <circle cx="0" cy="0" r="50" fill="#030712" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
            <text x="0" y="5" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">LOOP</text>
          </g>
        </g>

        <!-- Right: Model Context Protocol (MCP) &amp; Context Engineering -->
        <g transform="translate(830, 0)">
          <rect x="0" y="0" width="790" height="590" rx="20" fill="#0d0517" stroke="rgba(168,85,247,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#d8b4fe" font-size="20" font-weight="800">Model Context Protocol (MCP) &amp; Context Engineering</text>
          <text x="35" y="75" fill="#9ca3af" font-size="14">Dynamic Tool Schemas &amp; Standardized Client-Server Connectivity</text>

          <!-- MCP Protocol Hub -->
          <g transform="translate(35, 105)">
            <rect x="0" y="0" width="720" height="135" rx="14" fill="#2d1247" stroke="#a855f7" stroke-width="2.5"/>
            <text x="30" y="40" fill="#ffffff" font-size="17" font-weight="800">MCP Protocol Bus (JSON-RPC 2.0)</text>
            <text x="30" y="70" fill="#d8b4fe" font-size="13">Open standard decoupling AI models from execution environments.</text>
            <text x="30" y="98" fill="#f3e8ff" font-size="12" font-weight="700">Dynamic Tool Discovery • Resource Reading • Prompt Templates</text>
          </g>

          <!-- Connected MCP Servers -->
          <g transform="translate(35, 260)">
            <rect x="0" y="0" width="225" height="140" rx="12" fill="#0b172e" stroke="#3b82f6" stroke-width="1.5"/>
            <text x="20" y="35" fill="#60a5fa" font-size="15" font-weight="800">Knowledge Server</text>
            <text x="20" y="65" fill="#9ca3af" font-size="12">• Mentawise Graph</text>
            <text x="20" y="90" fill="#9ca3af" font-size="12">• Semantic Vectors</text>
            <text x="20" y="115" fill="#9ca3af" font-size="12">• Factual Ontologies</text>

            <rect x="245" y="0" width="225" height="140" rx="12" fill="#211705" stroke="#f59e0b" stroke-width="1.5"/>
            <text x="265" y="35" fill="#fbbf24" font-size="15" font-weight="800">Simulation Server</text>
            <text x="265" y="65" fill="#9ca3af" font-size="12">• Spine Layout DES</text>
            <text x="265" y="90" fill="#9ca3af" font-size="12">• Physics Engines</text>
            <text x="265" y="115" fill="#9ca3af" font-size="12">• Parameter Sweeps</text>

            <rect x="490" y="0" width="230" height="140" rx="12" fill="#072b1b" stroke="#10b981" stroke-width="1.5"/>
            <text x="510" y="35" fill="#34d399" font-size="15" font-weight="800">Developer Server</text>
            <text x="510" y="65" fill="#9ca3af" font-size="12">• File Workspace</text>
            <text x="510" y="90" fill="#9ca3af" font-size="12">• Compiler / Ast</text>
            <text x="510" y="115" fill="#9ca3af" font-size="12">• Test Runners</text>
          </g>

          <rect x="35" y="425" width="720" height="120" rx="14" fill="#170929" stroke="rgba(168,85,247,0.5)" stroke-width="1.5"/>
          <text x="60" y="465" fill="#f3e8ff" font-size="15" font-weight="800">Context Engineering Precision</text>
          <text x="60" y="495" fill="#d8b4fe" font-size="13">Pruning token bloat and feeding structured tool responses empowers agentic reasoning with zero hallucination.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(64, 1030)">
    <line x1="0" y1="0" x2="1792" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <text x="0" y="24" fill="#6b7280" font-size="14" font-weight="600">Dr. Georg Hackenberg • Personal Interests Exploration</text>
    <text x="1792" y="24" fill="#6b7280" font-size="14" font-weight="600" text-anchor="end">Original Vector SVG • Infinite Crisp Scalability</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1920 1080" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      
      text { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#030712"/>

  <!-- Header -->
  <g transform="translate(64, 48)">
    <text x="0" y="36" fill="#ffffff" font-size="34" font-weight="900" letter-spacing="-0.5">Text Embeddings, LLMs &amp; KV Caching Mechanics</text>
    <text x="0" y="66" fill="#c084fc" font-size="16" font-weight="700" letter-spacing="1">HIGH-DIMENSIONAL VECTOR SPACES, ATTENTION LAYERS &amp; MEMORY OPTIMIZATION</text>
    
    <!-- Badge -->
    <rect x="1560" y="8" width="232" height="40" rx="20" fill="rgba(255,255,255,0.05)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1676" y="33" fill="#c084fc" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">TECHNICAL SCHEMATIC</text>
    
    <!-- Separator -->
    <line x1="0" y1="90" x2="1792" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 150)">
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="1720" height="780" rx="24" fill="#1b0c2b" stroke="rgba(168,85,247,0.3)" stroke-width="3"/>
      <text x="50" y="65" fill="#c084fc" font-size="22" font-weight="800" letter-spacing="1.5">TEXT EMBEDDINGS, LARGE LANGUAGE MODELS &amp; KV CACHING</text>

      <g transform="translate(50, 110)">
        <!-- Left: Vector Embeddings Space -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="530" height="590" rx="20" fill="#0d0517" stroke="rgba(168,85,247,0.3)" stroke-width="2"/>
          <text x="30" y="45" fill="#d8b4fe" font-size="18" font-weight="800">1. High-Dimensional Embeddings</text>
          <text x="30" y="70" fill="#9ca3af" font-size="13">Mapping semantic concepts into dense 1536-D vector space</text>

          <!-- 3D Vector Cluster -->
          <g transform="translate(30, 95)">
            <rect x="0" y="0" width="470" height="280" rx="14" fill="#120620" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
            
            <!-- Cluster 1: Software -->
            <circle cx="120" cy="90" r="35" fill="rgba(59,130,246,0.3)" stroke="#3b82f6" stroke-width="2"/>
            <text x="120" y="95" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle">"Architecture"</text>
            <circle cx="160" cy="140" r="28" fill="rgba(59,130,246,0.3)" stroke="#3b82f6" stroke-width="2"/>
            <text x="160" y="145" fill="#93c5fd" font-size="11" text-anchor="middle">"Compiler"</text>

            <!-- Cluster 2: AI -->
            <circle cx="360" cy="110" r="40" fill="rgba(168,85,247,0.3)" stroke="#a855f7" stroke-width="2"/>
            <text x="360" y="115" fill="#d8b4fe" font-size="12" font-weight="700" text-anchor="middle">"Neural Net"</text>
            <circle cx="310" cy="170" r="32" fill="rgba(168,85,247,0.3)" stroke="#a855f7" stroke-width="2"/>
            <text x="310" y="175" fill="#d8b4fe" font-size="11" text-anchor="middle">"Transformer"</text>

            <!-- Cosine Similarity Link -->
            <line x1="160" y1="140" x2="310" y2="170" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
            <text x="235" y="150" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">cos θ = 0.89</text>
          </g>

          <rect x="30" y="400" width="470" height="150" rx="14" fill="#240f3b" stroke="#a855f7" stroke-width="1.5"/>
          <text x="50" y="435" fill="#f3e8ff" font-size="15" font-weight="800">Semantic Search &amp; Retrieval</text>
          <text x="50" y="465" fill="#d8b4fe" font-size="12">Dense embeddings allow neural models to calculate conceptual proximity and query knowledge graphs with zero keyword rigidity.</text>
        </g>

        <!-- Middle: Transformer Attention Layer -->
        <g transform="translate(560, 0)">
          <rect x="0" y="0" width="550" height="590" rx="20" fill="#0d0517" stroke="rgba(168,85,247,0.3)" stroke-width="2"/>
          <text x="30" y="45" fill="#d8b4fe" font-size="18" font-weight="800">2. Transformer Attention Heads</text>
          <text x="30" y="70" fill="#9ca3af" font-size="13">Self-Attention Matrix: Softmax(Q • K^T / √d) • V</text>

          <!-- Attention Grid -->
          <g transform="translate(30, 95)">
            <rect x="0" y="0" width="490" height="280" rx="14" fill="#120620" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
            
            <g transform="translate(45, 40)">
              <rect x="0" y="0" width="70" height="70" rx="8" fill="#a855f7" opacity="0.9"/>
              <rect x="85" y="0" width="70" height="70" rx="8" fill="#a855f7" opacity="0.3"/>
              <rect x="170" y="0" width="70" height="70" rx="8" fill="#a855f7" opacity="0.7"/>
              <rect x="255" y="0" width="70" height="70" rx="8" fill="#a855f7" opacity="0.2"/>

              <rect x="0" y="85" width="70" height="70" rx="8" fill="#a855f7" opacity="0.4"/>
              <rect x="85" y="85" width="70" height="70" rx="8" fill="#a855f7" opacity="0.85"/>
              <rect x="170" y="85" width="70" height="70" rx="8" fill="#a855f7" opacity="0.2"/>
              <rect x="255" y="85" width="70" height="70" rx="8" fill="#a855f7" opacity="0.6"/>
            </g>
            <text x="245" y="235" fill="#d8b4fe" font-size="12" text-anchor="middle">Multi-Head Dynamic Attention Weights</text>
          </g>

          <rect x="30" y="400" width="490" height="150" rx="14" fill="#240f3b" stroke="#a855f7" stroke-width="1.5"/>
          <text x="50" y="435" fill="#f3e8ff" font-size="15" font-weight="800">Contextual Synthesis</text>
          <text x="50" y="465" fill="#d8b4fe" font-size="12">Attention dynamically weighs relationships between every token in the prompt, enabling complex conceptual reasoning.</text>
        </g>

        <!-- Right: KV Caching Mechanism -->
        <g transform="translate(1140, 0)">
          <rect x="0" y="0" width="480" height="590" rx="20" fill="#0d0517" stroke="rgba(168,85,247,0.3)" stroke-width="2"/>
          <text x="30" y="45" fill="#d8b4fe" font-size="18" font-weight="800">3. KV Caching Acceleration</text>
          <text x="30" y="70" fill="#9ca3af" font-size="13">O(1) Autoregressive Generation Speed</text>

          <g transform="translate(30, 95)">
            <rect x="0" y="0" width="420" height="280" rx="14" fill="#120620" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
            
            <rect x="20" y="25" width="380" height="90" rx="10" fill="#052418" stroke="#10b981" stroke-width="2"/>
            <text x="40" y="60" fill="#6ee7b7" font-size="15" font-weight="800">Cached Past Tokens (Keys &amp; Values)</text>
            <text x="40" y="85" fill="#d1fae5" font-size="12">Reused across token generation • Zero recomputation</text>

            <rect x="20" y="145" width="380" height="90" rx="10" fill="#2b1138" stroke="#a855f7" stroke-width="2"/>
            <text x="40" y="180" fill="#f3e8ff" font-size="15" font-weight="800">New Token (Query Only)</text>
            <text x="40" y="205" fill="#d8b4fe" font-size="12">Computes attention only for the current step (10x faster)</text>
          </g>

          <rect x="30" y="400" width="420" height="150" rx="14" fill="#082b1d" stroke="#10b981" stroke-width="2"/>
          <text x="50" y="435" fill="#ffffff" font-size="15" font-weight="800">Low-Latency Inference</text>
          <text x="50" y="465" fill="#a7f3d0" font-size="12">KV Caching transforms O(N²) generation into linear time, making interactive browser AI and local LLMs responsive.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(64, 1030)">
    <line x1="0" y1="0" x2="1792" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <text x="0" y="24" fill="#6b7280" font-size="14" font-weight="600">Dr. Georg Hackenberg • Personal Interests Exploration</text>
    <text x="1792" y="24" fill="#6b7280" font-size="14" font-weight="600" text-anchor="end">Original Vector SVG • Infinite Crisp Scalability</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1920 1080" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      
      text { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#030712"/>

  <!-- Header -->
  <g transform="translate(64, 48)">
    <text x="0" y="36" fill="#ffffff" font-size="34" font-weight="900" letter-spacing="-0.5">Wireframes, UI Mockups &amp; Interaction Behavior Design</text>
    <text x="0" y="66" fill="#34d399" font-size="16" font-weight="700" letter-spacing="1">FROM LOW-FI WIREFRAMES TO HIGH-FI DARK MODE MOCKUPS AND TACTILE MICRO-ANIMATIONS</text>
    
    <!-- Badge -->
    <rect x="1560" y="8" width="232" height="40" rx="20" fill="rgba(255,255,255,0.05)" stroke="#34d399" stroke-width="1.5"/>
    <text x="1676" y="33" fill="#34d399" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">TECHNICAL SCHEMATIC</text>
    
    <!-- Separator -->
    <line x1="0" y1="90" x2="1792" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 150)">
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="1720" height="780" rx="24" fill="#061c14" stroke="rgba(16,185,129,0.3)" stroke-width="3"/>
      <text x="50" y="65" fill="#34d399" font-size="22" font-weight="800" letter-spacing="1.5">WIREFRAMES, HIGH-FIDELITY UI MOCKUPS &amp; INTERACTION BEHAVIOR</text>

      <g transform="translate(50, 110)">
        <!-- Low-Fi Wireframe Block -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="450" height="590" rx="20" fill="#020f0a" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#6ee7b7" font-size="18" font-weight="800">1. Low-Fidelity Wireframes</text>
          <text x="35" y="70" fill="#9ca3af" font-size="13">Information Hierarchy &amp; Spatial Groupings</text>

          <!-- Blueprint Wireframe Box -->
          <g transform="translate(35, 95)">
            <rect x="0" y="0" width="380" height="280" rx="14" fill="#071811" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4"/>
            <!-- Nav placeholder -->
            <rect x="20" y="20" width="340" height="30" rx="4" fill="none" stroke="#34d399" stroke-width="1.5"/>
            <!-- Content left -->
            <rect x="20" y="65" width="160" height="190" rx="6" fill="none" stroke="#34d399" stroke-width="1.5"/>
            <!-- Content right -->
            <rect x="195" y="65" width="165" height="90" rx="6" fill="none" stroke="#34d399" stroke-width="1.5"/>
            <rect x="195" y="165" width="165" height="90" rx="6" fill="none" stroke="#34d399" stroke-width="1.5"/>
          </g>

          <rect x="35" y="400" width="380" height="150" rx="14" fill="#0b2419" stroke="#10b981" stroke-width="1.5"/>
          <text x="55" y="435" fill="#ffffff" font-size="15" font-weight="800">Structural Validation</text>
          <text x="55" y="465" fill="#a7f3d0" font-size="12">Iterate rapidly on navigation flows and data hierarchy without color or typography bias.</text>
        </g>

        <!-- High-Fi Dark Theme UI Mockup -->
        <g transform="translate(480, 0)">
          <rect x="0" y="0" width="580" height="590" rx="20" fill="#020f0a" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#6ee7b7" font-size="18" font-weight="800">2. High-Fidelity UI Design</text>
          <text x="35" y="70" fill="#9ca3af" font-size="13">Visual Aesthetics, Typography &amp; Dark Mode</text>

          <!-- Polished UI Container -->
          <g transform="translate(35, 95)">
            <rect x="0" y="0" width="510" height="280" rx="16" fill="#030712" stroke="rgba(52,211,153,0.5)" stroke-width="2"/>
            <!-- Header bar -->
            <rect x="0" y="0" width="510" height="45" rx="16" fill="#082b1d"/>
            <circle cx="25" cy="22" r="6" fill="#ef4444"/>
            <circle cx="45" cy="22" r="6" fill="#f59e0b"/>
            <circle cx="65" cy="22" r="6" fill="#10b981"/>
            <text x="255" y="27" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">Factory Analytics Dashboard</text>

            <!-- Card 1 -->
            <rect x="20" y="65" width="225" height="190" rx="10" fill="#093322" stroke="#10b981" stroke-width="1"/>
            <text x="35" y="95" fill="#34d399" font-size="13" font-weight="800">Throughput</text>
            <text x="35" y="130" fill="#ffffff" font-size="24" font-weight="900">98.4%</text>
            <text x="35" y="160" fill="#a7f3d0" font-size="11">+4.2% from baseline</text>

            <!-- Card 2 -->
            <rect x="265" y="65" width="225" height="190" rx="10" fill="#093322" stroke="#10b981" stroke-width="1"/>
            <text x="280" y="95" fill="#34d399" font-size="13" font-weight="800">Buffer Efficiency</text>
            <text x="280" y="130" fill="#ffffff" font-size="24" font-weight="900">12ms</text>
            <text x="280" y="160" fill="#a7f3d0" font-size="11">Zero congestion</text>
          </g>

          <rect x="35" y="400" width="510" height="150" rx="14" fill="#0b2419" stroke="#10b981" stroke-width="1.5"/>
          <text x="55" y="435" fill="#ffffff" font-size="15" font-weight="800">Aesthetic Clarity</text>
          <text x="55" y="465" fill="#a7f3d0" font-size="12">High-contrast dark themes reduce eye strain, while typography hierarchy guides rapid scanning.</text>
        </g>

        <!-- Tactile Interaction &amp; Behavior -->
        <g transform="translate(1090, 0)">
          <rect x="0" y="0" width="530" height="590" rx="20" fill="#020f0a" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#6ee7b7" font-size="18" font-weight="800">3. Interaction &amp; Behavior</text>
          <text x="35" y="70" fill="#9ca3af" font-size="13">Tactile Feedback &amp; Spring Physics</text>

          <g transform="translate(35, 95)">
            <!-- State 1: Default -->
            <rect x="0" y="0" width="460" height="75" rx="12" fill="#071c13" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
            <text x="25" y="45" fill="#9ca3af" font-size="14" font-weight="700">Default State</text>
            <text x="360" y="45" fill="#9ca3af" font-size="12">Resting • 1.0x</text>

            <!-- State 2: Hover -->
            <rect x="0" y="95" width="460" height="75" rx="12" fill="#093825" stroke="#34d399" stroke-width="2"/>
            <text x="25" y="140" fill="#6ee7b7" font-size="14" font-weight="800">Hover / Focus State</text>
            <text x="360" y="140" fill="#6ee7b7" font-size="12">Glow • 1.03x</text>

            <!-- State 3: Active Click -->
            <rect x="0" y="190" width="460" height="75" rx="12" fill="#0d5236" stroke="#10b981" stroke-width="2.5"/>
            <text x="25" y="235" fill="#ffffff" font-size="14" font-weight="900">Active / Press State</text>
            <text x="360" y="235" fill="#a7f3d0" font-size="12">Spring • 0.98x</text>
          </g>

          <rect x="35" y="400" width="460" height="150" rx="14" fill="#0b2419" stroke="#10b981" stroke-width="1.5"/>
          <text x="55" y="435" fill="#ffffff" font-size="15" font-weight="800">Responsive Tactility</text>
          <text x="55" y="465" fill="#a7f3d0" font-size="12">Deliberate micro-interactions provide reassuring confirmation that the interface is responsive and stable.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(64, 1030)">
    <line x1="0" y1="0" x2="1792" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <text x="0" y="24" fill="#6b7280" font-size="14" font-weight="600">Dr. Georg Hackenberg • Personal Interests Exploration</text>
    <text x="1792" y="24" fill="#6b7280" font-size="14" font-weight="600" text-anchor="end">Original Vector SVG • Infinite Crisp Scalability</text>
  </g>
</svg>

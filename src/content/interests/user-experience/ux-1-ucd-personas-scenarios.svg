<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1920 1080" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      
      text { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#030712"/>

  <!-- Header -->
  <g transform="translate(64, 48)">
    <text x="0" y="36" fill="#ffffff" font-size="34" font-weight="900" letter-spacing="-0.5">User-Centered Design, Personas &amp; Scenario Mapping</text>
    <text x="0" y="66" fill="#34d399" font-size="16" font-weight="700" letter-spacing="1">USER ARCHETYPES, GOAL-DIRECTED SCENARIOS &amp; STRUCTURED USER STORIES</text>
    
    <!-- Badge -->
    <rect x="1560" y="8" width="232" height="40" rx="20" fill="rgba(255,255,255,0.05)" stroke="#34d399" stroke-width="1.5"/>
    <text x="1676" y="33" fill="#34d399" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">TECHNICAL SCHEMATIC</text>
    
    <!-- Separator -->
    <line x1="0" y1="90" x2="1792" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 150)">
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="1720" height="780" rx="24" fill="#061c14" stroke="rgba(16,185,129,0.3)" stroke-width="3"/>
      <text x="50" y="65" fill="#34d399" font-size="22" font-weight="800" letter-spacing="1.5">USER-CENTERED DESIGN: PERSONAS, SCENARIOS &amp; USE CASES</text>

      <g transform="translate(50, 110)">
        <!-- Left: Persona Profile -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="530" height="590" rx="20" fill="#020f0a" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#6ee7b7" font-size="20" font-weight="800">1. Target User Persona</text>
          <text x="35" y="75" fill="#9ca3af" font-size="13">Archetype Definition &amp; Cognitive Pain Points</text>

          <g transform="translate(35, 100)">
            <rect x="0" y="0" width="460" height="150" rx="16" fill="#062e20" stroke="#10b981" stroke-width="2"/>
            <circle cx="70" cy="75" r="45" fill="#10b981" opacity="0.3"/>
            <text x="70" y="85" fill="#ffffff" font-size="28" font-weight="900" text-anchor="middle">👤</text>
            
            <text x="140" y="55" fill="#ffffff" font-size="18" font-weight="800">Dr. Elena Rostova</text>
            <text x="140" y="80" fill="#a7f3d0" font-size="13" font-weight="600">Lead Simulation &amp; Factory Engineer</text>
            <text x="140" y="110" fill="#9ca3af" font-size="12">Needs intuitive visualization for complex topologies</text>
          </g>

          <!-- Goals &amp; Frustrations -->
          <g transform="translate(35, 275)">
            <rect x="0" y="0" width="460" height="130" rx="14" fill="#0b2419" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
            <text x="25" y="35" fill="#34d399" font-size="15" font-weight="800">Core Goals &amp; Motivations</text>
            <text x="25" y="65" fill="#e2e8f0" font-size="13">• Identify factory bottlenecks in seconds</text>
            <text x="25" y="95" fill="#e2e8f0" font-size="13">• Export verified simulation runs to stakeholders</text>

            <rect x="0" y="145" width="460" height="130" rx="14" fill="#241010" stroke="#ef4444" stroke-width="1.5"/>
            <text x="25" y="180" fill="#fca5a5" font-size="15" font-weight="800">Key Frustrations to Eliminate</text>
            <text x="25" y="210" fill="#fecaca" font-size="13">• Cluttered, unintuitive legacy CAD interfaces</text>
            <text x="25" y="240" fill="#fecaca" font-size="13">• Opaque error states without clear guidance</text>
          </g>
        </g>

        <!-- Middle: User Scenario &amp; Journey Map -->
        <g transform="translate(560, 0)">
          <rect x="0" y="0" width="550" height="590" rx="20" fill="#020f0a" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#6ee7b7" font-size="20" font-weight="800">2. User Scenario Journey</text>
          <text x="35" y="75" fill="#9ca3af" font-size="13">End-to-End Goal-Directed Workflow Path</text>

          <g transform="translate(35, 100)">
            <!-- Stage 1 -->
            <rect x="0" y="0" width="480" height="100" rx="12" fill="#0b2419" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
            <text x="25" y="35" fill="#34d399" font-size="15" font-weight="800">Phase 1: Discover &amp; Ingest</text>
            <text x="25" y="65" fill="#d1fae5" font-size="13">Drag-and-drop CAD model → Instant 3D bounding box feedback</text>

            <!-- Stage 2 -->
            <rect x="0" y="125" width="480" height="100" rx="12" fill="#0b2419" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
            <text x="25" y="160" fill="#34d399" font-size="15" font-weight="800">Phase 2: Interactive Parameterization</text>
            <text x="25" y="190" fill="#d1fae5" font-size="13">Adjust spine velocity &amp; buffer queue capacities with tactile sliders</text>

            <!-- Stage 3 -->
            <rect x="0" y="250" width="480" height="100" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
            <text x="25" y="285" fill="#ffffff" font-size="15" font-weight="800">Phase 3: Real-Time Simulation Run</text>
            <text x="25" y="315" fill="#a7f3d0" font-size="13">Inspect visual heatmaps • Zero latency • Dynamic node highlights</text>

            <!-- Stage 4 -->
            <rect x="0" y="375" width="480" height="85" rx="12" fill="#0b2419" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
            <text x="25" y="410" fill="#34d399" font-size="15" font-weight="800">Phase 4: Export &amp; Share</text>
            <text x="25" y="435" fill="#d1fae5" font-size="13">One-click interactive web link for team review</text>
          </g>
        </g>

        <!-- Right: Structured User Stories &amp; Contracts -->
        <g transform="translate(1140, 0)">
          <rect x="0" y="0" width="480" height="590" rx="20" fill="#020f0a" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
          <text x="35" y="45" fill="#6ee7b7" font-size="20" font-weight="800">3. User Stories &amp; Use Cases</text>
          <text x="35" y="75" fill="#9ca3af" font-size="13">Executable Specifications for Developers</text>

          <g transform="translate(30, 100)">
            <rect x="0" y="0" width="420" height="140" rx="14" fill="#093322" stroke="#10b981" stroke-width="2"/>
            <text x="20" y="35" fill="#6ee7b7" font-size="14" font-weight="800">USER STORY #104</text>
            <text x="20" y="65" fill="#ffffff" font-size="13" font-weight="700">"As an engineer,"</text>
            <text x="20" y="90" fill="#d1fae5" font-size="12">"I want to filter graph clusters by tag,"</text>
            <text x="20" y="115" fill="#a7f3d0" font-size="12">"so that I isolate relevant components in seconds."</text>

            <rect x="0" y="165" width="420" height="140" rx="14" fill="#093322" stroke="#10b981" stroke-width="2"/>
            <text x="20" y="200" fill="#6ee7b7" font-size="14" font-weight="800">USER STORY #105</text>
            <text x="20" y="230" fill="#ffffff" font-size="13" font-weight="700">"As a project stakeholder,"</text>
            <text x="20" y="255" fill="#d1fae5" font-size="12">"I want a 3D real-time simulation replay,"</text>
            <text x="20" y="280" fill="#a7f3d0" font-size="12">"so that I verify layout throughput intuitively."</text>
          </g>

          <rect x="30" y="440" width="420" height="115" rx="12" fill="#062419" stroke="#34d399" stroke-width="1.5"/>
          <text x="50" y="475" fill="#ffffff" font-size="15" font-weight="800">Unambiguous Bridge</text>
          <text x="50" y="505" fill="#a7f3d0" font-size="12">Structured user stories ensure software engineering directly maps to user goals without scope drift.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(64, 1030)">
    <line x1="0" y1="0" x2="1792" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <text x="0" y="24" fill="#6b7280" font-size="14" font-weight="600">Dr. Georg Hackenberg • Personal Interests Exploration</text>
    <text x="1792" y="24" fill="#6b7280" font-size="14" font-weight="600" text-anchor="end">Original Vector SVG • Infinite Crisp Scalability</text>
  </g>
</svg>

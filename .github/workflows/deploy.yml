name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Restore Branding & OG Assets Cache
        id: cache-branding
        uses: actions/cache/restore@v4
        with:
          path: .cache/branding
          key: branding-assets-${{ hashFiles('src/pages/_internal/**', 'src/commons/server/branding-assets.ts') }}
          restore-keys: |
            branding-assets-

      - name: Restore Presentation Audio & Cue Timings Cache
        id: cache-audio
        uses: actions/cache/restore@v4
        with:
          path: .cache/slides-audio
          key: slides-audio-${{ hashFiles('src/content/presentations/**/slides/**', 'src/content/presentations/tts-lexicon.json') }}
          restore-keys: |
            slides-audio-

      - name: Restore Presentation PDF Handouts Cache
        id: cache-pdf
        uses: actions/cache/restore@v4
        with:
          path: .cache/slides-pdf
          key: slides-pdf-${{ hashFiles('src/content/presentations/**/slides/**', 'src/content/presentations/**/images/**', 'src/content/presentations/**/index.md', 'src/components/slides/**', 'src/styles/slides.css', 'src/styles/theme.css', 'src/layouts/Layout.astro', 'src/pages/presentations/[slug]/print.astro') }}
          restore-keys: |
            slides-pdf-

      - name: Restore JSON-LD Authorities Cache
        id: cache-jsonld
        uses: actions/cache/restore@v4
        with:
          path: .cache/jsonld-authorities.json
          key: jsonld-authorities-${{ hashFiles('src/content/**', 'src/commons/server/json-ld.ts', 'src/scripts/validate-jsonld.ts') }}
          restore-keys: |
            jsonld-authorities-

      - name: Validate Code Quality & Integrity
        run: npm run validate

      - name: Build Astro Site, Export Presentation PDFs & Validate Semantic Artifacts
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Branding & OG Assets Cache
        if: steps.cache-branding.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/branding
          key: ${{ steps.cache-branding.outputs.cache-primary-key }}

      - name: Save Presentation Audio & Cue Timings Cache
        if: steps.cache-audio.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/slides-audio
          key: ${{ steps.cache-audio.outputs.cache-primary-key }}

      - name: Save Presentation PDF Handouts Cache
        if: steps.cache-pdf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/slides-pdf
          key: ${{ steps.cache-pdf.outputs.cache-primary-key }}

      - name: Save JSON-LD Authorities Cache
        if: steps.cache-jsonld.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/jsonld-authorities.json
          key: ${{ steps.cache-jsonld.outputs.cache-primary-key }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LISTMONK_URL: ${{ secrets.LISTMONK_URL || 'https://news.hackenberg.tech' }}
      LISTMONK_API_USER: ${{ secrets.LISTMONK_API_USER }}
      LISTMONK_API_TOKEN: ${{ secrets.LISTMONK_API_TOKEN }}
      LISTMONK_SSH_HOST: ${{ secrets.LISTMONK_SSH_HOST }}
      LISTMONK_SSH_PORT: ${{ secrets.LISTMONK_SSH_PORT || '22' }}
      LISTMONK_SSH_USER: ${{ secrets.LISTMONK_SSH_USER || 'root' }}
      LISTMONK_DOCKER_DIR: ${{ secrets.LISTMONK_DOCKER_DIR || '/var/www/listmonk/hackenberg.tech' }}
      LISTMONK_SSH_PRIVATE_KEY: ${{ secrets.LISTMONK_SSH_PRIVATE_KEY }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout Repository for Newsletter Sync
        if: env.LISTMONK_API_USER != '' && env.LISTMONK_API_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node.js for Newsletter Sync
        if: env.LISTMONK_API_USER != '' && env.LISTMONK_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies for Newsletter Sync
        if: env.LISTMONK_API_USER != '' && env.LISTMONK_API_TOKEN != ''
        run: npm ci

      - name: Sync Newsletter Templates & Draft Campaigns to Listmonk
        run: |
          if [ -n "$LISTMONK_API_USER" ] && [ -n "$LISTMONK_API_TOKEN" ]; then
            if [ -n "$LISTMONK_SSH_PRIVATE_KEY" ]; then
              SSH_KEY_FILE="$(mktemp)"
              printf "%s\n" "$LISTMONK_SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
              chmod 600 "$SSH_KEY_FILE"
              export LISTMONK_SSH_KEY_PATH="$SSH_KEY_FILE"
              echo "LISTMONK_TEMP_SSH_KEY=$SSH_KEY_FILE" >> "$GITHUB_ENV"
            fi
            npm run newsletter:sync -- --all
          else
            echo "Listmonk credentials not configured in repository secrets — skipping newsletter sync."
          fi

      - name: Clean Up Temporary Listmonk SSH Key
        if: always() && env.LISTMONK_TEMP_SSH_KEY != ''
        run: rm -f "$LISTMONK_TEMP_SSH_KEY"

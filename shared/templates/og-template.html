<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Image Template</title>
  <!-- Load fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      font-family: "Outfit", "Inter", sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Base Canvas & Night Sky */
    .og-canvas {
      position: relative;
      width: 1200px;
      height: 630px;
      background: #030712;
      background-image: radial-gradient(ellipse 90% 70% at 50% 25%, #0e2047 0%, #030712 85%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Glow Orbs */
    .bg-glow-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
    .orb-blue {
      background-color: #3b82f6;
      width: 650px;
      height: 500px;
      top: -120px;
      left: 80px;
      filter: blur(140px);
      opacity: 0.22;
    }
    .orb-purple {
      background-color: #a855f7;
      width: 600px;
      height: 480px;
      top: 160px;
      right: -80px;
      filter: blur(140px);
      opacity: 0.18;
    }
    .orb-green {
      background-color: #10b981;
      width: 450px;
      height: 350px;
      bottom: -80px;
      left: 380px;
      filter: blur(130px);
      opacity: 0.12;
    }

    /* Starfield SVG */
    .stars-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1200px;
      height: 630px;
      pointer-events: none;
      z-index: 2;
    }

    /* Shooting Stars */
    .shooting-stars-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1200px;
      height: 630px;
      pointer-events: none;
      z-index: 2;
    }
    .shooting-star {
      position: absolute;
      height: 1.5px;
      background: linear-gradient(to left, rgba(254, 249, 195, 0) 0%, rgba(254, 249, 195, 0.75) 100%);
      transform-origin: left center;
    }
    .shooting-star-1 {
      width: 140px;
      top: 12%;
      left: 72%;
      transform: rotate(-35deg);
      opacity: 0.8;
    }
    .shooting-star-2 {
      width: 110px;
      top: 26%;
      left: 18%;
      transform: rotate(-38deg);
      opacity: 0.65;
    }
    .shooting-star-3 {
      width: 160px;
      top: 7%;
      left: 88%;
      transform: rotate(-32deg);
      opacity: 0.75;
    }

    /* Main Centered Logo Container */
    .center-container {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    /* Logo Badge ("GH.") */
    .logo-badge {
      width: 112px;
      height: 112px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      box-shadow: 
        0 20px 48px -10px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.25),
        0 0 40px -10px rgba(59, 130, 246, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: "Outfit", sans-serif;
      font-weight: 800;
      font-size: 52px;
      line-height: 1;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, #3b82f6 0%, #a855f7 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-bottom: 2px;
    }

    /* Logo Text Details */
    .logo-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }

    .brand-name {
      font-family: "Outfit", sans-serif;
      font-weight: 700;
      font-size: 54px;
      line-height: 1.1;
      color: #ffffff;
      letter-spacing: -0.8px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    }

    .brand-subtitle {
      font-family: "Inter", sans-serif;
      font-weight: 400;
      font-size: 24px;
      line-height: 1.25;
      color: #94a3b8;
      letter-spacing: 0.1px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="og-canvas">
    <!-- Ambient Glow Orbs -->
    <div class="bg-glow-orb orb-blue"></div>
    <div class="bg-glow-orb orb-purple"></div>
    <div class="bg-glow-orb orb-green"></div>

    <!-- Shooting Stars -->
    <div class="shooting-stars-container">
      <div class="shooting-star shooting-star-1"></div>
      <div class="shooting-star shooting-star-2"></div>
      <div class="shooting-star shooting-star-3"></div>
    </div>

    <!-- Twinkling Stars SVG Layer -->
    <svg id="sparkling-stars" class="stars-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"></svg>

    <!-- Center Brand Logo Lockup -->
    <div class="center-container">
      <div class="logo-badge">
        <span class="logo-text">GH</span>
      </div>
      <div class="logo-details">
        <h1 class="brand-name">Dr. Georg Hackenberg</h1>
        <p class="brand-subtitle">Professor for Industrial Informatics @ UAP Campus Wels</p>
      </div>
    </div>
  </div>

  <script>
    // Deterministic High-Density Starfield Generator matching Background.astro
    (function generateStarfield() {
      const svg = document.getElementById('sparkling-stars');
      if (!svg) return;

      const numStars = 140;
      const starColor = '#fef9c3';

      // Seeded random function for deterministic visual generation
      let seed = 42;
      function random() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      for (let i = 0; i < numStars; i++) {
        const x = random() * 1200;
        const y = random() * 630;
        const opacity = random() * 0.45 + 0.35;
        const isHeroStar = i % 14 === 0;

        if (isHeroStar) {
          const heroStar = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          const size = random() * 4.5 + 4;
          heroStar.setAttribute('transform', `translate(${x}, ${y})`);
          
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M 0 -${size} Q 0 0 ${size} 0 Q 0 0 0 ${size} Q 0 0 -${size} 0 Q 0 0 0 -${size} Z`);
          path.setAttribute('fill', starColor);
          path.setAttribute('opacity', (random() * 0.3 + 0.55).toFixed(2));
          
          heroStar.appendChild(path);
          svg.appendChild(heroStar);
        } else {
          const r = (random() * 0.8 + 0.5).toFixed(2);
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', x.toFixed(1));
          circle.setAttribute('cy', y.toFixed(1));
          circle.setAttribute('r', r);
          circle.setAttribute('fill', starColor);
          circle.setAttribute('opacity', opacity.toFixed(2));
          
          svg.appendChild(circle);
        }
      }
    })();
  </script>
</body>
</html>
